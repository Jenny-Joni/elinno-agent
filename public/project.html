<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/auth.css" />
</head>
<body>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand">Elinno Agent</a>
      <div class="app-nav-actions">
        <span id="navUser" style="color:#fff;opacity:.85;font-size:14px;"></span>
        <a href="/projects.html">Projects</a>
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <button id="logoutBtn" class="btn-nav">Log out</button>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <div class="custom-container">
      <div id="shellRoot">
        <!-- JS renders one of: loading state-card / boot-error state-card / project shell -->
      </div>
    </div>
  </main>

  <!-- Block 4 commit 8: channel-picker modal. Hidden by default; opened by
       openChannelPicker() in the Connections-tab logic. Body-level so it
       overlays the entire shell. Closes on Escape, click-outside (backdrop),
       and the close button per locked sub-decision (g). -->
  <div id="channelPickerModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="channelPickerHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="channelPickerHeading" class="modal-heading">Select a Slack channel</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body channel-picker-list">
        Loading…
      </div>
    </div>
  </div>

  <!-- Block 6 commit 9: Jira connect form. Jira uses API tokens (decision
       A), not OAuth — so no consent redirect; the form POSTs directly to
       /api/connectors/jira/auth/save (decision N). On success, redirects
       to /project.html?…&just_connected=jira to trigger the project picker
       below. Closes on Escape, click-outside, and the close button. -->
  <div id="jiraConnectModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="jiraConnectHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="jiraConnectHeading" class="modal-heading">Connect Jira</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="state-card-body" style="margin-bottom: 16px;">
          Generate an API token at
          <a href="https://id.atlassian.com/manage-profile/security/api-tokens"
             target="_blank" rel="noopener noreferrer">id.atlassian.com</a>
          first, then enter your details below.
        </p>
        <form id="jiraConnectForm" autocomplete="off">
          <div style="margin-bottom: 12px;">
            <label for="jiraSiteUrl" style="display:block; margin-bottom:4px; font-weight:600;">Site URL</label>
            <input type="text" id="jiraSiteUrl" required
                   placeholder="mycompany.atlassian.net"
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 12px;">
            <label for="jiraEmail" style="display:block; margin-bottom:4px; font-weight:600;">Account email</label>
            <input type="email" id="jiraEmail" required
                   placeholder="you@example.com"
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 16px;">
            <label for="jiraApiToken" style="display:block; margin-bottom:4px; font-weight:600;">API token</label>
            <input type="password" id="jiraApiToken" required
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div id="jiraConnectError" style="display:none; color:#b00020; margin-bottom:12px; padding:8px; background:#fce8eb; border-radius:4px;"></div>
          <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn btn-ghost" type="button" id="jiraConnectCancelBtn">Cancel</button>
            <button class="btn btn-primary" type="submit" id="jiraConnectSubmitBtn">Connect</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Block 6 commit 9: Jira project picker. Mirrors channelPickerModal
       structure. Opened by openJiraProjectPicker() — auto-opens after
       ?just_connected=jira from the connect form's redirect, or via
       "Pick project" button on a Jira connection that needs setup. -->
  <div id="jiraProjectPickerModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="jiraProjectPickerHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="jiraProjectPickerHeading" class="modal-heading">Select a Jira project</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body jira-project-picker-list">
        Loading…
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Block 2 Sub-task 2.5 — project.html three-tab shell + chat UI
    //
    // Decisions in force from BLOCK_2_PLAN.md:
    //   F  default to most-recent conversation when ?c= missing
    //   G  auto-create one conversation on first project open
    //   H  auto-title (server-side; client just renders response.title)
    //   I  echo placeholder format (server-side)
    //   N  error-string strategy: terse → translate, validation → verbatim
    //   V  history.replaceState only; single applyState() routing point
    //   W  composer mechanics — Enter sends, Shift+Enter newline, IME-safe
    //   X  POST /messages response is canonical for title; render directly
    //   Y  placeholder Members + Connections tabs use .state-card primitive
    //   Z  echo banner non-dismissible; .placeholder class on every assistant
    //   AA mobile drawer (≤700px) behind hamburger; in-memory boolean state
    //   AB sidebar two-line rows: title (ellipsized) + "Nh ago · N message(s)"
    //   AC conversations are per-user; server scopes — client just renders
    //
    // The single source of truth for navigation is applyState({ conversationId, tab }).
    // Sidebar click, tab click, auto-create, and default-to-most-recent all route through it.
    // ============================================================

    // ---------- Module state ----------
    let me = null;             // { id, email, is_admin } from /api/me
    let project = null;        // { id, name, description, role, ... } from GET /api/projects/:id
    let conversations = [];    // sidebar list (with message_count) — sorted updated_at DESC
    let activeConvId = null;
    let activeTab = 'chat';
    const messagesById = {};   // cache: conversationId → messages[] (avoids refetch on tab switch)
    let drawerOpen = false;    // decision AA: in-memory only
    let inFlight = false;      // global send-in-flight guard
    // Members tab state (sub-task 2.6). `members` is null until first successful
    // load — boot fetches eagerly so the tab pill renders from initial paint.
    // memberCount being null means "unknown"; the pill stays hidden.
    let members = null;
    let memberCount = null;
    // Connections tab state (Block 4 commit 8). `connections` is null until
    // first successful load — boot fetches eagerly so the Connections tab
    // renders without a flash. Empty array = no connections (renders the
    // Connect Slack empty state).
    let connections = null;
    // One-shot guard: ?just_connected=slack should auto-open the channel
    // picker exactly once after OAuth callback redirects here. Subsequent
    // tab switches must not re-trigger.
    let justConnectedHandled = false;

    const VALID_TABS = { chat: 1, members: 1, connections: 1 };

    // Read URL params once at module init; resolved/overwritten during boot.
    const initialParams = new URLSearchParams(location.search);
    const projectId = initialParams.get('id');
    let initialConvId = initialParams.get('c');
    const initialTabRaw = initialParams.get('tab');

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Decision AB: sibling to projects.html's fmtRelative — drops the "Updated " prefix.
    // Used by sidebar conv-meta and chat-msg-meta. Returns '' on parse failure so callers
    // can gracefully omit; "now"/"yesterday" come from Intl.RelativeTimeFormat numeric:'auto'.
    function fmtRelativeShort(value) {
      if (!value) return '';
      try {
        const date = new Date(value);
        if (isNaN(date.getTime())) return '';
        const diffMs  = Date.now() - date.getTime();
        const diffMin = Math.round(diffMs / 60000);
        const diffHr  = Math.round(diffMs / 3600000);
        const diffDay = Math.round(diffMs / 86400000);
        const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
        if (Math.abs(diffMin) < 60) return rtf.format(-diffMin, 'minute');
        if (Math.abs(diffHr)  < 24) return rtf.format(-diffHr,  'hour');
        if (Math.abs(diffDay) < 30) return rtf.format(-diffDay, 'day');
        return rtf.format(-Math.round(diffDay / 30), 'month');
      } catch {
        return '';
      }
    }

    // Block 9.2 decisions F+G: citation freshness for the chip's · suffix.
    // Returns { suffix, titleSource, stale } so the caller can append the
    // suffix, populate the title= absolute, and apply a muted class when
    // both source_updated_at and connection_last_sync_at are null.
    function fmtCitationFreshness(c) {
      const src = c && c.source_updated_at;
      const conn = c && c.connection_last_sync_at;
      if (src) {
        const rel = fmtRelativeShort(src);
        if (rel) return { suffix: ' · ' + rel, titleSource: src, stale: false };
      }
      if (conn) {
        const rel = fmtRelativeShort(conn);
        if (rel) return { suffix: ' · as of last sync (' + rel + ')', titleSource: conn, stale: false };
      }
      return { suffix: ' · as of unknown', titleSource: null, stale: true };
    }

    // Block 9.2 decision D: absolute timestamp for the chip's title= tooltip.
    // Format: 'May 11, 14:23 UTC' — 24h, UTC explicit. Returns '' on null/invalid.
    function fmtCitationTitle(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('en-US', {
          month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false,
          timeZone: 'UTC', timeZoneName: 'short',
        });
      } catch {
        return '';
      }
    }

    // Decision AB: "Nh ago · N message(s)" with ternary plural.
    function fmtConvMeta(updatedAt, messageCount) {
      const rel = fmtRelativeShort(updatedAt);
      const n = Number.isFinite(messageCount) ? messageCount : 0;
      const count = n === 1 ? '1 message' : n + ' messages';
      return rel ? rel + ' · ' + count : count;
    }

    // Decision W: avatar initials. User = first character of email, uppercase.
    // Assistant = hardcoded "EA". Display-name + proper initials deferred to Block 9.
    function deriveUserInitial(email) {
      return (email && email.length > 0) ? email[0].toUpperCase() : '?';
    }

    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.search));
    }

    // ---------- Auth-gated nav setup ----------
    // Same pattern as projects.html — /api/me returns { user: null } for unauthenticated.
    // We do this BEFORE boot() to populate the static nav once; boot() re-uses `me`.
    async function bootstrapMe() {
      let res;
      try {
        res = await fetch('/api/me');
      } catch {
        return false;
      }
      if (res.status === 401) { redirectToLogin(); return false; }
      if (!res.ok) return false;
      const data = await res.json().catch(() => ({}));
      if (!data || !data.user) {
        location.replace('/');
        return false;
      }
      me = data.user;
      document.getElementById('navUser').textContent = me.email;
      if (me.is_admin) {
        document.getElementById('adminLink').style.display = '';
      }
      return true;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    // ---------- Boot states ----------
    function renderLoadingShell() {
      document.getElementById('shellRoot').innerHTML = `
        <div class="state-card" aria-busy="true">
          <div class="state-card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 2"/>
            </svg>
          </div>
          <h2 class="state-card-heading">Loading project…</h2>
        </div>
      `;
    }

    function renderBootError() {
      document.getElementById('shellRoot').innerHTML = `
        <div class="state-card" role="alert">
          <div class="state-card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l9.5 17H2.5L12 3z"/>
              <line x1="12" y1="9" x2="12" y2="14"/>
              <line x1="12" y1="17.5" x2="12" y2="17.51"/>
            </svg>
          </div>
          <h2 class="state-card-heading">Couldn't load this project</h2>
          <p class="state-card-body">Check your connection or refresh the page if this persists.</p>
          <div class="state-card-actions">
            <button class="btn btn-primary" id="bootRetryBtn">Retry</button>
          </div>
        </div>
      `;
      document.getElementById('bootRetryBtn').addEventListener('click', boot);
    }

    // ---------- Boot pipeline ----------
    // Step ordering matches sub-task 2.5 spec. Auth-error mapping per decision N:
    //   401 mid-flight → redirect to /login.html?next=...
    //   403 / 404 on the project resource → /projects.html (don't leak existence)
    //   Other non-OK → render boot-error state-card with Retry
    async function boot() {
      if (!projectId) { location.replace('/projects.html'); return; }
      renderLoadingShell();

      try {
        // Step 1: GET /api/projects/:id (auth + project meta + role).
        const projRes = await fetch('/api/projects/' + encodeURIComponent(projectId));
        if (projRes.status === 401) { redirectToLogin(); return; }
        if (projRes.status === 403 || projRes.status === 404) {
          // 403-collapse from requireProjectRole, OR project soft-deleted between
          // checks. Either way: don't leak existence — bounce to projects list.
          location.replace('/projects.html'); return;
        }
        if (!projRes.ok) { renderBootError(); return; }
        const projData = await projRes.json();
        project = projData.project;
        if (!project || !project.id) { renderBootError(); return; }

        // Step 2: GET conversations (decision AC: server scopes to session user).
        const convRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/conversations');
        if (convRes.status === 401) { redirectToLogin(); return; }
        if (convRes.status === 403) { location.replace('/projects.html'); return; }
        if (!convRes.ok) { renderBootError(); return; }
        const convData = await convRes.json();
        conversations = Array.isArray(convData.conversations) ? convData.conversations : [];

        // Step 3 (decision G): auto-create one if user has zero conversations
        // in this project. Lower friction than an empty state.
        if (conversations.length === 0) {
          const createRes = await fetch(
            '/api/projects/' + encodeURIComponent(projectId) + '/conversations',
            { method: 'POST' }
          );
          if (createRes.status === 401) { redirectToLogin(); return; }
          if (createRes.status === 403) { location.replace('/projects.html'); return; }
          if (!createRes.ok) { renderBootError(); return; }
          const createData = await createRes.json();
          if (!createData || !createData.conversation) { renderBootError(); return; }
          conversations = [createData.conversation];
        }

        // Sub-task 2.6: eager members fetch so the Members tab's count pill
        // (decision Y) renders from initial paint, not after first tab open.
        // Latency cost is one additional GET on every project.html boot
        // (~50ms typical). On non-OK we leave members=null/memberCount=null —
        // boot doesn't fail just because the count is unknown; the Members
        // tab will retry the fetch on first open.
        try {
          const memRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/members');
          if (memRes.status === 401) { redirectToLogin(); return; }
          if (memRes.status === 403) { location.replace('/projects.html'); return; }
          if (memRes.ok) {
            const memData = await memRes.json().catch(() => ({}));
            members = Array.isArray(memData.members) ? memData.members : [];
            memberCount = members.length;
          }
        } catch {
          // Swallow — Members tab open will retry. Chat still works.
        }

        // Step 3.5 (Block 4 commit 8): eager connections load (paralleling
        // members). Same swallow-on-failure pattern — Connections tab will
        // re-fetch on first open if this fails. Chat + Members still work.
        try {
          const connRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/connections');
          if (connRes.status === 401) { redirectToLogin(); return; }
          if (connRes.status === 403) { location.replace('/projects.html'); return; }
          if (connRes.ok) {
            const connData = await connRes.json().catch(() => ({}));
            connections = Array.isArray(connData.connections) ? connData.connections : [];
          }
        } catch {
          // Swallow — Connections tab open will retry.
        }

        // Step 4 (decisions F + V): resolve activeConvId — ?c= if it matches a
        // real row, otherwise most-recent (conversations[0] is updated_at DESC).
        if (initialConvId && conversations.some(c => c.id === initialConvId)) {
          activeConvId = initialConvId;
        } else {
          activeConvId = conversations[0].id;
        }

        // Step 5: GET messages for active conversation.
        const msgsRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/conversations/' + encodeURIComponent(activeConvId) + '/messages'
        );
        if (msgsRes.status === 401) { redirectToLogin(); return; }
        if (msgsRes.status === 403) { location.replace('/projects.html'); return; }
        if (!msgsRes.ok) { renderBootError(); return; }
        const msgsData = await msgsRes.json();
        messagesById[activeConvId] = Array.isArray(msgsData.messages) ? msgsData.messages : [];

        // Step 6 (decision V): resolve activeTab and route through applyState
        // so the URL bar reflects reality from the moment the page is interactive.
        activeTab = (initialTabRaw && VALID_TABS[initialTabRaw]) ? initialTabRaw : 'chat';

        renderShell();
        applyState({ conversationId: activeConvId, tab: activeTab });
      } catch {
        renderBootError();
      }
    }

    // ---------- Shell (static chrome — rendered once after boot succeeds) ----------
    function renderShell() {
      const projName = escapeHtml(project.name || 'Untitled project');
      document.getElementById('shellRoot').innerHTML = `
        <div class="project-shell" id="shell">
          <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
          <aside class="project-sidebar" id="sidebar">
            <div class="project-sidebar-header">
              <div class="project-sidebar-title">Conversations</div>
              <button class="new-conv-btn" id="newConvBtn" type="button" title="New conversation" aria-label="New conversation">+</button>
            </div>
            <div id="convList"></div>
          </aside>
          <main class="project-main">
            <div class="project-main-header">
              <div class="project-header-left">
                <button class="drawer-toggle" id="drawerToggle" type="button" aria-label="Toggle conversations">
                  <span></span><span></span><span></span>
                </button>
                <div class="project-header-titles">
                  <div class="project-breadcrumb">
                    <a href="/projects.html">Projects</a> / <span>${projName}</span>
                  </div>
                  <h2 class="project-name-h">${projName}</h2>
                </div>
              </div>
              <div class="project-tabs" id="tabStrip">
                <button class="project-tab" type="button" data-tab="chat">Chat</button>
                <button class="project-tab" type="button" data-tab="members">Members <span class="tab-count" id="memberCountPill"${memberCount === null ? ' style="display:none;"' : ''}>${memberCount === null ? '' : escapeHtml(String(memberCount))}</span></button>
                <button class="project-tab" type="button" data-tab="connections">Connections</button>
              </div>
            </div>
            <div id="tabBody"></div>
          </main>
        </div>
      `;

      document.getElementById('newConvBtn').addEventListener('click', onNewConv);
      document.getElementById('drawerToggle').addEventListener('click', toggleDrawer);
      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.getElementById('tabStrip').addEventListener('click', onTabClick);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawerOpen) closeDrawer();
      });
    }

    // ---------- Single state-update function (decision V) ----------
    // Sidebar click, tab click, auto-create, default-to-most-recent all route through here.
    // Always replaceState; never pushState; never reload.
    function applyState({ conversationId, tab }) {
      activeConvId = conversationId;
      activeTab = VALID_TABS[tab] ? tab : 'chat';

      // URL bar reflects reality. Always include ?id and ?c (when conv exists);
      // omit ?tab when 'chat' (the implicit default) for cleaner shareable URLs.
      const u = new URL(location.href);
      u.searchParams.set('id', project.id);
      if (activeConvId) u.searchParams.set('c', activeConvId);
      else u.searchParams.delete('c');
      if (activeTab !== 'chat') u.searchParams.set('tab', activeTab);
      else u.searchParams.delete('tab');
      history.replaceState(null, '', u.toString());

      renderSidebar();
      renderTabStrip();
      renderTabBody();
    }

    // ---------- Sidebar ----------
    function renderSidebar() {
      const list = document.getElementById('convList');
      list.innerHTML = conversations.map(c => {
        const title = escapeHtml(c.title || 'Untitled');
        const meta = escapeHtml(fmtConvMeta(c.updated_at, c.message_count));
        const active = c.id === activeConvId ? ' active' : '';
        const id = escapeHtml(c.id);
        return `
          <button class="conv-item${active}" type="button" data-conv-id="${id}">
            <div class="conv-title">${title}</div>
            <div class="conv-meta">${meta}</div>
          </button>
        `;
      }).join('');
      list.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', () => onConvClick(el.dataset.convId));
      });
    }

    // ---------- Tab strip ----------
    function renderTabStrip() {
      document.querySelectorAll('#tabStrip .project-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === activeTab);
      });
    }

    function onTabClick(e) {
      const tab = e.target.closest('.project-tab');
      if (!tab) return;
      applyState({ conversationId: activeConvId, tab: tab.dataset.tab });
    }

    // ---------- Tab body ----------
    function renderTabBody() {
      const body = document.getElementById('tabBody');
      if (activeTab === 'chat') renderChat(body);
      else if (activeTab === 'members') renderMembers(body);
      else renderConnections(body);
    }

    function renderChat(body) {
      const conv = conversations.find(c => c.id === activeConvId);
      const title = conv ? (conv.title || '') : '';
      body.innerHTML = `
        <div class="chat-area">
          <div class="chat-conv-title" id="chatConvTitle"></div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-composer">
            <div class="chat-error" id="chatError" style="display:none;" role="alert"></div>
            <div class="chat-composer-row">
              <textarea class="chat-input" id="chatInput" placeholder="Ask anything about this project…" rows="1" aria-label="Message"></textarea>
              <button class="chat-send-btn" id="chatSend" type="button" disabled>Send</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('chatConvTitle').textContent = title;
      renderMessages();
      wireComposer();
      // Defer focus to next frame so the textarea is in the layout tree.
      requestAnimationFrame(() => {
        const input = document.getElementById('chatInput');
        if (input && !inFlight) input.focus();
      });
    }

    // Block 9.3 decision H: hardcoded source-gated suggestion lists. No
    // channel-name / sprint-name interpolation — keeps the chip text static
    // and dodges an extra API call. <topic> is a literal placeholder the
    // user edits before sending (decision I: click fills + focuses, no
    // auto-submit).
    const SUGGESTIONS_SLACK = [
      "What's been discussed about <topic> this week?",
      "Summarize the last 24 hours of decisions.",
    ];
    const SUGGESTIONS_JIRA = [
      "How many open tickets are in the active sprint?",
      "Which issues are blocking?",
    ];

    // Block 9.3 decision J: "show only when active conversation has zero
    // user messages." Disappears after first send; reappears on a new
    // conversation. No dismissal state.
    function userMessagesEver(convId) {
      return (messagesById[convId] || []).filter(m => m.role === 'user').length;
    }

    // Block 9.3 decision H: collapse the `connections` global into one of
    // 'slack' / 'jira' / 'both' / 'none' for the gating switch in
    // renderSuggestionsHtml. `null` (still loading or failed) falls into
    // 'none' — the empty-state card is a safer default than guessing.
    function getConnectionState() {
      if (!Array.isArray(connections)) return 'none';
      const hasSlack = connections.some(c => c && c.source === 'slack');
      const hasJira  = connections.some(c => c && c.source === 'jira');
      if (hasSlack && hasJira) return 'both';
      if (hasSlack) return 'slack';
      if (hasJira)  return 'jira';
      return 'none';
    }

    // Block 9.3 decision H: pick the chip list for each state. 'both' is
    // the union of the two two-shape lists per the plan's Block 10 note.
    function getSuggestionList(state) {
      if (state === 'slack') return SUGGESTIONS_SLACK;
      if (state === 'jira')  return SUGGESTIONS_JIRA;
      if (state === 'both')  return SUGGESTIONS_SLACK.concat(SUGGESTIONS_JIRA);
      return [];
    }

    // Block 9.3 decisions H + K: build the empty-state HTML. 'none' renders
    // the "Connect Slack or Jira" state card with a tab-switch link; the
    // other three render the source-gated suggestion grid.
    function renderSuggestionsHtml(state) {
      if (state === 'none') {
        return `
          <div class="chat-suggestions-empty">
            <div class="chat-suggestions-empty-title">Connect Slack or Jira to start asking questions</div>
            <a class="chat-suggestions-empty-link" href="#" data-suggestions-link="connections">Open Connections tab</a>
          </div>
        `;
      }
      const items = getSuggestionList(state);
      if (items.length === 0) return '';
      const chips = items.map(q => {
        const safe = escapeHtml(q);
        return `<button class="chat-suggestion" type="button" data-suggestion="${safe}">${safe}</button>`;
      }).join('');
      return `
        <div class="chat-suggestions">
          <div class="chat-suggestions-label">Try asking…</div>
          <div class="chat-suggestions-grid">${chips}</div>
        </div>
      `;
    }

    // Block 9.3 decision I: chip click fills #chatInput, focuses it, dispatches
    // an 'input' event so the composer's auto-resize + send-button-enable
    // logic fires. NO auto-submit — PRD §5.9 calls these "example questions,"
    // not "example answers," and auto-submit turns a nudge into accidental
    // token spend. Also wires the "Open Connections tab" link in the
    // 'none'-state card via a programmatic click on the existing tab button.
    function wireSuggestionChips(scope) {
      scope.querySelectorAll('.chat-suggestion').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById('chatInput');
          if (!input) return;
          input.value = btn.dataset.suggestion || '';
          input.focus();
          input.dispatchEvent(new Event('input', { bubbles: true }));
        });
      });
      const tabLink = scope.querySelector('[data-suggestions-link="connections"]');
      if (tabLink) {
        tabLink.addEventListener('click', (e) => {
          e.preventDefault();
          const tabBtn = document.querySelector('.project-tab[data-tab="connections"]');
          if (tabBtn) tabBtn.click();
        });
      }
    }

    function renderMessages() {
      const list = document.getElementById('chatMessages');
      // Filter:
      //   - role='tool' rows (intermediate tool results, not user-visible)
      //   - role='assistant' with no content (intermediate tool-call turns;
      //     they live in the DB for replay/observability but render empty)
      const msgs = (messagesById[activeConvId] || []).filter(m => {
        if (m.role === 'tool') return false;
        if (m.role === 'assistant' && !(m.content && m.content.length > 0)) return false;
        return true;
      });
      // Block 9.3 decisions J + K: when this conversation is brand-new
      // (no visible messages AND no user messages ever sent), render the
      // source-gated suggestion grid (or the no-connections state card)
      // in place of the empty chat list. Disappears on the next render
      // after the user sends — userMessagesEver becomes > 0.
      if (msgs.length === 0 && userMessagesEver(activeConvId) === 0) {
        list.innerHTML = renderSuggestionsHtml(getConnectionState());
        wireSuggestionChips(list);
        return;
      }
      list.innerHTML = msgs.map(m => renderMessageHtml(m)).join('');
      list.scrollTop = list.scrollHeight;
    }

    function renderMessageHtml(m) {
      const isUser = m.role === 'user';
      const avatar = isUser ? deriveUserInitial(me.email) : 'EA';
      const rel = fmtRelativeShort(m.created_at) || 'just now';
      const meta = (isUser ? 'You · ' : 'Elinno Agent · ') + rel;
      const citations = !isUser && Array.isArray(m.citations) ? m.citations : [];

      // Assistant visual states:
      //   .error  — model=null: agent loop failed (S21) or zero-data-
      //             source short-circuit; canned text with no AI involved.
      //   .muted  — citations empty but model set: honest "couldn't
      //             find that" answer with no sources to cite.
      let stateClass = '';
      if (!isUser) {
        if (m.model === null || m.model === undefined) stateClass = ' error';
        else if (citations.length === 0) stateClass = ' muted';
      }

      return `
        <div class="chat-msg ${isUser ? 'user' : 'assistant'}${stateClass}">
          <div class="chat-msg-avatar">${escapeHtml(avatar)}</div>
          <div class="chat-msg-body">
            <div class="chat-msg-meta">${escapeHtml(meta)}</div>
            <div class="chat-msg-content">${escapeHtml(m.content || '')}</div>
            ${citations.length > 0 ? renderCitationRailHtml(citations) : ''}
          </div>
        </div>
      `;
    }

    function renderCitationRailHtml(citations) {
      const chips = citations.map(c => {
        const baseLabel = c.title || c.author || (c.source ? c.source[0].toUpperCase() + c.source.slice(1) : 'Source');
        const fresh = fmtCitationFreshness(c);
        const safeBase = escapeHtml(baseLabel);
        const safeSuffix = escapeHtml(fresh.suffix);
        const staleClass = fresh.stale ? ' chat-citation-stale' : '';
        const freshHtml = `<span class="chat-citation-freshness${staleClass}">${safeSuffix}</span>`;
        const labelHtml = `${safeBase}${freshHtml}`;
        const url = c.source_url || '';
        const titleStr = fmtCitationTitle(fresh.titleSource);
        const titleAttr = titleStr ? ` title="${escapeHtml(titleStr)}"` : '';
        if (url) {
          return `<a class="chat-citation" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"${titleAttr}>${labelHtml}</a>`;
        }
        return `<span class="chat-citation chat-citation-noref"${titleAttr}>${labelHtml}</span>`;
      }).join('');
      return `<div class="chat-citation-rail">${chips}</div>`;
    }

    // ---------- Composer (decision W) ----------
    function wireComposer() {
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');

      // Auto-resize on input. Cap is enforced by CSS max-height; scrollHeight grows
      // beyond cap, so we still set scrollHeight and let CSS clamp it.
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
        send.disabled = inFlight || input.value.trim().length === 0;
      });

      // Enter sends; Shift+Enter newline; IME-safe (don't intercept while composing).
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      send.addEventListener('click', sendMessage);
    }

    function showChatError(msg) {
      const slot = document.getElementById('chatError');
      if (!slot) return;
      slot.textContent = msg;
      slot.style.display = '';
    }

    function clearChatError() {
      const slot = document.getElementById('chatError');
      if (!slot) return;
      slot.style.display = 'none';
      slot.textContent = '';
    }

    async function sendMessage() {
      if (inFlight) return;
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');
      if (!input || !send) return;
      const content = input.value.trim();
      if (content.length === 0) return;

      // Capture sendingConvId at send time. If user switches convs mid-flight, the
      // returned messages still get cached against the conversation they were sent in.
      const sendingConvId = activeConvId;

      inFlight = true;
      send.textContent = 'Sending…';
      send.disabled = true;
      input.disabled = true;
      clearChatError();

      let res;
      try {
        res = await fetch(
          '/api/projects/' + encodeURIComponent(project.id) +
          '/conversations/' + encodeURIComponent(sendingConvId) + '/messages',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
          }
        );
      } catch {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/projects.html'); return; }
      if (res.status === 400) {
        // Decision N: validation strings are user-facing-quality; render verbatim.
        const data = await res.json().catch(() => ({}));
        restoreComposer();
        showChatError(data && data.error ? data.error : 'Something went wrong. Please try again.');
        return;
      }
      if (res.status === 429) {
        // BLOCK_10_PLAN.md decision K: friendly cap message. Server's
        // `error` field already reads as user-facing copy; append a
        // human-formatted retry hint computed from retry_after_seconds.
        const data = await res.json().catch(() => ({}));
        restoreComposer();
        let msg = data && data.error ? data.error : 'Daily message limit reached.';
        if (data && typeof data.retry_after_seconds === 'number' && data.retry_after_seconds > 0) {
          const totalMins = Math.ceil(data.retry_after_seconds / 60);
          const hours = Math.floor(totalMins / 60);
          const remMins = totalMins % 60;
          let when;
          if (hours > 0 && remMins > 0) when = hours + 'h ' + remMins + 'm';
          else if (hours > 0) when = hours + 'h';
          else when = totalMins + 'm';
          msg = msg + ' Try again in ' + when + '.';
        }
        showChatError(msg);
        return;
      }
      if (!res.ok) {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      // Append both messages to the conversation they were sent in (sendingConvId,
      // not activeConvId — user might have switched mid-flight).
      if (!messagesById[sendingConvId]) messagesById[sendingConvId] = [];
      if (data.user_message) messagesById[sendingConvId].push(data.user_message);
      if (data.assistant_message) messagesById[sendingConvId].push(data.assistant_message);

      // Decision X: server response is canonical for title. Update sidebar row +
      // chat-conv-title heading (when on chat tab and same conv) directly from the
      // response — no refetch.
      const idx = conversations.findIndex(c => c.id === sendingConvId);
      if (idx >= 0) {
        const newTitle = (data.conversation && data.conversation.title) || conversations[idx].title;
        const bumpedAt = (data.assistant_message && data.assistant_message.created_at) || new Date().toISOString();
        conversations[idx] = {
          ...conversations[idx],
          title: newTitle,
          updated_at: bumpedAt,
          message_count: (conversations[idx].message_count || 0) + 2,
        };
        // Re-sort matches the API's ORDER BY updated_at DESC, id DESC so the
        // active conv naturally bumps to the top of the sidebar.
        conversations.sort((a, b) => {
          const at = new Date(a.updated_at).getTime();
          const bt = new Date(b.updated_at).getTime();
          if (bt !== at) return bt - at;
          return a.id < b.id ? 1 : -1;
        });
      }

      // Render — sidebar always; chat surface only when still viewing that conv.
      renderSidebar();
      if (activeConvId === sendingConvId && activeTab === 'chat') {
        const heading = document.getElementById('chatConvTitle');
        if (heading) {
          const conv = conversations.find(c => c.id === sendingConvId);
          heading.textContent = conv ? (conv.title || '') : '';
        }
        renderMessages();
      }

      // Decision W: clear textarea, reset min-height, refocus.
      input.value = '';
      input.style.height = '';
      restoreComposer();
    }

    function restoreComposer() {
      inFlight = false;
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');
      if (send) {
        send.textContent = 'Send';
        send.disabled = !input || input.value.trim().length === 0;
      }
      if (input) {
        input.disabled = false;
        input.focus();
      }
    }

    // ---------- Conversation switch ----------
    async function onConvClick(convId) {
      if (!convId) return;
      // No-op if we're already on this conv AND on chat tab. Still close drawer
      // for the mobile "tap to dismiss" affordance (decision AA).
      if (convId === activeConvId && activeTab === 'chat') {
        closeDrawer();
        return;
      }

      // Fetch messages if not cached.
      if (!messagesById[convId]) {
        let res;
        try {
          res = await fetch(
            '/api/projects/' + encodeURIComponent(project.id) +
            '/conversations/' + encodeURIComponent(convId) + '/messages'
          );
        } catch {
          showChatError("Couldn't load that conversation. Please try again.");
          return;
        }
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 403) {
          // Conv was deleted or membership revoked between sidebar render and click.
          // Bounce to the safe known state.
          location.replace('/projects.html');
          return;
        }
        if (!res.ok) {
          showChatError("Couldn't load that conversation. Please try again.");
          return;
        }
        const data = await res.json().catch(() => ({}));
        messagesById[convId] = Array.isArray(data.messages) ? data.messages : [];
      }

      closeDrawer();
      // Sidebar click always lands on the chat tab — that's where active-conv state
      // is meaningful. Matches consumer chat UX (Slack, ChatGPT).
      applyState({ conversationId: convId, tab: 'chat' });
    }

    // ---------- New conversation ----------
    async function onNewConv() {
      const btn = document.getElementById('newConvBtn');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try {
        let res;
        try {
          res = await fetch(
            '/api/projects/' + encodeURIComponent(project.id) + '/conversations',
            { method: 'POST' }
          );
        } catch {
          // Network failure: surface in chat-error slot, switch to chat tab so the
          // slot is visible. Stay on current conv.
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 403) { location.replace('/projects.html'); return; }
        if (!res.ok) {
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!data || !data.conversation) {
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        const newConv = data.conversation;
        conversations.unshift(newConv);
        messagesById[newConv.id] = [];
        closeDrawer();
        // Decision V: route through applyState. Lands on chat tab, fresh conv active.
        applyState({ conversationId: newConv.id, tab: 'chat' });
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- Members tab (sub-task 2.6) ----------
    //
    // Admins see the invite row + members list with Remove buttons (creator's
    // Remove disabled). Non-admins see a read-only list — no invite row,
    // no Remove buttons (decision: read-only view per session-4 plan).
    //
    // Cache strategy: the boot pipeline fetches members eagerly so the tab
    // pill renders from initial paint. If that fetch failed (members === null),
    // first Members-tab open re-fetches; on subsequent opens the cached
    // members[] renders instantly. Invite/remove always re-fetch the list
    // (per-spec: "After invite/remove, refetch the list and re-render.
    // Optimistic updates not needed at this scale.")
    function renderMembers(body) {
      const isProjectAdmin = project.role === 'admin';
      body.innerHTML = `
        <div class="members-area">
          ${isProjectAdmin ? `
            <div class="invite-row">
              <div class="field">
                <label for="inviteEmail">Invite by email</label>
                <input id="inviteEmail" type="email" placeholder="teammate@elinnovation.net" autocomplete="email" />
              </div>
              <button class="btn btn-primary" id="inviteBtn" type="button" disabled>Send invite</button>
              <div class="invite-error" id="inviteError" style="display:none;" role="alert"></div>
            </div>
          ` : ''}
          <div class="members-section-title" id="membersSectionTitle">Loading…</div>
          <div id="membersListContainer"></div>
        </div>
      `;

      if (isProjectAdmin) wireInvite();

      if (members !== null) {
        renderMembersList();
      } else {
        loadMembers();
      }
    }

    function wireInvite() {
      const input = document.getElementById('inviteEmail');
      const btn = document.getElementById('inviteBtn');
      if (!input || !btn) return;
      input.addEventListener('input', () => {
        btn.disabled = input.value.trim().length === 0;
      });
      // IME-safe Enter handling — same pattern as the chat composer (decision W).
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          onInviteSubmit();
        }
      });
      btn.addEventListener('click', onInviteSubmit);
    }

    async function loadMembers() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;

      // Three-row skeleton — quick visual cue that data's loading.
      container.innerHTML = `
        <div class="members-list" aria-busy="true" aria-label="Loading members">
          <div class="member-row-skeleton"></div>
          <div class="member-row-skeleton"></div>
          <div class="member-row-skeleton"></div>
        </div>
      `;
      if (title) title.textContent = 'Loading…';

      let res;
      try {
        res = await fetch('/api/projects/' + encodeURIComponent(project.id) + '/members');
      } catch {
        renderMembersError();
        return;
      }
      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/projects.html'); return; }
      if (!res.ok) { renderMembersError(); return; }

      const data = await res.json().catch(() => ({}));
      members = Array.isArray(data.members) ? data.members : [];
      memberCount = members.length;
      updateMemberCountPill();
      renderMembersList();
    }

    function renderMembersError() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;
      container.innerHTML = `
        <div class="state-card" role="alert">
          <div class="state-card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l9.5 17H2.5L12 3z"/>
              <line x1="12" y1="9" x2="12" y2="14"/>
              <line x1="12" y1="17.5" x2="12" y2="17.51"/>
            </svg>
          </div>
          <h2 class="state-card-heading">Couldn't load members</h2>
          <p class="state-card-body">Check your connection or refresh the page if this persists.</p>
          <div class="state-card-actions">
            <button class="btn btn-primary" id="membersRetryBtn" type="button">Retry</button>
          </div>
        </div>
      `;
      if (title) title.textContent = '';
      const retry = document.getElementById('membersRetryBtn');
      if (retry) retry.addEventListener('click', loadMembers);
    }

    function renderMembersList() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;

      if (title) {
        title.textContent = members.length === 1 ? '1 member' : members.length + ' members';
      }

      const isProjectAdmin = project.role === 'admin';
      container.innerHTML = `
        <div class="members-list">
          ${members.map(m => renderMemberRow(m, isProjectAdmin)).join('')}
        </div>
      `;

      if (isProjectAdmin) {
        container.querySelectorAll('.member-remove-btn').forEach(btn => {
          btn.addEventListener('click', () => onRemoveClick(btn.dataset.userId, btn));
        });
      }
    }

    function renderMemberRow(m, isProjectAdmin) {
      const userIdStr = String(m.user_id);
      const isYou = userIdStr === String(me.id);
      const isCreator = userIdStr === String(project.owner_user_id);
      // .read-only collapses the trailing Remove column on non-admin views;
      // see CSS for the grid-template-columns swap.
      const cls = 'member-row' + (isYou ? ' you' : '') + (!isProjectAdmin ? ' read-only' : '');
      // Email may be null for orphan rows (project_members without a matching D1
      // user — surfaced rather than hidden, per the API contract).
      const email = m.email || '(orphan: id=' + userIdStr + ')';
      const initial = m.email ? deriveUserInitial(m.email) : '?';
      const meta = formatMemberMeta(m, isCreator);
      const roleBadge = isCreator
        ? '<span class="badge">Admin</span>'
        : '<span class="badge muted">Member</span>';
      const removeBtn = isProjectAdmin
        ? '<button class="btn-danger member-remove-btn" type="button" data-user-id="' + escapeHtml(userIdStr) + '"' + (isCreator ? ' disabled' : '') + '>Remove</button>'
        : '';
      const youSuffix = isYou ? ' <span class="self">(you)</span>' : '';
      return `
        <div class="${cls}">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div class="member-info">
            <div class="member-email">${escapeHtml(email)}${youSuffix}</div>
            <div class="member-meta">${escapeHtml(meta)}</div>
          </div>
          ${roleBadge}
          ${removeBtn}
        </div>
      `;
    }

    function formatMemberMeta(m, isCreator) {
      // Creator uses joined_at ("Joined as creator · 28 Apr"); invitees use
      // invited_at ("Invited 2 May") to match the mockup verbatim.
      if (isCreator) {
        const dateStr = formatShortDate(m.joined_at);
        return dateStr ? 'Joined as creator · ' + dateStr : 'Joined as creator';
      }
      const dateStr = formatShortDate(m.invited_at);
      return dateStr ? 'Invited ' + dateStr : 'Invited';
    }

    function formatShortDate(value) {
      if (!value) return '';
      try {
        const d = new Date(value);
        if (isNaN(d.getTime())) return '';
        // "28 Apr" / "2 May" — day + abbreviated month, no year.
        return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }).format(d);
      } catch {
        return '';
      }
    }

    function updateMemberCountPill() {
      const pill = document.getElementById('memberCountPill');
      if (!pill) return;
      if (memberCount === null) {
        pill.style.display = 'none';
        pill.textContent = '';
      } else {
        pill.style.display = '';
        pill.textContent = String(memberCount);
      }
    }

    async function onInviteSubmit() {
      const input = document.getElementById('inviteEmail');
      const btn = document.getElementById('inviteBtn');
      if (!input || !btn || btn.disabled) return;
      const email = input.value.trim();
      if (email.length === 0) return;

      const origText = btn.textContent;
      btn.textContent = 'Sending…';
      btn.disabled = true;
      input.disabled = true;
      hideInviteError();

      let res;
      try {
        res = await fetch('/api/projects/' + encodeURIComponent(project.id) + '/members', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
      } catch {
        showInviteError('Something went wrong. Please try again.');
        restoreInviteForm(btn, input, origText);
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }
      // 403 from requireProjectRole = stale-admin-state. Bounce so the user
      // returns to a known UI state rather than seeing a bare "Forbidden".
      if (res.status === 403) { location.replace('/projects.html'); return; }

      if (!res.ok) {
        // 400 / 404 / 409 / 500 — render server's error verbatim per decision N.
        // The members API uses user-facing-quality strings already
        // ("Invalid email", "No Elinno account…", "User is already a member…").
        const data = await res.json().catch(() => ({}));
        const msg = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
        showInviteError(msg);
        restoreInviteForm(btn, input, origText);
        return;
      }

      // 201 success — clear input, refetch list.
      input.value = '';
      restoreInviteForm(btn, input, origText);
      await loadMembers();
    }

    function showInviteError(msg) {
      const slot = document.getElementById('inviteError');
      if (!slot) return;
      slot.textContent = msg;
      slot.style.display = '';
    }

    function hideInviteError() {
      const slot = document.getElementById('inviteError');
      if (!slot) return;
      slot.style.display = 'none';
      slot.textContent = '';
    }

    function restoreInviteForm(btn, input, origText) {
      if (btn) {
        btn.textContent = origText;
        btn.disabled = !input || input.value.trim().length === 0;
      }
      if (input) input.disabled = false;
    }

    async function onRemoveClick(userId, btn) {
      if (!btn || btn.disabled || !userId) return;
      // Defensive: the creator's row renders Remove with disabled attr, but a
      // tampered DOM could re-enable it. The 403 creator-block from the API
      // is the true gate; this is a pre-flight to keep the UI honest.
      if (userId === String(project.owner_user_id)) return;

      const origText = btn.textContent;
      btn.textContent = 'Removing…';
      btn.disabled = true;
      hideInviteError();

      let res;
      try {
        res = await fetch(
          '/api/projects/' + encodeURIComponent(project.id) +
          '/members/' + encodeURIComponent(userId),
          { method: 'DELETE' }
        );
      } catch {
        showInviteError('Something went wrong. Please try again.');
        if (btn.isConnected) { btn.textContent = origText; btn.disabled = false; }
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }

      if (!res.ok) {
        // Includes 403 ("The project creator cannot be removed"), 404, 500.
        // Render verbatim — the creator-block path is the most likely 403 here,
        // and stale-admin showing "Forbidden" is acceptable for a rare edge case.
        const data = await res.json().catch(() => ({}));
        const msg = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
        showInviteError(msg);
        if (btn.isConnected) { btn.textContent = origText; btn.disabled = false; }
        return;
      }

      // Success — refetch list. The button reference becomes detached during
      // the re-render; that's fine, we don't touch it after this point.
      await loadMembers();
    }

    // ---------- Connections tab (Block 4 commit 8) ----------
    // Implements decisions K (full-page redirect to /oauth/start),
    // L (channel-picker modal post-connect; selected_channel_* via PATCH;
    // immediate POST sync after PATCH; disconnect+reconnect for re-sync).
    // Two-tier error model per Block 2 decision N: 401 redirects to login;
    // 5xx / network show generic message + retry. Validation and
    // application errors render verbatim.

    async function loadConnections() {
      try {
        const res = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/connections');
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) { connections = []; return; }
        const data = await res.json().catch(() => ({}));
        connections = Array.isArray(data.connections) ? data.connections : [];
      } catch {
        connections = [];
      }
    }

    async function renderConnections(body) {
      // Render placeholder while we (re)load if needed.
      if (connections === null) {
        body.innerHTML = '<div class="tab-loading">Loading…</div>';
        await loadConnections();
      }

      const slack = (connections || []).find(c => c.source === 'slack');
      const jira = (connections || []).find(c => c.source === 'jira');

      if (!slack && !jira) {
        body.innerHTML = `
          <div class="tab-content">
            <div class="state-card">
              <div class="state-card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                </svg>
              </div>
              <h2 class="state-card-heading">No tools connected yet</h2>
              <p class="state-card-body">Connect a tool to start indexing data into this project.</p>
              <div class="state-card-actions" style="display:flex; gap:8px; justify-content:center;">
                <button class="btn btn-primary" id="connectSlackBtn">Connect Slack</button>
                <button class="btn btn-primary" id="connectJiraBtn">Connect Jira</button>
              </div>
            </div>
          </div>
        `;
        document.getElementById('connectSlackBtn')?.addEventListener('click', () => {
          location.href = '/api/connectors/slack/oauth/start?project_id=' + encodeURIComponent(projectId);
        });
        document.getElementById('connectJiraBtn')?.addEventListener('click', openJiraConnectModal);
        return;
      }

      // Render rows for each connected source plus an "Add another" footer
      // when only one of {slack, jira} is connected (v1.1 single-instance
      // per source per BLOCK_6_PLAN.md decision F).
      const rows = [];
      if (slack) rows.push(renderSlackRowHtml(slack));
      if (jira)  rows.push(renderJiraRowHtml(jira));

      const addOtherHtml = (slack && !jira)
        ? '<div class="tab-section-footer" style="margin-top:12px;"><button class="btn btn-ghost" id="connectJiraBtn">+ Connect Jira</button></div>'
        : (!slack && jira)
        ? '<div class="tab-section-footer" style="margin-top:12px;"><button class="btn btn-ghost" id="connectSlackBtn">+ Connect Slack</button></div>'
        : '';

      body.innerHTML = `
        <div class="tab-content">
          ${rows.join('')}
          ${addOtherHtml}
        </div>
      `;

      // Wire Slack row handlers.
      if (slack) {
        const slackNeedsSetup = !slack.selected_channel_id;
        if (slackNeedsSetup) {
          document.getElementById('pickChannelBtn')?.addEventListener('click', () => openChannelPicker(slack.id));
        }
        // Block 9.1: Sync now + View activity (admin-only; render-time gated)
        document.getElementById('syncSlackBtn')?.addEventListener('click', () => triggerManualSync(slack.id, 'slack'));
        document.getElementById('activitySlackBtn')?.addEventListener('click', () => toggleActivityDrawer(slack.id, 'slack'));
        document.getElementById('disconnectSlackBtn')?.addEventListener('click', () => disconnectSlack(slack.id));
      }

      // Wire Jira row handlers.
      if (jira) {
        const jiraNeedsSetup = !jira.selected_project_key;
        if (jiraNeedsSetup) {
          document.getElementById('pickProjectBtn')?.addEventListener('click', () => openJiraProjectPicker(jira.id));
        }
        // Block 9.1: Sync now + View activity (admin-only; render-time gated)
        document.getElementById('syncJiraBtn')?.addEventListener('click', () => triggerManualSync(jira.id, 'jira'));
        document.getElementById('activityJiraBtn')?.addEventListener('click', () => toggleActivityDrawer(jira.id, 'jira'));
        document.getElementById('disconnectJiraBtn')?.addEventListener('click', () => disconnectJira(jira.id));
      }

      // Wire "+ Connect Jira/Slack" footer button (whichever is shown).
      document.getElementById('connectJiraBtn')?.addEventListener('click', openJiraConnectModal);
      document.getElementById('connectSlackBtn')?.addEventListener('click', () => {
        location.href = '/api/connectors/slack/oauth/start?project_id=' + encodeURIComponent(projectId);
      });

      // ?just_connected one-shot: auto-open the relevant picker.
      if (!justConnectedHandled) {
        justConnectedHandled = true;
        const params = new URLSearchParams(location.search);
        const just = params.get('just_connected');
        if (just === 'slack' && slack && !slack.selected_channel_id) {
          setTimeout(() => openChannelPicker(slack.id), 0);
        } else if (just === 'jira' && jira && !jira.selected_project_key) {
          setTimeout(() => openJiraProjectPicker(jira.id), 0);
        }
        if (params.has('just_connected')) {
          const url = new URL(location.href);
          url.searchParams.delete('just_connected');
          history.replaceState(null, '', url.toString());
        }
      }
    }

    // ---------- per-source row HTML ----------

    // Block 9.1 decision N: compute client-side rate-limit state from
    // connections.last_sync_at. CAVEAT: server uses MAX(sync_runs.started_at)
    // which includes failures; client only sees last_sync_at (bumped on
    // non-inert success). Client may show "available" when server returns
    // 429 — surfaced as a toast in triggerManualSync.
    const SYNC_RATE_LIMIT_MS = 3600 * 1000;
    function computeSyncBlocked(connection) {
      if (!connection || !connection.last_sync_at) return { blocked: false, minutesRemaining: 0 };
      const blockedUntil = new Date(connection.last_sync_at).getTime() + SYNC_RATE_LIMIT_MS;
      const remainingMs = blockedUntil - Date.now();
      if (remainingMs <= 0) return { blocked: false, minutesRemaining: 0 };
      return { blocked: true, minutesRemaining: Math.ceil(remainingMs / 60000) };
    }

    // Block 9.1: fixed-position toast for sync-related feedback. Lives
    // outside #tabBody so renderTabBody() re-renders don't wipe it. Auto-
    // dismisses after 5s; consecutive calls reset the timer + replace text.
    function showConnToast(msg, type) {
      let toast = document.getElementById('connToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'connToast';
        document.body.appendChild(toast);
      }
      toast.className = 'conn-toast conn-toast-' + (type || 'info');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    // Block 9.1 decision L: admin-only manual full sync. Disables the
    // clicked button while in-flight; refreshes connections + re-renders
    // the tab on success so the new last_sync_at + Active pill update.
    // 429 surfaces via toast per decision N's caveat (client/server clock-
    // source mismatch). Other errors render a generic toast — the sync_run
    // failed-row narrative shows up in the activity drawer (commit 3).
    // Block 9.1 decision O: activity drawer formatters + render helpers.

    // Duration: finished_at - started_at as 'Xs' or 'Xm Ys'. '—' if still
    // running (no finished_at) or if the inputs don't parse.
    function fmtSyncDuration(start, end) {
      if (!start || !end) return '—';
      const ms = new Date(end).getTime() - new Date(start).getTime();
      if (!isFinite(ms) || ms < 0) return '—';
      const secs = Math.round(ms / 1000);
      if (secs < 60) return secs + 's';
      const mins = Math.floor(secs / 60);
      const remSecs = secs % 60;
      return remSecs === 0 ? mins + 'm' : mins + 'm ' + remSecs + 's';
    }

    // Error cell: trim + truncate >120 chars with ellipsis per decision O.
    // Returns HTML-escaped string (no markup). Caller wraps in italic+red.
    function fmtSyncError(err) {
      if (!err) return '';
      const trimmed = String(err).trim();
      if (trimmed.length <= 120) return escapeHtml(trimmed);
      return escapeHtml(trimmed.slice(0, 120)) + '…';
    }

    // 50-row activity table. Columns per decision O:
    // When | Status | Mode | Duration | Records (+ins / ~upd / ⊘skip) | Error
    function renderSyncRunsTableHtml(runs) {
      if (!Array.isArray(runs) || runs.length === 0) {
        return '<div class="activity-empty">No sync runs yet.</div>';
      }
      const rows = runs.map(r => {
        const whenAbs = fmtCitationTitle(r.started_at);
        const whenRel = fmtRelativeShort(r.started_at) || 'now';
        const dur = (r.status === 'running') ? '—' : fmtSyncDuration(r.started_at, r.finished_at);
        const counts = '+' + (r.records_inserted || 0) + ' / ~' + (r.records_updated || 0) + ' / ⊘' + (r.records_skipped || 0);
        const errorHtml = (r.status === 'failed' && r.error)
          ? '<span class="activity-error">' + fmtSyncError(r.error) + '</span>'
          : '';
        return `
          <tr>
            <td title="${escapeHtml(whenAbs)}">${escapeHtml(whenRel)}</td>
            <td><span class="activity-status activity-status-${escapeHtml(r.status || 'unknown')}">${escapeHtml(r.status || '—')}</span></td>
            <td>${escapeHtml(r.sync_mode || '')}</td>
            <td>${escapeHtml(dur)}</td>
            <td class="activity-counts">${escapeHtml(counts)}</td>
            <td>${errorHtml}</td>
          </tr>
        `;
      }).join('');
      return `
        <table class="activity-table">
          <thead>
            <tr>
              <th>When</th>
              <th>Status</th>
              <th>Mode</th>
              <th>Duration</th>
              <th>Records</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // Toggle the drawer for a given connection source. First open fetches
    // the sync-runs list (member-accessible endpoint at sync-runs.js:31);
    // subsequent toggles just show/hide without re-fetching to avoid
    // refresh-thrash. Click "Refresh" inside the drawer if needed (future
    // enhancement — for v1.1 the user can just close + reopen).
    async function toggleActivityDrawer(connId, source) {
      const drawerId = source + 'ActivityDrawer';
      const drawer = document.getElementById(drawerId);
      if (!drawer) return;
      if (drawer.style.display === 'block') {
        drawer.style.display = 'none';
        return;
      }
      drawer.style.display = 'block';
      if (drawer.dataset.loaded === 'true') return;  // already fetched
      drawer.innerHTML = '<div class="activity-loading">Loading…</div>';
      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync-runs'
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          drawer.innerHTML = '<div class="activity-empty">Could not load sync runs.</div>';
          return;
        }
        const data = await res.json().catch(() => ({}));
        const runs = Array.isArray(data.sync_runs) ? data.sync_runs : [];
        drawer.innerHTML = renderSyncRunsTableHtml(runs);
        drawer.dataset.loaded = 'true';
      } catch {
        drawer.innerHTML = '<div class="activity-empty">Could not load sync runs.</div>';
      }
    }

    async function triggerManualSync(connId, source) {
      const btnId = source === 'slack' ? 'syncSlackBtn' : 'syncJiraBtn';
      const btn = document.getElementById(btnId);
      if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync',
          { method: 'POST' }
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 429) {
          const data = await res.json().catch(() => ({}));
          const mins = data.retry_after_seconds
            ? Math.ceil(data.retry_after_seconds / 60)
            : 60;
          showConnToast('Rate limit: next sync in ' + mins + 'm', 'warn');
          return;
        }
        if (!res.ok) {
          showConnToast('Sync failed. Check the activity drawer for details.', 'warn');
          return;
        }
        await loadConnections();
        showConnToast('Sync complete.', 'success');
        if (activeTab === 'connections') renderTabBody();
      } catch {
        showConnToast('Sync failed. Network or server error.', 'warn');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Sync now'; }
      }
    }

    function renderSlackRowHtml(slack) {
      const channelId = slack.selected_channel_id || null;
      const channelName = slack.selected_channel_name || null;
      const needsSetup = !channelId;
      const lastSyncRel = slack.last_sync_at ? fmtRelativeShort(slack.last_sync_at) : null;
      let pillText, pillClass;
      if (needsSetup) { pillText = 'Needs setup'; pillClass = 'pill-setup'; }
      else if (slack.last_sync_at) { pillText = 'Active'; pillClass = 'pill-active'; }
      else { pillText = 'Syncing…'; pillClass = 'pill-syncing'; }

      // Block 9.1 decisions L + N: admin-only Sync now button + client-side
      // disabled state when within 1h of last successful sync. Tooltip
      // surfaces the remaining minutes.
      const isAdmin = !!(me && me.is_admin);
      const blocked = computeSyncBlocked(slack);
      const syncBtnHtml = (isAdmin && !needsSetup)
        ? `<button class="btn btn-ghost" id="syncSlackBtn"${blocked.blocked ? ' disabled title="Next sync available in ' + blocked.minutesRemaining + 'm"' : ''}>Sync now</button>`
        : '';
      // Block 9.1 decision O: View activity link, admin-only UI gate even
      // though endpoint is member-accessible (tighter endpoint gate is a
      // Block 10 cleanup, not 9.1's surface).
      const activityBtnHtml = isAdmin
        ? '<button class="btn btn-ghost" id="activitySlackBtn">View activity</button>'
        : '';

      return `
        <div class="connection-row-group">
          <div class="connection-row">
            <div class="connection-info">
              <div class="connection-source">Slack</div>
              <div class="connection-meta">
                ${channelName ? '#' + escapeHtml(channelName) : 'No channel selected'}
                ${lastSyncRel ? ' &middot; last sync ' + escapeHtml(lastSyncRel) : ''}
              </div>
            </div>
            <div class="connection-pill ${pillClass}">${escapeHtml(pillText)}</div>
            <div class="connection-actions">
              ${needsSetup ? '<button class="btn btn-ghost" id="pickChannelBtn">Pick channel</button>' : ''}
              ${activityBtnHtml}
              ${syncBtnHtml}
              <button class="btn btn-ghost" id="disconnectSlackBtn" aria-label="Disconnect Slack">Disconnect</button>
            </div>
          </div>
          <div class="activity-drawer" id="slackActivityDrawer" style="display:none;"></div>
        </div>
      `;
    }

    function renderJiraRowHtml(jira) {
      const projectKey = jira.selected_project_key || null;
      const projectName = jira.selected_project_name || null;
      const needsSetup = !projectKey;
      const lastSyncRel = jira.last_sync_at ? fmtRelativeShort(jira.last_sync_at) : null;
      let pillText, pillClass;
      if (needsSetup) { pillText = 'Needs setup'; pillClass = 'pill-setup'; }
      else if (jira.last_sync_at) { pillText = 'Active'; pillClass = 'pill-active'; }
      else { pillText = 'Syncing…'; pillClass = 'pill-syncing'; }

      const metaText = projectName
        ? `${escapeHtml(projectName)} (${escapeHtml(projectKey)})`
        : (projectKey ? escapeHtml(projectKey) : 'No project selected');

      // Block 9.1 decisions L + N: admin-only Sync now button with client-
      // side disabled state — same pattern as Slack row.
      const isAdmin = !!(me && me.is_admin);
      const blocked = computeSyncBlocked(jira);
      const syncBtnHtml = (isAdmin && !needsSetup)
        ? `<button class="btn btn-ghost" id="syncJiraBtn"${blocked.blocked ? ' disabled title="Next sync available in ' + blocked.minutesRemaining + 'm"' : ''}>Sync now</button>`
        : '';
      // Block 9.1 decision O: View activity link, admin-only UI gate.
      const activityBtnHtml = isAdmin
        ? '<button class="btn btn-ghost" id="activityJiraBtn">View activity</button>'
        : '';

      return `
        <div class="connection-row-group">
          <div class="connection-row">
            <div class="connection-info">
              <div class="connection-source">Jira</div>
              <div class="connection-meta">
                ${metaText}
                ${lastSyncRel ? ' &middot; last sync ' + escapeHtml(lastSyncRel) : ''}
              </div>
            </div>
            <div class="connection-pill ${pillClass}">${escapeHtml(pillText)}</div>
            <div class="connection-actions">
              ${needsSetup ? '<button class="btn btn-ghost" id="pickProjectBtn">Pick project</button>' : ''}
              ${activityBtnHtml}
              ${syncBtnHtml}
              <button class="btn btn-ghost" id="disconnectJiraBtn" aria-label="Disconnect Jira">Disconnect</button>
            </div>
          </div>
          <div class="activity-drawer" id="jiraActivityDrawer" style="display:none;"></div>
        </div>
      `;
    }

    // ---------- Jira connect form (decision N + L) ----------

    function openJiraConnectModal() {
      const modal = document.getElementById('jiraConnectModal');
      if (!modal) return;
      modal.style.display = '';
      // Reset form + error each time the modal opens.
      const form = document.getElementById('jiraConnectForm');
      if (form) form.reset();
      const err = document.getElementById('jiraConnectError');
      if (err) { err.style.display = 'none'; err.textContent = ''; }

      modal.querySelector('.modal-close').onclick = closeJiraConnectModal;
      modal.querySelector('.modal-backdrop').onclick = closeJiraConnectModal;
      document.getElementById('jiraConnectCancelBtn').onclick = closeJiraConnectModal;
      document.addEventListener('keydown', _jiraConnectEscapeHandler);

      // Wire the form submit. Idempotent — reattaching is fine.
      form.onsubmit = submitJiraConnect;

      // Focus the first field for quick entry.
      setTimeout(() => document.getElementById('jiraSiteUrl')?.focus(), 0);
    }

    function closeJiraConnectModal() {
      const modal = document.getElementById('jiraConnectModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _jiraConnectEscapeHandler);
    }

    function _jiraConnectEscapeHandler(e) {
      if (e.key === 'Escape') closeJiraConnectModal();
    }

    async function submitJiraConnect(event) {
      event.preventDefault();
      const errEl = document.getElementById('jiraConnectError');
      const submitBtn = document.getElementById('jiraConnectSubmitBtn');
      errEl.style.display = 'none';
      errEl.textContent = '';

      // Strip any accidentally-pasted protocol/path so the validator
      // doesn't reject (matches jira.js's hostname-only requirement).
      let siteUrl = (document.getElementById('jiraSiteUrl').value || '').trim();
      siteUrl = siteUrl.replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
      const accountEmail = (document.getElementById('jiraEmail').value || '').trim();
      const apiToken = document.getElementById('jiraApiToken').value || '';

      if (!siteUrl || !accountEmail || !apiToken) {
        errEl.textContent = 'All three fields are required.';
        errEl.style.display = '';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connecting…';

      try {
        const res = await fetch('/api/connectors/jira/auth/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            project_id: projectId,
            site_url: siteUrl,
            account_email: accountEmail,
            api_token: apiToken,
          }),
        });
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          let msg = (data && typeof data.error === 'string') ? data.error : 'Could not connect.';
          if (msg === 'invalid_credentials') msg = 'Invalid credentials. Check the site URL, email, and API token.';
          if (msg === 'already_connected') msg = 'A Jira connection already exists for this project.';
          errEl.textContent = msg;
          errEl.style.display = '';
          return;
        }
        // Success — full reload with ?just_connected=jira so the project
        // picker auto-opens once renderConnections re-runs.
        const url = new URL(location.href);
        url.searchParams.set('tab', 'connections');
        url.searchParams.set('just_connected', 'jira');
        location.href = url.toString();
      } catch {
        errEl.textContent = 'Could not connect. Please try again.';
        errEl.style.display = '';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Connect';
      }
    }

    // ---------- Jira project picker ----------

    async function openJiraProjectPicker(connId) {
