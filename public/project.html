      const refreshButtonHtml = messageId
        ? `<button type="button" class="refresh-reask-button" data-msg-id="${escapeHtml(messageId)}" title="Refresh the cited sources and re-ask">↻ Refresh &amp; re-ask</button>`
        : '';
      return `<div class="chat-citation-rail">${chips}${refreshButtonHtml}</div>`;
    }

    // ---------- Composer (decision W) ----------
    function wireComposer() {
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');

      // Auto-resize on input. Cap is enforced by CSS max-height; scrollHeight grows
      // beyond cap, so we still set scrollHeight and let CSS clamp it.
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = input.scrollHeight + 'px';
        send.disabled = inFlight || input.value.trim().length === 0;
        // Block 18.5: hide the rail while the composer has content. A style
        // toggle on a persistent node — deliberately NOT a re-render, which
        // on every keystroke would thrash layout and can steal focus from
        // the textarea the rail sits above.
        updateRailVisibility();
      });

      // Enter sends; Shift+Enter newline; IME-safe (don't intercept while composing).
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      send.addEventListener('click', sendMessage);
    }

    function showChatError(msg) {
      const slot = document.getElementById('chatError');
      if (!slot) return;
      slot.textContent = msg;
      slot.style.display = '';
    }

    function clearChatError() {
      const slot = document.getElementById('chatError');
      if (!slot) return;
      slot.style.display = 'none';
      slot.textContent = '';
    }

    // Block 10.2 decision F: AI paused banner. Renders above the
    // composer when aiPausedUntilMs is in the future. Disables the
    // composer's input + send button so users get clear feedback that
    // typing won't help until the cap resets next month. Cleared on a
    // page reload — a fresh send after the reset boundary will pass the
    // server pre-check and the banner stays cleared.
    function updateAiPausedBanner() {
      const banner = document.getElementById('aiPausedBanner');
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');
      if (!banner) return;
      const isPaused = aiPausedUntilMs > Date.now();
      if (isPaused) {
        const resetDate = new Date(aiPausedUntilMs);
        const opts = { year: 'numeric', month: 'short', day: 'numeric' };
        banner.textContent = 'AI is paused for this project — monthly budget reached. Resumes ' + resetDate.toLocaleDateString(undefined, opts) + '.';
        banner.style.display = '';
        if (input) input.disabled = true;
        if (send) send.disabled = true;
      } else {
        banner.style.display = 'none';
        banner.textContent = '';
        if (input) input.disabled = false;
        // Send button's enabled state is also gated by inFlight + empty
        // input; the composer's own input listener handles those.
      }
    }

    async function sendMessage() {
      if (inFlight) return;
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');
      if (!input || !send) return;
      const content = input.value.trim();
      if (content.length === 0) return;

      // Capture sendingConvId at send time. If user switches convs mid-flight, the
      // returned messages still get cached against the conversation they were sent in.
      const sendingConvId = activeConvId;

      inFlight = true;
      // 2026-05-27: send button is an icon now — don't replace its
      // innerHTML with text. Disabled state communicates sending.
      send.disabled = true;
      input.disabled = true;
      clearChatError();

      let res;
      try {
        res = await fetch(
          '/api/projects/' + encodeURIComponent(project.id) +
          '/conversations/' + encodeURIComponent(sendingConvId) + '/messages',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content }),
          }
        );
      } catch {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/projects.html'); return; }
      if (res.status === 400) {
        // Decision N: validation strings are user-facing-quality; render verbatim.
        const data = await res.json().catch(() => ({}));
        restoreComposer();
        showChatError(data && data.error ? data.error : 'Something went wrong. Please try again.');
        return;
      }
      if (res.status === 429) {
        // BLOCK_10_PLAN.md decisions K (10.3) + F (10.2): two flavors of
        // 429 from this endpoint. Daily-message-limit 429 carries
        // `retry_after_seconds`; cost-cap pause 429 carries `cap_usd` +
        // `used_usd` + `resets_at` (no retry_after_seconds — the
        // reset is a calendar-month event, not a duration).
        const data = await res.json().catch(() => ({}));
        restoreComposer();
        let msg = data && data.error ? data.error : 'Limit reached.';
        if (data && data.resets_at) {
          // Cost-cap pause shape. Render the human resets date.
          const resetDate = new Date(data.resets_at);
          if (!isNaN(resetDate.getTime())) {
            const opts = { year: 'numeric', month: 'short', day: 'numeric' };
            msg = msg + ' AI resumes ' + resetDate.toLocaleDateString(undefined, opts) + '.';
          }
          if (typeof data.used_usd === 'number' && typeof data.cap_usd === 'number') {
            msg = msg + ' ($' + data.used_usd.toFixed(2) + ' / $' + data.cap_usd.toFixed(2) + ')';
          }
          aiPausedUntilMs = resetDate.getTime();
          updateAiPausedBanner();
        } else if (data && typeof data.retry_after_seconds === 'number' && data.retry_after_seconds > 0) {
          // Daily-message-limit shape.
          const totalMins = Math.ceil(data.retry_after_seconds / 60);
          const hours = Math.floor(totalMins / 60);
          const remMins = totalMins % 60;
          let when;
          if (hours > 0 && remMins > 0) when = hours + 'h ' + remMins + 'm';
          else if (hours > 0) when = hours + 'h';
          else when = totalMins + 'm';
          msg = msg + ' Try again in ' + when + '.';
        }
        showChatError(msg);
        return;
      }
      if (!res.ok) {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch {
        restoreComposer();
        showChatError('Something went wrong. Please try again.');
        return;
      }

      // Append both messages to the conversation they were sent in (sendingConvId,
      // not activeConvId — user might have switched mid-flight).
      if (!messagesById[sendingConvId]) messagesById[sendingConvId] = [];
      if (data.user_message) messagesById[sendingConvId].push(data.user_message);
      if (data.assistant_message) messagesById[sendingConvId].push(data.assistant_message);

      // Decision X: server response is canonical for title. Update sidebar row +
      // chat-conv-title heading (when on chat tab and same conv) directly from the
      // response — no refetch.
      const idx = conversations.findIndex(c => c.id === sendingConvId);
      if (idx >= 0) {
        const newTitle = (data.conversation && data.conversation.title) || conversations[idx].title;
        const bumpedAt = (data.assistant_message && data.assistant_message.created_at) || new Date().toISOString();
        conversations[idx] = {
          ...conversations[idx],
          title: newTitle,
          updated_at: bumpedAt,
          message_count: (conversations[idx].message_count || 0) + 2,
        };
        // Re-sort matches the API's ORDER BY updated_at DESC, id DESC so the
        // active conv naturally bumps to the top of the sidebar.
        conversations.sort((a, b) => {
          const at = new Date(a.updated_at).getTime();
          const bt = new Date(b.updated_at).getTime();
          if (bt !== at) return bt - at;
          return a.id < b.id ? 1 : -1;
        });
      }

      // Render — sidebar always; chat surface only when still viewing that conv.
      renderSidebar();
      if (activeConvId === sendingConvId && activeTab === 'chat') {
        const heading = document.getElementById('chatConvTitle');
        if (heading) {
          const conv = conversations.find(c => c.id === sendingConvId);
          heading.textContent = conv ? (conv.title || '') : '';
        }
        renderMessages();
      }

      // Decision W: clear textarea, reset min-height, refocus.
      input.value = '';
      input.style.height = '';
      restoreComposer();
    }

    function restoreComposer() {
      inFlight = false;
      const input = document.getElementById('chatInput');
      const send = document.getElementById('chatSend');
      if (send) {
        // 2026-05-27: send button is an icon now — just toggle disabled.
        send.disabled = !input || input.value.trim().length === 0;
      }
      if (input) {
        input.disabled = false;
        input.focus();
      }
    }

    // ---------- Conversation switch ----------
    async function onConvClick(convId) {
      if (!convId) return;
      // No-op if we're already on this conv AND on chat tab. Still close drawer
      // for the mobile "tap to dismiss" affordance (decision AA).
      if (convId === activeConvId && activeTab === 'chat') {
        closeDrawer();
        return;
      }

      // Fetch messages if not cached.
      if (!messagesById[convId]) {
        let res;
        try {
          res = await fetch(
            '/api/projects/' + encodeURIComponent(project.id) +
            '/conversations/' + encodeURIComponent(convId) + '/messages'
          );
        } catch {
          showChatError("Couldn't load that conversation. Please try again.");
          return;
        }
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 403) {
          // Conv was deleted or membership revoked between sidebar render and click.
          // Bounce to the safe known state.
          location.replace('/projects.html');
          return;
        }
        if (!res.ok) {
          showChatError("Couldn't load that conversation. Please try again.");
          return;
        }
        const data = await res.json().catch(() => ({}));
        messagesById[convId] = Array.isArray(data.messages) ? data.messages : [];
      }

      closeDrawer();
      // Sidebar click always lands on the chat tab — that's where active-conv state
      // is meaningful. Matches consumer chat UX (Slack, ChatGPT).
      applyState({ conversationId: convId, tab: 'chat' });
    }

    // ---------- New conversation ----------
    async function onNewConv() {
      const btn = document.getElementById('newConvBtn');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try {
        let res;
        try {
          res = await fetch(
            '/api/projects/' + encodeURIComponent(project.id) + '/conversations',
            { method: 'POST' }
          );
        } catch {
          // Network failure: surface in chat-error slot, switch to chat tab so the
          // slot is visible. Stay on current conv.
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 403) { location.replace('/projects.html'); return; }
        if (!res.ok) {
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        const data = await res.json().catch(() => ({}));
        if (!data || !data.conversation) {
          applyState({ conversationId: activeConvId, tab: 'chat' });
          showChatError("Couldn't create a new conversation. Please try again.");
          closeDrawer();
          return;
        }
        const newConv = data.conversation;
        conversations.unshift(newConv);
        messagesById[newConv.id] = [];
        closeDrawer();
        // Decision V: route through applyState. Lands on chat tab, fresh conv active.
        applyState({ conversationId: newConv.id, tab: 'chat' });
      } finally {
        btn.disabled = false;
      }
    }

    // ---------- Members tab (sub-task 2.6) ----------
    //
    // ============================================================
    // Block 16 — Sprint View (read-only Jira sprint dashboard)
    // Reads GET /api/projects/:id/sprint (?sprint_id passthrough). The
    // endpoint bypasses the agent loop entirely; this renderer only shapes
    // the JSON into the mockup's dashboard. Grouping (Status/Assignee/Type/
    // None) and Status/Assignee/Type filters operate client-side on the
    // returned issues[] — no refetch (the list is the uncapped ≤500 read).
    // ============================================================
    const SV_IC_TASK  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>';
    const SV_IC_BUG   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="7" width="8" height="13" rx="4"/><path d="M8 11H4M8 15H3M8 19H5M16 11h4M16 15h5M16 19h3M9.5 7 8 4M14.5 7 16 4"/></svg>';
    const SV_IC_STORY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
    const SV_IC_GEN   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>';
    const SV_IC_CAL   = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
    const SV_IC_REFRESH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>';
    const SV_CHECK    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-11"/></svg>';
    const SV_UNASSIGNED = '__UNASSIGNED__';

    // status_category → presentation. `default` (unknown) is surfaced as a
    // muted "Other" rather than dropped (Block 16 decision: don't hide it).
    function svCat(cat) {
      switch (cat) {
        case 'indeterminate': return { color: '#6234fc', spill: 'sp-ind', group: 'ind',  label: 'In Progress' };
        case 'done':          return { color: '#1d8a52', spill: 'sp-don', group: 'done', label: 'Done' };
        case 'new':           return { color: '#8b93a7', spill: 'sp-new', group: 'new',  label: 'To Do' };
        default:              return { color: '#c2c7d0', spill: 'sp-new', group: 'new',  label: 'Other' };
      }
    }
    function svType(type) {
      const t = String(type || '').toLowerCase();
      if (t === 'task')  return { cls: 'task',  icon: SV_IC_TASK };
      if (t === 'bug')   return { cls: 'bug',   icon: SV_IC_BUG };
      if (t === 'story') return { cls: 'story', icon: SV_IC_STORY };
      return { cls: '', icon: SV_IC_GEN };
    }
    function svInitials(name) {
      if (!name) return '—';
      const parts = String(name).trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '—';
      if (parts.length === 1) return parts[0].slice(0, 1).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }
    function svFmtDate(v, withYear) {
      if (!v) return '';
      const d = new Date(v);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', withYear
        ? { month: 'short', day: 'numeric', year: 'numeric' }
        : { month: 'short', day: 'numeric' });
    }
    function svFmtRange(s, e) {
      if (s && e) return svFmtDate(s, false) + ' – ' + svFmtDate(e, true);
      if (s || e) return svFmtDate(s || e, true);
      return '';
    }

    async function renderSprint(body) {
      // Loading placeholder (keeps the FROM chip stable across the fetch).
      body.innerHTML = projectFromRowHtml()
        + '<div class="sv"><div class="sv-empty"><p class="sv-empty-text">Loading sprint…</p></div></div>';

      const spOverride = new URLSearchParams(location.search).get('sprint_id');
      const url = '/api/projects/' + encodeURIComponent(projectId) + '/sprint'
        + (spOverride ? ('?sprint_id=' + encodeURIComponent(spOverride)) : '');

      let data;
      try {
        const res = await fetch(url);
        if (res.status === 401) { redirectToLogin(); return; }
        if (res.status === 403) { location.replace('/projects.html'); return; }
        if (!res.ok) { renderSprintError(body); return; }
        data = await res.json();
      } catch {
        renderSprintError(body);
        return;
      }
      // Tab may have changed while the fetch was in flight — don't clobber.
      if (activeTab !== 'sprint') return;

      sprintData = data;
      if (!data || data.active === false) {
        renderSprintEmpty(body, data && data.as_of);
        return;
      }

      // Fresh UI state for this sprint payload.
      const statusList = (data.board_status || []).map(b => b.status);
      const asgList = (data.workload || []).map(w => w.assignee || SV_UNASSIGNED);
      const typeList = [];
      (data.issues || []).forEach(it => { if (!typeList.includes(it.issue_type)) typeList.push(it.issue_type); });
      svUi = {
        groupBy: 'status',
        statuses: new Set(statusList),
        assignees: new Set(asgList),
        types: new Set(typeList),
        statusOrder: statusList,
        asgOrder: asgList,
        typeOrder: typeList,
        _open: null,
      };

      body.innerHTML = projectFromRowHtml() + svDashboardHtml(data);

      // Delegated interactions on the issues card (survives inner re-renders).
      const card = document.getElementById('svIssuesCard');
      if (card) card.addEventListener('click', svOnCardClick);
      svWireDoc();
    }

    function renderSprintEmpty(body, asOf) {
      const foot = asOf
        ? '<div class="sv-foot">' + SV_IC_REFRESH + ' Synced from Jira · as of ' + escapeHtml(fmtRelativeShort(asOf) || 'unknown') + '</div>'
        : '';
      body.innerHTML = projectFromRowHtml()
        + '<div class="sv"><div class="sv-empty">'
        +   '<div class="sv-empty-ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div>'
        +   '<h2 class="sv-empty-title">No active sprint</h2>'
        +   '<p class="sv-empty-text">This project’s Jira board doesn’t have an active sprint right now. When your team starts one, its progress, breakdown, and issues will show up here.</p>'
        +   foot
        + '</div></div>';
    }

    function renderSprintError(body) {
      body.innerHTML = projectFromRowHtml()
        + '<div class="sv"><div class="sv-empty">'
        +   '<h2 class="sv-empty-title">Couldn’t load the sprint</h2>'
        +   '<p class="sv-empty-text sv-error">Something went wrong fetching this sprint. Reload the page to try again.</p>'
        + '</div></div>';
    }

    // ---- Dashboard sections (pure string builders) ----
    function svDashboardHtml(d) {
      const sp = d.sprint || {};
      const pr = sp.progress || {};
      const overdue = !!pr.overdue;

      // Header pills + days tile.
      let pills = '<span class="sv-pill"><span class="sv-dot"></span>Active</span>';
      if (overdue) pills += '<span class="sv-pill sv-pill--over"><span class="sv-dot"></span>Overdue</span>';

      const daysNum = overdue ? pr.days_overdue : pr.days_left;
      const daysLbl = overdue ? 'days overdue' : 'days left';
      const daysTile = '<div class="sv-daysleft' + (overdue ? ' sv-daysleft--over' : '') + '">'
        + '<div class="sv-daysleft-num">' + escapeHtml(daysNum == null ? '—' : String(daysNum)) + '</div>'
        + '<div class="sv-daysleft-lbl">' + daysLbl + '</div></div>';

      const range = svFmtRange(sp.start_date, sp.end_date);
      let meta = range ? '<span>' + SV_IC_CAL + escapeHtml(range) + '</span>' : '';
      if (sp.goal) meta += (meta ? '<span class="sv-sep">·</span>' : '') + '<span class="sv-goal">' + escapeHtml(sp.goal) + '</span>';

      // Progress bar.
      let fillW = 0, progLbl = '', overCls = '';
      if (pr.total_days == null) {
        progLbl = 'Sprint dates unavailable';
      } else if (overdue) {
        fillW = 100; overCls = '--over';
        const dw = pr.days_overdue === 1 ? 'day' : 'days';
        progLbl = 'Ended ' + escapeHtml(svFmtDate(sp.end_date, false)) + ' · ran ' + escapeHtml(String(pr.days_overdue)) + ' ' + dw + ' over';
      } else {
        fillW = Math.max(0, Math.min(100, Number(pr.pct_elapsed) || 0));
        progLbl = 'Day ' + escapeHtml(String(pr.elapsed_days)) + ' of ' + escapeHtml(String(pr.total_days)) + ' · ' + fillW + '% of the sprint elapsed';
      }
      const progress = '<div class="sv-progress">'
        + '<div class="sv-progress-track"><div class="sv-progress-fill' + (overCls ? ' sv-progress-fill--over' : '') + '" style="width:' + fillW + '%"></div></div>'
        + '<div class="sv-progress-lbl' + (overCls ? ' sv-progress-lbl--over' : '') + '">' + progLbl + '</div></div>';

      // Summary stat cards.
      const st = d.stats || {};
      const stats = '<div class="sv-stats">'
        + svStatCard('total', 'Total', st.total) + svStatCard('task', 'Tasks', st.tasks)
        + svStatCard('bug', 'Bugs', st.bugs) + svStatCard('story', 'Stories', st.stories)
        + '</div>';

      return '<div class="sv">'
        + '<div class="sv-head"><div>'
        +   '<div class="sv-titlerow"><h2 class="sv-title">' + escapeHtml(sp.name || 'Sprint') + '</h2>' + pills + '</div>'
        +   (meta ? '<div class="sv-meta">' + meta + '</div>' : '')
        + '</div>' + daysTile + '</div>'
        + progress
        + stats
        + svCategoryCardHtml(d)
        + svBoardCardHtml(d)
        + svWorkloadCardHtml(d)
        + svIssuesCardShell(d)
        + svFootHtml(d.as_of);
    }

    function svStatCard(kind, label, n) {
      const icons = {
        total: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>',
        task: SV_IC_TASK, bug: SV_IC_BUG, story: SV_IC_STORY,
      };
      return '<div class="sv-stat"><span class="sv-stat-ic sv-stat-ic--' + kind + '">' + icons[kind] + '</span>'
        + '<div class="sv-stat-num">' + escapeHtml(String(n == null ? 0 : n)) + '</div>'
        + '<div class="sv-stat-lbl">' + escapeHtml(label) + '</div></div>';
    }

    function svCategoryCardHtml(d) {
      const cats = d.categories || {};
      const order = ['new', 'indeterminate', 'done', 'unknown'];
      const present = order.filter(c => (Number(cats[c]) || 0) > 0);
      if (!present.length) return '';
      let segs = '', keys = '';
      present.forEach(c => {
        const n = Number(cats[c]) || 0, m = svCat(c);
        segs += '<div class="sv-catseg" style="flex:' + n + ';background:' + m.color + '">' + n + '</div>';
        keys += '<span><span class="sv-sw" style="background:' + m.color + '"></span> ' + escapeHtml(m.label) + ' · ' + n + '</span>';
      });
      return '<div class="sv-card"><div class="sv-card-head">'
        + '<h3 class="sv-card-title">Status category</h3>'
        + '<span class="sv-card-sub">Grouped by Jira’s fixed status categories</span></div>'
        + '<div class="sv-catbar">' + segs + '</div>'
        + '<div class="sv-catkey">' + keys + '</div></div>';
    }

    function svBoardCardHtml(d) {
      const rows = d.board_status || [];
      if (!rows.length) return '';
      const max = Math.max(1, ...rows.map(r => Number(r.count) || 0));
      const cols = rows.map(r => {
        const n = Number(r.count) || 0, pts = Number(r.points) || 0;
        const h = Math.max(4, Math.round((n / max) * 100));
        const color = svCat(r.status_category).color;
        return '<div class="sv-col"><div class="sv-bar-val">' + n + '</div>'
          + '<div class="sv-bartrack"><div class="sv-bar" style="height:' + h + '%;background:' + color + '"></div></div>'
          + '<div class="sv-bar-lbl">' + escapeHtml(r.status || '') + '</div>'
          + '<div class="sv-bar-sub">' + pts + ' pts</div></div>';
      }).join('');
      return '<div class="sv-card"><div class="sv-card-head">'
        + '<h3 class="sv-card-title">Issues by board status</h3>'
        + '<span class="sv-card-sub">Your team’s workflow columns · colors match the categories above</span></div>'
        + '<div class="sv-chart">' + cols + '</div></div>';
    }

    function svWorkloadCardHtml(d) {
      const rows = d.workload || [];
      if (!rows.length) return '';
      const max = Math.max(1, ...rows.map(r => Number(r.total) || 0));
      const html = rows.map(r => {
        const total = Number(r.total) || 0;
        const isUn = !r.assignee;
        const name = isUn ? 'Unassigned' : r.assignee;
        const counts = r.counts || {};
        let segs = '';
        [['new', '#8b93a7'], ['indeterminate', '#6234fc'], ['done', '#1d8a52'], ['unknown', '#c2c7d0']].forEach(([k, color]) => {
          const n = Number(counts[k]) || 0;
          if (n > 0) segs += '<div class="sv-wl-seg" style="flex:' + n + ';background:' + color + '">' + n + '</div>';
        });
        const fillW = Math.max(0, Math.min(100, Math.round((total / max) * 100)));
        return '<div class="sv-wl-row">'
          + '<div class="sv-wl-name"><span class="sv-wl-av' + (isUn ? ' un' : '') + '">' + escapeHtml(svInitials(r.assignee)) + '</span>' + escapeHtml(name) + '</div>'
          + '<div class="sv-wl-track"><div class="sv-wl-fill" style="width:' + fillW + '%">' + segs + '</div></div>'
          + '<div class="sv-wl-num"><b>' + total + '</b></div></div>';
      }).join('');
      return '<div class="sv-card"><div class="sv-card-head"><h3 class="sv-card-title">Assignee workload</h3>'
        + '<span class="sv-card-sub">Total issues per assignee</span></div>'
        + '<div class="sv-wl">' + html + '</div></div>';
    }

    function svFootHtml(asOf) {
      return '<div class="sv-foot">' + SV_IC_REFRESH + ' Synced from Jira · as of '
        + escapeHtml(fmtRelativeShort(asOf) || 'unknown') + '</div>';
    }

    // Issues card: outer shell with a stable #svIssuesCard whose inner content
    // (filters + list) is re-rendered on every group/filter change.
    function svIssuesCardShell(d) {
      return '<div class="sv-card" id="svIssuesCard">' + svIssuesCardInner() + '</div>';
    }

    function svIssuesCardInner() {
      const d = sprintData;
      const total = (d.issues || []).length;
      const head = '<div class="sv-card-head"><h3 class="sv-card-title">Issues</h3>'
        + '<span class="sv-card-sub">' + total + ' in this sprint</span></div>';
      const filtered = svFilteredIssues();
      return head + svFiltersHtml() + svListHtml(filtered);
    }

    function svFilteredIssues() {
      const d = sprintData;
      return (d.issues || []).filter(it => {
        const asg = it.assignee_display_name || SV_UNASSIGNED;
        return svUi.statuses.has(it.status)
          && svUi.assignees.has(asg)
          && svUi.types.has(it.issue_type);
      });
    }

    function svFiltersHtml() {
      const labels = { status: 'Status', assignee: 'Assignee', type: 'Type', none: 'None' };
      const groupChip = '<span class="sv-filterwrap" data-menu="group">'
        + '<span class="sv-chip is-group">Group: ' + labels[svUi.groupBy] + ' ▾</span>'
        + '<div class="sv-menu"><div class="sv-menu-label">Group by</div>'
        + ['status', 'assignee', 'type', 'none'].map(g =>
            '<div class="sv-menu-item' + (svUi.groupBy === g ? ' sel' : '') + '" data-menu="group" data-value="' + g + '">'
            + labels[g] + (svUi.groupBy === g ? '<span class="sv-mcheck">' + SV_CHECK + '</span>' : '') + '</div>'
          ).join('')
        + '</div></span>';

      const statusMenu = '<span class="sv-filterwrap" data-menu="status">'
        + '<span class="sv-chip">Status ▾</span>'
        + '<div class="sv-menu"><div class="sv-menu-label">Filter by status</div>'
        + svUi.statusOrder.map(s => {
            const on = svUi.statuses.has(s);
            const cat = (sprintData.board_status.find(b => b.status === s) || {}).status_category;
            return '<div class="sv-menu-item" data-menu="status" data-value="' + escapeAttr(s) + '">'
              + '<span class="sv-cb' + (on ? ' on' : '') + '">' + (on ? SV_CHECK : '') + '</span> '
              + '<span class="sv-sdot" style="background:' + svCat(cat).color + '"></span> ' + escapeHtml(s) + '</div>';
          }).join('')
        + '</div></span>';

      const asgMenu = '<span class="sv-filterwrap" data-menu="assignee">'
        + '<span class="sv-chip">Assignee ▾</span>'
        + '<div class="sv-menu"><div class="sv-menu-label">Filter by assignee</div>'
        + svUi.asgOrder.map(a => {
            const on = svUi.assignees.has(a);
            const label = a === SV_UNASSIGNED ? 'Unassigned' : a;
            return '<div class="sv-menu-item" data-menu="assignee" data-value="' + escapeAttr(a) + '">'
              + '<span class="sv-cb' + (on ? ' on' : '') + '">' + (on ? SV_CHECK : '') + '</span> ' + escapeHtml(label) + '</div>';
          }).join('')
        + '</div></span>';

      const typeMenu = '<span class="sv-filterwrap" data-menu="type">'
        + '<span class="sv-chip">Type ▾</span>'
        + '<div class="sv-menu"><div class="sv-menu-label">Filter by type</div>'
        + svUi.typeOrder.map(t => {
            const on = svUi.types.has(t), m = svType(t);
            return '<div class="sv-menu-item" data-menu="type" data-value="' + escapeAttr(t) + '">'
              + '<span class="sv-cb' + (on ? ' on' : '') + '">' + (on ? SV_CHECK : '') + '</span> '
              + '<span class="sv-type-ic sv-type-ic--' + m.cls + '">' + m.icon + '</span> ' + escapeHtml(t) + '</div>';
          }).join('')
        + '</div></span>';

      return '<div class="sv-filters">' + groupChip + statusMenu + asgMenu + typeMenu + '</div>';
    }

    // Row-cell builders.
    function svItemCell(it) {
      const m = svType(it.issue_type);
      return '<td><span class="sv-item"><span class="sv-type-ic sv-type-ic--' + m.cls + '" title="' + escapeAttr(it.issue_type || '') + '">'
        + m.icon + '</span><span class="sv-key">' + escapeHtml(it.issue_key || '') + '</span></span></td>';
    }
    function svTitleCell(it) { return '<td class="sv-it-title">' + escapeHtml(it.title || '') + '</td>'; }
    function svAsgCell(it) {
      const asg = it.assignee_display_name;
      return '<td' + (asg ? '' : ' class="sv-muted"') + '>' + escapeHtml(asg || 'Unassigned') + '</td>';
    }
    function svStatusCell(it) {
      const m = svCat(it.status_category);
      return '<td><span class="sv-spill ' + m.spill + '"><span class="d"></span>' + escapeHtml(it.status || '') + '</span></td>';
    }

    function svListHtml(items) {
      if (!items.length) {
        return '<div class="sv-empty" style="padding:40px 20px"><p class="sv-empty-text">No issues match these filters.</p></div>';
      }
      if (svUi.groupBy === 'none') {
        const rows = items.map(it => '<tr>' + svItemCell(it) + svTitleCell(it) + svStatusCell(it) + svAsgCell(it) + '</tr>').join('');
        return '<table class="sv-tbl sv-tbl--flat"><thead><tr><th>Item</th><th>Title</th><th>Status</th><th>Assignee</th></tr></thead><tbody>' + rows + '</tbody></table>';
      }
      if (svUi.groupBy === 'assignee') return svGroupedHtml(items, 'assignee');
      if (svUi.groupBy === 'type') return svGroupedHtml(items, 'type');
      return svGroupedHtml(items, 'status');
    }

    function svGroupedHtml(items, mode) {
      // Build ordered group keys + bucket the filtered issues.
      const buckets = new Map();
      const keyOf = (it) => mode === 'status' ? it.status
        : mode === 'assignee' ? (it.assignee_display_name || SV_UNASSIGNED)
        : it.issue_type;
      items.forEach(it => {
        const k = keyOf(it);
        if (!buckets.has(k)) buckets.set(k, []);
        buckets.get(k).push(it);
      });
      let order = mode === 'status' ? svUi.statusOrder
        : mode === 'assignee' ? svUi.asgOrder
        : svUi.typeOrder;
      order = order.filter(k => buckets.has(k));

      const groups = order.map(k => {
        const list = buckets.get(k);
        const rows = list.map(it => {
          const third = mode === 'status' ? svAsgCell(it) : svStatusCell(it);
          return '<tr>' + svItemCell(it) + svTitleCell(it) + third + '</tr>';
        }).join('');
        let cls = 'sv-group', head;
        if (mode === 'status') {
          const cat = (sprintData.board_status.find(b => b.status === k) || {}).status_category
            || (list[0] && list[0].status_category);
          const m = svCat(cat);
          cls += ' sv-group--' + m.group;
          head = '<span class="sv-spill ' + m.spill + '"><span class="d"></span>' + escapeHtml(k) + '</span>';
        } else if (mode === 'type') {
          const m = svType(k);
          cls += m.cls ? ' sv-group--' + m.cls : '';
          head = '<span class="sv-type-ic sv-type-ic--' + m.cls + '" title="' + escapeAttr(k || '') + '">' + m.icon + '</span>'
            + '<span class="sv-asg-name">' + escapeHtml(k || 'Unknown') + '</span>';
        } else { // assignee
          const isUn = k === SV_UNASSIGNED;
          const label = isUn ? 'Unassigned' : k;
          head = '<span class="sv-wl-av' + (isUn ? ' un' : '') + '">' + escapeHtml(svInitials(isUn ? null : k)) + '</span>'
            + '<span class="sv-asg-name">' + escapeHtml(label) + '</span>';
        }
        return '<div class="' + cls + '"><div class="sv-group-head">' + head
          + '<span class="sv-group-n">' + list.length + '</span></div>'
          + '<table class="sv-tbl"><tbody>' + rows + '</tbody></table></div>';
      }).join('');
      return '<div class="sv-groups">' + groups + '</div>';
    }

    // ---- Issues card interactions (delegated; survive inner re-render) ----
    function svRerenderIssuesCard() {
      const card = document.getElementById('svIssuesCard');
      if (!card) return;
      card.innerHTML = svIssuesCardInner();
      if (svUi._open) {
        const w = card.querySelector('.sv-filterwrap[data-menu="' + svUi._open + '"]');
        if (w) w.classList.add('open');
      }
    }
    function svOnCardClick(e) {
      const item = e.target.closest('.sv-menu-item');
      if (item) {
        e.stopPropagation();
        const menu = item.getAttribute('data-menu');
        const val = item.getAttribute('data-value');
        if (menu === 'group') {
          svUi.groupBy = val;
          svUi._open = null;
        } else {
          const set = menu === 'status' ? svUi.statuses : menu === 'assignee' ? svUi.assignees : svUi.types;
          if (set.has(val)) set.delete(val); else set.add(val);
          svUi._open = menu; // keep the menu open for multi-toggle
        }
        svRerenderIssuesCard();
        return;
      }
      const chip = e.target.closest('.sv-chip');
      if (chip) {
        e.stopPropagation();
        const wrap = chip.closest('.sv-filterwrap');
        const key = wrap.getAttribute('data-menu');
        const wasOpen = wrap.classList.contains('open');
        document.querySelectorAll('.sv-filterwrap.open').forEach(w => w.classList.remove('open'));
        if (wasOpen) { wrap.classList.remove('open'); svUi._open = null; }
        else { wrap.classList.add('open'); svUi._open = key; }
        return;
      }
      if (e.target.closest('.sv-menu')) e.stopPropagation(); // clicks on labels: swallow
    }
    let svDocWired = false;
    function svWireDoc() {
      if (svDocWired) return;
      svDocWired = true;
      document.addEventListener('click', function (e) {
        if (e.target.closest('.sv-filterwrap')) return;
        document.querySelectorAll('.sv-filterwrap.open').forEach(w => w.classList.remove('open'));
        if (svUi) svUi._open = null;
      });
    }

    // Admins see the invite row + members list with Remove buttons (creator's
    // Remove disabled). Non-admins see a read-only list — no invite row,
    // no Remove buttons (decision: read-only view per session-4 plan).
    //
    // Cache strategy: the boot pipeline fetches members eagerly so the tab
    // pill renders from initial paint. If that fetch failed (members === null),
    // first Members-tab open re-fetches; on subsequent opens the cached
    // members[] renders instantly. Invite/remove always re-fetch the list
    // (per-spec: "After invite/remove, refetch the list and re-render.
    // Optimistic updates not needed at this scale.")
    function renderMembers(body) {
      const isProjectAdmin = project.role === 'admin';
      body.innerHTML = `
        <div class="members-area">
          ${isProjectAdmin ? `
            <div class="invite-row">
              <div class="field">
                <label for="inviteEmail">Invite by email</label>
                <input id="inviteEmail" type="email" placeholder="teammate@elinnovation.net" autocomplete="email" />
              </div>
              <button class="btn btn-primary" id="inviteBtn" type="button" disabled>Send invite</button>
              <div class="invite-error" id="inviteError" style="display:none;" role="alert"></div>
            </div>
          ` : ''}
          <div class="members-section-title" id="membersSectionTitle">Loading…</div>
          <div id="membersListContainer"></div>
        </div>
      `;

      if (isProjectAdmin) wireInvite();

      if (members !== null) {
        renderMembersList();
      } else {
        loadMembers();
      }
    }

    function wireInvite() {
      const input = document.getElementById('inviteEmail');
      const btn = document.getElementById('inviteBtn');
      if (!input || !btn) return;
      input.addEventListener('input', () => {
        btn.disabled = input.value.trim().length === 0;
      });
      // IME-safe Enter handling — same pattern as the chat composer (decision W).
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          onInviteSubmit();
        }
      });
      btn.addEventListener('click', onInviteSubmit);
    }

    async function loadMembers() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;

      // Three-row skeleton — quick visual cue that data's loading.
      container.innerHTML = `
        <div class="members-list" aria-busy="true" aria-label="Loading members">
          <div class="member-row-skeleton"></div>
          <div class="member-row-skeleton"></div>
          <div class="member-row-skeleton"></div>
        </div>
      `;
      if (title) title.textContent = 'Loading…';

      let res;
      try {
        res = await fetch('/api/projects/' + encodeURIComponent(project.id) + '/members');
      } catch {
        renderMembersError();
        return;
      }
      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/projects.html'); return; }
      if (!res.ok) { renderMembersError(); return; }

      const data = await res.json().catch(() => ({}));
      members = Array.isArray(data.members) ? data.members : [];
      memberCount = members.length;
      updateMemberCountPill();
      renderMembersList();
    }

    function renderMembersError() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;
      container.innerHTML = `
        <div class="state-card" role="alert">
          <div class="state-card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l9.5 17H2.5L12 3z"/>
              <line x1="12" y1="9" x2="12" y2="14"/>
              <line x1="12" y1="17.5" x2="12" y2="17.51"/>
            </svg>
          </div>
          <h2 class="state-card-heading">Couldn't load members</h2>
          <p class="state-card-body">Check your connection or refresh the page if this persists.</p>
          <div class="state-card-actions">
            <button class="btn btn-primary" id="membersRetryBtn" type="button">Retry</button>
          </div>
        </div>
      `;
      if (title) title.textContent = '';
      const retry = document.getElementById('membersRetryBtn');
      if (retry) retry.addEventListener('click', loadMembers);
    }

    function renderMembersList() {
      const container = document.getElementById('membersListContainer');
      const title = document.getElementById('membersSectionTitle');
      if (!container) return;

      if (title) {
        title.textContent = members.length === 1 ? '1 member' : members.length + ' members';
      }

      const isProjectAdmin = project.role === 'admin';
      container.innerHTML = `
        <div class="members-list">
          ${members.map(m => renderMemberRow(m, isProjectAdmin)).join('')}
        </div>
      `;

      if (isProjectAdmin) {
        container.querySelectorAll('.member-remove-btn').forEach(btn => {
          btn.addEventListener('click', () => onRemoveClick(btn.dataset.userId, btn));
        });
      }
    }

    function renderMemberRow(m, isProjectAdmin) {
      const userIdStr = String(m.user_id);
      const isYou = userIdStr === String(me.id);
      const isCreator = userIdStr === String(project.owner_user_id);
      // .read-only collapses the trailing Remove column on non-admin views;
      // see CSS for the grid-template-columns swap.
      const cls = 'member-row' + (isYou ? ' you' : '') + (!isProjectAdmin ? ' read-only' : '');
      // Email may be null for orphan rows (member rows without a matching D1
      // user — surfaced rather than hidden, per the API contract).
      // v1.3 (Block 12.1): the Members tab is hidden — membership collapsed
      // per BLOCK_12_PLAN decision I. This render function is dead code
      // until 12.4 reworks the project settings page.
      const email = m.email || '(orphan: id=' + userIdStr + ')';
      const initial = m.email ? deriveUserInitial(m.email) : '?';
      const meta = formatMemberMeta(m, isCreator);
      const roleBadge = isCreator
        ? '<span class="badge">Admin</span>'
        : '<span class="badge muted">Member</span>';
      const removeBtn = isProjectAdmin
        ? '<button class="btn-danger member-remove-btn" type="button" data-user-id="' + escapeHtml(userIdStr) + '"' + (isCreator ? ' disabled' : '') + '>Remove</button>'
        : '';
      const youSuffix = isYou ? ' <span class="self">(you)</span>' : '';
      return `
        <div class="${cls}">
          <div class="avatar">${escapeHtml(initial)}</div>
          <div class="member-info">
            <div class="member-email">${escapeHtml(email)}${youSuffix}</div>
            <div class="member-meta">${escapeHtml(meta)}</div>
          </div>
          ${roleBadge}
          ${removeBtn}
        </div>
      `;
    }

    function formatMemberMeta(m, isCreator) {
      // Creator uses joined_at ("Joined as creator · 28 Apr"); invitees use
      // invited_at ("Invited 2 May") to match the mockup verbatim.
      if (isCreator) {
        const dateStr = formatShortDate(m.joined_at);
        return dateStr ? 'Joined as creator · ' + dateStr : 'Joined as creator';
      }
      const dateStr = formatShortDate(m.invited_at);
      return dateStr ? 'Invited ' + dateStr : 'Invited';
    }

    function formatShortDate(value) {
      if (!value) return '';
      try {
        const d = new Date(value);
        if (isNaN(d.getTime())) return '';
        // "28 Apr" / "2 May" — day + abbreviated month, no year.
        return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }).format(d);
      } catch {
        return '';
      }
    }

    function updateMemberCountPill() {
      const pill = document.getElementById('memberCountPill');
      if (!pill) return;
      if (memberCount === null) {
        pill.style.display = 'none';
        pill.textContent = '';
      } else {
        pill.style.display = '';
        pill.textContent = String(memberCount);
      }
    }

    async function onInviteSubmit() {
      const input = document.getElementById('inviteEmail');
      const btn = document.getElementById('inviteBtn');
      if (!input || !btn || btn.disabled) return;
      const email = input.value.trim();
      if (email.length === 0) return;

      const origText = btn.textContent;
      btn.textContent = 'Sending…';
      btn.disabled = true;
      input.disabled = true;
      hideInviteError();

      let res;
      try {
        res = await fetch('/api/projects/' + encodeURIComponent(project.id) + '/members', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
      } catch {
        showInviteError('Something went wrong. Please try again.');
        restoreInviteForm(btn, input, origText);
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }
      // 403 from requireWorkspaceScope (v1.3) = stale-admin-state. Bounce
      // so the user returns to a known UI state rather than seeing a bare
      // "Forbidden".
      if (res.status === 403) { location.replace('/projects.html'); return; }

      if (!res.ok) {
        // 400 / 404 / 409 / 500 — render server's error verbatim per decision N.
        // The members API uses user-facing-quality strings already
        // ("Invalid email", "No Elinno account…", "User is already a member…").
        const data = await res.json().catch(() => ({}));
        const msg = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
        showInviteError(msg);
        restoreInviteForm(btn, input, origText);
        return;
      }

      // 201 success — clear input, refetch list.
      input.value = '';
      restoreInviteForm(btn, input, origText);
      await loadMembers();
    }

    function showInviteError(msg) {
      const slot = document.getElementById('inviteError');
      if (!slot) return;
      slot.textContent = msg;
      slot.style.display = '';
    }

    function hideInviteError() {
      const slot = document.getElementById('inviteError');
      if (!slot) return;
      slot.style.display = 'none';
      slot.textContent = '';
    }

    function restoreInviteForm(btn, input, origText) {
      if (btn) {
        btn.textContent = origText;
        btn.disabled = !input || input.value.trim().length === 0;
      }
      if (input) input.disabled = false;
    }

    async function onRemoveClick(userId, btn) {
      if (!btn || btn.disabled || !userId) return;
      // Defensive: the creator's row renders Remove with disabled attr, but a
      // tampered DOM could re-enable it. The 403 creator-block from the API
      // is the true gate; this is a pre-flight to keep the UI honest.
      if (userId === String(project.owner_user_id)) return;

      const origText = btn.textContent;
      btn.textContent = 'Removing…';
      btn.disabled = true;
      hideInviteError();

      let res;
      try {
        res = await fetch(
          '/api/projects/' + encodeURIComponent(project.id) +
          '/members/' + encodeURIComponent(userId),
          { method: 'DELETE' }
        );
      } catch {
        showInviteError('Something went wrong. Please try again.');
        if (btn.isConnected) { btn.textContent = origText; btn.disabled = false; }
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }

      if (!res.ok) {
        // Includes 403 ("The project creator cannot be removed"), 404, 500.
        // Render verbatim — the creator-block path is the most likely 403 here,
        // and stale-admin showing "Forbidden" is acceptable for a rare edge case.
        const data = await res.json().catch(() => ({}));
        const msg = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
        showInviteError(msg);
        if (btn.isConnected) { btn.textContent = origText; btn.disabled = false; }
        return;
      }

      // Success — refetch list. The button reference becomes detached during
      // the re-render; that's fine, we don't touch it after this point.
      await loadMembers();
    }

    // ---------- Connections tab (Block 4 commit 8) ----------
    // Implements decisions K (full-page redirect to /oauth/start),
    // L (channel-picker modal post-connect; selected_channel_* via PATCH;
    // immediate POST sync after PATCH; disconnect+reconnect for re-sync).
    // Two-tier error model per Block 2 decision N: 401 redirects to login;
    // 5xx / network show generic message + retry. Validation and
    // application errors render verbatim.

    async function loadConnections() {
      try {
        const res = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/connections');
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) { connections = []; return; }
        const data = await res.json().catch(() => ({}));
        connections = Array.isArray(data.connections) ? data.connections : [];
      } catch {
        connections = [];
      }
    }

    // Block 13.7b: the Connections-tab render path + 24 supporting
    // helpers (renderConnections, renderSlackRowHtml, renderJiraRowHtml,
    // 3 modal open/close/select handlers, submitJiraConnect, sync /
    // disconnect / activity-drawer helpers) lived here. Phase 7a ported
    // the flow to /project_settings.html; Phase 7b's callback retarget
    // makes Settings the single source. About 720 lines of dead code
    // removed. loadConnections + getConnectionState are kept above — they
    // still decide which suggestion set the shared module renders.

    // Block 13.7b: showConnToast was previously defined alongside the
    // (now-removed) connections code, but it's also called by the
    // refresh-and-re-ask code path (Block 10.1 — see line ~975+).
    // Keeping it here as a standalone helper.
    function showConnToast(msg, type) {
      let toast = document.getElementById('connToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'connToast';
        document.body.appendChild(toast);
      }
      toast.className = 'conn-toast conn-toast-' + (type || 'info');
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    // ---------- Mobile drawer (decision AA) ----------
    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      applyDrawerClass();
    }

    function closeDrawer() {
      if (!drawerOpen) return;
      drawerOpen = false;
      applyDrawerClass();
    }

    function applyDrawerClass() {
      const shell = document.getElementById('shell');
      if (shell) shell.classList.toggle('drawer-open', drawerOpen);
    }

    // ---------- Kick off ----------
    (async () => {
      const ok = await bootstrapMe();
      if (!ok) return;
      boot();
    })();
  </script>
  <script src="/_lib/sticky-topbar.js" defer></script>
  <script src="/_lib/whats-new-data.js" defer></script>
  <script src="/_lib/whats-new-badge.js" defer></script>
</body>
