      const modal = document.getElementById('jiraProjectPickerModal');
      if (!modal) return;
      modal.style.display = '';
      const list = modal.querySelector('.jira-project-picker-list');
      list.innerHTML = '<div class="tab-loading">Loading projects…</div>';

      modal.querySelector('.modal-close').onclick = closeJiraProjectPicker;
      modal.querySelector('.modal-backdrop').onclick = closeJiraProjectPicker;
      document.addEventListener('keydown', _jiraProjectPickerEscapeHandler);

      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/jira/projects'
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          list.innerHTML = '<p class="state-card-body">Could not load projects. The Jira API token may be invalid or revoked.</p>';
          return;
        }
        const data = await res.json().catch(() => ({}));
        const projects = Array.isArray(data.projects) ? data.projects : [];
        if (projects.length === 0) {
          list.innerHTML = '<p class="state-card-body">No projects visible to this API token.</p>';
          return;
        }
        list.innerHTML = projects.map(p => `
          <button class="channel-list-item" type="button"
                  data-project-key="${escapeHtml(p.key)}"
                  data-project-name="${escapeHtml(p.name)}">
            <span class="channel-list-name">${escapeHtml(p.name)}</span>
            <span class="channel-list-tag">${escapeHtml(p.key)}</span>
          </button>
        `).join('');
        list.querySelectorAll('.channel-list-item').forEach(item => {
          item.addEventListener('click', () => {
            const key = item.getAttribute('data-project-key');
            const name = item.getAttribute('data-project-name');
            selectJiraProject(connId, key, name);
          });
        });
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not load projects. Please try again.</p>';
      }
    }

    function closeJiraProjectPicker() {
      const modal = document.getElementById('jiraProjectPickerModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _jiraProjectPickerEscapeHandler);
    }

    function _jiraProjectPickerEscapeHandler(e) {
      if (e.key === 'Escape') closeJiraProjectPicker();
    }

    async function selectJiraProject(connId, projectKey, projectName) {
      const modal = document.getElementById('jiraProjectPickerModal');
      const list = modal.querySelector('.jira-project-picker-list');
      list.innerHTML = '<div class="tab-loading">Setting project and starting sync…</div>';
      try {
        const patchRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              credential_metadata: {
                selected_project_key: projectKey,
                selected_project_name: projectName,
              },
            }),
          }
        );
        if (patchRes.status === 401) { redirectToLogin(); return; }
        if (!patchRes.ok) {
          let msg = 'Could not set project. Please try again.';
          if (patchRes.status >= 400 && patchRes.status < 500) {
            const data = await patchRes.json().catch(() => ({}));
            if (data && typeof data.error === 'string') msg = data.error;
          }
          list.innerHTML = '<p class="state-card-body">' + escapeHtml(msg) + '</p>';
          return;
        }
        // Fire-and-don't-await sync — Jira backfill can take 10-30s
        // (depending on project size). UI shows "Syncing…" pill until
        // next refresh.
        fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync',
          { method: 'POST' }
        ).catch(() => { /* surfaces in sync_runs row */ });

        closeJiraProjectPicker();
        connections = null;
        if (activeTab === 'connections') renderTabBody();
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not set project. Please try again.</p>';
      }
    }

    async function disconnectJira(connId) {
      const ok = confirm('Disconnect Jira? This will remove the connection from this project.');
      if (!ok) return;
      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          { method: 'DELETE' }
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          alert('Could not disconnect. Please try again.');
          return;
        }
        connections = null;
        if (activeTab === 'connections') renderTabBody();
      } catch {
        alert('Could not disconnect. Please try again.');
      }
    }

    async function disconnectSlack(connId) {
      const ok = confirm('Disconnect Slack? This will remove the connection from this project.');
      if (!ok) return;
      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          { method: 'DELETE' }
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          alert('Could not disconnect. Please try again.');
          return;
        }
        // Force re-fetch and re-render. Drops back to empty state.
        connections = null;
        if (activeTab === 'connections') renderTabBody();
      } catch {
        alert('Could not disconnect. Please try again.');
      }
    }

    async function openChannelPicker(connId) {
      const modal = document.getElementById('channelPickerModal');
      if (!modal) return;
      modal.style.display = '';
      const list = modal.querySelector('.channel-picker-list');
      list.innerHTML = '<div class="tab-loading">Loading channels…</div>';

      // Wire close handlers idempotently.
      modal.querySelector('.modal-close').onclick = closeChannelPicker;
      modal.querySelector('.modal-backdrop').onclick = closeChannelPicker;
      // Escape key — bind once via document so we don't re-add per open.
      document.addEventListener('keydown', _channelPickerEscapeHandler);

      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/slack/channels'
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          list.innerHTML = '<p class="state-card-body">Could not load channels. The Slack app may need to be re-installed.</p>';
          return;
        }
        const data = await res.json().catch(() => ({}));
        const channels = Array.isArray(data.channels) ? data.channels : [];
        if (channels.length === 0) {
          list.innerHTML = '<p class="state-card-body">No channels visible to the bot. Add the bot to a channel in Slack and re-open this picker.</p>';
          return;
        }
        list.innerHTML = channels.map(c => `
          <button class="channel-list-item" type="button"
                  data-channel-id="${escapeHtml(c.id)}"
                  data-channel-name="${escapeHtml(c.name)}">
            <span class="channel-list-name">#${escapeHtml(c.name)}</span>
            ${c.is_member ? '<span class="channel-list-tag">bot in channel</span>' : ''}
          </button>
        `).join('');
        list.querySelectorAll('.channel-list-item').forEach(item => {
          item.addEventListener('click', () => {
            const id = item.getAttribute('data-channel-id');
            const name = item.getAttribute('data-channel-name');
            selectChannel(connId, id, name);
          });
        });
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not load channels. Please try again.</p>';
      }
    }

    function closeChannelPicker() {
      const modal = document.getElementById('channelPickerModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _channelPickerEscapeHandler);
    }

    function _channelPickerEscapeHandler(e) {
      if (e.key === 'Escape') closeChannelPicker();
    }

    async function selectChannel(connId, channelId, channelName) {
      const modal = document.getElementById('channelPickerModal');
      const list = modal.querySelector('.channel-picker-list');
      list.innerHTML = '<div class="tab-loading">Setting channel and starting sync…</div>';
      try {
        const patchRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              credential_metadata: {
                selected_channel_id: channelId,
                selected_channel_name: channelName,
              },
            }),
          }
        );
        if (patchRes.status === 401) { redirectToLogin(); return; }
        if (!patchRes.ok) {
          let msg = 'Could not set channel. Please try again.';
          if (patchRes.status >= 400 && patchRes.status < 500) {
            const data = await patchRes.json().catch(() => ({}));
            if (data && typeof data.error === 'string') msg = data.error;
          }
          list.innerHTML = '<p class="state-card-body">' + escapeHtml(msg) + '</p>';
          return;
        }
        // Fire-and-don't-await sync — it can take several seconds for
        // backfill. UI shows "Syncing…" pill until next refresh; admin
        // can refresh the page to see updated state.
        fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync',
          { method: 'POST' }
        ).catch(() => { /* surfaces in sync_runs row + Block 9 polish UI */ });

        closeChannelPicker();
        connections = null;  // force re-fetch on next render
        if (activeTab === 'connections') renderTabBody();
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not set channel. Please try again.</p>';
      }
    }

    // ---------- Mobile drawer (decision AA) ----------
    function toggleDrawer() {
      drawerOpen = !drawerOpen;
      applyDrawerClass();
    }

    function closeDrawer() {
      if (!drawerOpen) return;
      drawerOpen = false;
      applyDrawerClass();
    }

    function applyDrawerClass() {
      const shell = document.getElementById('shell');
      if (shell) shell.classList.toggle('drawer-open', drawerOpen);
    }

    // ---------- Kick off ----------
    (async () => {
      const ok = await bootstrapMe();
      if (!ok) return;
      boot();
    })();
  </script>
</body>
</html>
