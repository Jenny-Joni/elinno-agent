<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/_lib/no-zoom.js" defer></script>
  <!-- Block 18: shared suggested-questions module, both chat surfaces.
       defer in <head> so it has executed before boot()'s first await
       resolves and renderChat runs. -->
  <script src="/_lib/chat-suggestions.js" defer></script>
  <title>Project — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-08-09-1" />
  <style>
    /* v1.4 (Block 13.5): per-row ⋯ menu on conversation sidebar.
       The legacy .conv-item rule in auth.css styles the row text; this
       block wraps it in a .conv-row that adds a kebab trigger and an
       absolute-positioned menu. The button visibility follows the
       mockup: hover-only on desktop, always-visible on touch / ≤700px. */
    .conv-row {
      position: relative;
    }
    .conv-row .conv-item {
      padding-right: 36px;
    }
    /* D3: highlight the currently-open conversation. Matches cross-project/chat.html
       pattern. auth.css has a .conv-item.active rule but the `active` class is on
       the .conv-row wrapper here, so target via descendant selector. */
    .conv-row.active .conv-item {
      background: var(--brand-tint);
      color: var(--brand-strong);
      font-weight: 500;
    }
    .conv-row .conv-title-wrap { display: block; min-width: 0; max-width: 100%; }
    /* Span is inline by default — text-overflow:ellipsis (set in auth.css)
       only activates on a block-level element. Matches the working pattern
       in cross-project/chat.html. Without this, the nowrap title overflows
       horizontally past the sidebar boundary into the chat column. */
    .conv-row .conv-title { display: block; }
    .conv-row .conv-rename-input {
      padding: 2px 6px;
      border: 1px solid var(--brand);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      outline: none;
      box-shadow: 0 0 0 3px var(--brand-hair);
      width: 100%;
    }
    .conv-menu-trigger {
      position: absolute;
      top: 8px;
      right: 6px;
      opacity: 0;
      transition: opacity var(--t-fast, 0.1s ease-out), background var(--t-fast, 0.1s ease-out);
      z-index: 2;
      width: 24px;
      height: 24px;
      font-size: 14px;
    }
    .conv-row:hover .conv-menu-trigger,
    .conv-menu-trigger[aria-expanded="true"] {
      opacity: 1;
    }
    .conv-menu {
      top: 32px;
      right: 4px;
      min-width: 170px;
    }
    @media (max-width: 700px) {
      .conv-menu-trigger { opacity: 1; }
    }

    /* Conv toast — top-right floating notice for delete + undo. */
    .conv-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      z-index: 2000;
      display: none;
    }
    .conv-toast .btn--ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 0.5px solid rgba(255, 255, 255, 0.3);
    }
    .conv-toast .btn--ghost:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .conv-toast-warn { background: var(--danger); }

    /* 2026-05-27 (shared-workspace-visibility follow-up):
       Single-project chat UI aligned to cross-project (mockup screen-12).
       Drops the giant project-name H2 — breadcrumb is the header. Adds
       the FROM chip row (mirror of cross-project's ACROSS) and the
       centered empty state. CSS lives page-local to avoid touching
       auth.css (which would require the 14-page cache-bust dance per
       HANDOFF). Class names use a .pj- / .chat-empty- prefix; the
       legacy .chat-suggestions-* rules in auth.css are now unused but
       left in place. */

    /* FROM chip row — mirror of .xc-across in cross-project/chat.html */
    .pj-from {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 12px 0 14px;
      border-bottom: 0.5px solid var(--border-soft);
      margin-bottom: 12px;
    }
    .pj-from__label {
      font-family: var(--font);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      font-weight: 600;
    }
    .pj-scopechip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 4px;
      border-radius: var(--r-pill);
      background: var(--brand-soft);
      border: 0.5px solid var(--brand-soft-border);
      font-family: var(--font);
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
    }
    .pj-scopechip__icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    img.pj-scopechip__icon { object-fit: cover; }

    /* Block 18.5: the .chat-empty* rules that lived here moved to auth.css
       as .sg-empty* / .sg-list / .sg-card. They were byte-identical to
       cross-project/chat.html's .xc-empty* — the same rules under two names,
       which is the drift the shared module exists to stop. */

    /* ─── Layout alignment with cross-project chat ─────────────────────
       Round-2 of the visual alignment: override the single-card
       .project-shell look (one rounded card with a vertical divider)
       to the cross-project "two rounded cards in a grid with gap"
       pattern (mirror of .xc-grid / .xc-sidebar / .xc-main). All
       overrides live page-local; the auth.css base rules are kept
       so other consumers of these classes (if any) are unaffected. */
    /* The page's outer .app-main wrapper from auth.css has padding: 70px 0
       (used on the dashboard, etc). Cross-project chat instead wraps in
       .xc-shell with padding: 18px 20px 30px. Override .app-main here
       so the single-project chat uses the same viewport math — otherwise
       the shell ends up ~90px too tall for the available space and the
       page scrolls. Round-3 fix. */
    .app-main {
      padding: 18px 0 30px;
      /* Cross-project chat sets <main style="background:var(--bg-subtle)">
         inline (= #fcfcfd, near-white). The default .app-main from
         auth.css uses var(--color-bg-soft) (= #f7f7f7, grayer). That's
         the last visible color delta between the two screens — match
         it here so the page bg is identical. */
      background: var(--bg-subtle);
    }
    /* Match cross-project chat's outer width: .xc-shell is max-width:
       1100px with padding: 18px 20px 30px. Override .custom-container
       (default max-width: 1230px) so the single-project shell sits in
       the same visible-width column as cross-project, not full-bleed.
       Round-4 fix. */
    .custom-container {
      max-width: 1100px;
      padding: 0 20px;
    }
    .project-shell {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      height: calc(100vh - 130px);
      min-height: 480px;
      padding: 0;
    }
    .project-sidebar {
      background: var(--bg-subtle);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      border-right: 0.5px solid var(--border);
      padding: 16px 12px;
      gap: 0;
    }
    .project-sidebar-header {
      padding: 0 6px;
      margin-bottom: 12px;
    }
    .project-sidebar-title {
      font-family: var(--font);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-3);
      font-weight: 600;
    }
    .new-conv-btn {
      width: 24px;
      height: 24px;
      border: 0.5px solid var(--border-input);
      border-radius: 8px;
      background: var(--bg);
      color: var(--brand);
      font-size: 15px;
    }
    .new-conv-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
    .project-main {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .project-main-header {
      padding: 14px 22px 12px;
      border-bottom: 0.5px solid var(--border-soft);
      align-items: center;
    }
    .project-breadcrumb {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 0;
    }
    .project-breadcrumb a { color: var(--brand); }
    .chat-area {
      padding: 0 24px;
    }
    .pj-from { padding: 14px 0 12px; }
    .chat-conv-title {
      display: none;
    }
    .chat-messages {
      padding: 12px 0 18px;
      gap: 18px;
    }
    .chat-composer {
      padding: 14px 0;
      margin: 0 -24px;
      padding-left: 22px;
      padding-right: 22px;
      border-top: 0.5px solid var(--border-soft);
      gap: 8px;
    }
    .chat-composer-row {
      background: var(--bg-subtle);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px 8px 14px;
      align-items: flex-end;
      gap: 10px;
    }
    .chat-input,
    .chat-input:focus {
      flex: 1;
      background: transparent !important;
      border: none !important;
      padding: 6px 0;
      min-height: 22px;
      max-height: 180px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      outline: none;
    }
    .chat-send-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-transform: none;
      letter-spacing: 0;
    }
    /* Match cross-project's .xc-composer__send:disabled — gray bg, not
       brand-purple-dimmed. The auth.css base has .chat-send-btn:disabled
       { opacity: 0.5 } which combined with var(--brand) bg looked too
       purple next to cross-project. */
    .chat-send-btn:disabled {
      background: var(--text-3);
      opacity: 0.6;
      cursor: not-allowed;
    }
    .chat-send-btn:hover:not(:disabled) { filter: brightness(1.1); }

    /* Quiet boot loader — mirror of .xc-loading in cross-project chat.
       Replaces the loud .state-card "Loading project…" overlay. */
    .chat-boot-loading {
      padding: 60px 0;
      text-align: center;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-3);
    }
    .chat-composer-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .chat-composer-footer__hint { color: var(--text-faint); }

    /* ─── Mobile pass 2026-05-31 ─────────────────────────────────────
       The intentional desktop alignment above re-declares .project-shell
       (220px 1fr) and .project-sidebar page-locally; being later in source
       order than auth.css, those defeat the shared @media(700) collapse +
       drawer. Re-apply the mobile shell/drawer here so single-project chat
       stacks and the sidebar becomes the off-canvas drawer (markup + JS for
       .drawer-open / .drawer-toggle already exist on this page; .drawer-toggle
       is shown by the shared auth.css mobile rule). */
    @media (max-width: 700px) {
      .project-shell {
        grid-template-columns: 1fr;
        gap: 0;
        height: calc(100vh - 130px);
        min-height: 480px;
      }
      .project-sidebar {
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 280px; max-width: 85%;
        z-index: 3;
        transform: translateX(-100%);
        transition: transform 0.25s ease-out;
        border-radius: var(--r-md);
      }
      .project-shell.drawer-open .project-sidebar { transform: translateX(0); }
      .project-main { min-height: 0; }
    }
  </style>
</head>
<body>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a href="/whats-new.html" class="wn-navlink">What's new<span class="wn-navlink__dot" style="display:none;"></span></a>
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:600;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <div class="custom-container">
      <div id="shellRoot">
        <!-- Server-painted quiet loader so the first frame after click
             isn't a blank shellRoot. JS replaces this once boot resolves
             (renderLoadingShell on retry, renderShell on success, etc).
             Mirrors cross-project chat's <div class="xc-loading"> body
             pre-render. -->
        <div class="chat-boot-loading" aria-busy="true">Loading chat…</div>
      </div>
    </div>
  </main>

  <!-- Block 13.7b: the channel-picker / Jira-connect / Jira-project-picker
       modals (Block 4/6) lived here. Phase 7a ported them to
       project_settings.html and Phase 7b retargeted the Slack OAuth
       callback to land directly on /project_settings.html. The modals
       are no longer reachable from project.html — removed. -->

  <script>
    // ============================================================
    // Block 2 Sub-task 2.5 — project.html three-tab shell + chat UI
    //
    // Decisions in force from BLOCK_2_PLAN.md:
    //   F  default to most-recent conversation when ?c= missing
    //   G  auto-create one conversation on first project open
    //   H  auto-title (server-side; client just renders response.title)
    //   I  echo placeholder format (server-side)
    //   N  error-string strategy: terse → translate, validation → verbatim
    //   V  history.replaceState only; single applyState() routing point
    //   W  composer mechanics — Enter sends, Shift+Enter newline, IME-safe
    //   X  POST /messages response is canonical for title; render directly
    //   Y  placeholder Members + Connections tabs use .state-card primitive
    //   Z  echo banner non-dismissible; .placeholder class on every assistant
    //   AA mobile drawer (≤700px) behind hamburger; in-memory boolean state
    //   AB sidebar two-line rows: title (ellipsized) + "Nh ago · N message(s)"
    //   AC conversations are per-user; server scopes — client just renders
    //
    // The single source of truth for navigation is applyState({ conversationId, tab }).
    // Sidebar click, tab click, auto-create, and default-to-most-recent all route through it.
    // ============================================================

    // ---------- Module state ----------
    let me = null;             // { id, email, is_admin } from /api/me
    let project = null;        // { id, name, description, role, ... } from GET /api/projects/:id
    let conversations = [];    // sidebar list (with message_count) — sorted updated_at DESC
    let activeConvId = null;
    let activeTab = 'chat';
    const messagesById = {};   // cache: conversationId → messages[] (avoids refetch on tab switch)
    let drawerOpen = false;    // decision AA: in-memory only
    let inFlight = false;      // global send-in-flight guard
    // Block 10.2 decision F: when the latest message POST returned a
    // cost-cap 429, this holds the reset boundary (UTC first-of-next-
    // month) as a Unix ms. While > Date.now(), the composer renders the
    // "AI paused" banner and disables send. Reset to 0 manually by
    // reload (a clean retry post-reset will pass the pre-check and the
    // banner stays at 0).
    let aiPausedUntilMs = 0;
    // Members tab state (sub-task 2.6). `members` is null until first successful
    // load — boot fetches eagerly so the tab pill renders from initial paint.
    // memberCount being null means "unknown"; the pill stays hidden.
    let members = null;
    let memberCount = null;
    // Connections tab state (Block 4 commit 8). `connections` is null until
    // first successful load — boot fetches eagerly so the Connections tab
    // renders without a flash. Empty array = no connections (renders the
    // Connect Slack empty state).
    let connections = null;
    // One-shot guard: ?just_connected=slack should auto-open the channel
    // picker exactly once after OAuth callback redirects here. Subsequent
    // tab switches must not re-trigger.
    let justConnectedHandled = false;

    // Block 16 — Sprint View tab state. `sprintData` caches the last
    // /api/projects/:id/sprint response so client-side grouping + filter
    // changes re-render from memory (no refetch). `svUi` holds the
    // grouping mode + per-facet filter Sets; rebuilt on each fresh fetch.
    let sprintData = null;
    let svUi = null;

    // Block 13.7b: dropped `connections` from VALID_TABS — the Connections
    // tab UI now lives on /project_settings.html. `members` is left for
    // legacy URL compatibility; its render path is unused in v1.4.
    const VALID_TABS = { chat: 1, members: 1, sprint: 1 };

    // Read URL params once at module init; resolved/overwritten during boot.
    const initialParams = new URLSearchParams(location.search);
    // Prefer <meta name="x-project-id"> when present — the slug route
    // (functions/project/[slug].js) injects it so the page can boot
    // without ?id= in the URL bar (kills the URL flicker on slug load).
    // Legacy /project.html?id=<uuid> still works via the ?id= fallback.
    const projectId = (document.querySelector('meta[name="x-project-id"]')?.getAttribute('content'))
      || initialParams.get('id');
    let initialConvId = initialParams.get('c');
    // Active tab now travels in the path: /project/<slug>/<tab>. The slug
    // route (functions/project/[slug]/[tab].js) injects it as a meta tag so
    // the page boots into the tab without a UTM-looking ?tab= query param.
    // Legacy /project.html?id=<uuid>&tab=<tab> URLs still work via ?tab=.
    const initialTabMeta = document.querySelector('meta[name="x-active-tab"]')?.getAttribute('content') || null;
    const initialTabRaw = initialTabMeta || initialParams.get('tab');
    // Block 13.7b: the 7a-2 ?just_connected= bounce to project_settings.html
    // is removed — the Slack OAuth callback now redirects there directly.

    // ---------- Helpers ----------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    // Attribute-safe escape. escapeHtml already encodes " and ', so an
    // alias is sufficient — kept distinct so call sites read intentionally.
    const escapeAttr = escapeHtml;

    // Minimal, XSS-safe inline markdown for assistant answers. The model
    // emits **bold** labels/headers (the cross-project prompt even mandates
    // them), so rendering raw asterisks looked broken. Escape FIRST, then
    // apply a tiny allowlist of inline transforms on the already-escaped
    // string, so untrusted tool-result text (Slack/Jira) can never inject
    // markup. Only asterisk-bold and backtick-code are handled — underscores
    // are left alone so identifiers like status_category aren't italicised,
    // and block markdown is unneeded because .chat-msg-content preserves
    // newlines via white-space: pre-wrap.
    function renderMessageContent(s) {
      let html = escapeHtml(s == null ? '' : String(s));
      html = html.replace(/`([^`\n]+?)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    // Decision AB: sibling to projects.html's fmtRelative — drops the "Updated " prefix.
    // Used by sidebar conv-meta and chat-msg-meta. Returns '' on parse failure so callers
    // can gracefully omit; "now"/"yesterday" come from Intl.RelativeTimeFormat numeric:'auto'.
    function fmtRelativeShort(value) {
      if (!value) return '';
      try {
        const date = new Date(value);
        if (isNaN(date.getTime())) return '';
        const diffMs  = Date.now() - date.getTime();
        const diffMin = Math.round(diffMs / 60000);
        const diffHr  = Math.round(diffMs / 3600000);
        const diffDay = Math.round(diffMs / 86400000);
        const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
        if (Math.abs(diffMin) < 60) return rtf.format(-diffMin, 'minute');
        if (Math.abs(diffHr)  < 24) return rtf.format(-diffHr,  'hour');
        if (Math.abs(diffDay) < 30) return rtf.format(-diffDay, 'day');
        return rtf.format(-Math.round(diffDay / 30), 'month');
      } catch {
        return '';
      }
    }

    // Block 9.2 decisions F+G: citation freshness for the chip's · suffix.
    // Returns { suffix, titleSource, stale } so the caller can append the
    // suffix, populate the title= absolute, and apply a muted class when
    // both source_updated_at and connection_last_sync_at are null.
    function fmtCitationFreshness(c) {
      const src = c && c.source_updated_at;
      const conn = c && c.connection_last_sync_at;
      if (src) {
        const rel = fmtRelativeShort(src);
        if (rel) return { suffix: ' · ' + rel, titleSource: src, stale: false };
      }
      if (conn) {
        const rel = fmtRelativeShort(conn);
        if (rel) return { suffix: ' · as of last sync (' + rel + ')', titleSource: conn, stale: false };
      }
      return { suffix: ' · as of unknown', titleSource: null, stale: true };
    }

    // Block 9.2 decision D: absolute timestamp for the chip's title= tooltip.
    // Format: 'May 11, 14:23 UTC' — 24h, UTC explicit. Returns '' on null/invalid.
    function fmtCitationTitle(iso) {
      if (!iso) return '';
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleString('en-US', {
          month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false,
          timeZone: 'UTC', timeZoneName: 'short',
        });
      } catch {
        return '';
      }
    }

    // Decision AB: "Nh ago · N message(s)" with ternary plural.
    function fmtConvMeta(updatedAt, messageCount) {
      const rel = fmtRelativeShort(updatedAt);
      const n = Number.isFinite(messageCount) ? messageCount : 0;
      const count = n === 1 ? '1 message' : n + ' messages';
      return rel ? rel + ' · ' + count : count;
    }

    // Decision W: avatar initials. User = first character of email, uppercase.
    // Assistant = hardcoded "EA". Display-name + proper initials deferred to Block 9.
    function deriveUserInitial(email) {
      return (email && email.length > 0) ? email[0].toUpperCase() : '?';
    }

    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.search));
    }

    // ---------- Auth-gated nav setup ----------
    // Same pattern as projects.html — /api/me returns { user: null } for unauthenticated.
    // We do this BEFORE boot() to populate the static nav once; boot() re-uses `me`.
    async function bootstrapMe() {
      let res;
      try {
        res = await fetch('/api/me');
      } catch {
        return false;
      }
      if (res.status === 401) { redirectToLogin(); return false; }
      if (!res.ok) return false;
      const data = await res.json().catch(() => ({}));
      if (!data || !data.user) {
        redirectToLogin();
        return false;
      }
      me = data.user;
      const av = document.getElementById('navUserAvatar');
      const initial = String((me.display_name || me.email || '?').trim()[0] || '?').toUpperCase();
      av.textContent = initial;
      av.title = (me.display_name || '') + (me.email ? ' · ' + me.email : '');
      if (me.is_admin) {
        document.getElementById('adminLink').style.display = '';
      }
      return true;
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    // ---------- Boot states ----------
    // 2026-05-28 (round-7 UI alignment): the big "Loading project…"
    // state-card overlay was jarring on click — full-card icon +
    // heading flashed for the duration of the boot fetches. Mirror
    // cross-project's quieter pattern (.xc-loading): a small muted
    // "Loading chat…" line in place, no card chrome. The CSS for
    // .chat-boot-loading lives in the page-local style block.
    function renderLoadingShell() {
      document.getElementById('shellRoot').innerHTML =
        '<div class="chat-boot-loading" aria-busy="true">Loading chat…</div>';
    }

    function renderBootError() {
      document.getElementById('shellRoot').innerHTML = `
        <div class="state-card" role="alert">
          <div class="state-card-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3l9.5 17H2.5L12 3z"/>
              <line x1="12" y1="9" x2="12" y2="14"/>
              <line x1="12" y1="17.5" x2="12" y2="17.51"/>
            </svg>
          </div>
          <h2 class="state-card-heading">Couldn't load this project</h2>
          <p class="state-card-body">Check your connection or refresh the page if this persists.</p>
          <div class="state-card-actions">
            <button class="btn btn-primary" id="bootRetryBtn">Retry</button>
          </div>
        </div>
      `;
      document.getElementById('bootRetryBtn').addEventListener('click', boot);
    }

    // ---------- Boot pipeline ----------
    // Step ordering matches sub-task 2.5 spec. Auth-error mapping per decision N:
    //   401 mid-flight → redirect to /login.html?next=...
    //   403 / 404 on the project resource → /projects.html (don't leak existence)
    //   Other non-OK → render boot-error state-card with Retry
    async function boot() {
      if (!projectId) { location.replace('/projects.html'); return; }
      renderLoadingShell();

      try {
        // Step 1: GET /api/projects/:id (auth + project meta + role).
        const projRes = await fetch('/api/projects/' + encodeURIComponent(projectId));
        if (projRes.status === 401) { redirectToLogin(); return; }
        if (projRes.status === 403 || projRes.status === 404) {
          // 403-collapse from requireWorkspaceScope (v1.3 successor to
          // requireProjectRole), OR project soft-deleted between checks.
          // Either way: don't leak existence — bounce to projects list.
          location.replace('/projects.html'); return;
        }
        if (!projRes.ok) { renderBootError(); return; }
        const projData = await projRes.json();
        project = projData.project;
        if (!project || !project.id) { renderBootError(); return; }
        // Block 18.2/18.5: active sprint name for the interpolated card.
        // Absent or null is normal (no Jira, no active sprint, or the
        // lookup degraded) — the card falls back to static wording.
        suggestionContext = {
          sprintName: (projData.suggestion_context && projData.suggestion_context.active_sprint_name) || null,
        };

        // Step 2: GET conversations (decision AC: server scopes to session user).
        const convRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/conversations');
        if (convRes.status === 401) { redirectToLogin(); return; }
        if (convRes.status === 403) { location.replace('/projects.html'); return; }
        if (!convRes.ok) { renderBootError(); return; }
        const convData = await convRes.json();
        conversations = Array.isArray(convData.conversations) ? convData.conversations : [];

        // Step 3 (decision G): auto-create one if user has zero conversations
        // in this project. Lower friction than an empty state.
        if (conversations.length === 0) {
          const createRes = await fetch(
            '/api/projects/' + encodeURIComponent(projectId) + '/conversations',
            { method: 'POST' }
          );
          if (createRes.status === 401) { redirectToLogin(); return; }
          if (createRes.status === 403) { location.replace('/projects.html'); return; }
          if (!createRes.ok) { renderBootError(); return; }
          const createData = await createRes.json();
          if (!createData || !createData.conversation) { renderBootError(); return; }
          conversations = [createData.conversation];
        }

        // Sub-task 2.6: eager members fetch so the Members tab's count pill
        // (decision Y) renders from initial paint, not after first tab open.
        // Latency cost is one additional GET on every project.html boot
        // (~50ms typical). On non-OK we leave members=null/memberCount=null —
        // boot doesn't fail just because the count is unknown; the Members
        // tab will retry the fetch on first open.
        try {
          const memRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/members');
          if (memRes.status === 401) { redirectToLogin(); return; }
          if (memRes.status === 403) { location.replace('/projects.html'); return; }
          if (memRes.ok) {
            const memData = await memRes.json().catch(() => ({}));
            members = Array.isArray(memData.members) ? memData.members : [];
            memberCount = members.length;
          }
        } catch {
          // Swallow — Members tab open will retry. Chat still works.
        }

        // Step 3.5 (Block 4 commit 8): eager connections load (paralleling
        // members). Same swallow-on-failure pattern — Connections tab will
        // re-fetch on first open if this fails. Chat + Members still work.
        try {
          const connRes = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/connections');
          if (connRes.status === 401) { redirectToLogin(); return; }
          if (connRes.status === 403) { location.replace('/projects.html'); return; }
          if (connRes.ok) {
            const connData = await connRes.json().catch(() => ({}));
            connections = Array.isArray(connData.connections) ? connData.connections : [];
          }
        } catch {
          // Swallow — Connections tab open will retry.
        }

        // Step 4 (decisions F + V): resolve activeConvId — ?c= if it matches a
        // real row, otherwise most-recent (conversations[0] is updated_at DESC).
        if (initialConvId && conversations.some(c => c.id === initialConvId)) {
          activeConvId = initialConvId;
        } else {
          activeConvId = conversations[0].id;
        }

        // Step 5: GET messages for active conversation.
        const msgsRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/conversations/' + encodeURIComponent(activeConvId) + '/messages'
        );
        if (msgsRes.status === 401) { redirectToLogin(); return; }
        if (msgsRes.status === 403) { location.replace('/projects.html'); return; }
        if (!msgsRes.ok) { renderBootError(); return; }
        const msgsData = await msgsRes.json();
        messagesById[activeConvId] = Array.isArray(msgsData.messages) ? msgsData.messages : [];

        // Step 6 (decision V): resolve activeTab and route through applyState
        // so the URL bar reflects reality from the moment the page is interactive.
        // Block 16 (decision C): default to Sprint View whenever Jira is
        // connected and the URL didn't pin an explicit ?tab. With no active
        // sprint the tab still renders its own empty state (no pre-fetch here —
        // the decision is on connection state alone). Otherwise default to chat.
        if (initialTabRaw && VALID_TABS[initialTabRaw]) {
          activeTab = initialTabRaw;
        } else {
          const _cs0 = getConnectionState();
          activeTab = (_cs0 === 'jira' || _cs0 === 'both') ? 'sprint' : 'chat';
        }

        renderShell();
        applyState({ conversationId: activeConvId, tab: activeTab });
      } catch {
        renderBootError();
      }
    }

    // ---------- Shell (static chrome — rendered once after boot succeeds) ----------
    function renderShell() {
      const projName = escapeHtml(project.name || 'Untitled project');
      // Block 16: the Sprint View / Chat segmented control only appears when
      // Jira is connected (decision C). Computed once here — connections are
      // already loaded by boot() before renderShell() runs.
      const _cs = getConnectionState();
      const jiraOn = (_cs === 'jira' || _cs === 'both');
      document.getElementById('shellRoot').innerHTML = `
        <div class="project-shell" id="shell">
          <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
          <aside class="project-sidebar" id="sidebar">
            <div class="project-sidebar-header">
              <div class="project-sidebar-title">Conversations</div>
              <button class="new-conv-btn" id="newConvBtn" type="button" title="New conversation" aria-label="New conversation">+</button>
            </div>
            <div id="convList"></div>
          </aside>
          <main class="project-main">
            <div class="project-main-header">
              <div class="project-header-left">
                <button class="drawer-toggle" id="drawerToggle" type="button" aria-label="Toggle conversations">
                  <span></span><span></span><span></span>
                </button>
                <div class="project-header-titles">
                  <div class="project-breadcrumb">
                    <a href="/projects.html">Projects</a> / <span>${projName}</span>
                  </div>
                  <!-- 2026-05-27: giant <h2 class="project-name-h"> removed
                       per UI alignment with cross-project chat. Project
                       name now lives in the breadcrumb + the FROM chip
                       row inside .chat-area. -->
                </div>
              </div>
              <div class="project-tabs" id="tabStrip">
                <!-- 2026-05-27: Chat tab button hidden — chat is the only
                     mode now (Members + Connections collapsed in prior
                     blocks). The data-tab="chat" handler stays alive so
                     applyState's tab routing keeps working. -->
                <button class="project-tab" type="button" data-tab="chat" hidden style="display:none;">Chat</button>
                <!-- v1.4 (Block 13.4): tab strip collapsed to Chat-only per SPEC §8.
                     Members tab stays hidden (collapsed in v1.3 Block 12.1).
                     Connections tab hidden — sequencing-critical: kept in the DOM
                     with the existing JS handler so the eager connections fetch
                     and getConnectionState still drives which suggestion set
                     the shared module renders. Phase 7a ports the full
                     connect flow into Settings → Connections; 7b strips this
                     button + its handler. -->
                <button class="project-tab" type="button" data-tab="members" hidden style="display:none;">Members <span class="tab-count" id="memberCountPill" style="display:none;"></span></button>
                <!-- Block 13.7b: Connections tab button removed; the Connections UI lives on /project_settings.html. -->
                <!-- The Members tab button is kept (hidden) for legacy URL tab=members compatibility. -->

                <!-- Block 16: Sprint View / Chat segmented switcher. Visible only
                     when Jira is connected. Its buttons carry data-tab and route
                     through the same onTabClick → applyState path as the hidden
                     legacy tabs (onTabClick matches .seg-btn too). -->
                <div class="seg" id="segControl"${jiraOn ? '' : ' hidden'}>
                  <button class="seg-btn" type="button" data-tab="sprint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg><span>Sprint View</span></button>
                  <button class="seg-btn" type="button" data-tab="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a8.38 8.38 0 0 1-.9-4 8.5 8.5 0 0 1 17 0z"/></svg><span>Chat</span></button>
                </div>

                <!-- Settings demoted from tab to header gear button (SPEC §8).
                     2026-05-27 (shared-workspace-visibility follow-up):
                     gear is admin-only — non-admins (members) can't
                     mutate settings/connections, so they don't see the
                     entry point. me.is_admin comes from the /api/me
                     fetch in loadMe() (line ~299). -->
                ${me && me.is_admin ? '<a class="project-tab" id="projectSettingsLink" href="' + (project && project.slug ? '/project_settings/' + project.slug : '/project_settings.html?id=' + projectId) + '" title="Project settings" style="text-decoration:none;color:var(--text-3);margin-left:auto;padding:8px 10px;" aria-label="Project settings"><i class="ti ti-settings" style="font-size:18px;line-height:1;"></i></a>' : ''}
              </div>

      document.getElementById('newConvBtn').addEventListener('click', onNewConv);
      document.getElementById('drawerToggle').addEventListener('click', toggleDrawer);
      document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
      document.getElementById('tabStrip').addEventListener('click', onTabClick);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && drawerOpen) closeDrawer();
      });

      // Block 16: scroll-shadow under the pinned header when the Sprint View
      // panel scrolls. #tabBody is the scroll surface only in sprint mode
      // (chat scrolls inside .chat-messages), so this is a no-op for chat.
      const tabBodyEl = document.getElementById('tabBody');
      const headerEl = document.querySelector('.project-main-header');
      if (tabBodyEl && headerEl) {
        tabBodyEl.addEventListener('scroll', () => {
          headerEl.classList.toggle('scrolled', tabBodyEl.scrollTop > 4);
        }, { passive: true });

    }

    // ---------- Single state-update function (decision V) ----------
    // Sidebar click, tab click, auto-create, default-to-most-recent all route through here.
    // Always replaceState; never pushState; never reload.
    function applyState({ conversationId, tab }) {
      activeConvId = conversationId;
      activeTab = VALID_TABS[tab] ? tab : 'chat';

      // URL bar reflects reality. Prefer the slug pathname
      // (/project/<slug>) introduced in Block 13.8. The legacy
      // ?id=<uuid> form is the redirect-target served by
      // functions/project/[[path]].js — landing on it is normal
      // (we got 302'd here), but we rewrite back to the slug form
      // so the URL bar shows the human-readable path.
      // Fallback: if slug is somehow missing, fall through to the
      // legacy pathname to preserve a working URL.
      //
      // ?c=<conv-uuid> is intentionally NOT preserved in the URL bar
      // (user request 2026-05-26). The sidebar is the canonical
      // "which conversation is open" control; on refresh we default
      // to most-recent (the existing fallback at boot). Legacy
      // /project/<slug>?c=<uuid> URLs still work if pasted — the
      // initial load reads ?c= once before applyState strips it.
      // Tab travels in the path (/project/<slug>/<tab>), NOT as ?tab= —
      // ?tab=sprint looks like a UTM param (same rationale as the
      // project_settings/<slug>/<tab> route). chat = the slug-only default,
      // so it gets no segment. The legacy /project.html?id= fallback keeps
      // ?tab= because there's no path route for it.
      const u = new URL(location.href);
      if (project && project.slug) {
        u.pathname = '/project/' + project.slug + (activeTab !== 'chat' ? '/' + activeTab : '');
        u.searchParams.delete('id');
        u.searchParams.delete('tab'); // strip any legacy ?tab= we were loaded with
      } else {
        u.pathname = '/project.html';
        u.searchParams.set('id', project.id);
        if (activeTab !== 'chat') u.searchParams.set('tab', activeTab);
        else u.searchParams.delete('tab');
      }
      u.searchParams.delete('c');
      history.replaceState(null, '', u.toString());

      renderSidebar();
      renderTabStrip();
      // Block 16: Sprint View is full-width — collapse the conversations
      // sidebar and let the panel scroll inside #tabBody (chat keeps its own
      // internal scroll, so this class only applies in sprint mode).
      const shellEl = document.getElementById('shell');
      if (shellEl) shellEl.classList.toggle('sprint-mode', activeTab === 'sprint');
      renderTabBody();
    }

    // ---------- Sidebar (v1.4: per-row ⋯ menu with Rename + Delete) ----------
    function renderSidebar() {
      const list = document.getElementById('convList');
      list.innerHTML = conversations.map(c => {
        const title = escapeHtml(c.title || 'Untitled');
        const meta = escapeHtml(fmtConvMeta(c.updated_at, c.message_count));
        const active = c.id === activeConvId ? ' active' : '';
        const id = escapeHtml(c.id);
        const menuId = 'conv-menu-' + id;
        return `
          <div class="conv-row${active}" data-conv-id="${id}">
            <div class="conv-item" role="button" tabindex="0" data-conv-id="${id}">
              <div class="conv-title-wrap">
                <span class="conv-title">${title}</span>
                <input class="conv-rename-input" value="${title}" maxlength="120" hidden aria-label="Rename conversation">
              </div>
              <div class="conv-meta">${meta}</div>
            </div>
            <button class="kebab-btn conv-menu-trigger" type="button" data-menu-toggle="${menuId}" aria-haspopup="menu" aria-expanded="false" aria-label="Conversation actions">
              <i class="ti ti-dots"></i>
            </button>
            <div class="menu conv-menu" role="menu" id="${menuId}" data-open="false">
              <button class="menu__item" role="menuitem" type="button" data-action="rename" data-conv-id="${id}"><i class="ti ti-pencil"></i>Rename</button>
              <button class="menu__item menu__item--danger" role="menuitem" type="button" data-action="delete" data-conv-id="${id}"><i class="ti ti-trash"></i>Delete</button>
            </div>
          </div>
        `;
      }).join('');

      // Row click → open the conversation (skip when click is in the
      // menu trigger / menu / rename input — they handle their own).
      list.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.conv-rename-input')) return;
          onConvClick(el.dataset.convId);
        });
        el.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.conv-rename-input')) {
            e.preventDefault();
            onConvClick(el.dataset.convId);
          }
        });
      });
    }

    // ---------- Conv menu open/close (one at a time) ----------
    let openConvMenu = null;
    function closeConvMenu() {
      if (!openConvMenu) return;
      openConvMenu.setAttribute('data-open', 'false');
      const trigger = document.querySelector('[data-menu-toggle="' + openConvMenu.id + '"]');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      openConvMenu = null;
    }
    document.addEventListener('click', (e) => {
      const trigger = e.target.closest('[data-menu-toggle]');
      if (trigger && trigger.classList.contains('conv-menu-trigger')) {
        e.stopPropagation();
        const id = trigger.getAttribute('data-menu-toggle');
        const menu = document.getElementById(id);
        if (!menu) return;
        if (openConvMenu === menu) { closeConvMenu(); return; }
        closeConvMenu();
        menu.setAttribute('data-open', 'true');
        trigger.setAttribute('aria-expanded', 'true');
        openConvMenu = menu;
        return;
      }
      if (openConvMenu && !openConvMenu.contains(e.target)) closeConvMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openConvMenu) closeConvMenu();
    });

    // ---------- Conv-row actions ----------
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action][data-conv-id]');
      if (!btn) return;
      // Only act on actions inside the sidebar's conv menus.
      if (!btn.closest('.conv-menu')) return;
      e.stopPropagation();
      closeConvMenu();
      const id = btn.dataset.convId;
      const action = btn.dataset.action;
      if (action === 'rename') startConvRename(id);
      else if (action === 'delete') deleteConv(id);
    });

    // Inline-edit rename.
    function startConvRename(id) {
      const row = document.querySelector('.conv-row[data-conv-id="' + id + '"]');
      if (!row) return;
      const titleSpan = row.querySelector('.conv-title');
      const input = row.querySelector('.conv-rename-input');
      if (!titleSpan || !input) return;
      input.value = titleSpan.textContent;
      titleSpan.hidden = true;
      input.hidden = false;
      input.focus();
      input.select();
    }
    document.addEventListener('keydown', (e) => {
      if (!e.target.classList.contains('conv-rename-input')) return;
      const row = e.target.closest('.conv-row');
      if (!row) return;
      if (e.key === 'Enter') { e.preventDefault(); commitConvRename(row); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelConvRename(row); }
    });
    document.addEventListener('blur', (e) => {
      if (!e.target.classList.contains('conv-rename-input')) return;
      const row = e.target.closest('.conv-row');
      if (row) setTimeout(() => cancelConvRename(row), 100);
    }, true);
    async function commitConvRename(row) {
      const input = row.querySelector('.conv-rename-input');
      const titleSpan = row.querySelector('.conv-title');
      const id = row.dataset.convId;
      const next = (input.value || '').trim();
      if (!next) { cancelConvRename(row); return; }
      const prev = titleSpan.textContent;
      // Optimistic update.
      titleSpan.textContent = next;
      input.hidden = true;
      titleSpan.hidden = false;
      try {
        const res = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/conversations/' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: next }),
        });
        if (!res.ok) {
          titleSpan.textContent = prev; // roll back
          showConvToast('Rename failed', 'warn');
          return;
        }
        // Update local state too so future re-renders show the new title.
        const c = conversations.find(c => c.id === id);
        if (c) c.title = next;
      } catch {
        titleSpan.textContent = prev;
        showConvToast('Network error', 'warn');
      }
    }
    function cancelConvRename(row) {
      const input = row.querySelector('.conv-rename-input');
      const titleSpan = row.querySelector('.conv-title');
      if (!input || !titleSpan) return;
      input.hidden = true;
      titleSpan.hidden = false;
    }

    // Delete with 5s undo toast.
    async function deleteConv(id) {
      const c = conversations.find(c => c.id === id);
      if (!c) return;
      const wasActive = id === activeConvId;
      // Optimistically remove from sidebar.
      conversations = conversations.filter(x => x.id !== id);
      if (wasActive) {
        activeConvId = conversations[0]?.id || null;
      }
      renderSidebar();
      if (wasActive && activeConvId) {
        onConvClick(activeConvId);
      } else if (wasActive) {
        // No fallback conversation — clear the chat surface.
        renderTabBody();
      }

      // Server delete (soft).
      let serverOk = false;
      try {
        const res = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
        serverOk = res.ok;
      } catch { serverOk = false; }

      if (!serverOk) {
        // Roll back the optimistic removal.
        conversations.push(c);
        if (wasActive) activeConvId = id;
        renderSidebar();
        showConvToast('Delete failed', 'warn');
        return;
      }

      // Show undo toast (5s).
      showConvUndoToast(c, wasActive);
    }

    // Conv toast — simple top-of-sidebar message. Auto-dismisses.
    function showConvToast(text, kind, ms) {
      const existing = document.getElementById('convToast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'convToast';
      toast.className = 'conv-toast conv-toast-' + (kind || 'info');
      toast.textContent = text;
      document.body.appendChild(toast);
      toast.style.display = 'block';
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, ms || 3000);
    }
    function showConvUndoToast(c, wasActive) {
      const existing = document.getElementById('convToast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'convToast';
      toast.className = 'conv-toast conv-toast-info';
      toast.style.display = 'flex';
      toast.style.alignItems = 'center';
      toast.style.gap = '12px';
      toast.innerHTML = '<span>"' + escapeHtml(c.title || 'Conversation') + '" deleted.</span>';
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.className = 'btn btn--ghost';
      undo.style.padding = '4px 10px';
      undo.style.fontSize = '12px';
      undo.textContent = 'Undo';
      undo.addEventListener('click', async () => {
        toast.remove();
        try {
          const res = await fetch('/api/projects/' + encodeURIComponent(projectId) + '/conversations/' + encodeURIComponent(c.id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ restore: true }),
          });
          if (!res.ok) { showConvToast('Undo failed', 'warn'); return; }
          conversations.push(c);
          conversations.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
          if (wasActive) activeConvId = c.id;
          renderSidebar();
          if (wasActive) onConvClick(c.id);
        } catch { showConvToast('Network error', 'warn'); }
      });
      toast.appendChild(undo);
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
    }

    // ---------- Tab strip ----------
    function renderTabStrip() {
      document.querySelectorAll('#tabStrip .project-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === activeTab);
      });
      // Block 16: mirror active state onto the segmented control.
      document.querySelectorAll('#tabStrip .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
      });
    }

    function onTabClick(e) {
      // Block 16: .seg-btn (Sprint View / Chat switcher) routes through the
      // same path as the legacy .project-tab buttons.
      const tab = e.target.closest('.project-tab, .seg-btn');
      if (!tab) return;
      applyState({ conversationId: activeConvId, tab: tab.dataset.tab });
    }

    // ---------- Tab body ----------
    // Block 13.7b: the `connections` branch is removed — the Connections
    // UI now lives on /project_settings.html. Any URL with ?tab=connections
    // falls through to chat (VALID_TABS dropped `connections`, so the
    // boot path normalizes it to `chat`).
    function renderTabBody() {
      const body = document.getElementById('tabBody');
      if (activeTab === 'chat') renderChat(body);
      else if (activeTab === 'sprint') renderSprint(body);
      else if (activeTab === 'members') renderMembers(body);
      else renderChat(body);
    }

    // 2026-05-27 (shared-workspace-visibility follow-up):
    // FROM chip row — mirrors the ACROSS row in cross-project chat.
    // Now that the giant project-name heading is gone, this strip
    // reinforces "you are chatting with <project>". Logo if uploaded,
    // initial letter otherwise (same fallback as the dashboard cards).
    function projectFromRowHtml() {
      if (!project) return '';
      const name = project.name || '';
      const initial = String(name.trim()[0] || '?').toUpperCase();
      const iconHtml = project.logo_url
        ? '<img class="pj-scopechip__icon" src="' + escapeHtml(project.logo_url) + '" alt="">'
        : '<span class="pj-scopechip__icon">' + escapeHtml(initial) + '</span>';
      return ''
        + '<div class="pj-from">'
        +   '<span class="pj-from__label">From</span>'
        +   '<span class="pj-scopechip">' + iconHtml + escapeHtml(name) + '</span>'
        + '</div>';
    }

    // Composer footer cap/limit text — mirror of cross-project's
    // "Cross-project AI · workspace cap $X / $Y this month". Uses the
    // per-project ai_monthly_cap_usd and (optionally) the
    // ai_spend_period_to_date_usd that /api/projects/:id returns.
    function composerFooterCapHtml() {
      if (!project) return '';
      const cap = Number(project.ai_monthly_cap_usd);
      const spent = Number(project.ai_spend_period_to_date_usd);
      if (!Number.isFinite(cap) || cap <= 0) return 'Project chat';
      const fmt = (n) => '$' + (Number.isFinite(n) ? n.toFixed(2) : '0.00');
      const spentTxt = Number.isFinite(spent) ? fmt(spent) : '$0.00';
      return 'Project chat · cap ' + spentTxt + ' / ' + fmt(cap) + ' this month';
    }

    function renderChat(body) {
      const conv = conversations.find(c => c.id === activeConvId);
      const title = conv ? (conv.title || '') : '';
      body.innerHTML = `
        <div class="chat-area">
          ${projectFromRowHtml()}
          <div class="chat-conv-title" id="chatConvTitle"></div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-composer">
            <div class="chat-error" id="chatError" style="display:none;" role="alert"></div>
            <div class="ai-paused-banner" id="aiPausedBanner" style="display:none;" role="status"></div>
            <!-- Block 18.5: persistent rail mount. Contents are rebuilt by
                 renderRail(); visibility is a style toggle so typing never
                 re-renders it. First child of .chat-composer so it inherits
                 the composer's padding. -->
            <div id="chatRail" style="display:none;"></div>
            <div class="chat-composer-row">
              <textarea class="chat-input" id="chatInput" placeholder="Ask ${escapeHtml(project && project.name ? project.name : 'this project')}…" rows="1" aria-label="Message"></textarea>
              <button class="chat-send-btn" id="chatSend" type="button" disabled aria-label="Send"><i class="ti ti-send"></i></button>
            </div>
            <div class="chat-composer-footer">
              <div>${composerFooterCapHtml()}</div>
              <div class="chat-composer-footer__hint">↵ to send</div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('chatConvTitle').textContent = title;
      renderMessages();
      wireComposer();
      // Block 10.2 decision F: if a prior 429 set aiPausedUntilMs, the
      // banner needs to render every time the chat re-renders (tab
      // switch, conversation switch). updateAiPausedBanner is a no-op
      // when the timestamp is in the past.
      updateAiPausedBanner();
      // Defer focus to next frame so the textarea is in the layout tree.
      requestAnimationFrame(() => {
        const input = document.getElementById('chatInput');
        if (input && !inFlight) input.focus();
      });
    }

    // Block 18.5: the hardcoded SUGGESTIONS_SLACK / SUGGESTIONS_JIRA lists
    // and getSuggestionList moved into /_lib/chat-suggestions.js, shared with
    // cross-project chat. The <topic> placeholder chip is gone: the sprint
    // card interpolates the real sprint name from suggestion_context instead.
    // getConnectionState below still drives which set renders.

    // Context passed to the shared module for interpolation. Populated in
    // boot() from GET /api/projects/:id (Block 18.2); a null sprint name is
    // normal and the card falls back to static wording.
    let suggestionContext = { sprintName: null };

    // Block 9.3 decision J: "show only when active conversation has zero
    // user messages." Disappears after first send; reappears on a new
    // conversation. No dismissal state.
    function userMessagesEver(convId) {
      return (messagesById[convId] || []).filter(m => m.role === 'user').length;
    }

    // Block 9.3 decision H: collapse the `connections` global into one of
    // 'slack' / 'jira' / 'both' / 'none' for the gating switch in
    // renderSuggestionsHtml. `null` (still loading or failed) falls into
    // 'none' — the empty-state card is a safer default than guessing.
    function getConnectionState() {
      if (!Array.isArray(connections)) return 'none';
      const hasSlack = connections.some(c => c && c.source === 'slack');
      const hasJira  = connections.some(c => c && c.source === 'jira');
      if (hasSlack && hasJira) return 'both';
      if (hasSlack) return 'slack';
      if (hasJira)  return 'jira';
      return 'none';
    }


    // 2026-05-27 (shared-workspace-visibility follow-up): empty state
    // aligned to cross-project chat (mockup screen-12). Centered icon
    // + "Ask <project>" title + sub-paragraph + suggestion cards
    // (mirror of .xc-empty). Source-gating logic is preserved:
    //   - 'none' (no Slack/Jira connections): admins get the "Open
    //     Connections" CTA card, members get a contact-an-admin hint
    //     (no actionable card).
    //   - 'slack' / 'jira' / 'both': cards from the shared module's
    //     ChatSuggestions.listHtml(state, ctx) (Block 18.5).
    // Icons are per-catalog-entry now, set in /_lib/chat-suggestions.js
    // rather than one ti-message-question for every chip.
    // The 'none' state's CTA is a link, not a question, so it stays local —
    // the shared module renders question cards only.
    function connectionsCardHtml() {
      const href = project && project.slug
        ? '/project_settings/' + project.slug + '/connections'
        : '/project_settings.html?id=' + encodeURIComponent(projectId) + '&tab=connections';
      return ''
        + '<div class="sg-list">'
        +   '<a class="sg-card" href="' + escapeHtml(href) + '">'
        +     '<i class="ti ti-plug sg-card__icon"></i>'
        +     '<span class="sg-card__text">Open Connections</span>'
        +   '</a>'
        + '</div>';
    }

    function renderSuggestionsHtml(state) {
      const projectName = project && project.name ? project.name : 'this project';
      const titleHtml = '<h2 class="sg-empty__title">Ask <strong>' + escapeHtml(projectName) + '</strong></h2>';
      const iconHtml = '<div class="sg-empty__icon"><i class="ti ti-messages"></i></div>';
      const CS = window.ChatSuggestions;

      if (state === 'none') {
        const subText = (me && me.is_admin)
          ? "Connect Slack or Jira to start asking questions about this project's data."
          : "No data sources are connected to this project yet. Ask a workspace admin to connect Slack or Jira.";
        // .sg-empty--none keeps the sub-paragraph visible below 700px. Here
        // it is not decorative: it carries the whole actionable message, and
        // members get no CTA card, so the blanket mobile hide would leave
        // them an icon and a title and nothing else.
        return ''
          + '<div class="sg-empty sg-empty--none">'
          +   iconHtml
          +   titleHtml
          +   '<p class="sg-empty__sub">' + escapeHtml(subText) + '</p>'
          +   ((me && me.is_admin) ? connectionsCardHtml() : '')
          + '</div>';
      }

      // Defensive: if the module failed to load, render the empty state
      // without cards rather than throwing and blanking the chat.
      const cards = CS ? CS.listHtml(state, suggestionContext) : '';
      if (!cards) {
        return '<div class="sg-empty">' + iconHtml + titleHtml + '</div>';
      }
      return ''
        + '<div class="sg-empty">'
        +   iconHtml
        +   titleHtml
        +   '<p class="sg-empty__sub">The agent reads this project’s connected data and cites every answer.</p>'
        +   cards
        + '</div>';
    }

    // Block 9.3 decision I: chip click fills #chatInput, focuses it, dispatches
    // an 'input' event so the composer's auto-resize + send-button-enable
    // logic fires. NO auto-submit — PRD §5.9 calls these "example questions,"
    // not "example answers," and auto-submit turns a nudge into accidental
    // token spend. Also wires the "Open Connections tab" link in the
    // 'none'-state card via a programmatic click on the existing tab button.
    function wireSuggestionChips(scope) {
      if (!window.ChatSuggestions) return;
      window.ChatSuggestions.wire(scope, {
        getInput: () => document.getElementById('chatInput'),
        onDismiss: () => {
          window.ChatSuggestions.dismiss(activeConvId);
          renderRail();
        },
      });
      // Block 13.7b: the empty-state CTA is a plain <a href> navigation link,
      // so it needs no handler.
    }

    // ── Returning rail (Block 18.5) ────────────────────────────────────────
    // Visible when the thread has messages, the composer is empty and nothing
    // is in flight. The rail lives in a PERSISTENT node inside .chat-composer
    // and is toggled by class on input — never re-rendered from the `input`
    // handler, which would thrash layout and fight the textarea above it.
    function railMount() {
      return document.getElementById('chatRail');
    }

    function railShouldShow() {
      if (inFlight) return false;
      if (!window.ChatSuggestions) return false;
      if (window.ChatSuggestions.isDismissed(activeConvId)) return false;
      const input = document.getElementById('chatInput');
      if (input && input.value.trim().length > 0) return false;
      return userMessagesEver(activeConvId) > 0;
    }

    // Rebuilds the rail's contents. Called on render and after a turn
    // completes — NOT on keystroke.
    function renderRail() {
      const mount = railMount();
      if (!mount) return;
      if (!window.ChatSuggestions || window.ChatSuggestions.isDismissed(activeConvId)) {
        mount.innerHTML = '';
        updateRailVisibility();
        return;
      }
      const all = messagesById[activeConvId] || [];
      // Last assistant turn that actually rendered — the same filter
      // renderMessages uses, so the rail keys off the visible answer.
      let last = null;
      for (let i = all.length - 1; i >= 0; i--) {
        if (all[i].role === 'assistant' && all[i].content) { last = all[i]; break; }
      }
      const sentTexts = all.filter(m => m.role === 'user').map(m => m.content || '');
      mount.innerHTML = window.ChatSuggestions.railHtml({
        surface: 'project',
        state: getConnectionState(),
        citations: last && Array.isArray(last.citations) ? last.citations : null,
        // model === null marks a failed turn; following up a failure is the
        // wrong nudge, so the rail renders nothing.
        errored: !!(last && last.model === null),
        sentTexts,
        ctx: suggestionContext,
      });
      wireSuggestionChips(mount);
      updateRailVisibility();
    }

    // Class toggle only. Cheap enough to call on every keystroke.
    function updateRailVisibility() {
      const mount = railMount();
      if (!mount) return;
      const show = railShouldShow() && mount.innerHTML.length > 0;
      mount.style.display = show ? '' : 'none';
    }

    function renderMessages() {
      const list = document.getElementById('chatMessages');
      // Filter:
      //   - role='tool' rows (intermediate tool results, not user-visible)
      //   - role='assistant' with no content (intermediate tool-call turns;
      //     they live in the DB for replay/observability but render empty)
      const msgs = (messagesById[activeConvId] || []).filter(m => {
        if (m.role === 'tool') return false;
        if (m.role === 'assistant' && !(m.content && m.content.length > 0)) return false;
        return true;
      });
      // Block 9.3 decisions J + K: when this conversation is brand-new
      // (no visible messages AND no user messages ever sent), render the
      // source-gated suggestion grid (or the no-connections state card)
      // in place of the empty chat list. Disappears on the next render
      // after the user sends — userMessagesEver becomes > 0.
      if (msgs.length === 0 && userMessagesEver(activeConvId) === 0) {
        list.innerHTML = renderSuggestionsHtml(getConnectionState());
        wireSuggestionChips(list);
        // First-open cards are showing; the returning rail must not also be.
        const mount = railMount();
        if (mount) { mount.innerHTML = ''; mount.style.display = 'none'; }
        return;
      }
      // Pass the full message array (incl. any role='tool' rows) so
      // renderMessageHtml can resolve tool_use_id matchups for the trace
      // viewer (BLOCK_10_PLAN.md decision P, 10.6). The filtered `msgs`
      // above stays the user-visible list — tool rows still hidden from
      // the main chat scroll.
      const allMsgs = messagesById[activeConvId] || [];
      list.innerHTML = msgs.map(m => renderMessageHtml(m, allMsgs)).join('');
      // Block 10.1 decision C: wire up the ↻ Refresh & re-ask buttons
      // after innerHTML lands. data-msg-id carries the source assistant
      // message id; handler reads it and POSTs to the refresh endpoint.
      list.querySelectorAll('.refresh-reask-button').forEach(btn => {
        btn.addEventListener('click', () => handleRefreshAndReask(btn));
      });
      list.scrollTop = list.scrollHeight;
      // Block 18.5: the thread has messages, so the returning rail applies.
      renderRail();
    }

    // Block 10.1 decision C: handler for the ↻ Refresh & re-ask button.
    // Disables the button + flips its label while in-flight; surfaces 429
    // via the existing showConnToast (Block 9.1 pattern); on success
    // appends the new assistant message to messagesById and re-renders.
    // The freshly synced data is naturally reflected in the new
    // assistant message's citations (data-as-of suffix via Block 9.2).
    async function handleRefreshAndReask(btn) {
      if (btn.disabled) return;
      const messageId = btn.dataset.msgId;
      if (!messageId) return;
      const origLabel = btn.innerHTML;
      btn.disabled = true;
      btn.classList.add('in-flight');
      btn.innerHTML = 'Refreshing…';

      // Path note (Block 10.1 hotfix): the new endpoint sits at
      // /conversations/.../refresh-and-ask-again/:msgId — NOT under
      // /messages/... where messages.js shadowed the deeper route in
      // Pages Functions routing. See the endpoint file's header comment
      // for the full diagnostic.
      const url = '/api/projects/' + encodeURIComponent(project.id) +
                  '/conversations/' + encodeURIComponent(activeConvId) +
                  '/refresh-and-ask-again/' + encodeURIComponent(messageId);

      let res;
      try {
        res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      } catch {
        btn.disabled = false;
        btn.classList.remove('in-flight');
        btn.innerHTML = origLabel;
        showConnToast('Refresh failed. Network or server error.', 'warn');
        return;
      }

      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/projects.html'); return; }
      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        const mins = data.retry_after_seconds
          ? Math.ceil(data.retry_after_seconds / 60)
          : 60;
        showConnToast('Rate limit: ' + (data.error || 'try again later') + ' Next refresh in ~' + mins + 'm.', 'warn');
        btn.disabled = false;
        btn.classList.remove('in-flight');
        btn.innerHTML = origLabel;
        return;
      }
      if (!res.ok) {
        showConnToast('Refresh failed. Try again or check the activity drawer.', 'warn');
        btn.disabled = false;
        btn.classList.remove('in-flight');
        btn.innerHTML = origLabel;
        return;
      }

      let data;
      try { data = await res.json(); } catch { data = null; }
      if (!data || !data.assistant_message) {
        showConnToast('Refresh succeeded but no answer was returned.', 'warn');
        btn.disabled = false;
        btn.classList.remove('in-flight');
        btn.innerHTML = origLabel;
        return;
      }

      // Append the new assistant message to local state and re-render.
      // Admins also benefit from seeing the new tool trace, but the
      // role='tool' rows aren't returned by this endpoint — a hard reload
      // (or future enhancement to re-fetch /messages) would expose them.
      if (!messagesById[activeConvId]) messagesById[activeConvId] = [];
      messagesById[activeConvId].push(data.assistant_message);

      // Bump the sidebar's updated_at-DESC sort so the refreshed
      // conversation surfaces to the top (server already UPDATEd
      // conversations.updated_at; mirror it locally for snappy UI).
      const idx = conversations.findIndex(c => c.id === activeConvId);
      if (idx >= 0) {
        conversations[idx] = {
          ...conversations[idx],
          updated_at: data.assistant_message.created_at || new Date().toISOString(),
          message_count: (conversations[idx].message_count || 0) + 1,
        };
        conversations.sort((a, b) => {
          const at = new Date(a.updated_at).getTime();
          const bt = new Date(b.updated_at).getTime();
          if (bt !== at) return bt - at;
          return a.id < b.id ? 1 : -1;
        });
      }

      renderMessages();
      renderConversations();
      const summary = data.connection_summary || {};
      const okCount = summary.succeeded || 0;
      const failCount = summary.failed || 0;
      let toastMsg = 'Refreshed and re-asked.';
      if (failCount > 0) {
        toastMsg = 'Refreshed (' + okCount + ' source' + (okCount === 1 ? '' : 's') + ' updated, ' + failCount + ' failed). Answer regenerated.';
      }
      showConnToast(toastMsg, failCount > 0 ? 'warn' : 'success');
    }

    function renderMessageHtml(m, allMsgs) {
      const isUser = m.role === 'user';
      const avatar = isUser ? deriveUserInitial(me.email) : 'EA';
      const rel = fmtRelativeShort(m.created_at) || 'just now';
      const meta = (isUser ? 'You · ' : 'Elinno Agent · ') + rel;
      const citations = !isUser && Array.isArray(m.citations) ? m.citations : [];
      // Block 10.6 decision P: tool-call trace viewer. Server gates by
      // admin role — non-admins receive tool_calls: null on assistant
      // rows, so the aggregate stays empty → no trace renders.
      //
      // Aggregate across the iteration cluster: intermediate assistants
      // (empty content, carrying tool_calls) are filtered out of the
      // visible list at line 677, so we walk back from each final-content
      // assistant to the preceding user boundary and collect their
      // tool_calls. The trace lands on the user-visible answer message.
      const toolCalls = (() => {
        if (isUser) return [];
        const own = Array.isArray(m.tool_calls) ? m.tool_calls : [];
        if (!(m.content && m.content.length > 0)) return own;
        const idx = (allMsgs || []).findIndex(am => am.id === m.id);
        if (idx === -1) return own;
        const aggregated = [];
        for (let i = idx - 1; i >= 0; i--) {
          const prev = allMsgs[i];
          if (prev.role === 'user') break;
          if (prev.role === 'assistant' && Array.isArray(prev.tool_calls) && prev.tool_calls.length > 0) {
            aggregated.unshift(...prev.tool_calls);
          }
        }
        return [...aggregated, ...own];
      })();
      const toolTraceHtml = toolCalls.length > 0
        ? renderToolTraceHtml(toolCalls, allMsgs || [])
        : '';

      // Assistant visual states:
      //   .error  — model=null: agent loop failed (S21) or zero-data-
      //             source short-circuit; canned text with no AI involved.
      //   .muted  — citations empty but model set: honest "couldn't
      //             find that" answer with no sources to cite.
      let stateClass = '';
      if (!isUser) {
        if (m.model === null || m.model === undefined) stateClass = ' error';
        else if (citations.length === 0) stateClass = ' muted';
      }

      return `
        <div class="chat-msg ${isUser ? 'user' : 'assistant'}${stateClass}">
          <div class="chat-msg-avatar">${escapeHtml(avatar)}</div>
          <div class="chat-msg-body">
            <div class="chat-msg-meta">${escapeHtml(meta)}</div>
            <div class="chat-msg-content">${renderMessageContent(m.content || '')}</div>
            ${toolTraceHtml}
            ${citations.length > 0 ? renderCitationRailHtml(citations, m.id) : ''}
          </div>
        </div>
      `;
    }

    // Block 10.6 decision P: compact tool-call trace renderer, admin-only.
    // Server-side gate already filters non-admins out — this function only
    // runs when toolCalls.length > 0. Each tool_use is matched to its
    // tool_result by tool_use_id (Anthropic content-block convention,
    // persisted by loop.js:300-310). Failed tools surface their
    // error_message from f7fc540's persisted payload, truncated to ~200
    // chars for the chip. Args are intentionally hidden in v1.1 (decision P
    // calls out that "Args are hidden in v1.1") — Block 11+ can add an
    // expand toggle if forensic value materializes.
    function renderToolTraceHtml(toolCalls, allMsgs) {
      const toolMsgs = allMsgs.filter(m => m.role === 'tool' && m.tool_result);
      const items = toolCalls.map(tc => {
        const match = toolMsgs.find(t =>
          t.tool_result && t.tool_result.tool_use_id === tc.id
        );
        let failedErr = null;
        if (match) {
          try {
            const result = match.tool_result.result;
            if (Array.isArray(result) && result[0] && typeof result[0].text === 'string') {
              const parsed = JSON.parse(result[0].text);
              if (parsed && parsed.error === 'tool_execution_failed') {
                failedErr = String(parsed.error_message || 'tool_execution_failed').slice(0, 200);
              }
            }
          } catch { /* malformed payload — render as success */ }
        }
        const status = failedErr
          ? `<span class="tool-trace-result err">⚠️ ${escapeHtml(failedErr)}</span>`
          : `<span class="tool-trace-result ok">✓</span>`;
        return `<li><span class="tool-trace-name">${escapeHtml(tc.name || 'unknown')}</span> ${status}</li>`;
      }).join('');
      const failedCount = toolCalls.filter(tc => {
        const match = toolMsgs.find(t =>
          t.tool_result && t.tool_result.tool_use_id === tc.id
        );
        if (!match) return false;
        try {
          const result = match.tool_result.result;
          if (Array.isArray(result) && result[0] && typeof result[0].text === 'string') {
            const parsed = JSON.parse(result[0].text);
            return parsed && parsed.error === 'tool_execution_failed';
          }
        } catch { /* */ }
        return false;
      }).length;
      const summary = `🔧 ${toolCalls.length} tool call${toolCalls.length === 1 ? '' : 's'}${failedCount > 0 ? ' (' + failedCount + ' failed)' : ''}`;
      return `<details class="tool-trace"><summary>${escapeHtml(summary)}</summary><ul>${items}</ul></details>`;
    }

    function renderCitationRailHtml(citations, messageId) {
      // Dedupe visually-identical chips: one source can be cited by several
      // tool calls in a single turn (and duplicate source records can share
      // a display name), which rendered the same chip 2–3×. Collapse by the
      // rendered label so each distinct source shows once; the citation
      // contract (PRD principle 2) still holds.
      const seenChipKeys = new Set();
      const chips = citations.map(c => {
        const baseLabel = c.title || c.author || (c.source ? c.source[0].toUpperCase() + c.source.slice(1) : 'Source');
        const fresh = fmtCitationFreshness(c);
        const chipKey = baseLabel + '|' + fresh.suffix;
        if (seenChipKeys.has(chipKey)) return '';
        seenChipKeys.add(chipKey);
        const safeBase = escapeHtml(baseLabel);
        const safeSuffix = escapeHtml(fresh.suffix);
        const staleClass = fresh.stale ? ' chat-citation-stale' : '';
        const freshHtml = `<span class="chat-citation-freshness${staleClass}">${safeSuffix}</span>`;
        const labelHtml = `${safeBase}${freshHtml}`;
        // v1.4 (Block 13.4) per BLOCK_13_DECISIONS.md decision 6:
        // citations are non-clickable labels. The outbound URL is dropped
        // — every citation renders as a .chat-citation-noref span regardless
        // of whether c.source_url is present. "Refresh & re-ask" stays as
        // the interactive affordance below the chip row.
        const titleStr = fmtCitationTitle(fresh.titleSource);
        const titleAttr = titleStr ? ` title="${escapeHtml(titleStr)}"` : '';
        return `<span class="chat-citation chat-citation-noref"${titleAttr}>${labelHtml}</span>`;
      }).join('');
      // Block 10.1 decision C: ↻ Refresh & re-ask button on every assistant
      // message with citations. Wired up via event delegation after innerHTML
      // sets (see renderMessages wiring + handleRefreshAndReask). Skipped if
      // no messageId — guards against future call sites that don't pass it.
