<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/_lib/no-zoom.js" defer></script>
  <meta name="theme-color" content="#121215" />
  <title>Elinno Agent — Sign in</title>
  <meta name="description" content="Sign in to Elinno Agent." />
  <meta property="og:title" content="Elinno Agent" />
  <meta property="og:description" content="A thoughtful, precise agent made to work alongside you." />
  <meta property="og:url" content="https://elinnoagent.com" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@300,400,500,600,700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <section class="mainbanner">
    <div class="banner-bg" aria-hidden="true"></div>
    <div class="banner-orbs" aria-hidden="true">
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
    </div>
    <div class="thisdiv" aria-hidden="true"></div>

    <header class="main-navbar">
      <nav class="navbar custom-container">
        <a class="navbar-brand" href="/" aria-label="Elinno Agent">
          <span class="brandmark brandmark--light" style="width:22px;height:22px;"></span>
          <span class="wordmark" style="font-size:16px;">Elinno&nbsp;Agent</span>
        </a>
      </nav>
    </header>

    <div class="innerbanner custom-container">
      <p class="eyebrow reveal" style="--d:0ms">— 2026</p>

      <h1 class="mainbannerhead reveal" style="--d:120ms">
        Welcome
        <span class="dark">back</span>
      </h1>

      <form id="loginForm" class="hero-login reveal" style="--d:280ms" novalidate>
        <div id="msg" class="hero-msg" role="status" aria-live="polite"></div>

        <div class="hero-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required placeholder="you@example.com" />
        </div>

        <div class="hero-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>

        <button id="submitBtn" type="submit" class="hero-btn">Sign in</button>

        <div class="hero-foot">
          <a href="/forgot-password.html">Forgot password?</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="mainfooter" id="about">
    <div class="custom-container">
      <div class="innerfooter">
        <div class="footerleft">
          <a class="footer-brand" href="/">
            <span class="brandmark" style="width:22px;height:22px;"></span>
            <span class="wordmark" style="font-size:18px;">Elinno&nbsp;Agent</span>
          </a>
          <p class="logopara">
            A thoughtful, precise agent made to work alongside you.
          </p>
        </div>
      </div>

      <div class="bottom-footer">
        <span class="meta">© 2026 Elinno Agent. All rights reserved.</span>
        <span class="meta">elinnoagent.com</span>
      </div>
    </div>
  </footer>

  <script>
    // D6: honor ?next=<path> from a sign-out redirect so the user lands back
    // where they were trying to go. Same-origin validation to prevent
    // open-redirect: must start with "/" and NOT "//" (which would be a
    // protocol-relative URL to another host).
    function postLoginTarget() {
      const next = new URLSearchParams(location.search).get('next');
      if (next && next.startsWith('/') && !next.startsWith('//')) return next;
      return '/dashboard.html';
    }

    // Already signed in? Skip straight to the dashboard (or honor ?next=).
    // v1.4 SPEC §5.2: both roles land at /dashboard.html; admins reach
    // /admin.html from the dashboard nav, not via a separate login redirect.
    fetch('/api/me').then(r => r.json()).then(d => {
      if (d.user) location.replace(postLoginTarget());
    }).catch(() => {});

    const form = document.getElementById('loginForm');
    const msg  = document.getElementById('msg');
    const btn  = document.getElementById('submitBtn');

    function showMsg(text, kind) {
      msg.textContent = text;
      msg.className = 'hero-msg ' + kind;
    }
    function hideMsg() { msg.className = 'hero-msg'; msg.textContent = ''; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showMsg(data.error || 'Login failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          return;
        }
        location.replace(postLoginTarget());
      } catch (err) {
        showMsg('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>

</body>
</html>
