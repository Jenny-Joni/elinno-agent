<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project settings — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/auth.css?v=2026-05-26-1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <style>
    /* Project-settings page layout. Components from 12.2 (auth.css). */
    .ps-shell {
      background: var(--color-bg-light);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 24px;
      margin: 18px 0;
    }
    .ps-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 22px;
    }
    .ps-head-eyebrow {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--color-brand);
      font-weight: 500;
      margin: 0 0 6px;
    }
    .ps-head h1 {
      font-size: 22px;
      font-weight: 500;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0;
    }
    .ps-head h1 strong { font-weight: 700; }

    .ps-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 28px;
    }
    .ps-tab {
      padding: 10px 16px;
      font-size: 13px;
      color: var(--color-text-muted);
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      font-family: inherit;
    }
    .ps-tab.active { color: var(--color-brand); border-bottom-color: var(--color-brand); }

    .ps-section { margin-bottom: 32px; }
    .ps-section h2 {
      font-size: 18px;
      font-weight: 500;
      text-transform: uppercase;
      line-height: 1.15;
      margin: 0 0 6px;
    }
    .ps-section h2 strong { font-weight: 700; }
    .ps-section h2.danger { color: var(--color-danger); }
    .ps-section-sub {
      font-size: 12px;
      color: var(--color-text-muted);
      line-height: 1.45;
      margin: 0 0 20px;
    }
    .ps-section-sub strong { color: var(--color-text-dark); }

    .ps-card {
      background: var(--color-bg-soft);
      border-radius: 12px;
      padding: 22px;
    }
    .ps-card + .ps-card { margin-top: 14px; }
    .ps-card.danger {
      background: var(--color-danger-bg);
      border: 1px solid var(--color-danger-border);
    }

    .ps-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }
    .ps-row:last-child { margin-bottom: 0; }
    .ps-row.full { grid-template-columns: 1fr; }
    .ps-row.align-start { align-items: flex-start; }
    .ps-row label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-body);
    }
    .ps-row .ps-row-hint {
      font-size: 10px;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .ps-row input[type="text"],
    .ps-row input[type="number"],
    .ps-row textarea {
      padding: 11px 14px;
      background: var(--color-bg-light);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      color: var(--color-text-dark);
      width: 100%;
    }
    .ps-row textarea {
      font-size: 13px;
      line-height: 1.45;
      resize: vertical;
      min-height: 60px;
    }
    .ps-row input[disabled],
    .ps-row textarea[disabled] {
      background: var(--color-border);
      color: var(--color-text-muted);
      cursor: not-allowed;
    }
    .ps-row input:focus,
    .ps-row textarea:focus {
      outline: none;
      border-color: var(--color-brand);
    }

    .ps-row-key {
      position: relative;
    }
    .ps-row-key-preview {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: var(--color-text-muted);
      font-family: monospace;
      pointer-events: none;
    }
    /* Block 13.8f: editable slug field with availability pill. */
    .ps-slug-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
    .ps-slug-wrap input { flex: 1; }
    .ps-slug-status {
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 50px;
      flex-shrink: 0;
      white-space: nowrap;
      font-weight: 500;
    }
    .ps-slug-status.ok    { background: #e6f5ec; color: #1d7a3e; }
    .ps-slug-status.error { background: rgba(255, 0, 131, 0.08); color: var(--color-error); }
    .ps-slug-status.muted { background: var(--color-bg-soft); color: var(--color-text-muted); }
    .ps-slug-warning {
      font-size: 10px;
      color: var(--color-warning);
      margin-top: 4px;
      display: none;
    }
    .ps-slug-warning.show { display: block; }

    .ps-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 32px;
    }
    @media (max-width: 700px) { .ps-info-grid { grid-template-columns: 1fr; gap: 16px; } }
    .ps-info-cell-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      font-weight: 500;
      margin: 0 0 5px;
    }
    .ps-info-cell-value {
      font-size: 13px;
      color: var(--color-text-dark);
    }
    .ps-info-cell-value.mono {
      font-family: monospace;
      font-size: 11px;
      color: var(--color-text-body);
    }

    .ps-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .ps-actions .btn {
      width: auto;
      padding: 9px 16px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 8px;
    }
    .ps-actions .btn-secondary {
      background: transparent;
      color: var(--color-text-dark);
      border: 1px solid var(--color-border);
    }
    .ps-actions .btn-primary {
      background: var(--color-brand);
      color: var(--color-text-inverse);
      border: none;
      width: auto;
    }
    .ps-actions .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .ps-action-msg {
      font-size: 11px;
      color: var(--color-text-muted);
      align-self: center;
      margin-right: 8px;
    }
    .ps-action-msg.success { color: var(--color-success); }
    .ps-action-msg.error { color: var(--color-error); }

    /* Logo placeholder section */
    .ps-logo {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 24px;
      align-items: center;
    }
    .ps-logo-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--color-brand-tint);
      color: var(--color-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 36px;
    }
    .ps-logo-meta-label {
      font-size: 10px;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      text-align: center;
      margin-top: 8px;
    }
    .ps-logo-body-title {
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 4px;
    }
    .ps-logo-body-sub {
      font-size: 11px;
      color: var(--color-text-muted);
      margin: 0 0 14px;
    }
    .ps-logo-upload-btn {
      background: var(--color-brand);
      color: var(--color-text-inverse);
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .ps-logo-upload-btn:disabled {
      background: var(--color-bg-soft);
      color: var(--color-text-muted);
      cursor: not-allowed;
      border: 1px solid var(--color-border);
    }
    /* Block 15.1: img variant of the avatar (replaces the initial-letter
       div when a logo is uploaded). object-fit: cover so non-square
       uploads still render in the 84×84 circle without distortion. */
    .ps-logo-avatar-img {
      object-fit: cover;
      display: block;
      background: var(--color-bg-soft);
    }
    .ps-logo-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .ps-logo-remove-btn {
      background: transparent;
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      padding: 9px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .ps-logo-remove-btn:hover {
      color: var(--color-error, #c0392b);
      border-color: var(--color-error, #c0392b);
    }
    .ps-logo-remove-btn:disabled,
    .ps-logo-upload-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Limits spend block */
    .ps-limits-spend {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .ps-limits-spend-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-body);
    }
    .ps-limits-spend-status {
      font-size: 10px;
      font-weight: 500;
    }
    .ps-limits-spend-status.healthy { color: var(--color-success); }
    .ps-limits-spend-status.warning { color: var(--color-warning); }
    .ps-limits-spend-status.exceeded { color: var(--color-danger); }
    .ps-limits-spend-amount {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 10px;
    }
    .ps-limits-spend-amount .num {
      font-size: 22px;
      font-weight: 600;
    }
    .ps-limits-spend-amount .of {
      font-size: 12px;
      color: var(--color-text-muted);
    }
    .ps-currency-input {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 160px;
    }
    .ps-currency-input::before {
      content: '$';
      position: absolute;
      left: 14px;
      font-size: 14px;
      color: var(--color-text-muted);
      font-weight: 500;
      pointer-events: none;
    }
    .ps-currency-input input { padding-left: 26px; }

    /* Connections tab */
    .ps-conn-list { display: flex; flex-direction: column; gap: 10px; }
    .ps-conn-card {
      background: var(--color-bg-light);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 18px;
    }
    .ps-conn-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    .ps-conn-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--color-bg-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ps-conn-info { flex: 1; }
    .ps-conn-name {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .ps-conn-sub {
      font-size: 11px;
      color: var(--color-text-muted);
    }
    .ps-conn-disconnect {
      background: transparent;
      color: var(--color-text-muted);
      border: none;
      padding: 6px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .ps-conn-meta {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--color-border);
    }
    @media (max-width: 700px) { .ps-conn-meta { grid-template-columns: 1fr; gap: 8px; } }
    .ps-conn-meta-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      font-weight: 500;
      margin: 0 0 4px;
    }
    .ps-conn-meta-value { font-size: 12px; font-weight: 500; }
    .ps-conn-sync-btn,
    .ps-conn-setup-btn {
      background: transparent;
      color: var(--color-brand);
      border: 1px solid rgba(98, 52, 252, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      justify-self: flex-end;
    }
    .ps-conn-setup-btn {
      background: var(--color-brand);
      color: var(--color-text-inverse);
      border-color: var(--color-brand);
    }

    /* Empty state in Connections tab (no connections yet). Uses
       .state-card primitive from auth.css; this block is just for
       the inline action buttons row. */
    .ps-conn-empty-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .ps-conn-empty-actions .btn { width: auto; }

    /* "Add another" CTA when one source already connected. */
    .ps-conn-add-other {
      margin-top: 12px;
      text-align: center;
    }
    .ps-conn-add-other .btn { width: auto; }

    .ps-error {
      background: rgba(255, 0, 131, 0.08);
      border: 1px solid rgba(255, 0, 131, 0.3);
      border-radius: 12px;
      padding: 18px;
      color: var(--color-error);
      font-size: 13px;
      text-align: center;
      margin: 20px 0;
    }
    .ps-loading {
      padding: 60px 0;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 13px;
    }

    .ps-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--color-text-muted);
      text-decoration: none;
      margin-bottom: 8px;
    }
    .ps-back-link:hover { color: var(--color-brand); }
  </style>
</head>
<body>
  <nav class="app-nav">
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/projects.html">Projects</a>
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:600;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <div class="custom-container">
      <div id="psRoot">
        <div class="ps-loading">Loading project settings…</div>
      </div>
    </div>
  </main>

  <!-- Block 13.7a port: channel picker modal (Slack channel selection). Verbatim
       from project.html lines 115-127. Opened by openChannelPicker() in the
       Connections-tab logic. Closes on Escape, click-outside (backdrop), and
       the close button. -->
  <div id="channelPickerModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="channelPickerHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="channelPickerHeading" class="modal-heading">Select a Slack channel</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body channel-picker-list">
        Loading…
      </div>
    </div>
  </div>

  <!-- Block 13.7a port: Jira connect form. Verbatim from project.html lines
       134-175. Jira uses API tokens (no OAuth consent); form POSTs directly to
       /api/connectors/jira/auth/save. On success, redirects to
       /project_settings.html?…&just_connected=jira so the project picker
       auto-opens. -->
  <div id="jiraConnectModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="jiraConnectHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="jiraConnectHeading" class="modal-heading">Connect Jira</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="state-card-body" style="margin-bottom: 16px;">
          Generate an API token at
          <a href="https://id.atlassian.com/manage-profile/security/api-tokens"
             target="_blank" rel="noopener noreferrer">id.atlassian.com</a>
          first, then enter your details below.
        </p>
        <form id="jiraConnectForm" autocomplete="off">
          <div style="margin-bottom: 12px;">
            <label for="jiraSiteUrl" style="display:block; margin-bottom:4px; font-weight:600;">Site URL</label>
            <input type="text" id="jiraSiteUrl" required
                   placeholder="mycompany.atlassian.net"
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 12px;">
            <label for="jiraEmail" style="display:block; margin-bottom:4px; font-weight:600;">Account email</label>
            <input type="email" id="jiraEmail" required
                   placeholder="you@example.com"
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="margin-bottom: 16px;">
            <label for="jiraApiToken" style="display:block; margin-bottom:4px; font-weight:600;">API token</label>
            <input type="password" id="jiraApiToken" required
                   style="width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div id="jiraConnectError" style="display:none; color:#b00020; margin-bottom:12px; padding:8px; background:#fce8eb; border-radius:4px;"></div>
          <div style="display:flex; gap:8px; justify-content:flex-end;">
            <button class="btn btn-ghost" type="button" id="jiraConnectCancelBtn">Cancel</button>
            <button class="btn btn-primary" type="submit" id="jiraConnectSubmitBtn">Connect</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Block 13.7a port: Jira project picker. Verbatim from project.html lines
       181-193. Mirrors channelPickerModal. Auto-opens after ?just_connected=jira
       from the connect-form redirect, or via "Pick project" button on a Jira
       connection that needs setup. -->
  <div id="jiraProjectPickerModal" class="modal" style="display: none;"
       role="dialog" aria-modal="true" aria-labelledby="jiraProjectPickerHeading">
    <div class="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2 id="jiraProjectPickerHeading" class="modal-heading">Select a Jira project</h2>
        <button class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body jira-project-picker-list">
        Loading…
      </div>
    </div>
  </div>

  <script>
    // ---------- helpers ----------
    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    // Alias for ported code that uses escapeHtml (from project.html).
    function escapeHtml(s) { return escHtml(s); }
    function fmtUsd(n, decimals) {
      const d = decimals == null ? 2 : decimals;
      const num = Number(n) || 0;
      return '$' + num.toFixed(d);
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }
    function fmtRel(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const hr = Math.floor(diffMin / 60);
      if (hr < 24) return hr + ' hr' + (hr === 1 ? '' : 's') + ' ago';
      const day = Math.floor(hr / 24);
      if (day === 1) return 'yesterday';
      if (day < 7) return day + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function deriveKey(name) {
      return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'project';
    }
    function getQueryParam(name) {
      try { return new URL(location.href).searchParams.get(name); } catch { return null; }
    }
    function redirectToLogin() {
      // D6: preserve the page user tried to reach so login can return them here.
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }
    function jiraSvg(size) {

    }

    // ---------- state ----------
    let projectId = getQueryParam('id') || '';
    let activeTab = getQueryParam('tab') === 'connections' ? 'connections' : 'general';
    let project = null;
    let connections = null;
    let me = null;
    // Block 13.7a port: one-shot guard so ?just_connected= auto-opens the
    // picker exactly once per page-load (re-renders shouldn't re-trigger).
    let justConnectedHandled = false;

    // ---------- API ----------
    async function api(method, path, body) {
      const opts = { method, credentials: 'same-origin', headers: {} };
      if (body !== undefined) {
        opts.body = JSON.stringify(body);
        opts.headers['Content-Type'] = 'application/json';
      }
      const res = await fetch(path, opts);
      if (res.status === 401) { redirectToLogin(); throw new Error('unauth'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || ('HTTP ' + res.status));
      }
      return data;
    }

    async function loadAll() {
      if (!projectId) throw new Error('Missing project id');
      const [projRes, connsRes, meRes] = await Promise.all([
        api('GET', '/api/projects/' + encodeURIComponent(projectId)),
        api('GET', '/api/projects/' + encodeURIComponent(projectId) + '/connections'),
        api('GET', '/api/me').catch(() => null),
      ]);
      project = projRes.project;
      connections = Array.isArray(connsRes.connections) ? connsRes.connections : [];
      if (meRes && meRes.user) {
        me = meRes.user;
        const av = document.getElementById('navUserAvatar');
        const initial = String((me.display_name || me.email || '?').trim()[0] || '?').toUpperCase();
        av.textContent = initial;
        av.title = (me.display_name || '') + (me.email ? ' · ' + me.email : '');
        if (meRes.user.is_admin) document.getElementById('adminLink').style.display = '';
      }
    }

      const pctClass = pct >= 100 ? 'exceeded' : (pct >= 80 ? 'warning' : 'healthy');
      const pctLabel = pct >= 100 ? 'cap reached'
        : (pct >= 80 ? pct + '% — approaching cap' : pct + '% used');

      // Block 15.1 — project logo upload. project.logo_url is computed
      // server-side from logo_r2_key (NULL → null URL → placeholder
      // state); we just branch on truthiness here.
      const hasLogo = !!project.logo_url;
      const avatarHtml = hasLogo
        ? '<img class="ps-logo-avatar ps-logo-avatar-img" src="' + escHtml(project.logo_url) + '" alt="' + escHtml(project.name) + ' logo">'

        +       '<div class="ps-row">'
        +         '<div>'
        +           '<label for="psSlug">URL slug</label>'
        +           '<div class="ps-row-hint">elinnoagent.com/project/&lt;slug&gt;</div>'

        +   '<div class="ps-card">'
        +     '<div class="ps-limits-spend">'
        +       '<div class="ps-limits-spend-label">AI spend this month</div>'
        +       '<div class="ps-limits-spend-status ' + pctClass + '">' + pctLabel + '</div>'
        +     '</div>'
        +     '<div class="ps-limits-spend-amount">'
        +       '<span class="num">' + fmtUsd(spend) + '</span>'
        +       '<span class="of">of ' + fmtUsd(cap) + '</span>'
        +     '</div>'
        +     '<div class="spend-bar ' + pctClass + ' slim">'
        +       '<div class="spend-bar-track"><div class="spend-bar-fill" style="width:' + pct + '%;"></div></div>'

        +             '<input id="psCap" name="ai_monthly_cap_usd" type="number" min="1" step="1" value="' + Math.round(cap) + '" />'
        +           '</div>'
        +           '<span style="font-size:11px;color:var(--color-text-muted);">USD / month</span>'

        +           '<span style="font-size:11px;color:var(--color-text-muted);">messages / day</span>'

        +   '</div>'

    // ---------- Connections tab (Block 13.7a port) ----------
    function renderConnections() {
      const active = (connections || []).filter(c => c.status === 'active');
      const slack = active.find(c => c.source === 'slack');
      const jira  = active.find(c => c.source === 'jira');

      // Empty state — no connections yet.
      if (!slack && !jira) {
        return ''
          + '<section class="ps-section">'
          +   '<h2>Connect <strong>a data source</strong></h2>'
          +   '<p class="ps-section-sub">Start indexing ' + escHtml(project.name) + ' by connecting Slack or Jira. The agent reads from these — nothing is written back.</p>'
          +   '<div class="ps-card" style="text-align:center;">'
          +     '<div style="margin-bottom:18px;color:var(--color-text-muted);font-size:13px;">No tools connected yet.</div>'
          +     '<div class="ps-conn-empty-actions">'
          +       '<button class="btn btn-primary" id="connectSlackBtn">Connect Slack</button>'
          +       '<button class="btn btn-primary" id="connectJiraBtn">Connect Jira</button>'
          +     '</div>'
          +   '</div>'
          + '</section>';
      }

      // Render active rows + "Add another" CTA when only one source connected.
      function connCard(conn, source) {
        const isSlack = source === 'slack';
        const iconSvg = isSlack ? slackSvg(26) : jiraSvg(26);
        const name = isSlack ? 'Slack' : 'Jira';
        const needsSetup = isSlack
          ? !conn.selected_channel_id
          : !conn.selected_project_key;
        const sub = isSlack
          ? (conn.external_account_id || '') + ' · ' + (conn.selected_channel_name ? '#' + conn.selected_channel_name + ' · ' : '') + (needsSetup ? 'channel not picked' : 'connected')
          : (conn.external_account_id || '') + ' · ' + (conn.selected_project_name ? conn.selected_project_name + ' · ' : '') + (needsSetup ? 'project not picked' : 'connected');
        const pillHtml = needsSetup
          ? '<span class="status-pill" style="background:var(--color-warning-bg);color:var(--color-warning);"><span style="width:5px;height:5px;border-radius:50%;background:var(--color-warning);margin-right:4px;display:inline-block;"></span>Needs setup</span>'
          : '<span class="status-pill live"><span style="width:5px;height:5px;border-radius:50%;background:var(--color-success);margin-right:4px;display:inline-block;"></span>Connected</span>';
        const setupBtnHtml = needsSetup
          ? '<button class="ps-conn-setup-btn" data-action="' + (isSlack ? 'pick-channel' : 'pick-project') + '" data-conn-id="' + escHtml(conn.id) + '"><i class="ti ti-settings"></i> ' + (isSlack ? 'Pick channel' : 'Pick project') + '</button>'
          : '<button class="ps-conn-sync-btn" data-action="sync" data-conn-id="' + escHtml(conn.id) + '"><i class="ti ti-refresh"></i> Sync now</button>';
        return ''
          + '<div class="ps-conn-card" data-conn-id="' + escHtml(conn.id) + '">'
          +   '<div class="ps-conn-head">'
          +     '<div class="ps-conn-icon">' + iconSvg + '</div>'
          +     '<div class="ps-conn-info">'
          +       '<div class="ps-conn-name">' + escHtml(name) + ' ' + pillHtml + '</div>'
          +       '<div class="ps-conn-sub">' + escHtml(sub) + '</div>'
          +     '</div>'
          +     '<button class="ps-conn-disconnect" data-action="disconnect" data-source="' + source + '" data-conn-id="' + escHtml(conn.id) + '"><i class="ti ti-link-off"></i> Disconnect</button>'
          +   '</div>'
          +   '<div class="ps-conn-meta">'
          +     '<div><p class="ps-conn-meta-label">Last sync</p><div class="ps-conn-meta-value">' + escHtml(fmtRel(conn.last_sync_at) || '—') + '</div></div>'
          +     '<div><p class="ps-conn-meta-label">Status</p><div class="ps-conn-meta-value">' + escHtml(conn.status) + '</div></div>'
          +     setupBtnHtml
          +   '</div>'
          + '</div>';
      }

      let listHtml = '<div class="ps-conn-list">';
      if (slack) listHtml += connCard(slack, 'slack');
      if (jira)  listHtml += connCard(jira, 'jira');
      listHtml += '</div>';

      // "Add another" CTA when only one source is connected (v1.1 single-
      // instance per source per BLOCK_6_PLAN.md decision F).
      const addOtherHtml = (slack && !jira)
        ? '<div class="ps-conn-add-other"><button class="btn btn-ghost" id="connectJiraBtn">+ Connect Jira</button></div>'
        : (!slack && jira)
        ? '<div class="ps-conn-add-other"><button class="btn btn-ghost" id="connectSlackBtn">+ Connect Slack</button></div>'
        : '';

      return ''
        + '<section class="ps-section">'
        +   '<h2>Active <strong>connections</strong></h2>'
        +   '<p class="ps-section-sub">Data sources connected to ' + escHtml(project.name) + '. The agent reads from these — nothing is written back.</p>'
        +   listHtml
        +   addOtherHtml
        + '</section>';
    }

    function render() {
      const root = document.getElementById('psRoot');
      const body = activeTab === 'general' ? renderGeneral() : renderConnections();
      root.innerHTML = '<div class="ps-shell">' + renderHead() + body + '</div>';
      bindHandlers();

      // Block 13.7a port: ?just_connected= one-shot auto-open.
      if (activeTab === 'connections' && !justConnectedHandled) {
        justConnectedHandled = true;
        const params = new URLSearchParams(location.search);
        const just = params.get('just_connected');
        const active = (connections || []).filter(c => c.status === 'active');
        const slack = active.find(c => c.source === 'slack');
        const jira  = active.find(c => c.source === 'jira');
        if (just === 'slack' && slack && !slack.selected_channel_id) {
          setTimeout(() => openChannelPicker(slack.id), 0);
        } else if (just === 'jira' && jira && !jira.selected_project_key) {
          setTimeout(() => openJiraProjectPicker(jira.id), 0);
        }
        if (params.has('just_connected')) {
          const url = new URL(location.href);
          url.searchParams.delete('just_connected');
          history.replaceState(null, '', url.toString());
        }
      }
    }

    // ---------- handlers ----------
    function setMsg(elId, text, kind) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.textContent = text || '';
      el.className = 'ps-action-msg' + (kind ? ' ' + kind : '');
    }

    // Block 15.1: logo upload handlers ----------------------------------
    // The server-side validation in functions/api/projects/[id]/logo.js
    // is authoritative; the client checks here just give a fast UX
    // (no round-trip on obvious-fail cases).
    const LOGO_MAX_BYTES = 1024 * 1024;
    const LOGO_ALLOWED_MIME = ['image/png', 'image/jpeg'];

    async function onLogoFileChosen(e) {
      const file = e.target.files && e.target.files[0];
      // Reset the input so picking the same file again re-fires change.
      e.target.value = '';
      if (!file) return;

      if (!LOGO_ALLOWED_MIME.includes(file.type)) {
        setMsg('psLogoMsg', 'Please choose a PNG or JPG.', 'error');
        return;
      }
      if (file.size > LOGO_MAX_BYTES) {
        setMsg('psLogoMsg', 'File is too large (max 1 MB).', 'error');
        return;
      }

      const uploadBtn = document.getElementById('psLogoUploadBtn');
      const replaceBtn = document.getElementById('psLogoReplaceBtn');
      const removeBtn = document.getElementById('psLogoRemoveBtn');
      if (uploadBtn) uploadBtn.disabled = true;
      if (replaceBtn) replaceBtn.disabled = true;
      if (removeBtn) removeBtn.disabled = true;
      setMsg('psLogoMsg', 'Uploading…', '');

      try {
        const form = new FormData();
        form.append('file', file);
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) + '/logo',
          { method: 'POST', credentials: 'same-origin', body: form }
        );
        if (res.status === 401) { redirectToLogin(); return; }
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          setMsg('psLogoMsg', data.error || ('Upload failed (HTTP ' + res.status + ')'), 'error');
          return;
        }
        // Mutate local state with the new logo_url + key, then re-render.
        project.logo_url = data.logo_url;
        project.logo_r2_key = data.logo_r2_key;
        render();
        setMsg('psLogoMsg', 'Logo updated.', '');
      } catch (err) {
        setMsg('psLogoMsg', err.message || 'Upload failed', 'error');
      }
    }

    async function onLogoRemoveClick() {
      if (!window.confirm('Remove the project logo? The placeholder will be used until you upload a new one.')) {
        return;
      }
      const replaceBtn = document.getElementById('psLogoReplaceBtn');
      const removeBtn = document.getElementById('psLogoRemoveBtn');
      if (replaceBtn) replaceBtn.disabled = true;
      if (removeBtn) removeBtn.disabled = true;
      setMsg('psLogoMsg', 'Removing…', '');

      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) + '/logo',
          { method: 'DELETE', credentials: 'same-origin' }
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok && res.status !== 204) {
          const data = await res.json().catch(() => ({}));
          setMsg('psLogoMsg', data.error || ('Remove failed (HTTP ' + res.status + ')'), 'error');
          return;
        }
        project.logo_url = null;
        project.logo_r2_key = null;
        render();
        setMsg('psLogoMsg', 'Logo removed.', '');
      } catch (err) {
        setMsg('psLogoMsg', err.message || 'Remove failed', 'error');
      }
    }

    function bindHandlers() {
      // Tab switching
      document.querySelectorAll('.ps-tab').forEach(b => {
        b.addEventListener('click', () => {
          activeTab = b.dataset.tab;
          syncUrlBar();
          render();
        });
      });

      if (activeTab === 'general') {
        // Block 15.1: logo upload / replace / remove ---------------------
        // The button IDs are mutually exclusive per render:
        //   - psLogoUploadBtn exists when no logo (first upload)
        //   - psLogoReplaceBtn + psLogoRemoveBtn exist when a logo is set
        // Both upload paths share the same file input + handler.
        const fileInput = document.getElementById('psLogoFile');
        const uploadBtn = document.getElementById('psLogoUploadBtn');
        const replaceBtn = document.getElementById('psLogoReplaceBtn');
        const removeBtn = document.getElementById('psLogoRemoveBtn');
        const triggerPicker = () => fileInput && fileInput.click();
        if (uploadBtn) uploadBtn.addEventListener('click', triggerPicker);
        if (replaceBtn) replaceBtn.addEventListener('click', triggerPicker);
        if (fileInput) fileInput.addEventListener('change', onLogoFileChosen);
        if (removeBtn) removeBtn.addEventListener('click', onLogoRemoveClick);

        // Identity form
        const idForm = document.getElementById('psIdentityForm');
        if (idForm) {
          // Block 13.8f: editable slug field with debounced availability check.
          const slugInput = document.getElementById('psSlug');
          const slugStatus = document.getElementById('psSlugStatus');
          const slugWarning = document.getElementById('psSlugWarning');
          const saveBtn = document.getElementById('psIdentitySave');
          const initialSlug = (project && project.slug) || '';
          let slugCheckSeq = 0;
          let slugCheckTimer = null;
          let slugCheckResult = { available: true, reason: 'unchanged' };

          function isValidSlugFormat(s) {
            if (typeof s !== 'string' || s.length === 0 || s.length > 64) return false;
            return /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(s);
          }
          function setSlugStatus(kind, text) {
            slugStatus.className = 'ps-slug-status ' + kind;
            slugStatus.textContent = text;
          }
          function syncSaveBtn() {
            const slugVal = slugInput.value.trim();
            const slugUnchanged = slugVal === initialSlug;
            const slugOk = slugUnchanged || (slugCheckResult && slugCheckResult.available === true);
            saveBtn.disabled = !slugOk;
          }
          function showWarningIfChanged() {
            if (slugInput.value.trim() !== initialSlug) {
              slugWarning.className = 'ps-slug-warning show';
            } else {
              slugWarning.className = 'ps-slug-warning';
            }
          }

          async function checkSlugAvailability(candidate) {
            const seq = ++slugCheckSeq;
            setSlugStatus('muted', 'Checking…');
            try {
              const res = await fetch('/api/projects/slug-available?slug=' + encodeURIComponent(candidate));
              if (seq !== slugCheckSeq) return;
              const data = await res.json().catch(() => ({}));
              if (!res.ok && data.reason !== 'invalid_format') {
                setSlugStatus('error', 'Check failed');
                slugCheckResult = { available: false, reason: 'error' };
                syncSaveBtn();
                return;
              }
              slugCheckResult = data;
              if (data.available) {
                setSlugStatus('ok', '✓ Available');
              } else if (data.reason === 'reserved') {
                setSlugStatus('error', 'Reserved');
              } else if (data.reason === 'taken') {
                setSlugStatus('error', 'Taken');
              } else if (data.reason === 'invalid_format') {
                setSlugStatus('error', 'Invalid format');
              } else {
                setSlugStatus('error', 'Unavailable');
              }
              syncSaveBtn();
            } catch {
              if (seq !== slugCheckSeq) return;
              setSlugStatus('error', 'Check failed');
              slugCheckResult = { available: false, reason: 'error' };
              syncSaveBtn();
            }
          }

          function scheduleSlugCheck() {
            clearTimeout(slugCheckTimer);
            showWarningIfChanged();
            const candidate = slugInput.value.trim();
            if (candidate === initialSlug) {
              setSlugStatus('muted', 'Saved');
              slugCheckResult = { available: true, reason: 'unchanged' };
              syncSaveBtn();
              return;
            }
            if (!isValidSlugFormat(candidate)) {
              setSlugStatus('error', 'Invalid format');
              slugCheckResult = { available: false, reason: 'invalid_format' };
              syncSaveBtn();
              return;
            }
            slugCheckTimer = setTimeout(() => checkSlugAvailability(candidate), 300);
          }
          slugInput.addEventListener('input', scheduleSlugCheck);

          idForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setMsg('psIdentityMsg', 'Saving…', '');
            const name = document.getElementById('psName').value.trim();
            const description = document.getElementById('psDescription').value.trim();
            const slug = slugInput.value.trim();
            try {
              // Only include slug in the payload when it changed — keeps the
              // unique-index race window narrow (we don't trigger an unnecessary
              // UPDATE that might collide with a concurrent edit).
              const payload = { name, description };
              if (slug !== initialSlug) payload.slug = slug;
              const res = await api('PATCH', '/api/projects/' + encodeURIComponent(projectId), payload);
              project = { ...project, ...res.project };
              setMsg('psIdentityMsg', 'Saved.', 'success');
              setTimeout(() => render(), 700);
            } catch (err) {
              const m = String(err && err.message || err);
              setMsg('psIdentityMsg', m, 'error');
              if (m === 'Slug already taken in this workspace') {
                slugCheckResult = { available: false, reason: 'taken' };
                setSlugStatus('error', 'Taken');
                syncSaveBtn();
              }
            }
          });
          document.getElementById('psIdentityDiscard').addEventListener('click', () => render());
        }

        // Limits form
        const limitsForm = document.getElementById('psLimitsForm');
        if (limitsForm) {
          limitsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setMsg('psLimitsMsg', 'Saving…', '');
            const ai_monthly_cap_usd = Number(document.getElementById('psCap').value);
            const daily_message_limit = Number(document.getElementById('psMsg').value);
            try {
              const res = await api('PATCH', '/api/projects/' + encodeURIComponent(projectId) + '/limits', { ai_monthly_cap_usd, daily_message_limit });
              project = { ...project, ...res.project };
              setMsg('psLimitsMsg', 'Saved.', 'success');
              setTimeout(() => render(), 700);
            } catch (err) {
              setMsg('psLimitsMsg', String(err && err.message || err), 'error');
            }
          });
          document.getElementById('psLimitsDiscard').addEventListener('click', () => render());
        }

        // Delete button
        const delBtn = document.getElementById('psDeleteBtn');
        if (delBtn) {
          delBtn.addEventListener('click', async () => {
            const ok = window.prompt('Type the project name to confirm delete:\n\n' + project.name);
            if (ok !== project.name) {
              alert('Name did not match. Delete cancelled.');
              return;
            }
            try {
              await api('DELETE', '/api/projects/' + encodeURIComponent(projectId));
              alert('Project deleted.');
              location.replace('/projects.html');
            } catch (err) {
              alert('Delete failed: ' + (err && err.message || err));
            }
          });
        }
      } else if (activeTab === 'connections') {
        // Connect Slack — full-page redirect to OAuth start.
        const connectSlackBtn = document.getElementById('connectSlackBtn');
        if (connectSlackBtn) {
          connectSlackBtn.addEventListener('click', () => {
            location.href = '/api/connectors/slack/oauth/start?project_id=' + encodeURIComponent(projectId);
          });
        }
        // Connect Jira — open manual-token modal.
        const connectJiraBtn = document.getElementById('connectJiraBtn');
        if (connectJiraBtn) {
          connectJiraBtn.addEventListener('click', openJiraConnectModal);
        }

        // Pick channel / Pick project (setup needed state).
        document.querySelectorAll('[data-action="pick-channel"]').forEach(b => {
          b.addEventListener('click', () => openChannelPicker(b.dataset.connId));
        });
        document.querySelectorAll('[data-action="pick-project"]').forEach(b => {
          b.addEventListener('click', () => openJiraProjectPicker(b.dataset.connId));
        });

        // Sync now
        document.querySelectorAll('[data-action="sync"]').forEach(b => {
          b.addEventListener('click', async () => {
            const connId = b.dataset.connId;
            b.disabled = true;
            const original = b.innerHTML;
            b.innerHTML = '<i class="ti ti-loader"></i> Syncing…';
            try {
              await api('POST', '/api/projects/' + encodeURIComponent(projectId) + '/connections/' + encodeURIComponent(connId) + '/sync');
              await loadAll();
              render();
            } catch (err) {
              alert('Sync failed: ' + (err && err.message || err));
              b.disabled = false;
              b.innerHTML = original;
            }
          });
        });

        // Disconnect
        document.querySelectorAll('[data-action="disconnect"]').forEach(b => {
          b.addEventListener('click', async () => {
            const src = b.dataset.source === 'slack' ? 'Slack' : 'Jira';
            if (!confirm('Disconnect ' + src + '? Synced data stays; future syncs stop.')) return;
            const connId = b.dataset.connId;
            try {
              await api('DELETE', '/api/projects/' + encodeURIComponent(projectId) + '/connections/' + encodeURIComponent(connId));
              await loadAll();
              render();
            } catch (err) {
              alert('Disconnect failed: ' + (err && err.message || err));
            }
          });
        });
      }
    }

    // ---------- Modal handlers (Block 13.7a port from project.html) ----------
    //
    // The 3 modals + their open/close/select handlers are ported verbatim
    // from project.html, with two adaptations:
    //   1. `escapeHtml` → call site stays, alias defined at the top of this
    //      script so the ported code works unchanged.
    //   2. After a successful pick / save, we call `loadAll(); render()`
    //      instead of project.html's `connections = null; renderTabBody()`.
    //
    // The OAuth callback handlers at functions/api/connectors/**/callback.js
    // + functions/api/connectors/jira/auth/save.js are NOT modified by
    // Phase 7a (carve-out boundary). After successful Jira save, this
    // redirects to /project_settings.html?id=…&tab=connections&just_connected=jira
    // — the previously-untouched callback redirect target for Slack stays
    // /project.html?…&just_connected=slack, and project.html bounces to
    // /project_settings.html in commit 13.7a-2.

    // --- Jira connect modal ---
    function openJiraConnectModal() {
      const modal = document.getElementById('jiraConnectModal');
      if (!modal) return;
      modal.style.display = '';
      const form = document.getElementById('jiraConnectForm');
      if (form) form.reset();
      const err = document.getElementById('jiraConnectError');
      if (err) { err.style.display = 'none'; err.textContent = ''; }

      modal.querySelector('.modal-close').onclick = closeJiraConnectModal;
      modal.querySelector('.modal-backdrop').onclick = closeJiraConnectModal;
      document.getElementById('jiraConnectCancelBtn').onclick = closeJiraConnectModal;
      document.addEventListener('keydown', _jiraConnectEscapeHandler);

      form.onsubmit = submitJiraConnect;

      setTimeout(() => document.getElementById('jiraSiteUrl')?.focus(), 0);
    }
    function closeJiraConnectModal() {
      const modal = document.getElementById('jiraConnectModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _jiraConnectEscapeHandler);
    }
    function _jiraConnectEscapeHandler(e) {
      if (e.key === 'Escape') closeJiraConnectModal();
    }
    async function submitJiraConnect(event) {
      event.preventDefault();
      const errEl = document.getElementById('jiraConnectError');
      const submitBtn = document.getElementById('jiraConnectSubmitBtn');
      errEl.style.display = 'none';
      errEl.textContent = '';

      // Strip any accidentally-pasted protocol/path (jira.js requires
      // hostname-only).
      let siteUrl = (document.getElementById('jiraSiteUrl').value || '').trim();
      siteUrl = siteUrl.replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
      const accountEmail = (document.getElementById('jiraEmail').value || '').trim();
      const apiToken = document.getElementById('jiraApiToken').value || '';

      if (!siteUrl || !accountEmail || !apiToken) {
        errEl.textContent = 'All three fields are required.';
        errEl.style.display = '';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connecting…';

      try {
        const res = await fetch('/api/connectors/jira/auth/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            project_id: projectId,
            site_url: siteUrl,
            account_email: accountEmail,
            api_token: apiToken,
          }),
        });
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          let msg = (data && typeof data.error === 'string') ? data.error : 'Could not connect.';
          if (msg === 'invalid_credentials') msg = 'Invalid credentials. Check the site URL, email, and API token.';
          if (msg === 'already_connected') msg = 'A Jira connection already exists for this project.';
          errEl.textContent = msg;
          errEl.style.display = '';
          return;
        }
        // Block 13.7a port adaptation: redirect to project_settings.html
        // (the new connections home), NOT project.html.
        const url = new URL(location.href);
        url.searchParams.set('tab', 'connections');
        url.searchParams.set('just_connected', 'jira');
        location.href = url.toString();
      } catch {
        errEl.textContent = 'Could not connect. Please try again.';
        errEl.style.display = '';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Connect';
      }
    }

    // --- Jira project picker ---
    async function openJiraProjectPicker(connId) {
      const modal = document.getElementById('jiraProjectPickerModal');
      if (!modal) return;
      modal.style.display = '';
      const list = modal.querySelector('.jira-project-picker-list');
      list.innerHTML = '<div class="tab-loading">Loading projects…</div>';

      modal.querySelector('.modal-close').onclick = closeJiraProjectPicker;
      modal.querySelector('.modal-backdrop').onclick = closeJiraProjectPicker;
      document.addEventListener('keydown', _jiraProjectPickerEscapeHandler);

      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/jira/projects'
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          list.innerHTML = '<p class="state-card-body">Could not load projects. The Jira API token may be invalid or revoked.</p>';
          return;
        }
        const data = await res.json().catch(() => ({}));
        const projects = Array.isArray(data.projects) ? data.projects : [];
        if (projects.length === 0) {
          list.innerHTML = '<p class="state-card-body">No projects visible to this API token.</p>';
          return;
        }
        list.innerHTML = projects.map(p => `
          <button class="channel-list-item" type="button"
                  data-project-key="${escapeHtml(p.key)}"
                  data-project-name="${escapeHtml(p.name)}">
            <span class="channel-list-name">${escapeHtml(p.name)}</span>
            <span class="channel-list-tag">${escapeHtml(p.key)}</span>
          </button>
        `).join('');
        list.querySelectorAll('.channel-list-item').forEach(item => {
          item.addEventListener('click', () => {
            const key = item.getAttribute('data-project-key');
            const name = item.getAttribute('data-project-name');
            selectJiraProject(connId, key, name);
          });
        });
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not load projects. Please try again.</p>';
      }
    }
    function closeJiraProjectPicker() {
      const modal = document.getElementById('jiraProjectPickerModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _jiraProjectPickerEscapeHandler);
    }
    function _jiraProjectPickerEscapeHandler(e) {
      if (e.key === 'Escape') closeJiraProjectPicker();
    }
    async function selectJiraProject(connId, projectKey, projectName) {
      const modal = document.getElementById('jiraProjectPickerModal');
      const list = modal.querySelector('.jira-project-picker-list');
      list.innerHTML = '<div class="tab-loading">Setting project and starting sync…</div>';
      try {
        const patchRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              credential_metadata: {
                selected_project_key: projectKey,
                selected_project_name: projectName,
              },
            }),
          }
        );
        if (patchRes.status === 401) { redirectToLogin(); return; }
        if (!patchRes.ok) {
          let msg = 'Could not set project. Please try again.';
          if (patchRes.status >= 400 && patchRes.status < 500) {
            const data = await patchRes.json().catch(() => ({}));
            if (data && typeof data.error === 'string') msg = data.error;
          }
          list.innerHTML = '<p class="state-card-body">' + escapeHtml(msg) + '</p>';
          return;
        }
        // Fire-and-don't-await sync — Jira backfill can take 10-30s.
        fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync',
          { method: 'POST' }
        ).catch(() => { /* surfaces in sync_runs */ });

        closeJiraProjectPicker();
        // Block 13.7a port adaptation: project_settings.html idiom.
        await loadAll();
        render();
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not set project. Please try again.</p>';
      }
    }

    // --- Slack channel picker ---
    async function openChannelPicker(connId) {
      const modal = document.getElementById('channelPickerModal');
      if (!modal) return;
      modal.style.display = '';
      const list = modal.querySelector('.channel-picker-list');
      list.innerHTML = '<div class="tab-loading">Loading channels…</div>';

      modal.querySelector('.modal-close').onclick = closeChannelPicker;
      modal.querySelector('.modal-backdrop').onclick = closeChannelPicker;
      document.addEventListener('keydown', _channelPickerEscapeHandler);

      try {
        const res = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/slack/channels'
        );
        if (res.status === 401) { redirectToLogin(); return; }
        if (!res.ok) {
          list.innerHTML = '<p class="state-card-body">Could not load channels. The Slack app may need to be re-installed.</p>';
          return;
        }
        const data = await res.json().catch(() => ({}));
        const channels = Array.isArray(data.channels) ? data.channels : [];
        if (channels.length === 0) {
          list.innerHTML = '<p class="state-card-body">No channels visible to the bot. Add the bot to a channel in Slack and re-open this picker.</p>';
          return;
        }
        list.innerHTML = channels.map(c => `
          <button class="channel-list-item" type="button"
                  data-channel-id="${escapeHtml(c.id)}"
                  data-channel-name="${escapeHtml(c.name)}">
            <span class="channel-list-name">#${escapeHtml(c.name)}</span>
            ${c.is_member ? '<span class="channel-list-tag">bot in channel</span>' : ''}
          </button>
        `).join('');
        list.querySelectorAll('.channel-list-item').forEach(item => {
          item.addEventListener('click', () => {
            const id = item.getAttribute('data-channel-id');
            const name = item.getAttribute('data-channel-name');
            selectChannel(connId, id, name);
          });
        });
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not load channels. Please try again.</p>';
      }
    }
    function closeChannelPicker() {
      const modal = document.getElementById('channelPickerModal');
      if (modal) modal.style.display = 'none';
      document.removeEventListener('keydown', _channelPickerEscapeHandler);
    }
    function _channelPickerEscapeHandler(e) {
      if (e.key === 'Escape') closeChannelPicker();
    }
    async function selectChannel(connId, channelId, channelName) {
      const modal = document.getElementById('channelPickerModal');
      const list = modal.querySelector('.channel-picker-list');
      list.innerHTML = '<div class="tab-loading">Setting channel and starting sync…</div>';
      try {
        const patchRes = await fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId),
          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              credential_metadata: {
                selected_channel_id: channelId,
                selected_channel_name: channelName,
              },
            }),
          }
        );
        if (patchRes.status === 401) { redirectToLogin(); return; }
        if (!patchRes.ok) {
          let msg = 'Could not set channel. Please try again.';
          if (patchRes.status >= 400 && patchRes.status < 500) {
            const data = await patchRes.json().catch(() => ({}));
            if (data && typeof data.error === 'string') msg = data.error;
          }
          list.innerHTML = '<p class="state-card-body">' + escapeHtml(msg) + '</p>';
          return;
        }
        fetch(
          '/api/projects/' + encodeURIComponent(projectId) +
          '/connections/' + encodeURIComponent(connId) + '/sync',
          { method: 'POST' }
        ).catch(() => { /* surfaces in sync_runs */ });

        closeChannelPicker();
        // Block 13.7a port adaptation: project_settings.html idiom.
        await loadAll();
        render();
      } catch {
        list.innerHTML = '<p class="state-card-body">Could not set channel. Please try again.</p>';
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    // Rewrite URL bar to /project_settings/<slug>?tab=... so the address
    // bar mirrors the slug routing introduced for /project (Block 13.8).
    // Falls back to /project_settings.html?id=<uuid> if the project somehow
    // has no slug. ?just_connected= is left as-is by callers (the OAuth
    // bounce expects to read it once, then strips it itself).
    function syncUrlBar() {
      if (!project) return;
      const u = new URL(location.href);
      if (project.slug) {
        u.pathname = '/project_settings/' + project.slug;
        u.searchParams.delete('id');
      } else {
        u.pathname = '/project_settings.html';
        u.searchParams.set('id', project.id || projectId);
      }
      if (activeTab && activeTab !== 'general') u.searchParams.set('tab', activeTab);
      else u.searchParams.delete('tab');
      history.replaceState(null, '', u.toString());
    }

    (async function boot() {
      try {
        await loadAll();
        syncUrlBar();
        render();
      } catch (err) {
        document.getElementById('psRoot').innerHTML = ''
          + '<div class="ps-error">Couldn\'t load project settings. <br><small>'
          + escHtml(String(err && err.message || err)) + '</small></div>';
      }
    })();
  </script>
  <script src="/_lib/sticky-topbar.js" defer></script>
</body>
