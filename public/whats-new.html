<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/_lib/no-zoom.js" defer></script>
  <title>What's new — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-08-16-1" />
</head>
<!-- data-whats-new-page: whats-new-badge.js reads this to mark the release
     read on visit, rather than depending on the pathname. -->
<body data-whats-new-page>

  <!-- ===================================================================
       Block 19 side rail. This block is BYTE-IDENTICAL in all 11 authed
       pages and is diffed across them by verification item 3. Do not edit
       one copy — edit every copy, or the drift this rail exists to fix
       starts over. Behavior: /_lib/side-nav.js. Styles: auth.css .side-nav*.
       =================================================================== -->
  <div class="side-nav-head">
    <button class="side-nav-head__toggle" type="button" data-sn-mobile-toggle aria-label="Open navigation" aria-expanded="false"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <a class="side-nav-head__brand" href="/dashboard.html"><span class="brandmark"></span><span class="wordmark" style="font-size:14px;">Elinno&nbsp;Agent</span></a>
  </div>
  <div class="side-nav-backdrop" data-sn-backdrop></div>
  <aside class="side-nav" aria-label="Main">
    <div class="side-nav__brand">
      <a class="side-nav__lockup" href="/dashboard.html"><span class="brandmark"></span><span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span></a>
      <button class="side-nav__collapse" type="button" data-sn-toggle aria-label="Expand navigation" aria-expanded="false"><i class="ti ti-chevrons-right" aria-hidden="true"></i></button>
    </div>
    <div class="side-nav__scroll">
      <a class="sn-item" href="/dashboard.html" data-sn-nav="dashboard" title="Dashboard"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span class="sn-item__label">Dashboard</span></a>
      <button class="sn-item" type="button" data-sn-section="projects" aria-expanded="false" title="Projects"><i class="ti ti-folders" aria-hidden="true"></i><span class="sn-item__label">Projects</span><i class="ti ti-chevron-right sn-chev" aria-hidden="true"></i></button>
      <div data-sn-children="projects"></div>
      <a class="sn-item" href="/cross-project/index.html" data-sn-nav="cross-project" title="Cross-project chats"><i class="ti ti-messages" aria-hidden="true"></i><span class="sn-item__label">Cross-project chats</span></a>
      <div id="adminLink" style="display:none;">
        <div class="sn-divider"></div>
        <a class="sn-item" href="/workspace_settings.html" data-sn-nav="workspace-settings" title="Workspace settings"><i class="ti ti-settings" aria-hidden="true"></i><span class="sn-item__label">Workspace settings</span></a>
        <a class="sn-item" href="/admin.html" data-sn-nav="members" title="Members"><i class="ti ti-shield" aria-hidden="true"></i><span class="sn-item__label">Members</span></a>
      </div>
    </div>
    <div class="side-nav__foot">
      <a class="sn-item wn-navlink" href="/whats-new.html" data-sn-nav="whats-new" title="What's new"><i class="ti ti-sparkles" aria-hidden="true"></i><span class="sn-item__label">What's new</span><span class="wn-navlink__dot" style="display:none;"></span></a>
      <div class="sn-item sn-item--static" data-sn-user><span id="navUserAvatar" class="sn-avatar" title=""></span><span class="sn-item__label" data-sn-username>Account</span></div>
      <button class="sn-item" type="button" id="logoutBtn" title="Log out"><i class="ti ti-logout" aria-hidden="true"></i><span class="sn-item__label">Log out</span></button>
    </div>
  </aside>

  <main style="background:var(--bg-subtle);min-height:100vh;">
    <div class="wn-shell">

      <div class="eyebrow">
        <span class="eyebrow__label">What's new</span>
        <span class="eyebrow__rule"></span>
      </div>
      <h1 class="wn-title">What's <strong>new</strong></h1>
      <p class="wn-sub">A short weekly summary of what changed in Elinno Agent.</p>

      <div id="wnRoot"></div>

    </div>
  </main>

  <script src="/_lib/whats-new-data.js" defer></script>
  <script src="/_lib/whats-new-badge.js" defer></script>
  <script src="/_lib/side-nav.js" defer></script>

  <script>
  (function () {
    'use strict';

    function $(s, root) { return (root || document).querySelector(s); }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function initial(s) {
      return (String(s || '?').trim()[0] || '?').toUpperCase();
    }

    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    // "2026-08-02" -> "Week of August 2, 2026". Parsed as UTC parts rather
    // than via Date(str) so the label can't slide a day across timezones.
    function fmtWeekOf(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
      if (!m) return '';
      const months = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
      return 'Week of ' + months[Number(m[2]) - 1] + ' ' + Number(m[3]) + ', ' + m[1];
    }

    const TAG_CLASS = { New: 'wn-tag--new', Improved: 'wn-tag--improved', Fixed: 'wn-tag--fixed' };

    // Stand-in wireframes for features whose screenshot has not arrived. Kept
    // as markup here rather than in the content constant, so that file stays
    // copy-only; an entry just names which one it wants.
    //
    // Two forms per PRD §5.11.6 (amended 2026-08-10). ABSTRACT — grey bars,
    // no product copy — is the default. VERBATIM — the real shipped strings —
    // is for features whose content IS the copy, where bars say nothing; the
    // sg-* entries below are verbatim, checked once against the catalog at
    // publication and frozen thereafter. Never invented plausible copy.
    //
    // The caption lives inside each verbatim entry rather than in
    // renderFeature, deliberately: putting it back in the renderer would also
    // re-caption v1.8's two previews, which are frozen as published.
    // Caption required on every placeholder by PRD §5.11.6.
    const CAP = '<p class="wn-shot__cap">Placeholder &mdash; real screenshot goes here</p>';
    const PLACEHOLDER = {
      'whats-new':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">What\'s new</div>'
        + '<p class="wn-mini__title">What\'s <strong>new</strong></p>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">New</span><span class="wn-mini__bar"></span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">New</span><span class="wn-mini__bar" style="width:70%;flex:none;"></span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag wn-mini__tag--grey">Fixed</span><span class="wn-mini__bar" style="width:55%;flex:none;"></span></div>'
        + '</div>',
      'sync-now':
        '<div class="wn-mini wn-mini--bar-row">'
        + '<span class="wn-mini__label">Projects</span>'
        + '<span class="wn-mini__btn">Reorder</span>'
        + '<span class="wn-mini__btn">New project</span>'
        + '<span class="wn-mini__btn wn-mini__btn--primary">Sync now</span>'
        + '</div>',

      // ── v1.9 (Block 18.8) — verbatim previews ─────────────────────────
      // Strings below are the shipped strings from /_lib/chat-suggestions.js
      // as of v1.9. Interpolated values use invented stand-ins (Sprint 24,
      // Aurora, Beacon) — never a real sprint or project name.
      'sg-cards':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">Project chat &middot; Slack and Jira connected</div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">Jira</span><span class="wn-mini__text">How is <strong>Sprint 24</strong> tracking?</span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">Jira</span><span class="wn-mini__text">Who has the most open tickets right now?</span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">Jira</span><span class="wn-mini__text">How has velocity changed over the last three sprints?</span></div>'
        + '<div class="wn-mini__row" style="margin-bottom:0;"><span class="wn-mini__tag wn-mini__tag--grey">Slack</span><span class="wn-mini__text">Summarize the last 24 hours of decisions.</span></div>'
        + '</div>'
        + CAP,
      'sg-sprint':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">When a sprint is running</div>'
        + '<div class="wn-mini__row" style="border-color:var(--brand-soft-border);background:var(--brand-soft);"><span class="wn-mini__tag">Jira</span><span class="wn-mini__text">How is <strong>Sprint 24</strong> tracking?</span></div>'
        + '<div class="wn-mini__eyebrow" style="margin-top:11px;">When none is</div>'
        + '<div class="wn-mini__row" style="margin-bottom:0;"><span class="wn-mini__tag">Jira</span><span class="wn-mini__text">How is the active sprint tracking?</span></div>'
        + '</div>'
        + CAP,
      'sg-rail':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">Above the message box, after an answer</div>'
        + '<div class="wn-mini--bar-row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px;">'
        +   '<span class="wn-mini__pill">Break that down by assignee</span>'
        +   '<span class="wn-mini__pill">Compare with the last three sprints</span>'
        +   '<span class="wn-mini__pill">Which of those are blocked?</span>'
        + '</div>'
        + '<div class="wn-mini__row" style="margin-bottom:0;">'
        +   '<span class="wn-mini__text" style="color:var(--text-faint);">Ask a follow-up&hellip;</span>'
        +   '<span class="wn-mini__btn wn-mini__btn--primary" style="width:16px;height:16px;padding:0;flex:none;"></span>'
        + '</div>'
        + '</div>'
        + CAP,
      'sg-cross':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">Cross-project chat</div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag wn-mini__tag--grey">&middot;</span><span class="wn-mini__text">Which projects are at risk of missing their sprint?</span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">New</span><span class="wn-mini__text">Compare velocity across <strong>Aurora and Beacon</strong> over the last three sprints.</span></div>'
        + '<div class="wn-mini__row" style="margin-bottom:0;"><span class="wn-mini__tag wn-mini__tag--grey">&middot;</span><span class="wn-mini__text">Across <strong>Aurora and Beacon</strong>, who is the busiest assignee right now?</span></div>'
        + '</div>'
        + CAP
    };

    function renderFeature(f) {
      const tagClass = TAG_CLASS[f.tag] || 'wn-tag--new';
      let html = '<div class="wn-feature">'
        + '<span class="pill ' + tagClass + '">' + esc(f.tag || 'New') + '</span>'
        + '<h2 class="wn-feature__title">' + esc(f.title) + '</h2>'
        + '<p class="wn-feature__body">' + esc(f.body) + '</p>';
      // Features carry a preview; fixes never do. Until the real screenshot
      // arrives the slot shows a schematic wireframe plus an explicit caption
      // saying so. The wireframe is abstract by design — grey bars, no product
      // copy — so it reads as a stand-in, not as a screenshot.
      if (f.image) {
        html += '<div class="wn-shot"><img src="' + esc(f.image) + '" alt="' + esc(f.alt || '') + '" /></div>';
      } else if (f.placeholder && PLACEHOLDER[f.placeholder]) {
        html += '<div class="wn-shot">' + PLACEHOLDER[f.placeholder] + '</div>';
      }
      return html + '</div>';
    }

    function renderIssueBody(entry) {
      let html = '';
      (entry.features || []).forEach(f => { html += renderFeature(f); });
      const fixes = entry.fixes || [];
      if (fixes.length) {
        html += '<p class="wn-fixes__head">Also fixed</p>';
        fixes.forEach(fix => {
          // fixes[] entries are { tag, text }; tag defaults to Fixed. Not every
          // line under "Also fixed" is a fix — small new behaviour belongs here
          // too, and would otherwise be mislabelled or forced into features[],
          // which would then owe a preview image it does not need.
          const tag = (fix && fix.tag) || 'Fixed';
          const text = fix && fix.text !== undefined ? fix.text : fix;
          html += '<div class="wn-fix"><i class="ti ti-check" aria-hidden="true"></i>'
            + '<span><span class="pill ' + (TAG_CLASS[tag] || 'wn-tag--fixed') + '">'
            + esc(tag) + '</span> ' + esc(text) + '</span></div>';
        });
      }
      return html;
    }

    function renderLatest(entry) {
      return '<section class="surface surface--lg wn-issue">'
        + '<div class="wn-issue__head">'
        + '<span class="wn-version">' + esc(entry.version) + '</span>'
        + '<span class="wn-date">' + esc(fmtWeekOf(entry.date)) + '</span>'
        + '<span class="pill wn-tag--improved">Latest</span>'
        + '</div>'
        // The headline also carries the collapsed rows and the dashboard
        // strip; here it introduces the issue before the first feature.
        + '<p class="wn-headline">' + esc(entry.headline) + '</p>'
        + renderIssueBody(entry)
        + '</section>';
    }

    // Earlier issues collapse to one row each, so the page can't grow an
    // unbounded scroll as issues accumulate. Expanding reveals the full
    // issue body in place.
    function renderPast(entry, idx) {
      return '<button class="wn-past" type="button" aria-expanded="false" aria-controls="wn-past-body-' + idx + '" data-idx="' + idx + '">'
        + '<span class="wn-past__version">' + esc(entry.version) + '</span>'
        + '<span class="wn-past__date">' + esc(fmtWeekOf(entry.date)) + '</span>'
        + '<span class="wn-past__headline">' + esc(entry.headline)
        + ' <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:15px;"></i></span>'
        + '</button>'
        + '<section class="surface surface--lg wn-issue" id="wn-past-body-' + idx + '" hidden>'
        + renderIssueBody(entry)
        + '</section>';
    }

    function renderEmpty() {
      return '<section class="surface surface--lg wn-empty">'
        + 'Nothing published yet. Updates will appear here as they ship.'
        + '</section>';
    }

    function render() {
      const all = Array.isArray(window.WHATS_NEW) ? window.WHATS_NEW : [];
      const published = all.filter(e => e && e.status === 'published');
      const root = $('#wnRoot');

      if (!published.length) {
        root.innerHTML = renderEmpty();
        return;
      }

      let html = renderLatest(published[0]);
      published.slice(1).forEach((entry, i) => { html += renderPast(entry, i + 1); });
      root.innerHTML = html;

      root.addEventListener('click', e => {
        const btn = e.target.closest('.wn-past');
        if (!btn) return;
        const body = $('#wn-past-body-' + btn.getAttribute('data-idx'));
        if (!body) return;
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        body.hidden = open;
        const chevron = $('.ti-chevron-down, .ti-chevron-up', btn);
        if (chevron) {
          chevron.classList.toggle('ti-chevron-down', open);
          chevron.classList.toggle('ti-chevron-up', !open);
        }
      });
    }

    function start() {
      // Auth gate — same pattern as admin.html. /api/me returns
      // { user: null } when unauthenticated.
      fetch('/api/me').then(r => r.json()).then(d => {
        if (!d.user) { gotoLogin(); return; }
        const av = $('#navUserAvatar');
        av.textContent = initial(d.user.display_name || d.user.email);
        av.title = d.user.display_name ? d.user.display_name + ' · ' + d.user.email : d.user.email;
        if (d.user.is_admin) $('#adminLink').style.display = '';
        render();
      }).catch(() => gotoLogin());

      $('#logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' }).catch(() => {});
        location.replace('/');
      });
    }

    // This block is inline, so it runs DURING parsing — before the deferred
    // whats-new-data.js has set window.WHATS_NEW. Deferred scripts all run
    // before DOMContentLoaded, so waiting for it is what guarantees the data
    // is there. Without this, render() reads an undefined list and falls
    // through to the empty state.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
