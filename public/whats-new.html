  <!-- Block 19 rail boot. BYTE-IDENTICAL in all 11 authed pages, like the
       rail block in <body>; verification item 3b diffs them.

       This MUST be inline and synchronous, and it must stay in <head>.
       /_lib/side-nav.js is deferred, so it runs only after the document is
       parsed. Anything the rail needs at FIRST PAINT has to be decided here,
       or it visibly changes a moment later — which is what made moving
       between rail items look like a glitch rather than a page change.

       Settled before paint, as classes on <html>:
         sn-boot          layout is active (page gets its left offset)
         sn-open-projects Projects is open — derived from the PAGE, not from
                          storage, so the menu follows where you are: open on
                          a Projects page, shut everywhere else
         sn-at-<key>      which rail item is the current page
         sn-admin         reveal the admin group (a display hint, never a
                          permission — every link behind it is gated
                          server-side, and /api/me corrects it on load)

       sn-at-<key> duplicates activeKey() in /_lib/side-nav.js. That is a
       real drift risk and a deliberate trade: the alternative is the
       highlight appearing a frame late on every navigation. If you change
       one, change both — verification item 4 compares them.

       Keep it tiny and dependency-free: it blocks the parser by design. -->
  <script>(function(){var d=document.documentElement,p=location.pathname,k='';if(p==='/'||p.indexOf('/dashboard')===0)k='dashboard';else if(p.indexOf('/finance')===0)k='finance';else if(p.indexOf('/projects')===0||p.indexOf('/project/')===0||p.indexOf('/project.html')===0||p.indexOf('/project_settings')===0)k='projects';else if(p.indexOf('/cross-project')===0)k='cross-project';else if(p.indexOf('/workspace_settings')===0)k='workspace-settings';else if(p.indexOf('/admin')===0)k='members';else if(p.indexOf('/whats-new')===0)k='whats-new';d.classList.add('sn-boot');if(k)d.classList.add('sn-at-'+k);if(k==='projects')d.classList.add('sn-open-projects');else if(k==='finance')d.classList.add('sn-open-finance');try{if(localStorage.getItem('elinno.sidenav.admin')==='1')d.classList.add('sn-admin');}catch(e){}})();</script>

  <!-- Block 19 rail tree restore. BYTE-IDENTICAL in all 11 authed pages.
       Runs during parse, right after the rail exists and before first paint.

       Three jobs, all so the menu arrives correct rather than being corrected:
         1. paint the avatar letter
         2. paint the Projects tree from the last page's render, so an open
            section is not empty while /api/projects is in flight
         3. NORMALISE that tree to the CURRENT page — the cache carries
            whichever project was open on the previous screen, so it is
            re-pointed at the project in this URL, or closed entirely when
            this page is not a project. Without this, opening Rain and then
            clicking Members left Rain expanded under a Members highlight.
       Order matters: the tree must exist before scrollTop means anything,
       so the scroll restore is last.
       The markup came from the previous page's own render (escaped there)
       and the live render replaces it moments later. -->
  <script>(function(){try{var d=document.documentElement,p=location.pathname,i=localStorage.getItem('elinno.sidenav.initial'),a=document.getElementById('navUserAvatar');if(a&&i)a.textContent=i;if(d.classList.contains('sn-open-projects')){var s=document.querySelector('[data-sn-section="projects"]');if(s)s.setAttribute('aria-expanded','true');var b=document.querySelector('[data-sn-children="projects"]'),h=sessionStorage.getItem('elinno.sidenav.treeHtml');if(b&&h)b.innerHTML=h;}var m=p.match(/^\/(?:project|project_settings)\/([^\/]+)/),slug=m?decodeURIComponent(m[1]):null,rows=document.querySelectorAll('[data-sn-project]');for(var j=0;j<rows.length;j++){var on=slug!==null&&rows[j].getAttribute('data-sn-project')===slug;rows[j].classList.toggle('is-open',on);rows[j].setAttribute('aria-expanded',String(on));var g=rows[j].nextElementSibling;if(g&&g.classList.contains('sn-l3-group'))g.classList.toggle('is-open',on);}var c=document.querySelector('.side-nav__scroll'),y=sessionStorage.getItem('elinno.sidenav.scrollTop');if(c&&y)c.scrollTop=+y;}catch(e){}})();</script>

        +         '<i class="ti ti-menu-2" style="font-size:13px;color:var(--text-2);"></i>'
        +         '<span class="wn-mini__text" style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;">Elinno Agent</span>'
        +       '</div>'
        +       '<div style="padding:9px;"><span class="wn-mini__bar" style="display:block;width:80%;margin-bottom:6px;"></span><span class="wn-mini__bar" style="display:block;width:60%;"></span></div>'
        +     '</div>'
        +   '</div>'
        +   '<div style="flex:1;">'
        +     '<div class="wn-mini__eyebrow" style="margin-bottom:6px;">Open</div>'
        +     '<div class="wn-mini" style="padding:0;overflow:hidden;position:relative;">'
        +       '<div class="wn-mini--bar-row" style="gap:7px;padding:7px 9px;border-bottom:0.5px solid var(--border-soft);">'
        +         '<i class="ti ti-x" style="font-size:13px;color:var(--text-2);"></i>'
        +         '<span class="wn-mini__text" style="font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;">Elinno Agent</span>'
        +       '</div>'
        +       '<div style="position:relative;background:rgba(0,0,0,.22);">'
        +         '<div style="width:78%;background:var(--bg);padding:7px;">'
        +           '<div class="wn-mini__row" style="border:none;background:var(--brand-tint);padding:4px 6px;"><span class="wn-mini__text" style="color:var(--brand-strong);font-weight:600;">Dashboard</span></div>'
        +           '<div class="wn-mini__row" style="border:none;padding:4px 6px;"><span class="wn-mini__text">Projects</span></div>'
        +           '<div class="wn-mini__row" style="border:none;padding:4px 6px;margin-bottom:0;"><span class="wn-mini__text">Cross-project chats</span></div>'
        +         '</div>'
        +       '</div>'
        +     '</div>'
        +   '</div>'
        + '</div>',
      'sg-cross':
        '<div class="wn-mini">'
        + '<div class="wn-mini__eyebrow">Cross-project chat</div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag wn-mini__tag--grey">&middot;</span><span class="wn-mini__text">Which projects are at risk of missing their sprint?</span></div>'
        + '<div class="wn-mini__row"><span class="wn-mini__tag">New</span><span class="wn-mini__text">Compare velocity across <strong>Aurora and Beacon</strong> over the last three sprints.</span></div>'
        + '<div class="wn-mini__row" style="margin-bottom:0;"><span class="wn-mini__tag wn-mini__tag--grey">&middot;</span><span class="wn-mini__text">Across <strong>Aurora and Beacon</strong>, who is the busiest assignee right now?</span></div>'
        + '</div>'
    };

    function renderFeature(f) {
      const tagClass = TAG_CLASS[f.tag] || 'wn-tag--new';
      let html = '<div class="wn-feature">'
        + '<span class="pill ' + tagClass + '">' + esc(f.tag || 'New') + '</span>'
        + '<h2 class="wn-feature__title">' + esc(f.title) + '</h2>'
        + '<p class="wn-feature__body">' + esc(f.body) + '</p>';
      // Features carry a preview; fixes never do. Until the real screenshot
      // arrives the slot shows a schematic wireframe plus an explicit caption
      // saying so. The wireframe is abstract by design — grey bars, no product
      // copy — so it reads as a stand-in, not as a screenshot.
      if (f.image) {
        html += '<div class="wn-shot"><img src="' + esc(f.image) + '" alt="' + esc(f.alt || '') + '" /></div>';
      } else if (f.placeholder && PLACEHOLDER[f.placeholder]) {
        html += '<div class="wn-shot">' + PLACEHOLDER[f.placeholder] + '</div>';
      }
      return html + '</div>';
    }

    function renderIssueBody(entry) {
      let html = '';
      (entry.features || []).forEach(f => { html += renderFeature(f); });
      const fixes = entry.fixes || [];
      if (fixes.length) {
        html += '<p class="wn-fixes__head">Also fixed</p>';
        fixes.forEach(fix => {
          // fixes[] entries are { tag, text }; tag defaults to Fixed. Not every
          // line under "Also fixed" is a fix — small new behaviour belongs here
          // too, and would otherwise be mislabelled or forced into features[],
          // which would then owe a preview image it does not need.
          const tag = (fix && fix.tag) || 'Fixed';
          const text = fix && fix.text !== undefined ? fix.text : fix;
          html += '<div class="wn-fix"><i class="ti ti-check" aria-hidden="true"></i>'
            + '<span><span class="pill ' + (TAG_CLASS[tag] || 'wn-tag--fixed') + '">'
            + esc(tag) + '</span> ' + esc(text) + '</span></div>';
        });
      }
      return html;
    }

    function renderLatest(entry) {
      return '<section class="surface surface--lg wn-issue">'
        + '<div class="wn-issue__head">'
        + '<span class="wn-version">' + esc(entry.version) + '</span>'
        + '<span class="wn-date">' + esc(fmtWeekOf(entry.date)) + '</span>'
        + '<span class="pill wn-tag--improved">Latest</span>'
        + '</div>'
        // The headline also carries the collapsed rows and the dashboard
        // strip; here it introduces the issue before the first feature.
        + '<p class="wn-headline">' + esc(entry.headline) + '</p>'
        + renderIssueBody(entry)
        + '</section>';
    }

    // Earlier issues collapse to one row each, so the page can't grow an
    // unbounded scroll as issues accumulate. Expanding reveals the full
    // issue body in place.
    function renderPast(entry, idx) {
      return '<button class="wn-past" type="button" aria-expanded="false" aria-controls="wn-past-body-' + idx + '" data-idx="' + idx + '">'
        + '<span class="wn-past__version">' + esc(entry.version) + '</span>'
        + '<span class="wn-past__date">' + esc(fmtWeekOf(entry.date)) + '</span>'
        + '<span class="wn-past__headline">' + esc(entry.headline)
        + ' <i class="ti ti-chevron-down" aria-hidden="true" style="font-size:15px;"></i></span>'
        + '</button>'
        + '<section class="surface surface--lg wn-issue" id="wn-past-body-' + idx + '" hidden>'
        + renderIssueBody(entry)
        + '</section>';
    }

    function renderEmpty() {
      return '<section class="surface surface--lg wn-empty">'
        + 'Nothing published yet. Updates will appear here as they ship.'
        + '</section>';
    }

    function render() {
      const all = Array.isArray(window.WHATS_NEW) ? window.WHATS_NEW : [];
      const published = all.filter(e => e && e.status === 'published');
      const root = $('#wnRoot');

      if (!published.length) {
        root.innerHTML = renderEmpty();
        return;
      }

      let html = renderLatest(published[0]);
      published.slice(1).forEach((entry, i) => { html += renderPast(entry, i + 1); });
      root.innerHTML = html;

      // Attached ONCE, not on every render. The listener used to be bound
      // here inside render(); a second render would bind a second copy to
      // the same #wnRoot, and every click would then toggle open and shut
      // again in one go — the row would look dead. render() is called once
      // today so this was latent, not live, but it is a trap worth closing.
      if (!root.dataset.wnBound) {
        root.dataset.wnBound = '1';
        root.addEventListener('click', onArchiveClick);
      }
    }

    function onArchiveClick(e) {
      const btn = e.target.closest('.wn-past');
      if (!btn) return;
      const body = $('#wn-past-body-' + btn.getAttribute('data-idx'));
      if (!body) return;
      const open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      body.hidden = open;
      const chevron = $('.ti-chevron-down, .ti-chevron-up', btn);
      if (chevron) {
        chevron.classList.toggle('ti-chevron-down', open);
        chevron.classList.toggle('ti-chevron-up', !open);
      }

      // Archive rows sit at the BOTTOM of the page, so an entry opens into
      // space that is off-screen: measured on the preview, 80px of 622px
      // were visible — 13%. The row toggled correctly and looked broken,
      // which is exactly how it was reported ("previous version can't
      // expand"). Bring the newly revealed content into view when opening,
      // and only when it is actually short of the fold.
      // setTimeout, NOT requestAnimationFrame: rAF does not fire in a
      // backgrounded tab, so a page opened in a background tab and switched
      // to later would never run this at all. Third time this has bitten in
      // this block — the rail's scroll-persistence save had the same flaw.
      if (open) return;                       // collapsing needs no scroll
      setTimeout(() => {
        const r = body.getBoundingClientRect();
        const shortfall = r.bottom - window.innerHeight;
        if (shortfall <= 0) return;           // already fully visible
        const btnTop = btn.getBoundingClientRect().top + window.scrollY;
        // Put the row near the top so the entry below it has room, but never
        // scroll further than the document allows.
        const target = Math.min(btnTop - 16, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
      }, 0);
    }

    function start() {
      // Auth gate — same pattern as admin.html. /api/me returns
      // { user: null } when unauthenticated.
      fetch('/api/me').then(r => r.json()).then(d => {
        if (!d.user) { gotoLogin(); return; }
        const av = $('#navUserAvatar');
        av.textContent = initial(d.user.display_name || d.user.email);
        av.title = d.user.display_name ? d.user.display_name + ' · ' + d.user.email : d.user.email;
        if (d.user.is_admin) $('#adminLink').style.display = '';
        render();
      }).catch(() => gotoLogin());

      $('#logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' }).catch(() => {});
        location.replace('/');
      });
    }

    // This block is inline, so it runs DURING parsing — before the deferred
    // whats-new-data.js has set window.WHATS_NEW. Deferred scripts all run
    // before DOMContentLoaded, so waiting for it is what guarantees the data
    // is there. Without this, render() reads an undefined list and falls
    // through to the empty state.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
