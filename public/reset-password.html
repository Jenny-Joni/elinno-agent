<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/_lib/no-zoom.js" defer></script>
  <title>Set new password — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-08-10-1" />
  <style>
    body { background: var(--bg-subtle); margin: 0; }
    .auth-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(60% 50% at 20% 10%, rgba(98, 52, 252, 0.10), transparent 60%),
        radial-gradient(60% 50% at 90% 90%, rgba(98, 52, 252, 0.08), transparent 60%),
        linear-gradient(180deg, #fcfcfd 0%, #f7f5ff 100%);
    }
    .auth-card-v14 {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 36px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(98, 52, 252, 0.06);
    }
    .auth-brand { display: flex; align-items: center; gap: 9px; margin-bottom: 24px; }
    .auth-card-v14 h1 {
      font-family: var(--font);
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 8px;
      letter-spacing: -0.005em;
    }
    .auth-card-v14 p.lead {
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.5;
      margin: 0 0 20px;
    }
    .auth-msg {
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 13px;
      border-radius: var(--r-sm);
      display: none;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .auth-msg.show { display: block; }
    .auth-msg.error { background: rgba(179,20,75,0.06); color: var(--danger); }
    .auth-msg.success { background: var(--success-tint); color: var(--success); }
    .auth-foot-v14 {
      margin-top: 16px;
      text-align: center;
      font-family: var(--font);
      font-size: 12px;
    }
    .auth-foot-v14 a { color: var(--brand); text-decoration: none; font-weight: 500; }
    .auth-foot-v14 a:hover { text-decoration: underline; }
    .match-hint {
      font-family: var(--font);
      font-size: 11px;
      margin-top: 4px;
      min-height: 14px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .match-hint.match { color: var(--success); }
    .match-hint.mismatch { color: var(--danger); }
    @media (max-width: 480px) {
      .auth-card-v14 { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card-v14">
      <div class="auth-brand">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:14px;">Elinno&nbsp;Agent</span>
      </div>
      <h1>Set new password</h1>
      <p class="lead">Choose a new password to finish resetting your account.</p>

      <div id="msg" class="auth-msg" role="status"></div>

      <form id="resetForm" novalidate>
        <div class="password-field" data-password-field style="margin-bottom:14px;">
          <div class="password-field__label-row">
            <label class="password-field__label" for="password">New password</label>
          </div>
          <div class="password-field__input-wrap">
            <input id="password" class="password-field__input" type="password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password" />
            <button type="button" class="password-field__eye" data-pw-eye aria-label="Show password">
              <i class="ti ti-eye"></i>
            </button>
          </div>
          <div class="password-field__hint">At least 8 characters.</div>
        </div>

        <div class="password-field" data-password-field style="margin-bottom:6px;">
          <div class="password-field__label-row">
            <label class="password-field__label" for="confirm">Confirm new password</label>
          </div>
          <div class="password-field__input-wrap">
            <input id="confirm" class="password-field__input" type="password" placeholder="Re-enter the new password" minlength="8" required autocomplete="new-password" />
            <button type="button" class="password-field__eye" data-pw-eye aria-label="Show password">
              <i class="ti ti-eye"></i>
            </button>
          </div>
          <div id="matchHint" class="match-hint"></div>
        </div>

        <button id="submitBtn" type="submit" class="btn btn--primary" style="width:100%;justify-content:center;margin-top:14px;">Update password</button>
      </form>

      <div class="auth-foot-v14">
        <a href="/">← Back to sign in</a>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const pw1 = document.getElementById('password');
    const pw2 = document.getElementById('confirm');
    const hint = document.getElementById('matchHint');

    function showMsg(text, kind) { msg.textContent = text; msg.className = 'auth-msg show ' + (kind || ''); }
    function hideMsg() { msg.className = 'auth-msg'; }

    if (!token) {
      showMsg('This reset link is missing or invalid. Request a new one.', 'error');
      btn.disabled = true;
    }

    // Password-field eye toggle (mirrors components.html + admin.html behavior).
    document.querySelectorAll('[data-pw-eye]').forEach(eye => {
      eye.addEventListener('click', () => {
        const input = eye.parentElement.querySelector('input');
        if (!input) return;
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        eye.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
        const icon = eye.querySelector('i');
        if (icon) icon.className = showing ? 'ti ti-eye' : 'ti ti-eye-off';
      });
    });

    // Live "Passwords match" check.
    function syncMatch() {
      const a = pw1.value;
      const b = pw2.value;
      if (!a || !b) { hint.textContent = ''; hint.className = 'match-hint'; return; }
      if (a === b) { hint.innerHTML = '<i class="ti ti-check"></i> Passwords match'; hint.className = 'match-hint match'; }
      else { hint.innerHTML = '<i class="ti ti-x"></i> Passwords don\'t match'; hint.className = 'match-hint mismatch'; }
    }
    pw1.addEventListener('input', syncMatch);
    pw2.addEventListener('input', syncMatch);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      const a = pw1.value;
      const b = pw2.value;
      if (a.length < 8) return showMsg('Password must be at least 8 characters.', 'error');
      if (a !== b) return showMsg('Passwords do not match.', 'error');

      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Updating…';
      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: a }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showMsg(data.error || 'Reset failed. The link may have expired — request a new one.', 'error');
          btn.disabled = false;
          btn.textContent = original;
          return;
        }
        showMsg('Password updated. Redirecting to sign-in…', 'success');
        setTimeout(() => location.replace('/'), 1500);
      } catch {
        showMsg('Network error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = original;
      }
    });
  })();
  </script>
</body>
</html>
