           months have none, so they stay one hue -- inventing colours there
           would encode nothing and re-say the bar length. */
        var drill = !!dim.drillBy;
        var fill = dim.key === 'project' ? (PROJECT_COLOR[d.name] || 'var(--fin-other)') : '';
        return '<div class="fin-drill">' +
          '<div class="fin-bar' + (drill ? ' fin-bar--drill' : '') + '" data-i="' + i + '"' +
            (drill ? ' data-drill="' + esc(d.name) + '" role="button" tabindex="0" aria-expanded="false"' : '') + '>' +
          '<div class="fin-bar__name' + (d.name === BLANK ? ' is-blank' : '') + '" title="' + esc(d.name) + '">' + esc(d.name) + '</div>' +
          '<div class="fin-bar__track"><div class="fin-bar__fill" style="width:' + (d.total / max * 100).toFixed(2) + '%' +
            (fill ? ';background:' + fill : '') + '"></div></div>' +
          '<div class="fin-bar__val">' + esc(money0(d.total)) + ' <span class="fin-bar__pct">' + esc(pct(d.total, total)) + '</span></div>' +
          (drill ? '<i class="fin-bar__chev ti ti-chevron-right" aria-hidden="true"></i>' : '') +
          '</div>' +
          (drill ? drillHtml(rows, dim, d.name, fill || 'var(--fin-c1)') : '') +
          '</div>';
      }).join('') + '</div>' +
      (over
        ? '<button class="fin-more" type="button" data-more="' + dim.id + '">' +
            (state.expanded[dim.id] ? 'Show top ' + LIMIT : 'Show all ' + all.length) + '</button>'
        : '');

      /* Project bars carry no tooltip: the name, amount and share are already
         on the row, and the drill-down answers anything further. Vendor rows
         carry what the row cannot -- what the vendor IS -- wherever the name
         appears: this card, the project card's drill, and both tables. */
      if (dim.key === 'vendor') {
        host.querySelectorAll('.fin-bar').forEach(function (el) {
          bindTip(el, vendorTipHtml(rows, shown[+el.getAttribute('data-i')].name));
        });
      }
      if (dim.drillBy === 'vendor') {
        host.querySelectorAll('[data-child]').forEach(function (el) {
          bindTip(el, vendorTipHtml(rows, el.querySelector('.fin-drill__rowname').getAttribute('title')));
        });
      }

      /* One project open at a time: several expanded splits stacked in one
         card stop being a comparison and start being a list. */
      host.querySelectorAll('[data-drill]').forEach(function (el) {
        function toggle() { holdScroll(el, function () {
          var open = el.getAttribute('aria-expanded') !== 'true';
          host.querySelectorAll('[data-drill]').forEach(function (o) {
            var on = o === el && open;
            o.setAttribute('aria-expanded', String(on));
            o.classList.toggle('is-open', on);
            o.nextElementSibling.classList.toggle('is-open', on);
          });
          state.drill[dim.id] = open ? el.getAttribute('data-drill') : null;
        }); }
        el.addEventListener('click', toggle);
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        /* Survive a re-render: filters redraw the card, and an open row that
           still exists in the new slice stays open. */
        if (state.drill[dim.id] === el.getAttribute('data-drill')) {
          el.setAttribute('aria-expanded', 'true');
          el.classList.add('is-open');
          el.nextElementSibling.classList.add('is-open');
        }
      });

      /* Level 3: one child's owner split. Same one-open-at-a-time rule and
         the same class-toggle-not-re-render approach as the level above. */
      host.querySelectorAll('[data-child]').forEach(function (el) {
        function toggle() { holdScroll(el, function () {
          var open = el.getAttribute('aria-expanded') !== 'true';
          host.querySelectorAll('[data-child]').forEach(function (o) {
            var on = o === el && open;
            o.setAttribute('aria-expanded', String(on));
            o.classList.toggle('is-open', on);
            o.nextElementSibling.classList.toggle('is-open', on);
          });
          state.child[dim.id] = open ? el.getAttribute('data-child') : null;
        }); }
        el.addEventListener('click', toggle);
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        if (state.child[dim.id] === el.getAttribute('data-child')) {
          el.setAttribute('aria-expanded', 'true');
          el.classList.add('is-open');
          el.nextElementSibling.classList.add('is-open');
        }
      });

      /* Level 4: one owner's individual charges, oldest first. */
      host.querySelectorAll('[data-owner]').forEach(function (el) {
        function toggle() { holdScroll(el, function () {
          var open = el.getAttribute('aria-expanded') !== 'true';
          host.querySelectorAll('[data-owner]').forEach(function (o) {
            var on = o === el && open;
            o.setAttribute('aria-expanded', String(on));
            o.classList.toggle('is-open', on);
            o.nextElementSibling.classList.toggle('is-open', on);
          });
          state.owner[dim.id] = open ? el.getAttribute('data-owner') : null;
        }); }
        el.addEventListener('click', toggle);
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        if (state.owner[dim.id] === el.getAttribute('data-owner')) {
          el.setAttribute('aria-expanded', 'true');
          el.classList.add('is-open');
          el.nextElementSibling.classList.add('is-open');
        }
      });

      var more = host.querySelector('[data-more]');
      if (more) {
        more.addEventListener('click', function () {
          state.expanded[dim.id] = !state.expanded[dim.id];
          renderBreakdown(filtered(), dim);
        });
      }

      renderBreakdownTable(all, rows, total, dim, tblHost);
    }

    function renderBreakdownTable(all, rows, total, dim, tblHost) {
      /* Mirrors the chart tree exactly, and shares its state -- expand a row
         here and it is expanded when you switch back to Chart. */
      function cells(name, n, amount, share, cls, chev, blank) {
        return '<td class="' + (cls || '') + (blank ? ' is-blank' : '') + '">' +
                 (chev ? '<i class="fin-tchev ti ti-chevron-right" aria-hidden="true"></i>' : '') + esc(name) + '</td>' +
               '<td class="is-num">' + (n === null ? '' : n) + '</td>' +
               '<td class="is-num">' + esc(amount) + '</td>' +
               '<td class="is-num">' + (share === null ? '' : esc(share)) + '</td>';
      }

      /* Same LIMIT and the same state key as the chart view, so the two
         cannot disagree about how much of the list is showing. Only the top
         level is capped -- an expanded row shows all of its children. */
      var over = all.length > LIMIT;
      var top = (over && !state.expanded[dim.id]) ? all.slice(0, LIMIT) : all;

      var body = top.map(function (d) {
        var open = dim.drillBy && state.drill[dim.id] === d.name;
        var html = '<tr class="fin-trow' + (dim.drillBy ? ' fin-trow--open' : '') + (open ? ' is-open' : '') + '"' +
          (dim.drillBy ? ' data-tdrill="' + esc(d.name) + '" role="button" tabindex="0" aria-expanded="' + open + '"' : '') + '>' +
          /* A `(partial)` suffix sat here on an unreachable branch; the
             partial-month concept is gone entirely as of 2026-08-24. */
          cells(d.name, d.n, money(d.total), pct(d.total, total),
                'is-strong', !!dim.drillBy, d.name === BLANK) + '</tr>';
        if (!dim.drillBy) return html;

        var mine = rows.filter(function (r) { return val(r, dim.key) === d.name; });
        groupBy(mine, { key: dim.drillBy }).forEach(function (c) {
          var ckey = dim.id + KEYSEP + d.name + KEYSEP + c.name;
          var copen = state.child[dim.id] === ckey;
          html += '<tr class="fin-trow fin-trow--l2 fin-trow--open' + (copen ? ' is-open' : '') + '"' +
            ' data-tchild="' + esc(ckey) + '" role="button" tabindex="0" aria-expanded="' + copen + '"' +
            (open ? '' : ' hidden') + '>' +
            cells(c.name, c.n, money(c.total), pct(c.total, d.total), '', true, c.name === BLANK) + '</tr>';

          var theirs = mine.filter(function (r) { return val(r, dim.drillBy) === c.name; });
          groupBy(theirs, { key: 'accountOwner' }).forEach(function (o) {
            var okey = ckey + KEYSEP + o.name;
            var oopen = state.owner[dim.id] === okey;
            html += '<tr class="fin-trow fin-trow--l3 fin-trow--open' + (oopen ? ' is-open' : '') + '"' +
              ' data-towner="' + esc(okey) + '" role="button" tabindex="0" aria-expanded="' + oopen + '"' +
              (open && copen ? '' : ' hidden') + '>' +
              cells(o.name, o.n, money(o.total), pct(o.total, c.total), '', true, o.name === BLANK) + '</tr>';

            theirs.filter(function (r) { return val(r, 'accountOwner') === o.name; })
              .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; })
              .forEach(function (t) {
                html += '<tr class="fin-trow fin-trow--l4" data-tof="' + esc(okey) + '"' +
                  (open && copen && oopen ? '' : ' hidden') + '>' +
                  cells(dmy(t.date), null, money(t.amount), null, '', false, false) + '</tr>';
              });
          });
        });
        return html;
      }).join('');

      tblHost.innerHTML = '<div class="fin-tbl-wrap"><table class="fin-tbl"><thead><tr><th>' + esc(dim.label) +
        '</th><th class="is-num">Payments</th><th class="is-num">Amount</th><th class="is-num">Share</th></tr></thead><tbody>' +
        body + '</tbody><tfoot class="fin-tbl__foot"><tr><td>Total</td><td class="is-num">' + rows.length +
        '</td><td class="is-num">' + esc(money(total)) + '</td><td class="is-num">100%</td></tr></tfoot></table></div>' +
        (over
          ? '<button class="fin-more" type="button" data-tmore="' + esc(dim.id) + '">' +
              (state.expanded[dim.id] ? 'Show top ' + LIMIT : 'Show all ' + all.length) + '</button>'
          : '');

      /* The footer total stays the total of the whole slice, not of the rows on
         screen -- a "Total" that changed when you paged the list would be a
         different number every time you looked at it. */
      var more = tblHost.querySelector('[data-tmore]');
      if (more) {
        more.addEventListener('click', function () {
          state.expanded[dim.id] = !state.expanded[dim.id];
          renderBreakdown(filtered(), dim);
        });
      }

      /* Same tooltip on the table rows that name a vendor. The title
         attribute holds the unescaped name; the cell text may be truncated. */
      if (dim.key === 'vendor') {
        tblHost.querySelectorAll('[data-tdrill]').forEach(function (r) {
          bindTip(r, vendorTipHtml(rows, r.getAttribute('data-tdrill')));
        });
      }
      if (dim.drillBy === 'vendor') {
        tblHost.querySelectorAll('[data-tchild]').forEach(function (r) {
          var parts = r.getAttribute('data-tchild').split(KEYSEP);
          bindTip(r, vendorTipHtml(rows, parts[parts.length - 1]));
        });
      }

      if (dim.drillBy) wireTableTree(tblHost, dim);
    }

    /* Visibility is recomputed from the three open keys rather than toggled
       row by row -- with four levels interleaved in one <tbody>, walking
       siblings to find "the rows that belong to this one" is where this goes
       wrong. Each row already knows its own key. */
    function wireTableTree(tblHost, dim) {
      function apply() {
        var p = state.drill[dim.id], c = state.child[dim.id], o = state.owner[dim.id];
        tblHost.querySelectorAll('[data-tdrill]').forEach(function (r) {
          var on = r.getAttribute('data-tdrill') === p;
          r.classList.toggle('is-open', on); r.setAttribute('aria-expanded', String(on));
        });
        tblHost.querySelectorAll('[data-tchild]').forEach(function (r) {
          var k = r.getAttribute('data-tchild');
          r.hidden = k.split(KEYSEP)[1] !== p;
          var on = k === c;
          r.classList.toggle('is-open', on); r.setAttribute('aria-expanded', String(on));
        });
        tblHost.querySelectorAll('[data-towner]').forEach(function (r) {
          var k = r.getAttribute('data-towner');
          r.hidden = !(k.split(KEYSEP)[1] === p && k.slice(0, k.lastIndexOf(KEYSEP)) === c);
          var on = k === o;
          r.classList.toggle('is-open', on); r.setAttribute('aria-expanded', String(on));
        });
        tblHost.querySelectorAll('[data-tof]').forEach(function (r) {
          r.hidden = r.getAttribute('data-tof') !== o;
        });
      }
      function bind(sel, set) {
        tblHost.querySelectorAll(sel).forEach(function (r) {
          function toggle() { holdScroll(r, function () { set(r); apply(); }); }
          r.addEventListener('click', toggle);
          r.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
          });
        });
      }
      bind('[data-tdrill]', function (r) {
        var k = r.getAttribute('data-tdrill');
        var open = state.drill[dim.id] !== k;
        state.drill[dim.id] = open ? k : null;
        if (!open) { state.child[dim.id] = null; state.owner[dim.id] = null; }
      });
      bind('[data-tchild]', function (r) {
        var k = r.getAttribute('data-tchild');
        var open = state.child[dim.id] !== k;
        state.child[dim.id] = open ? k : null;
        if (!open) state.owner[dim.id] = null;
      });
      bind('[data-towner]', function (r) {
        var k = r.getAttribute('data-towner');
        state.owner[dim.id] = state.owner[dim.id] !== k ? k : null;
      });
      tblHost._applyTree = apply;
      apply();
    }

    /* ---- month comparison ----------------------------------------------
       One project and one vendor at a time, compared across months. The
       month dimension used to be a third breakdown card; as a breakdown it
       only ever said "August is bigger", which the filter row could already
       tell you. Choosing the pair is what makes the months worth comparing. */

    /* A native <select> puts its popup where the OS wants it -- over the
       control, with the current row under the pointer. Beside the Projects
       menu, which opens below its trigger, the two behaved differently for
       no reason a reader could see. Same components, single-select
       semantics: click a row and it picks and closes. */
    function renderPace(rows) {
      var host = document.getElementById('bd-pace-chart');

      var pset = state.sel['pace-project'];
      var vset = state.sel['pace-vendor'];
      var base = rows.filter(function (r) { return !pset || pset.has(val(r, 'project')); });
      /* Drop a bar selection whose month is no longer in range. */
      if (state.paceBar && !base.some(function (r) { return bucketKeyOf(r) === state.paceBar.month; })) {
        state.paceBar = null;
      }
      var sel = base.filter(function (r) { return vset && vset.has(val(r, 'vendor')); });

      function setLabel(set, key, noun) {
        var all = ORDER[key] ? ORDER[key].length : 0;
        if (!set || set.size === 0) return 'no ' + noun + ' yet';
        if (set.size === all) return 'All ' + noun;
        if (set.size === 1) return Array.from(set)[0];
        return set.size + ' ' + noun;
      }
      var label = setLabel(pset, 'pace-project', 'projects') + ' \u00b7 ' +
                  setLabel(vset, 'pace-vendor', 'vendors');
      if (!sel.length) {
        /* Same scaffold as a populated card -- plot box, legend row, delta
           box. An empty state that is 135px shorter shrinks the document,
           and at the bottom of the page there is no scroll range left to
           hold anything still with. */
        /* Both pickers start empty, so say which one is still waiting rather
           than "no payments", which would read as "there is no data". */
        var msg = (!pset || pset.size === 0) ? 'Choose projects to chart.'
                : (!vset || vset.size === 0) ? 'Choose vendors to chart.'
                : 'No payments for ' + label + ' in this slice.';
        host.innerHTML = '<p class="fin-empty">' + esc(msg) + '</p>' +
          '<div class="fin-legend" style="margin-top:12px">' +
            '<span class="fin-legend__item" style="visibility:hidden">' +
              '<span class="fin-legend__dot"></span>placeholder</span>' +
          '</div>';
        return;
      }
      /* More than one project gets a bar each, however many. The old rule
         collapsed anything past five (and "all projects") into one combined
         bar on the grounds that thin bars stop being comparable; Jenny's call
         on 2026-08-24 is that a bar per project matters more. */
      var chosen = pset ? Array.from(pset) : [];
      if (chosen.length >= 2) {
        var order = chosen.map(function (n) {
          return { n: n, t: sum(sel.filter(function (r) { return val(r, 'project') === n; })) };
        }).sort(function (a, b) { return b.t - a.t; }).map(function (x) { return x.n; });
        return paceGrouped(sel, host, order);
      }
      return paceByMonth(sel, label, host);
    }

    /* The payments behind one bar, as the same tree the project card uses:
       vendor -> account owner -> individual charges, oldest first.

       The vendor level is skipped when the card's vendor picker already
       names one -- a tree whose every branch is the same single value is a
       row you have to click through to learn nothing. */
    function paceOwnerBlock(rows, parentTotal, keyPrefix, colour) {
      return groupBy(rows, { key: 'accountOwner' }).map(function (o) {
        var his = rows.filter(function (r) { return val(r, 'accountOwner') === o.name; })
                      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        var okey = keyPrefix + KEYSEP + o.name;
        var oopen = state.paceOwner === okey;
        return '<div class="fin-own">' +
          '<div class="fin-ownrow' + (oopen ? ' is-open' : '') + '" role="button" tabindex="0"' +
            ' aria-expanded="' + oopen + '" data-powner="' + esc(okey) + '">' +
            '<span class="fin-ownrow__name' + (o.name === BLANK ? ' is-blank' : '') + '" title="' + esc(o.name) + '">' + esc(o.name) + '</span>' +
            '<span class="fin-ownrow__track"><span class="fin-ownrow__fill" style="display:block;width:' +
              (parentTotal ? o.total / parentTotal * 100 : 0).toFixed(2) + '%;background:' + colour + '"></span></span>' +
            '<span class="fin-ownrow__amt">' + esc(money(o.total)) +
              ' <span class="fin-ownrow__n">\u00d7' + o.n + '</span></span>' +
            '<i class="fin-ownrow__chev ti ti-chevron-right" aria-hidden="true"></i>' +
          '</div>' +
          '<div class="fin-opanel' + (oopen ? ' is-open' : '') + '"><div class="fin-opanel__inner"><div class="fin-opanel__pad">' +
            his.map(function (t) {
              return '<div class="fin-txn"><span class="fin-txn__date">' + esc(dmy(t.date)) + '</span>' +
                '<span></span><span class="fin-txn__amt">' + esc(money(t.amount)) + '</span><span></span></div>';
            }).join('') +
          '</div></div></div></div>';
      }).join('');
    }

    function paceDetailHtml(sel, bar) {
      var rows = sel.filter(function (r) {
        if (bucketKeyOf(r) !== bar.month) return false;
        if (bar.project && val(r, 'project') !== bar.project) return false;
        return true;
      });
      if (!rows.length) return '';

      var subtotal = sum(rows);
      var colour = bar.project ? (PROJECT_COLOR[bar.project] || 'var(--fin-other)') : 'var(--fin-c1)';
      var prefix = bar.month + KEYSEP + (bar.project || '');
      /* The vendor level is skipped only when exactly ONE vendor is selected,
         because then every payment shares it and a one-row vendor tier is
         noise. With several selected the tier carries information again. */
      var vsetD = state.sel['pace-vendor'];
      var oneVendor = vsetD && vsetD.size === 1 ? Array.from(vsetD)[0] : '';
      var title = monthLabel(bar.month) + (bar.project ? ' \u00b7 ' + bar.project : '') +
                  (oneVendor ? ' \u00b7 ' + oneVendor : '');
      var body, count;

      if (oneVendor) {
        /* One vendor already: owners are the top level. */
        body = paceOwnerBlock(rows, subtotal, prefix, colour);
        count = '';
      } else {
        var vendors = groupBy(rows, { key: 'vendor' });
        count = vendors.length + ' vendor' + (vendors.length === 1 ? '' : 's') + ' \u00b7 ';
        body = vendors.map(function (v) {
          var mine = rows.filter(function (r) { return val(r, 'vendor') === v.name; });
          var vkey = prefix + KEYSEP + v.name;
          var vopen = state.paceChild === vkey;
          return '<div class="fin-vend">' +
            '<div class="fin-drill__row fin-drill__row--open' + (vopen ? ' is-open' : '') + '"' +
              ' role="button" tabindex="0" aria-expanded="' + vopen + '" data-pchild="' + esc(vkey) + '">' +
              '<div class="fin-drill__rowname' + (v.name === BLANK ? ' is-blank' : '') + '" title="' + esc(v.name) + '">' + esc(v.name) + '</div>' +
              '<div class="fin-drill__rowtrack"><div class="fin-drill__rowfill" style="width:' +
                (subtotal ? v.total / subtotal * 100 : 0).toFixed(2) + '%;background:' + colour + '"></div></div>' +
              '<div class="fin-drill__rowval">' + esc(money0(v.total)) +
                ' <span class="fin-drill__rowpct">' + esc(pct(v.total, subtotal)) + '</span></div>' +
              '<i class="fin-drill__rowchev ti ti-chevron-right" aria-hidden="true"></i>' +
            '</div>' +
            '<div class="fin-txns' + (vopen ? ' is-open' : '') + '"><div class="fin-txns__inner"><div class="fin-txns__pad">' +
              '<div class="fin-txn fin-txn__head"><span class="fin-txn__date">Account owner</span><span></span>' +
                '<span style="text-align:right">Amount</span><span></span></div>' +
              paceOwnerBlock(mine, v.total, vkey, colour) +
            '</div></div></div>' +
            '</div>';
        }).join('');
      }

      return '<div class="fin-pace__detail">' +
        '<p class="fin-pace__detailhead"><strong>' + esc(title) + '</strong>' +
          '<span>' + count + rows.length + ' payment' + (rows.length === 1 ? '' : 's') + ' \u00b7 ' +
          esc(money(subtotal)) + '</span>' +
          '<button class="fin-pace__close" type="button" data-pace-close>Close</button></p>' +
        '<div class="fin-pace__detailbody">' + body + '</div></div>';
    }

    /* One bar open at a time. Clicking the open one closes it. */
    function wirePaceBars(host, sel) {
      host.querySelectorAll('[data-bar]').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          var month = el.getAttribute('data-bar');
          var project = el.getAttribute('data-p') || null;
          var same = state.paceBar && state.paceBar.month === month && state.paceBar.project === project;
          state.paceBar = same ? null : { month: month, project: project };
          state.paceChild = null; state.paceOwner = null;   /* a new bar opens closed */
          /* No anchor: this element is inside the host about to be replaced,
             and a detached node measures as zero -- the correction would then
             chase a rectangle at the top of the document. repaintPace falls
             back to the card's own picker, which survives the re-render. */
          repaintPace();
        });
      });
      var close = host.querySelector('[data-pace-close]');
      if (close) {
        close.addEventListener('click', function () {
          state.paceBar = null; state.paceChild = null; state.paceOwner = null;
          repaintPace();
        });
      }
    }

    /* One vendor and one owner open at a time, toggled in place. The panels
       are already in the DOM, so they animate; re-rendering would hand the
       browser a new element at its final height with nothing to travel. */
    function wirePaceTree(host) {
      function bind(sel, read, write) {
        host.querySelectorAll(sel).forEach(function (el) {
          function toggle() {
            holdScroll(el, function () {
              var key = el.getAttribute(read);
              var open = write(key);
              host.querySelectorAll(sel).forEach(function (o) {
                var on = o === el && open;
                o.classList.toggle('is-open', on);
                o.setAttribute('aria-expanded', String(on));
                o.nextElementSibling.classList.toggle('is-open', on);
              });
            });
          }
          el.addEventListener('click', function (e) { e.stopPropagation(); toggle(); });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); }
          });
        });
      }
      bind('[data-pchild]', 'data-pchild', function (k) {
        var open = state.paceChild !== k;
        state.paceChild = open ? k : null;
        if (!open) state.paceOwner = null;
        return open;
      });
      bind('[data-powner]', 'data-powner', function (k) {
        var open = state.paceOwner !== k;
        state.paceOwner = open ? k : null;
        return open;
      });
    }

    /* Two to five projects: a bar each, inside every month. Colours are the
       spreadsheet's project colours, so a project reads the same here as on
       the breakdown card. */
    function paceGrouped(sel, host, names) {
      var ms = groupBy(sel, { key: 'month', ordered: true });
      var total = sum(sel);
      var byMonth = {};
      ms.forEach(function (m) { byMonth[m.sortKey] = {}; });
      sel.forEach(function (r) {
        var k = bucketKeyOf(r), p = val(r, 'project');
        byMonth[k][p] = (byMonth[k][p] || 0) + r.amount;
      });
      var max = niceMax(Math.max.apply(null, ms.map(function (m) {
        return Math.max.apply(null, names.map(function (n) { return byMonth[m.sortKey][n] || 0; }));
      })));

      var grid = '';
      for (var g = 4; g >= 0; g--) {
        grid += '<div class="fin-gridline" style="top:' + ((4 - g) * 25) + '%"><span>' + tickLabel(max * g / 4) + '</span></div>';
      }
      var cols = ms.map(function (m, i) {
        return '<div class="fin-col" data-i="' + i + '"><div class="fin-colgroup">' +
          names.map(function (n) {
            var v = byMonth[m.sortKey][n] || 0;
            return '<div data-p="' + esc(n) + '" data-bar="' + esc(m.sortKey) + '" style="height:' +
                   (max ? v / max * 100 : 0).toFixed(2) +
                   '%;background:' + (PROJECT_COLOR[n] || 'var(--fin-other)') + '"></div>';
          }).join('') + '</div></div>';
      }).join('');
      var axis = ms.map(function (m) { return '<span>' + esc(m.name) + '</span>'; }).join('');

      host.innerHTML = '<div class="fin-cols"><div class="fin-cols__plot">' + grid + cols +
        '</div><div class="fin-cols__axis">' + axis + '</div></div>' +
        '<div class="fin-legend" style="margin-top:12px">' +
          names.map(function (n) {
            var t = sum(sel.filter(function (r) { return val(r, 'project') === n; }));
            return '<span class="fin-legend__item"><span class="fin-legend__dot" style="background:' +
              (PROJECT_COLOR[n] || 'var(--fin-other)') + '"></span>' + esc(n) +
              ' <span class="fin-legend__val">' + esc(money0(t)) + '</span></span>';
          }).join('') +
        '</div>' +
        (state.paceBar ? paceDetailHtml(sel, state.paceBar) : '');
      wirePaceBars(host, sel);
      wirePaceTree(host);

    }

    /* ---- spend pace: one column per month --------------------------------
       Columns, not a cumulative area: a bar per month answers "how much did
       that month cost" directly, where a running total only ever climbs and
       makes every month look like an increase. The running total is still
       the table's last column. */
    function paceByMonth(sel, label, host) {
      var ms = groupBy(sel, { key: 'month', ordered: true });
      var total = sum(sel);
      var max = niceMax(Math.max.apply(null, ms.map(function (m) { return m.total; })));

      /* One project selected: use its own colour, the same one it carries on
         the by PROJECT card and in the grouped view, so a project reads the
         same everywhere. Anything else stays the neutral series colour —
         combined bars are not "a project". */
      var pset = state.sel['pace-project'];
      var only = pset && pset.size === 1 ? Array.from(pset)[0] : '';
      var colour = only ? (PROJECT_COLOR[only] || 'var(--fin-other)') : 'var(--fin-c1)';

      host.innerHTML = columnsHtml(ms, max, total, colour) +
        '<div class="fin-legend" style="margin-top:12px">' +
          '<span class="fin-legend__item"><span class="fin-legend__dot" style="background:' + colour + '"></span>' +
            esc(label) + ' <span class="fin-legend__val">' + esc(money0(total)) + '</span></span>' +
        '</div>' +
        (state.paceBar ? paceDetailHtml(sel, state.paceBar) : '');
      wirePaceBars(host, sel);
      wirePaceTree(host);

      var runT = 0;
    }

    /* ---- render --------------------------------------------------------- */
    function render() {
      var rows = filtered();
      DIMENSIONS.forEach(function (d) { renderBreakdown(rows, d); });
      renderPace(rows);
    }

    /* ---- tabs, and the rail children that mirror them ------------------
       The three sources are one page, so the tab is a query param and the
       rail children point at it — the same ?tab= convention the project
       rows already use. */
    var TABS = ['reap', 'fiat', 'crypto'];
    var root = document.documentElement;

    function setTab(name, syncUrl) {
      if (TABS.indexOf(name) < 0) name = 'reap';
      var label = name.charAt(0).toUpperCase() + name.slice(1);
      TABS.forEach(function (t) {
        var btn = document.getElementById('tab-' + t);
        var on = t === name;
        btn.setAttribute('aria-selected', String(on));
        btn.tabIndex = on ? 0 : -1;
      });
      /* One panel serves all three tabs (L1), so rather than hiding two of
         them its label follows the selected tab and its heading is
         rewritten. */
      document.getElementById('panel-finance').setAttribute('aria-labelledby', 'tab-' + name);
      titleEl.textContent = label;
      document.querySelectorAll('[data-fin-tab]').forEach(function (a) {
        var on = a.getAttribute('data-fin-tab') === name;
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
        a.parentNode.classList.toggle('is-current', on);
      });
      document.title = label + ' — Finance — Elinno Agent';
      if (syncUrl) history.replaceState(null, '', '?tab=' + name);
      loadDataset(name);
    }

    var tabStrip = document.querySelector('.fin-tabs');
    tabStrip.addEventListener('click', function (e) {
      var b = e.target.closest('.fin-tab');
      /* Clicking the tab you are already on is a no-op, not a reload. setTab
         resets the filters for the dataset it loads (L4), so without this a
         stray click on the current tab would silently throw away the range
         and selections the reader had just set. */
      if (b && b.getAttribute('data-tab') !== ACTIVE) setTab(b.getAttribute('data-tab'), true);
    });
    /* Roving arrow keys — a tablist that only answers to the mouse is not one. */
    tabStrip.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      var cur = TABS.findIndex(function (t) {
        return document.getElementById('tab-' + t).getAttribute('aria-selected') === 'true';
      });
      var next = TABS[(cur + d + TABS.length) % TABS.length];
      setTab(next, true);
      document.getElementById('tab-' + next).focus();
    });

    /* The initial setTab() lives in boot(), not here. It now reaches
       loadDataset(), which reads vars declared further down -- function
       declarations hoist, their initialisers do not. */

    function longDate(s) { var d = ymd(s); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
    /* dd/mm/yy for the range control and, since 2026-08-24 at Jenny's
       request, for "Last updated" too. The 2026-08-20/21 closeout had locked
       the long form there on the grounds that a lone 01/07/26 is ambiguous
       between 1 July and 7 January; that decision is reversed — one date
       format across the page won out over disambiguating a single line. */
    /* "hh:mm dd/mm/yy" for "Last updated". The endpoint stores uploadedAt as
       UTC; this renders it in the viewer's own timezone, because the question
       that line answers is "how long ago did someone replace this", which is a
       local one. A value with no clock in it (the old fixtures carried a bare
       YYYY-MM-DD) shows the date alone rather than inventing 00:00. */
    function stamp(v) {
      var str = String(v);
      /* Validate the date-only branch too. Without this a malformed value
         reaches dmy() and prints "NaN/NaN/aN" — which is the shape of the bug
         this line already had once. */
      if (str.indexOf('T') === -1) {
        return /^\d{4}-\d{2}-\d{2}$/.test(str.slice(0, 10)) ? dmy(str.slice(0, 10)) : '—';
      }
      var d = new Date(str);
      if (isNaN(d.getTime())) return '—';
      var p2 = function (n) { return String(n).padStart(2, '0'); };
      return p2(d.getHours()) + ':' + p2(d.getMinutes()) + ' ' +
             p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' +
             String(d.getFullYear()).slice(-2);
    }

    function dmy(s) {
      var d = ymd(s);
      return String(d.getDate()).padStart(2, '0') + '/' +
             String(d.getMonth() + 1).padStart(2, '0') + '/' +
             String(d.getFullYear()).slice(-2);
    }
    /* ---- boot ------------------------------------------------------------
       The page is a static asset with no data in it; everything comes from
       GET /api/finance/<dataset>, which gates on a session. All three
       datasets now have a data path (Block 26, reversing decision K), so a
       tab switch is a load, not a reveal.

       cache:'no-store' on the client pairs with the endpoint's
       `private, no-store`. Decision J: during the prototype session a stale
       data file was served three separate times after the file changed, and
       an upload nobody can see is worse than no upload. */

    var metaEl = document.getElementById('metaUpdated');
    var titleEl = document.getElementById('finTitle');

    /* Which dataset is on screen. The fetch, the upload and the panel heading
       all read this instead of naming 'reap'. */
    var ACTIVE = 'reap';

    /* Datasets already fetched, so returning to a tab is instant. An upload
       drops its own entry -- see the upload handler -- and nothing else
       invalidates it: the data only changes when someone replaces it. */
    var CACHE = {};

    /* Every load takes a ticket. A response whose ticket is no longer the
       current one is dropped, because the reader has moved to another tab
       since it was asked for. Without this, switching away from a slow Reap
       load paints Reap's spend under Fiat's heading -- one dataset's money
       shown as another's, which is the worst thing this page could do. */
    var loadSeq = 0;

    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    function applyDataset(payload) {
      DATA = payload || { rows: [] };
      ROWS = DATA.rows || [];
      /* An empty dataset has no span of its own. Fall back to today so the
         range picker still has a valid month to open on rather than
         rendering Invalid Date. */
      var today = new Date().toISOString().slice(0, 10);
      P_START = DATA.periodStart || today;
      P_END = DATA.periodEnd || today;
      /* uploadedAt is a full ISO timestamp from the endpoint
         (2026-08-24T13:05:22.123Z), not the bare YYYY-MM-DD the prototype's
         fixture carried. ymd() splits on '-', so the untrimmed string parsed
         as NaN and the line read "undefined NaN, NaN". Trim to the date part
         before formatting. */
      metaEl.textContent = DATA.uploadedAt ? stamp(DATA.uploadedAt) : '—';
      /* buildFilters, never bindFilters: this runs again on every tab switch
         and every upload, and re-binding is what broke the filter menus. */
      buildFilters();
      render();
    }

    /* Load one dataset into the single panel. Safe to call repeatedly. */
    function loadDataset(name) {
      ACTIVE = name;
      var seq = ++loadSeq;

      if (CACHE[name]) { applyDataset(CACHE[name]); return; }

      /* Blank the panel before fetching. Leaving the previous dataset's bars
         on screen under the new heading would show one dataset's spend
         labelled as another's for as long as the request takes. A card that
         is briefly empty is honest; one that is briefly wrong is not. */
      applyDataset({ rows: [] });
      metaEl.textContent = 'Loading…';

      fetch('/api/finance/' + name, { credentials: 'same-origin', cache: 'no-store' })
        .then(function (r) {
          if (r.status === 401) { gotoLogin(); return null; }
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (payload) {
          if (payload === null) return;          /* redirecting */
          CACHE[name] = payload;
          if (seq !== loadSeq) return;           /* reader moved on; drop it */
          applyDataset(payload);
        })
        .catch(function () {
          if (seq !== loadSeq) return;
          /* Deliberately renders the empty state rather than a blank page:
             the cards, filters and rail stay in place and the meta line
             carries the failure, so a transient outage looks like "no data
             right now" instead of a broken page. */
          applyDataset({ rows: [] });
          metaEl.textContent = 'Could not load — reload to try again';
        });
    }

    function boot() {
      /* Once, before any data exists. Every listener binds to static markup,
         so ordering it ahead of the first load is deliberate, not incidental. */
      bindFilters();
      /* setTab paints the tab strip and the heading, then loads the dataset. */
      setTab(new URLSearchParams(location.search).get('tab') || 'reap', false);
    }

    /* ---- per-dataset spreadsheet column names ----------------------------
       BLOCK_26_PLAN decision D1. The three datasets carry the same twelve
       concepts under different header spellings, so this is the ONLY thing
       that differs between them.

       `null` means "use the parser's own alias table", which is Reap's and
       is the one set of spellings that has been read off a real workbook.

       FIAT AND CRYPTO ARE PLACEHOLDERS. They inherit Reap's spellings
       because nothing about their real headers is known yet — deliberately
       not guessed. An upload whose headers do not match fails loudly, naming
       the headers it actually saw, which is the correct outcome until these
       are filled in from the real files. Both Block 25 parser bugs came from
       trusting a shape nobody had opened. */
    var DATASET_ALIASES = {
      reap: null,
      fiat: null,
      crypto: null
    };

    /* ---- admin upload -----------------------------------------------------
       Reveal is a display hint; the POST is gated by requireWorkspaceAdmin
       server-side. A non-admin who unhides this button gets a 403.

       The upload FULL-REPLACES the dataset, so it confirms first and names
       what is being destroyed. The endpoint keeps one previous version, but
       an undo nobody knows about is not consent.

       It targets whichever tab is active (L3), captured when the file is
       picked rather than read at each step: an admin who switches tabs while
       a large file parses must not have the upload follow them onto another
       dataset. */
    var upWrap = document.getElementById('uploadWrap');
    var upBtn = document.getElementById('uploadBtn');
    var upInput = document.getElementById('uploadInput');
    var upMsg = document.getElementById('uploadMsg');

    function say(text, kind) {
      upMsg.textContent = text;
      upMsg.className = 'fin-upload__msg' + (kind ? ' is-' + kind : '');
    }

    fetch('/api/me', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.user && d.user.is_admin) upWrap.hidden = false; })
      .catch(function () { /* stay hidden; the endpoint is the real gate */ });

    upBtn.addEventListener('click', function () { upInput.click(); });

    upInput.addEventListener('change', function () {
      var file = upInput.files && upInput.files[0];
      upInput.value = '';                     /* so re-picking the same file fires again */
      if (!file) return;

      /* Pinned here, for the whole of this upload. */
      var target = ACTIVE;
      var targetLabel = target.charAt(0).toUpperCase() + target.slice(1);

      say('Reading ' + file.name + '…');
      var parsed;
      parseFinanceWorkbook(file, { aliases: DATASET_ALIASES[target] })
        .then(function (payload) {
          parsed = payload;
          var had = (DATA.rows || []).length;
          var msg = 'Replace the ' + targetLabel + ' dataset with ' + payload.rows.length +
            ' payment' + (payload.rows.length === 1 ? '' : 's') +
            ' from ' + file.name + '?';
          if (had) {
            msg += '\n\nThis removes the ' + had + ' payment' + (had === 1 ? '' : 's') +
              ' currently stored. One previous version is kept.';
          }
          if (!window.confirm(msg)) { say(''); return null; }

          say('Uploading…');
          return fetch('/api/finance/' + target, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(parsed)
          });
        })
        .then(function (res) {
          if (res === null) return null;       /* cancelled at the confirm */
          return res.json().then(function (body) {
            if (!res.ok) throw new Error(body && body.error ? body.error : 'HTTP ' + res.status);
            return body;
          });
        })
        .then(function (body) {
          if (body === null) return;
          say('Replaced — ' + body.rows + ' payments', 'ok');
          /* The cached copy is now the old dataset. Drop it before anything
             can serve it back on a tab switch. */
          delete CACHE[target];
          /* Re-read rather than trusting what we just sent: the server is the
             source of truth, and it rebuilt every row from its own whitelist. */
          return fetch('/api/finance/' + target, { credentials: 'same-origin', cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (payload) {
              CACHE[target] = payload;
              /* Only paint it if that dataset is still the one on screen. */
              if (ACTIVE === target) applyDataset(payload);
            });
        })
        .catch(function (err) {
          /* The parser's messages name the headers it actually saw, and the
             endpoint's name the row that failed — both are more use to the
             person holding the spreadsheet than "upload failed". */
          say(err && err.message ? err.message : 'Upload failed', 'err');
        });
    });

    boot();
  })();
  </script>
