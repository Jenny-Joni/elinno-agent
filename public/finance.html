  <!-- Block 19 rail boot. BYTE-IDENTICAL in all 11 authed pages, like the
       rail block in <body>; verification item 3b diffs them.

       This MUST be inline and synchronous, and it must stay in <head>.
       /_lib/side-nav.js is deferred, so it runs only after the document is
       parsed. Anything the rail needs at FIRST PAINT has to be decided here,
       or it visibly changes a moment later — which is what made moving
       between rail items look like a glitch rather than a page change.

       Settled before paint, as classes on <html>:
         sn-boot          layout is active (page gets its left offset)
         sn-open-projects Projects is open — derived from the PAGE, not from
                          storage, so the menu follows where you are: open on
                          a Projects page, shut everywhere else
         sn-at-<key>      which rail item is the current page
         sn-admin         reveal the admin group (a display hint, never a
                          permission — every link behind it is gated
                          server-side, and /api/me corrects it on load)

       sn-at-<key> duplicates activeKey() in /_lib/side-nav.js. That is a
       real drift risk and a deliberate trade: the alternative is the
       highlight appearing a frame late on every navigation. If you change
       one, change both — verification item 4 compares them.

       Keep it tiny and dependency-free: it blocks the parser by design. -->
  <script>(function(){var d=document.documentElement,p=location.pathname,k='';if(p.indexOf('/finance')===0)k='finance';else if(p==='/'||p.indexOf('/dashboard')===0)k='dashboard';else if(p.indexOf('/projects')===0||p.indexOf('/project/')===0||p.indexOf('/project.html')===0||p.indexOf('/project_settings')===0)k='projects';else if(p.indexOf('/cross-project')===0)k='cross-project';else if(p.indexOf('/workspace_settings')===0)k='workspace-settings';else if(p.indexOf('/admin')===0)k='members';else if(p.indexOf('/whats-new')===0)k='whats-new';d.classList.add('sn-boot');if(k)d.classList.add('sn-at-'+k);if(k==='projects')d.classList.add('sn-open-projects');else if(k==='finance')d.classList.add('sn-open-finance');try{if(localStorage.getItem('elinno.sidenav.admin')==='1')d.classList.add('sn-admin');}catch(e){}})();</script>
  <link rel="stylesheet" href="/auth.css?v=2026-08-24-1" />
  <style>
    /* ===================================================================
       Finance dashboard. Data comes from GET /api/finance/<dataset>, which
       gates on a session — the page itself is a static asset and carries no
       payment data, so it is safe to serve from the CDN.

       Layout only — brand tokens, .surface/.eyebrow/.pill/.btn all come
       from auth.css. No SVG anywhere: every mark is a positioned div,
       which also sidesteps the Cloudflare inline-SVG-in-JS 500.
       =================================================================== */

    /* Categorical series palette. Six slots, fixed order, assigned by
       ENTITY not by rank, so filtering never repaints a survivor.
       Validated (lightness band / chroma floor / CVD separation /
       normal-vision floor / contrast) against a white surface — all pass.
       Deliberately clear of the reserved status hues (--success,
       --danger, --amber-*), which never encode a series. */
    :root {
      --fin-c1: #6234fc;         /* brand — every bar in a single-series chart */
      --fin-other: #959595;      /* a project with no colour of its own */
      --fin-grid: #eeeef1;       /* solid hairline, one shade off the surface */
      --fin-track: #f4f4f7;
    }

    /* ---- in-page tabs ------------------------------------------------- */
    .fin-tabs {
      display: flex; gap: 2px; margin: 0 0 22px;
      border-bottom: 1px solid var(--border);
    }
    .fin-tab {
      font-family: var(--font); font-size: 13.5px; font-weight: 500;
      color: var(--text-2); background: none; border: none; cursor: pointer;
      padding: 9px 14px; border-radius: var(--r-sm) var(--r-sm) 0 0;
      position: relative; top: 1px; border-bottom: 2px solid transparent;
      transition: color var(--t-fast), background var(--t-fast);
    }
    .fin-tab:hover { background: var(--brand-soft); color: var(--text); }
    .fin-tab[aria-selected="true"] {
      color: var(--brand-strong); border-bottom-color: var(--brand);
    }
    .fin-tab:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: -2px; }

    .fin-shell { max-width: 1100px; margin: 0 auto; padding: 28px 20px 96px; }

    .fin-h1 {
      font-family: var(--font); font-size: 28px; font-weight: 500;
      color: var(--text); margin: 0 0 6px; letter-spacing: -0.01em;
    }
    .fin-meta { margin: 0 0 22px; }
    .fin-meta p {
      font-family: var(--font); font-size: 13.5px; color: var(--text-2);
      margin: 0 0 3px; line-height: 1.5;
    }
    .fin-meta p:last-child { margin-bottom: 0; }
    .fin-meta strong { color: var(--text); font-weight: 500; }
    /* The upload control sits on the same line as "Last updated" and is
       pushed to the far end, so it never competes with the heading for
       attention — it is a monthly chore, not a primary action. */
    .fin-meta--row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .fin-meta--row p { flex: 1 1 auto; }
    .fin-upload { display: inline-flex; align-items: center; gap: 10px; }
    .fin-upload__btn { font-size: 12.5px; padding: 5px 11px; }
    .fin-upload__msg { font-family: var(--font); font-size: 12px; color: var(--text-2); }
    .fin-upload__msg.is-err { color: var(--danger); }
    .fin-upload__msg.is-ok { color: var(--success); }


    /* ---- one filter row, above everything it scopes ----------------- */
    .fin-filters {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: 14px 16px; margin: 0 0 8px;
    }
    .fin-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .fin-field label {
      font-family: var(--font); font-size: 11px; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3);
    }
    .fin-field select {
      font-family: var(--font); font-size: 13px; color: var(--text);
      background: var(--bg-subtle); border: 1px solid var(--border-input);
      border-radius: var(--r-sm); padding: 7px 10px; min-width: 132px;
      max-width: 190px; cursor: pointer;
    }
    .fin-field select:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 1px; }

    /* ---- multi-select filters ------------------------------------------
       The menu, the All/None actions and the checkbox are auth.css's
       .sv-* components, shipped for the Sprint View filters — reused rather
       than reinvented so both surfaces stay one control.

       One substitution: the Sprint View draws its tick as inline SVG inside
       a JS template literal (project.html SV_CHECK). That is the exact
       pattern that 500'd Cloudflare Pages in Block 13.3. A Tabler glyph is
       a font character and carries no such risk. */
    .fin-ms { position: relative; display: inline-flex; }
    .fin-ms .fin-dr__trigger { gap: 10px; padding-right: 9px; min-width: 148px; }
    .fin-ms .fin-dr__trigger > span { flex: 1; text-align: left; }
    .fin-ms .fin-dr__trigger > i { margin-left: auto; font-size: 14px; color: var(--text-3); }
    .fin-ms .fin-dr__trigger.is-filtered {
      background: var(--brand-tint); border-color: var(--brand-soft-border); color: var(--brand-strong);
    }
    .fin-ms .fin-dr__trigger.is-filtered > i { color: var(--brand-strong); }
    /* A long vendor list scrolls inside the menu rather than off the page.
       padding:0 on the scroll container is load-bearing — auth.css's 6px of
       menu padding sat ABOVE a sticky top:0 header, and .sv-menu-acts adds
       5px of margin BELOW it, so rows scrolled through two transparent
       strips and appeared to overlap the All/None row. The header is now one
       opaque block with no gap on either side of it. */
    .fin-ms .sv-menu { min-width: 250px; max-height: 300px; overflow-y: auto; padding: 0; }
    .fin-ms__head {
      position: sticky; top: 0; z-index: 2; background: var(--bg);
      padding: 6px 0 0; border-bottom: 1px solid var(--border-soft);
      border-radius: 11px 11px 0 0;
    }
    .fin-ms .sv-menu-acts { border-bottom: none; margin-bottom: 0; }
    .fin-ms__list { padding: 5px 6px 6px; }
    .fin-ms .sv-menu-item { justify-content: flex-start; }
    /* Flipped by JS when the menu would run off the right edge. */
    .fin-ms .sv-menu.is-right { left: auto; right: 0; }
    .fin-ms .sv-cb i { font-size: 11px; line-height: 1; }
    .fin-ms .sv-menu-item.is-capped { opacity: .4; cursor: default; }
    .fin-ms .sv-menu-item.is-capped:hover { background: none; }
    .fin-ms__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fin-ms__name.is-blank { color: var(--text-3); font-style: italic; }
    .fin-ms__n {
      margin-left: auto; padding-left: 10px; color: var(--text-3); font-size: 11.5px;
      font-variant-numeric: tabular-nums;
    }

    /* ---- period: one range picker -------------------------------------
       Two <input type="date"> fields could not express "a range" — they let
       you build a backwards one and never show the two dates in relation to
       each other. A calendar shows the span itself, which is the thing being
       chosen. No library, and no inline SVG: the chevrons are Tabler glyphs. */
    .fin-dr { position: relative; }
    .fin-dr__trigger {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font); font-size: 13px; color: var(--text);
      background: var(--bg-subtle); border: 1px solid var(--border-input);
      border-radius: var(--r-sm); padding: 7px 12px 7px 10px; cursor: pointer;
      white-space: nowrap;
    }
    .fin-dr__trigger i { font-size: 15px; color: var(--text-3); flex: none; }
    /* Narrow widths shrink the field below the label's width; ellipsise
       rather than clipping the last characters off "(all)". */
    .fin-dr__trigger { min-width: 0; }
    .fin-dr__trigger > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .fin-dr__trigger:hover { border-color: var(--brand-hair); }
    .fin-dr__trigger[aria-expanded="true"] { border-color: var(--brand); color: var(--brand-strong); }
    .fin-dr__trigger:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 1px; }

    .fin-dr__pop {
      position: absolute; z-index: 40; top: calc(100% + 6px); left: 0;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-md); padding: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
    }
    .fin-dr__months { display: flex; gap: 22px; }
    .fin-dr__cal { width: 210px; }
    .fin-dr__head {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 0 8px; height: 24px;
    }
    .fin-dr__title {
      font-family: var(--font); font-size: 12.5px; font-weight: 600; color: var(--text);
    }
    .fin-dr__nav {
      background: none; border: none; cursor: pointer; padding: 3px 5px;
      color: var(--text-3); border-radius: var(--r-sm); line-height: 1;
    }
    .fin-dr__nav:hover:not(:disabled) { background: var(--brand-soft); color: var(--brand-strong); }
    .fin-dr__nav:disabled { opacity: .3; cursor: default; }
    .fin-dr__nav i { font-size: 15px; }
    .fin-dr__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
    .fin-dr__dow {
      font-family: var(--font); font-size: 10px; font-weight: 500; color: var(--text-3);
      text-align: center; padding: 4px 0; letter-spacing: .02em;
    }
    .fin-dr__day {
      font-family: var(--font); font-size: 12px; color: var(--text-2);
      background: none; border: none; cursor: pointer; padding: 6px 0;
      border-radius: var(--r-sm); font-variant-numeric: tabular-nums;
    }
    .fin-dr__day:hover:not(:disabled) { background: var(--brand-soft); color: var(--text); }
    .fin-dr__day:disabled { color: var(--text-faint); cursor: default; }
    .fin-dr__day.is-blank { visibility: hidden; }
    /* The span reads as one block: square-cornered middles, rounded ends. */
    .fin-dr__day.is-in { background: var(--brand-tint); color: var(--brand-strong); border-radius: 0; }
    .fin-dr__day.is-end, .fin-dr__day.is-start {
      background: var(--brand); color: #fff; font-weight: 600;
    }
    .fin-dr__day.is-start { border-radius: var(--r-sm) 0 0 var(--r-sm); }
    .fin-dr__day.is-end { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
    .fin-dr__day.is-start.is-end { border-radius: var(--r-sm); }
    .fin-dr__day:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: -1px; }
    .fin-dr__foot {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--border-soft);
      font-family: var(--font); font-size: 11.5px; color: var(--text-3);
    }
    .fin-dr__all {
      font-family: var(--font); font-size: 11.5px; color: var(--brand-strong);
      background: none; border: none; cursor: pointer; padding: 2px;
      text-decoration: underline; text-underline-offset: 2px;
    }
    @media (max-width: 640px) {
      .fin-dr__months { flex-direction: column; gap: 14px; }
      .fin-dr__cal { width: 100%; }
    }
    .fin-filters__spacer { flex: 1 1 auto; }
    .fin-reset {
      font-family: var(--font); font-size: 12.5px; color: var(--brand-strong);
      background: none; border: none; cursor: pointer; padding: 8px 4px;
      text-decoration: underline; text-underline-offset: 2px;
    }
    /* ---- chart cards ------------------------------------------------ */
    .fin-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 18px 20px 20px; margin: 0 0 16px;
    }
    .fin-card__head {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin: 0 0 4px;
    }
    .fin-card__title {
      font-family: var(--font); font-size: 15px; font-weight: 600;
      color: var(--text); margin: 0;
    }
    .fin-card__tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    /* segmented control — mirrors auth.css .seg, kept local so the mockup
       does not depend on a class that may move */
    .fin-seg { display: inline-flex; background: var(--fin-track); border-radius: var(--r-pill); padding: 3px; }
    .fin-seg button {
      font-family: var(--font); font-size: 12.5px; font-weight: 500;
      color: var(--text-2); background: none; border: none; cursor: pointer;
      padding: 5px 12px; border-radius: var(--r-pill); white-space: nowrap;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .fin-seg button[aria-pressed="true"] { background: var(--bg); color: var(--brand-strong); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .fin-seg button:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 1px; }

    /* ---- vertical columns (the month card) ---------------------------
       Months run along an axis, so they are read left-to-right as a series,
       not top-down as a ranking. The container grows to include the axis
       band -- a fixed height that fits only the plot gives the card its own
       little scrollbar. */
    .fin-cols { padding: 26px 0 0; }
    .fin-cols__plot {
      position: relative; height: 200px; display: flex; align-items: flex-end;
      justify-content: center; gap: 28px; padding-left: 54px;
      border-bottom: 1px solid var(--fin-grid);
    }
    .fin-gridline {
      position: absolute; left: 54px; right: 0; height: 0;
      border-top: 1px solid var(--fin-grid); pointer-events: none;
    }
    .fin-gridline span {
      position: absolute; right: 100%; top: -7px; padding-right: 10px;
      font-family: var(--font); font-size: 10.5px; color: var(--text-3);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .fin-col {
      flex: 1 1 0; max-width: 120px; min-width: 0; height: 100%;
      display: flex; align-items: flex-end; cursor: default;
    }
    .fin-col__bar {
      position: relative; width: 100%; background: var(--fin-c1);
      border-radius: 4px 4px 0 0;        /* rounded data-end, anchored to the baseline */
      min-height: 2px; transition: opacity var(--t-fast);
    }
    .fin-col__tag {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      margin-bottom: 6px; font-family: var(--font); font-size: 11.5px;
      font-weight: 600; color: var(--text); white-space: nowrap;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
    .fin-cols__axis {
      display: flex; justify-content: center; gap: 28px; padding: 9px 0 0 54px;
    }
    .fin-cols__axis span {
      flex: 1 1 0; max-width: 120px; min-width: 0; text-align: center;
      font-family: var(--font); font-size: 11.5px; color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fin-cols__axis .fin-cols__pct { color: var(--text-3); }

    /* ---- horizontal bars (breakdown) -------------------------------- */
    .fin-bars { display: flex; flex-direction: column; gap: 9px; }
    .fin-bar { display: grid; grid-template-columns: 148px 1fr 92px; gap: 12px; align-items: center; }
    .fin-bar__name {
      font-family: var(--font); font-size: 12.5px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fin-bar__name.is-blank { color: var(--text-3); font-style: italic; }
    .fin-bar__track { background: var(--fin-track); border-radius: 4px; height: 20px; position: relative; }
    .fin-bar__fill {
      height: 100%; background: var(--fin-c1); border-radius: 4px;
      min-width: 2px; transition: opacity var(--t-fast);
    }
    .fin-bar:hover .fin-bar__fill { opacity: .78; }
    /* Chart and Table are genuinely different heights -- the table carries a
       header and a Total row the chart has none of. Padding the short one to
       match left ~165px of dead space under the chart, so the card animates
       between the two instead. */
    .fin-views { transition: height 0.22s ease; }
    .fin-views.is-sizing { overflow: hidden; }
    @media (prefers-reduced-motion: reduce) { .fin-views { transition: none; } }

    /* The comparison card carries its own two pickers. They narrow WITHIN
       whatever the filter row above has already selected -- a second filter
       bar that silently ignored the first would be a trap. */
    .fin-pace__picks { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 18px; }
    /* Grouped columns: one bar per selected project inside each month.
       Only for 2-5 selections -- past that the bars get too thin to compare
       and the colour list stops being readable, so the card falls back to a
       single combined bar. */
    /* Reserve two rows for the pace legend. One project fits on a line and
       five wrap to two, and letting the card grow by that row is the same
       jump the empty-state height was fixed for. */
    #bd-pace-chart .fin-legend { min-height: 50px; align-content: flex-start; }

    /* Clicking a bar opens the payments behind it, under the chart. */
    .fin-col[data-bar], .fin-colgroup > div[data-bar] { cursor: pointer; }
    .fin-col[data-bar]:hover .fin-col__bar, .fin-colgroup > div[data-bar]:hover { opacity: .8; }
    .fin-pace__detail {
      margin: 14px 0 0; padding: 12px 14px;
      background: var(--bg-subtle); border: 1px solid var(--border-soft);
      border-radius: var(--r-md);
    }
    /* The list scrolls inside the panel rather than stretching the page.
       August is 87 payments -- roughly 3,000px -- and closing that while
       scrolled to the bottom shrinks the document by more than the scroll
       range left to compensate with, so the page lurches however carefully
       the anchor is held. Capping it removes the cause. */
    .fin-pace__detailbody { max-height: 420px; overflow-y: auto; }
    .fin-pace__detailhead {
      display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px;
      font-family: var(--font); font-size: 12px; color: var(--text-2);
    }
    .fin-pace__detailhead strong { color: var(--text); font-weight: 600; }
    .fin-pace__close {
      margin-left: auto; background: none; border: none; cursor: pointer;
      font-family: var(--font); font-size: 11.5px; color: var(--brand-strong);
      text-decoration: underline; text-underline-offset: 2px; padding: 2px;
    }

    .fin-colgroup { display: flex; align-items: flex-end; gap: 3px; width: 100%; height: 100%; }
    .fin-colgroup > div { flex: 1 1 0; min-width: 2px; border-radius: 4px 4px 0 0; transition: opacity var(--t-fast); }

    .fin-more {
      display: block; width: 100%; margin: 14px 0 0; padding: 9px 0;
      font-family: var(--font); font-size: 12.5px; font-weight: 500;
      color: var(--brand-strong); background: none; cursor: pointer;
      border: 1px solid var(--border); border-radius: var(--r-sm);
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .fin-more:hover { background: var(--brand-soft); border-color: var(--brand-soft-border); }
    .fin-more:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 1px; }

    .fin-bar__val {
      font-family: var(--font); font-size: 12.5px; color: var(--text);
      font-variant-numeric: tabular-nums; text-align: right; font-weight: 500;
    }
    .fin-bar__pct { color: var(--text-3); font-weight: 400; font-size: 11.5px; }

    /* ---- project drill-down ------------------------------------------
       A project bar opens its own vendor split underneath it. The panels are
       rendered populated and CLOSED, and clicking only toggles classes --
       re-rendering would hand the browser a brand-new element already at its
       final height, with nothing to animate between. Same reason
       /_lib/side-nav.js keeps its project tree in the DOM. */
    /* One flex item per project, holding its bar and its panel. With
       display:contents the bar and the collapsed panel became separate items
       in .fin-bars, so every row paid the 9px container gap twice and the
       list fell apart vertically. */
    /* min-height:0 on both: a flex item's automatic minimum is content-based,
       which reserved one line-box under every collapsed panel and pushed the
       rows 22px apart. The 0fr collapse only works if nothing above it keeps
       an auto minimum. */
    .fin-drill { display: flex; flex-direction: column; min-height: 0; }
    .fin-bar--drill { grid-template-columns: 148px 1fr 92px 20px; cursor: pointer; }
    .fin-bar--drill:hover .fin-bar__name { color: var(--brand-strong); }
    .fin-bar__chev {
      display: inline-flex; justify-content: center; color: var(--text-faint);
      font-size: 13px; transition: transform 0.22s ease;
    }
    .fin-bar--drill.is-open .fin-bar__chev { transform: rotate(90deg); color: var(--brand); }
    .fin-bar--drill:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 2px; border-radius: var(--r-sm); }

    /* 0fr -> 1fr rather than max-height: no ceiling to guess, so a project
       with two vendors and one with eight both animate to their real size. */
    .fin-drill__panel { display: grid; grid-template-rows: 0fr; min-height: 0; transition: grid-template-rows 0.22s ease; }
    .fin-drill__panel.is-open { grid-template-rows: 1fr; }
    .fin-drill__inner { overflow: hidden; min-height: 0; }
    /* A rail in the project's own colour, so the rows read as belonging to
       the bar above them rather than as more rows in the same list. */
    .fin-drill__pad {
      margin: 6px 0 10px; padding: 10px 0 12px 16px;
      border-left: 2px solid currentColor;
      background: var(--bg-subtle); border-radius: 0 8px 8px 0;
      display: flex; flex-direction: column; gap: 5px;
    }
    .fin-drill__head {
      font-family: var(--font); font-size: 10.5px; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3);
      margin: 0 0 3px; padding-left: 2px;
    }
    .fin-drill__row { display: grid; grid-template-columns: 132px 1fr 96px 20px; gap: 12px; align-items: center; }
    .fin-drill__rowname {
      font-family: var(--font); font-size: 11.5px; color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fin-drill__rowname.is-blank { color: var(--text-3); font-style: italic; }
    /* Shorter and lighter than a project row: subordinate at a glance, and
       on the SAME scale as the bars above, so a vendor can never draw longer
       than the project that contains it. */
    .fin-drill__rowtrack { background: var(--fin-track); border-radius: 3px; height: 10px; }
    .fin-drill__rowfill { height: 100%; border-radius: 3px; min-width: 2px; opacity: .8; }
    .fin-drill__rowval {
      font-family: var(--font); font-size: 11.5px; color: var(--text-2);
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .fin-drill__rowpct { color: var(--text-3); font-size: 10.5px; }
    /* ---- level 3: the transactions behind one vendor -------------------
       Names checked against the stylesheet before use -- the last nesting
       level collided with a leftover .fin-sub rule and inherited a stray
       22px margin. */
    .fin-vend { display: flex; flex-direction: column; min-height: 0; }
    .fin-drill__row--open { cursor: pointer; }
    .fin-drill__row--open:hover .fin-drill__rowname { color: var(--brand-strong); }
    .fin-drill__row--open:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 2px; border-radius: var(--r-sm); }
    .fin-drill__rowchev {
      display: inline-flex; justify-content: center; color: var(--text-faint);
      font-size: 11px; transition: transform 0.22s ease;
    }
    .fin-drill__row--open.is-open .fin-drill__rowchev { transform: rotate(90deg); color: currentColor; }

    /* ---- level 4: one account owner's charges --------------------------
       Owners are summed first because "who is this card actually paying
       for" is the question at this depth; the individual charges sit one
       click further in. */
    .fin-own { display: flex; flex-direction: column; min-height: 0; }
    /* Levels 3 and 4 share this geometry with the vendor rows above them, so
       every amount in the tree lands in one column. The middle column used to
       be dead space between a name at the far left and a figure at the far
       right; it now carries the owner's share of the vendor. */
    .fin-ownrow {
      display: grid; grid-template-columns: 140px 1fr 96px 20px; gap: 12px; align-items: center;
      font-family: var(--font); font-size: 11px; color: var(--text-2);
      padding: 3px 0; cursor: pointer; border-radius: 5px;
    }
    .fin-ownrow__track { background: var(--fin-track); border-radius: 3px; height: 8px; }
    .fin-ownrow__fill { height: 100%; border-radius: 3px; min-width: 2px; opacity: .55; }
    .fin-ownrow:hover { color: var(--text); }
    .fin-ownrow:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: 2px; }
    .fin-ownrow__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fin-ownrow__name.is-blank { color: var(--text-3); font-style: italic; }
    .fin-ownrow__amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }
    .fin-ownrow__n { color: var(--text-faint); font-weight: 400; font-size: 10px; }
    .fin-ownrow__chev {
      display: inline-flex; justify-content: center; color: var(--text-faint);
      font-size: 10px; transition: transform 0.22s ease;
    }
    .fin-ownrow.is-open .fin-ownrow__chev { transform: rotate(90deg); color: var(--text-2); }

    .fin-opanel { display: grid; grid-template-rows: 0fr; min-height: 0; transition: grid-template-rows 0.22s ease; }
    .fin-opanel.is-open { grid-template-rows: 1fr; }
    .fin-opanel__inner { overflow: hidden; min-height: 0; }
    .fin-opanel__pad {
      margin: 2px 0 6px 8px; padding: 5px 0 5px 10px;
      border-left: 1px solid var(--border-soft);
      display: flex; flex-direction: column; gap: 2px;
    }

    .fin-txns { display: grid; grid-template-rows: 0fr; min-height: 0; transition: grid-template-rows 0.22s ease; }
    .fin-txns.is-open { grid-template-rows: 1fr; }
    .fin-txns__inner { overflow: hidden; min-height: 0; }
    .fin-txns__pad {
      margin: 4px 0 8px 12px; padding: 8px 0 8px 12px;
      border-left: 1px solid var(--border); background: var(--bg);
      border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 3px;
    }
    /* Date, the account the card belongs to, amount. Date leads because the
       list is ordered by it -- reading a history down a column of dates is
       the whole point of this level. */
    .fin-txn {
      display: grid; grid-template-columns: 140px 1fr 96px 20px; gap: 12px; align-items: baseline;
      font-family: var(--font); font-size: 10.5px; color: var(--text-3);
      padding: 1px 0;
    }
    .fin-txn__date { font-variant-numeric: tabular-nums; padding-left: 14px; }
    .fin-txn__amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
    .fin-txn__head {
      font-family: var(--font); font-size: 9.5px; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--text-faint); padding-bottom: 3px;
      border-bottom: 1px solid var(--border-soft); margin-bottom: 3px;
    }
    .fin-txn__head .fin-txn__date { padding-left: 0; }

    .fin-drill__more {
      font-family: var(--font); font-size: 11px; color: var(--text-3); margin: 0;
    }


    /* Legend. The rules for these classes were removed along with the old
       composition card; the burn-up reuses the markup, so they come back. */
    .fin-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
    .fin-legend__item {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--font); font-size: 12px; color: var(--text-2);
    }
    .fin-legend__dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
    .fin-legend__val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

    /* ---- tooltip ----------------------------------------------------- */
    .fin-tip {
      position: fixed; z-index: 60; pointer-events: none; opacity: 0;
      background: var(--text); color: #fff; border-radius: var(--r-sm);
      padding: 8px 11px; font-family: var(--font); font-size: 12px;
      line-height: 1.45; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.18);
      transition: opacity var(--t-fast);
    }
    .fin-tip.is-on { opacity: 1; }
    .fin-tip b { font-weight: 600; }
    .fin-tip .fin-tip__v { font-variant-numeric: tabular-nums; }
    .fin-tip .fin-tip__m { color: rgba(255,255,255,.66); }

    /* ---- tables ------------------------------------------------------ */
    .fin-tbl-wrap { overflow-x: auto; }
    .fin-tbl { width: 100%; border-collapse: collapse; font-family: var(--font); font-size: 12.5px; }
    .fin-tbl th {
      text-align: left; font-weight: 500; color: var(--text-3); font-size: 11px;
      letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 10px;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .fin-tbl th.is-num, .fin-tbl td.is-num { text-align: right; font-variant-numeric: tabular-nums; }
    .fin-tbl td {
      padding: 8px 10px; border-bottom: 1px solid var(--border-soft);
      color: var(--text-2); white-space: nowrap;
    }
    .fin-tbl td.is-strong { color: var(--text); font-weight: 500; }
    .fin-tbl td.is-blank { color: var(--text-faint); font-style: italic; }
    .fin-tbl tbody tr:hover td { background: var(--brand-soft); }
    .fin-tbl__foot td { border-bottom: none; color: var(--text); font-weight: 600; padding-top: 11px; }

    /* ---- expandable table rows ----------------------------------------
       The same tree as the chart view, in the table. Rows are shown and
       hidden rather than animated: a <tr> cannot be transitioned to a height
       the way a grid row can, and a half-drawn table row looks broken. */
    .fin-trow--open { cursor: pointer; }
    .fin-trow--open:hover td { background: var(--brand-soft); }
    .fin-trow--open:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: -2px; }
    .fin-tchev {
      display: inline-block; width: 12px; color: var(--text-faint);
      transition: transform 0.15s ease; font-size: 11px;
    }
    .fin-trow--open.is-open .fin-tchev { transform: rotate(90deg); color: var(--brand); }
    /* A project cell is its own target inside the month row. */
    .fin-tcell { cursor: pointer; }
    .fin-tcell:hover { background: var(--brand-soft); color: var(--brand-strong); }
    .fin-tcell.is-open { background: var(--brand-tint); color: var(--brand-strong); font-weight: 600; }
    .fin-tcell:focus-visible { outline: 2px solid var(--brand-hair); outline-offset: -2px; }

    .fin-trow--l2 > td:first-child { padding-left: 26px; }
    .fin-trow--l3 > td:first-child { padding-left: 46px; }
    .fin-trow--l4 > td:first-child { padding-left: 66px; }
    .fin-trow--l2 > td { font-size: 12px; }
    .fin-trow--l3 > td, .fin-trow--l4 > td { font-size: 11.5px; color: var(--text-3); }
    .fin-trow--l4 > td { font-variant-numeric: tabular-nums; }
    .fin-trow[hidden] { display: none; }

    /* The pace card's empty state holds the chart's footprint. Collapsing
       from 631px to 257px shortens the document, and once the page is
       shorter than the current scroll position the browser clamps -- no
       amount of scroll correction can hold a row still when there is no
       scroll range left to give back. Keeping the box is the actual fix. */
    #bd-pace-chart .fin-empty {
      /* Mirrors the rendered height of .fin-cols (26px top padding + a 200px
         plot + the axis band), measured rather than derived -- the derived
         figure was 8px short and the card still moved. Re-measure if the
         plot height or the axis type size changes. */
      min-height: 257px; display: flex; align-items: center; justify-content: center;
    }

    .fin-empty {
      font-family: var(--font); font-size: 13px; color: var(--text-2);
      padding: 34px 0; text-align: center;
    }
    .fin-note {
      font-family: var(--font); font-size: 11.5px; color: var(--text-3);
      margin: 12px 0 0; line-height: 1.5;
    }
    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .fin-shell { padding: 20px 14px 72px; }
      .fin-bar { grid-template-columns: 104px 1fr 78px; gap: 8px; }
      .fin-field select { min-width: 0; width: 100%; }
      .fin-field { flex: 1 1 140px; }
    }
  </style>
</head>

  <!-- Block 19 rail tree restore. BYTE-IDENTICAL in all 11 authed pages.
       Runs during parse, right after the rail exists and before first paint.

       Three jobs, all so the menu arrives correct rather than being corrected:
         1. paint the avatar letter
         2. paint the Projects tree from the last page's render, so an open
            section is not empty while /api/projects is in flight
         3. NORMALISE that tree to the CURRENT page — the cache carries
            whichever project was open on the previous screen, so it is
            re-pointed at the project in this URL, or closed entirely when
            this page is not a project. Without this, opening Rain and then
            clicking Members left Rain expanded under a Members highlight.
       Order matters: the tree must exist before scrollTop means anything,
       so the scroll restore is last.
       The markup came from the previous page's own render (escaped there)
       and the live render replaces it moments later. -->
  <script>(function(){try{var d=document.documentElement,p=location.pathname,i=localStorage.getItem('elinno.sidenav.initial'),a=document.getElementById('navUserAvatar');if(a&&i)a.textContent=i;if(d.classList.contains('sn-open-projects')){var s=document.querySelector('[data-sn-section="projects"]');if(s)s.setAttribute('aria-expanded','true');var b=document.querySelector('[data-sn-children="projects"]'),h=sessionStorage.getItem('elinno.sidenav.treeHtml');if(b&&h)b.innerHTML=h;}var m=p.match(/^\/(?:project|project_settings)\/([^\/]+)/),slug=m?decodeURIComponent(m[1]):null,rows=document.querySelectorAll('[data-sn-project]');for(var j=0;j<rows.length;j++){var on=slug!==null&&rows[j].getAttribute('data-sn-project')===slug;rows[j].classList.toggle('is-open',on);rows[j].setAttribute('aria-expanded',String(on));var g=rows[j].nextElementSibling;if(g&&g.classList.contains('sn-l3-group'))g.classList.toggle('is-open',on);}var c=document.querySelector('.side-nav__scroll'),y=sessionStorage.getItem('elinno.sidenav.scrollTop');if(c&&y)c.scrollTop=+y;}catch(e){}})();</script>

  <main style="background:var(--bg-subtle);min-height:100vh;">

      <section id="panel-finance" role="tabpanel" aria-labelledby="tab-reap" tabindex="0">

      <section class="fin-card">
        <div class="fin-card__head">
          <h2 class="fin-card__title">by MONTH</h2>

              <button class="fin-dr__trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-labelledby="lbl-pace-project">
                <span data-ms-label>All</span><i class="ti ti-chevron-down" aria-hidden="true"></i>

              <button class="fin-dr__trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-labelledby="lbl-pace-vendor">
                <span data-ms-label>Select vendors</span><i class="ti ti-chevron-down" aria-hidden="true"></i>

  <div class="fin-tip" id="finTip" role="status" aria-live="polite"></div>

  <!-- Upload path only. read-excel-file is vendored and pinned; see its
       header comment and BLOCK_25_PLAN.md decision L. -->
  <script src="/_lib/read-excel-file.min.js?v=2026-08-24-1"></script>
  <script src="/_lib/finance-xlsx.js?v=2026-08-24-1"></script>
  <script>
  (function () {
    'use strict';

    /* Filled by loadDataset() from the endpoint before buildFilters()/render() run.
       Reassigned wholesale, never mutated, so every closure below reads the
       current dataset through these bindings. */
    var DATA = { rows: [] };
    var ROWS = [];

    /* Series palette, read from CSS so the tokens have one home. Assigned by
       ENTITY (a stable sort of every value in the whole dataset), never by
       rank in the current slice — filtering must not repaint a survivor. */
    var BLANK = '(not set)';
    /* Joins the parts of a drill key. Never U+0000: an HTML parser rewrites
       that to U+FFFD inside an attribute, so a key built in JS stopped
       matching the same key read back from the DOM. */
    var KEYSEP = '|~|';

    /* Project colours, lifted from the cell fills in the Reap export so a
       project reads the same here as it does in the spreadsheet. Keyed by
       NAME, so a filter can never repaint a survivor.

       Seven of the ten were shifted darker along their own hue: they are
       cell fills, drawn as pale grounds behind dark text, and as marks on a
       white card they landed at 1.5-2.8:1. Each is the same colour at the
       minimum lightness that clears 3:1 -- Rain is still gold, Gems Trade
       still green -- rather than a different colour that happens to pass.
       Excel originals, in order: DF2F4A BDA8F9 FFCB00 00C875 9CD326 579BFC
       4ECCC6 FF007F 333333 C4C4C4. */
    var PROJECT_COLOR = {
      'Joni': '#DF2F4A',
      'Elinnovation': '#A082F6',
      'Rain': '#B69100',
      'Gems Trade': '#00AB64',
      'Gems Launchpad': '#78A21D',
      'Olympus AI': '#4D95FC',
      'Mezada': '#30A59F',
      'TOMI': '#FF007F',
      'DOP': '#333333',
      '(not set)': '#959595'
    };
    var LIMIT = 10;                    /* rows shown before "Show all" */

    var usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    var usd0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
    function money(n) { return usd.format(n); }
    function money0(n) { return usd0.format(n); }
    function pct(n, t) { return t ? (100 * n / t).toFixed(1) + '%' : '0%'; }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function val(r, k) { return (r[k] || '').trim() || BLANK; }
    function sum(a) { var t = 0; for (var i = 0; i < a.length; i++) t += a[i].amount; return t; }

    /* ---- dates: parse as plain calendar days, no timezone drift -------- */
    function ymd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    var P_START = '', P_END = '';   /* set by boot(), from the dataset's own span */


    /* ---- state -------------------------------------------------------- */
    var state = {
      from: '', to: '', sel: {},
      view: { project: 'chart', vendor: 'chart', pace: 'chart' },
      expanded: { project: false, vendor: false },
      cmp: { project: '' },
      paceBar: null, paceChild: null, paceOwner: null,
      drill: {}, child: {}, owner: {},
      sort: { key: 'date', dir: 'desc' }
    };

    function filtered() {
      return ROWS.filter(function (r) {
        if (state.from && r.date < state.from) return false;
        if (state.to && r.date > state.to) return false;
        for (var i = 0; i < MULTI.length; i++) {
          if (!state.sel[MULTI[i].key].has(val(r, MULTI[i].key))) return false;
        }
        return true;
      });
    }

    /* ---- tooltip ------------------------------------------------------ */
    var tipEl = document.getElementById('finTip');
    function tipOn(e, html) {
      tipEl.innerHTML = html;
      tipEl.classList.add('is-on');
      moveTip(e);
    }
    function moveTip(e) {
      var pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      var x = e.clientX + pad, y = e.clientY + pad;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
      tipEl.style.left = Math.max(8, x) + 'px';
      tipEl.style.top = Math.max(8, y) + 'px';
    }
    function tipOff() { tipEl.classList.remove('is-on'); }
    /* Hold the clicked row still while a panel opens or closes. Collapsing
       something above the fold otherwise yanks the whole page upward under
       the pointer, and with four nestable levels that happens constantly.

       Corrected every frame for the length of the transition rather than
       once at the end: the height changes gradually, so a single adjustment
       fixes the destination and leaves the 220ms in between sliding. */

    function holdScroll(el, mutate) {
      /* auth.css sets html { scroll-behavior: smooth }. Left on, every
         correction animates, so each frame measures a scroll position still
         travelling from the last one and the row drifts anyway. Corrections
         are instant; the restore puts smooth back for ordinary navigation. */
      var root = document.documentElement;
      var prevBehavior = root.style.scrollBehavior;
      root.style.scrollBehavior = 'auto';
      var before = el.getBoundingClientRect().top;
      mutate();
      var t0 = null;
      requestAnimationFrame(function step(ts) {
        if (t0 === null) t0 = ts;
        var drift = el.getBoundingClientRect().top - before;
        if (drift) window.scrollBy(0, drift);
        if (ts - t0 < 320) requestAnimationFrame(step);
        else root.style.scrollBehavior = prevBehavior;
      });
    }

    /* Department and description are per-PAYMENT fields, so a vendor's are
       the distinct values across its payments. A vendor filed under two
       departments should say both rather than have one picked for it. Empty
       fields are dropped, not shown blank. */
    function vendorTipHtml(rows, name) {
      var mine = rows.filter(function (r) { return val(r, 'vendor') === name; });
      function distinctOf(key) {
        var seen = {}, out = [];
        mine.forEach(function (r) {
          var v = (r[key] || '').trim();
          if (v && !seen[v]) { seen[v] = 1; out.push(v); }
        });
        return out;
      }
      var dept = distinctOf('department'), desc = distinctOf('description');
      var tip = '<b>' + esc(name) + '</b>';
      if (dept.length) tip += '<br>' + esc(dept.join(' \u00b7 '));
      if (desc.length) tip += '<br><span class="fin-tip__m">' + esc(desc.join(' ')) + '</span>';
      if (!dept.length && !desc.length) {
        tip += '<br><span class="fin-tip__m">No department or description recorded.</span>';
      }
      return tip;
    }

    function bindTip(el, html) {
      el.addEventListener('mouseenter', function (e) { tipOn(e, html); });
      el.addEventListener('mousemove', moveTip);
      el.addEventListener('mouseleave', tipOff);
    }

    /* ---- filters ------------------------------------------------------
       Options come from the FULL dataset, not the current slice, so the
       lists never reshuffle underneath a click. Selection is a Set per
       dimension seeded with everything, so "all selected" and "no filter"
       are the same state and filtered() needs no special case. */
    /* msId namespaces a menu; key says which column it reads. The pace card
       gets its own project menu over the same column, with its own selection
       and its own re-render. */
    var MULTI = [
      { msId: 'project', key: 'project', noun: 'projects', menu: 'Filter by project' },
      { msId: 'vendor', key: 'vendor', noun: 'vendors', menu: 'Filter by vendor', noCount: true },
      { msId: 'card', key: 'card', noun: 'cards', menu: 'Filter by card' }
    ];
    /* Re-rendering this card changes its height -- the headline gains a line
       when one month overtakes the other, the legend loses an entry when a
       month drops out. Left alone, the page jumps under a menu the reader is
       still clicking. Pin the control, animate the height. */
    function repaintPace(anchor) {
      holdScroll(anchor || document.querySelector('[data-ms="pace-project"]'), function () {
        animateViewSwitch({ id: 'pace' }, function () { renderPace(filtered()); });
      });
    }
    /* Both of this card's pickers are plain multi-selects with All/None and
       no cap, and both start empty (2026-08-24, Jenny). That reverses the
       closeout, which had no All/None on projects, a hard cap of five, and a
       single-select vendor. The cap is gone, not worked around: past five
       projects the grouped chart already falls back to one combined bar, so
       "all ten" is a state it can draw — just not as ten series. */
    var PACE_MULTI = { msId: 'pace-project', key: 'project', noun: 'projects', menu: 'Projects in this chart',
                       defaultSel: ['Joni'], emptyLabel: 'Select projects',
                       onChange: function (w) { refreshPaceVendors(); repaintPace(w); } };
    var PACE_VENDOR = { msId: 'pace-vendor', key: 'vendor', noun: 'vendors', menu: 'Vendors in this chart',
                        noCount: true, defaultSel: ['OpenRouter'], emptyLabel: 'Select vendors',
                        onChange: repaintPace };

    /* Named defaults, with a fallback: the dataset is replaced wholesale every
       upload, so "Joni" or "OpenRouter" may simply not be in the next file.
       Falling back to the largest entry keeps the card useful instead of
       opening on an empty state that looks like breakage. */
    function initialSet(m, names) {
      if (m.defaultSel) {
        var picked = m.defaultSel.filter(function (n) { return names.indexOf(n) >= 0; });
        if (picked.length) return new Set(picked);
        return new Set(names.length ? [names[0]] : []);
      }
      return new Set(m.startEmpty ? [] : names);
    }

    /* Row markup for a multi-select option. Shared so the vendor list can be
       rebuilt when the project selection narrows it, without drifting from
       what buildMulti() produced. */
    function msRowHtml(m, n, count) {
      return '<div class="sv-menu-item" role="checkbox" aria-checked="false" data-value="' + esc(n) + '">' +
        '<span class="sv-cb"></span>' +
        '<span class="fin-ms__name' + (n === BLANK ? ' is-blank' : '') + '" title="' + esc(n) + '">' + esc(n) + '</span>' +
        (m.noCount ? '' : '<span class="fin-ms__n">' + count + '</span>') + '</div>';
    }

    /* 3. Only vendors that actually appear in the chosen projects. Offering a
       vendor with nothing behind it produces an empty chart and no
       explanation. Ordered by spend, not payment count: counting puts a
       vendor with 24 small charges above one with 8 charges worth half the
       bill, which is the wrong end of the list for a card about spend.

       Rebuilding rows here is safe even though paintMulti deliberately
       restyles in place: this fires when the PROJECT menu changes, so the
       pointer is never over the vendor rows being replaced. */
    function refreshPaceVendors() {
      var wrap = document.querySelector('[data-ms="pace-vendor"]');
      if (!wrap) return;
      var pset = state.sel['pace-project'];
      var totals = {};
      filtered().forEach(function (r) {
        if (pset && pset.size && !pset.has(val(r, 'project'))) return;
        var v = val(r, 'vendor');
        totals[v] = (totals[v] || 0) + r.amount;
      });
      var names = Object.keys(totals).sort(function (a, b) {
        if (a === BLANK) return 1;
        if (b === BLANK) return -1;
        return totals[b] - totals[a] || a.localeCompare(b);
      });
      ORDER['pace-vendor'] = names;

      var keep = new Set();
      (state.sel['pace-vendor'] || new Set()).forEach(function (v) {
        if (names.indexOf(v) >= 0) keep.add(v);
      });
      /* Everything selected just dropped out of range. Rather than blank the
         card, fall back the same way the initial default does. */
      if (!keep.size) keep = initialSet(PACE_VENDOR, names);
      state.sel['pace-vendor'] = keep;

      wrap.querySelector('.fin-ms__list').innerHTML =
        names.map(function (n) { return msRowHtml(PACE_VENDOR, n, 0); }).join('');
      paintMulti(PACE_VENDOR);
    }
    var ORDER = {}, COUNTS = {};

    function distinct(key) {
      var c = {};
      ROWS.forEach(function (r) { var v = val(r, key); c[v] = (c[v] || 0) + 1; });
      /* Biggest first, but the blank bucket always last regardless of size —
         it is the absence of a value, not a value, and on Projects it
         outranks four real ones. Sorting it into the list would put a gap in
         the source data above things people are actually looking for. */
      var names = Object.keys(c).sort(function (a, b) {
        if (a === BLANK) return 1;
        if (b === BLANK) return -1;
        return c[b] - c[a] || a.localeCompare(b);
      });
      return { names: names, counts: c };
    }

    function msLabel(m) {
      var set = state.sel[m.msId], all = ORDER[m.msId].length;
      if (set.size === 0 && m.emptyLabel) return m.emptyLabel;
      if (set.size === all) return 'All ' + m.noun;
      if (set.size === 0) return 'No ' + m.noun;
      if (set.size === 1) return Array.from(set)[0];
      return set.size + ' ' + m.noun;
    }

    function paintMulti(m) {
      var wrap = document.querySelector('[data-ms="' + m.msId + '"]');
      var set = state.sel[m.msId], all = set.size === ORDER[m.msId].length;
      wrap.querySelector('[data-ms-label]').textContent = msLabel(m);
      wrap.querySelector('.fin-dr__trigger').classList.toggle('is-filtered', !all);

      /* Rows are re-styled in place, never rebuilt: replacing the menu on
         every tick would detach the row under the pointer — the same bug
         the date picker had. */
      var capped = m.max && set.size >= m.max;
      wrap.querySelectorAll('.sv-menu-item').forEach(function (el) {
        var on = set.has(el.getAttribute('data-value'));
        var cb = el.querySelector('.sv-cb');
        cb.classList.toggle('on', on);
        cb.innerHTML = on ? '<i class="ti ti-check" aria-hidden="true"></i>' : '';
        el.setAttribute('aria-checked', String(on));
        /* At the cap the unchecked rows are inert -- greying them says so
           before the click that would do nothing. */
        el.classList.toggle('is-capped', !!capped && !on);
        el.setAttribute('aria-disabled', String(!!capped && !on));
      });
    }

    function buildMulti(m) {
      var d = distinct(m.key);
      ORDER[m.msId] = d.names; COUNTS[m.msId] = d.counts;
      state.sel[m.msId] = initialSet(m, d.names);

      var wrap = document.querySelector('[data-ms="' + m.msId + '"]');
      var menu = wrap.querySelector('[data-ms-menu]');
      menu.innerHTML = '<div class="fin-ms__head">' +
          '<div class="sv-menu-label">' + esc(m.menu) + '</div>' +
          (m.noActions ? '' :
            '<div class="sv-menu-acts">' +
              '<span class="sv-menu-act" data-action="all" role="button" tabindex="0">All</span>' +
              '<span class="sv-menu-act" data-action="none" role="button" tabindex="0">None</span>' +
            '</div>') +
        '</div><div class="fin-ms__list">' +
        d.names.map(function (n) {
          return '<div class="sv-menu-item" role="checkbox" aria-checked="true" data-value="' + esc(n) + '">' +
            '<span class="sv-cb on"><i class="ti ti-check" aria-hidden="true"></i></span>' +
            '<span class="fin-ms__name' + (n === BLANK ? ' is-blank' : '') + '" title="' + esc(n) + '">' + esc(n) + '</span>' +
            (m.noCount ? '' : '<span class="fin-ms__n">' + d.counts[n] + '</span>') + '</div>';
        }).join('') + '</div>';

      paintMulti(m);
    }

    /* Listeners only, bound ONCE at boot -- never from buildMulti, which runs
       again on every dataset load and every upload. Both targets survive
       buildMulti's innerHTML replacement: the trigger sits outside the menu,
       and the menu handler is delegated through closest(). That is precisely
       why re-binding them silently doubled every click. */
    function bindMulti(m) {
      var wrap = document.querySelector('[data-ms="' + m.msId + '"]');
      var menu = wrap.querySelector('[data-ms-menu]');

      wrap.querySelector('.fin-dr__trigger').addEventListener('click', function () {
        openMulti(m.msId, !wrap.classList.contains('open'));
      });

      menu.addEventListener('click', function (e) {
        var act = e.target.closest('.sv-menu-act');
        if (act) {
          /* Clearing a set is not a toggle, so All/None are handled before
             the row click. The menu stays open either way — you are usually
             about to tick two or three back on. */
          state.sel[m.msId] = act.getAttribute('data-action') === 'all' ? new Set(ORDER[m.msId]) : new Set();
          paintMulti(m); if (m.onChange) m.onChange(wrap); else render();
          return;
        }
        var item = e.target.closest('.sv-menu-item');
        if (!item) return;
        var v = item.getAttribute('data-value');
        var set = state.sel[m.msId];
        if (set.has(v)) set.delete(v);
        else if (!m.max || set.size < m.max) set.add(v);
        else return;                                   /* at the cap: ignore */
        paintMulti(m); if (m.onChange) m.onChange(wrap); else render();
      });
    }

    /* One menu open at a time — two overlapping panels in a single filter
       row is just a stack of rectangles. */
    function openMulti(key, on) {
      document.querySelectorAll('[data-ms]').forEach(function (w) {
        var open = on && w.getAttribute('data-ms') === key;
        w.classList.toggle('open', open);
        w.querySelector('.fin-dr__trigger').setAttribute('aria-expanded', String(open));
        if (!open) return;
        /* Measured after it is visible, not guessed from position in the
           row: the rightmost filter changes with the viewport. */
        var menu = w.querySelector('[data-ms-menu]');
        if (!menu) return;
        menu.classList.remove('is-right');
        /* Skip the flip when the viewport reports no width -- a hidden or
           zero-sized frame makes every menu look like it overflows, and the
           "fix" then throws it off the left edge instead. */
        var vw = document.documentElement.clientWidth || window.innerWidth || 0;
        if (vw > 0 && menu.getBoundingClientRect().right > vw - 8) {
          menu.classList.add('is-right');
        }
      });
    }

    /* Rebuilt for every dataset that lands: each menu's options, counts and
       selection come from the rows just loaded, and the range resets to that
       dataset's own span. Deliberately binds NOTHING -- see bindFilters. */
    function buildFilters() {
      resetPeriod();
      MULTI.forEach(buildMulti);
      buildMulti(PACE_MULTI);
      buildMulti(PACE_VENDOR);
      /* Narrow the vendor list to the default project straight away, so the
         card opens in the same state a project click would produce. */
      refreshPaceVendors();
    }

    /* Bound ONCE, at boot, before any dataset exists. Every target here is
       in the static markup, so none of it depends on buildFilters having
       run. Splitting these two apart is what makes a tab switch -- and an
       upload, which had the same bug -- safe to repeat. */
    function bindFilters() {
      bindPeriodPicker();
      MULTI.forEach(bindMulti);
      bindMulti(PACE_MULTI);
      bindMulti(PACE_VENDOR);

      document.getElementById('fReset').addEventListener('click', function () {
        /* the pace card's own menu resets too -- "Reset filters" that left a
           control selected somewhere down the page would be a lie */
        MULTI.concat([PACE_MULTI, PACE_VENDOR]).forEach(function (m) {
          state.sel[m.msId] = initialSet(m, ORDER[m.msId]); paintMulti(m);
        });
        /* The vendor list is a function of the project selection, so it has to
           be rebuilt after the reset, not just repainted. */
        refreshPaceVendors();
        setPeriod(P_START, P_END);
        openMulti(null, false);
        render();
      });

      document.addEventListener('mousedown', function (e) {
        if (!e.target.closest('[data-ms]')) openMulti(null, false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') openMulti(null, false);
      });

      document.querySelectorAll('[data-view]').forEach(function (b) {
        b.addEventListener('click', function () {
          var v = b.getAttribute('data-view');
          var dim = DIMENSIONS.filter(function (d) { return d.id === v; })[0];
          state.view[v] = b.getAttribute('data-mode');
          document.querySelectorAll('[data-view="' + v + '"]').forEach(function (o) {
            o.setAttribute('aria-pressed', String(o === b));
          });
          if (dim) animateViewSwitch(dim, function () { renderBreakdown(filtered(), dim); });
          else if (v === 'pace') animateViewSwitch({ id: 'pace' }, function () { renderPace(filtered()); });
          else render();
        });
      });
    }

    /* ---- period: one range picker --------------------------------------
       Two date inputs could not express a RANGE — they let you build a
       backwards one, and they never show the span in relation to itself.
       Here the span is the thing on screen. Two months side by side because
       the loaded period crosses a month boundary; forcing a nav click
       halfway through picking a range is the usual way these go wrong. */
    var DOW = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    var dr = { pendingStart: null, hover: null, view: null };

    function isoOf(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function firstOfMonth(s) { var d = ymd(s); return new Date(d.getFullYear(), d.getMonth(), 1); }
    function shiftMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, 1); }

    function setPeriod(from, to) {
      state.from = from; state.to = to;
      dr.pendingStart = null; dr.hover = null;
      document.getElementById('fPeriodLabel').textContent =
        (from === P_START && to === P_END) ? dmy(from) + ' – ' + dmy(to) + ' (all)'
                                           : dmy(from) + ' – ' + dmy(to);
      paintDays();
    }

    function dayClasses(iso) {
      /* While a range is half-made, the hovered day stands in for the end —
         so the span you are about to commit is the span you can see. */
      var a = dr.pendingStart || state.from;
      var b = dr.pendingStart ? (dr.hover || dr.pendingStart) : state.to;
      var lo = a < b ? a : b, hi = a < b ? b : a;
      if (iso < lo || iso > hi) return '';
      var c = [];
      if (iso === lo) c.push('is-start');
      if (iso === hi) c.push('is-end');
      if (!c.length) c.push('is-in');
      return ' ' + c.join(' ');
    }

    function monthHtml(base, showPrev, showNext) {
      var y = base.getFullYear(), m = base.getMonth();
      var lead = (new Date(y, m, 1).getDay() + 6) % 7;          /* Monday-first */
      var days = new Date(y, m + 1, 0).getDate();
      var minM = firstOfMonth(P_START), maxM = firstOfMonth(P_END);
      var h = '<div class="fin-dr__cal"><div class="fin-dr__head">' +
        (showPrev
          ? '<button class="fin-dr__nav" type="button" data-nav="-1"' +
            (shiftMonths(dr.view, -1) < minM ? ' disabled' : '') +
            ' aria-label="Previous month"><i class="ti ti-chevron-left"></i></button>'
          : '<span style="width:25px"></span>') +
        '<span class="fin-dr__title">' + MON[m] + ' ' + y + '</span>' +
        (showNext
          ? '<button class="fin-dr__nav" type="button" data-nav="1"' +
            (shiftMonths(dr.view, 1) > maxM ? ' disabled' : '') +
            ' aria-label="Next month"><i class="ti ti-chevron-right"></i></button>'
          : '<span style="width:25px"></span>') +
        '</div><div class="fin-dr__grid">';
      DOW.forEach(function (d) { h += '<div class="fin-dr__dow">' + d + '</div>'; });
      for (var i = 0; i < lead; i++) h += '<button class="fin-dr__day is-blank" type="button" disabled></button>';
      for (var day = 1; day <= days; day++) {
        var iso = isoOf(new Date(y, m, day));
        var out = iso < P_START || iso > P_END;   /* outside the loaded file */
        h += '<button class="fin-dr__day' + (out ? '' : dayClasses(iso)) + '" type="button" data-d="' + iso + '"' +
          (out ? ' disabled' : '') + '>' + day + '</button>';
      }
      return h + '</div></div>';
    }

    /* Two functions, deliberately. buildCalendar() replaces the grid — month
       navigation only. paintDays() re-styles the buttons that are already
       there, and is what hover and selection use.

       They were one function, and rebuilding innerHTML on every hover
       detached the button being clicked: the event then bubbled to document
       with a target that was no longer in the popover, so the outside-click
       handler read it as a click elsewhere and dismissed the picker halfway
       through a range. Keep the DOM; change only the classes. */
    function buildCalendar() {
      var host = document.getElementById('fPeriodMonths');
      if (!host || !dr.view) return;
      host.innerHTML = monthHtml(dr.view, true, false) + monthHtml(shiftMonths(dr.view, 1), false, true);
      paintDays();
    }

    function paintDays() {
      var pop = document.getElementById('fPeriodPop');
      if (!pop) return;
      pop.querySelectorAll('[data-d]').forEach(function (el) {
        el.className = 'fin-dr__day' + (el.disabled ? '' : dayClasses(el.getAttribute('data-d')));
      });
      document.getElementById('fPeriodHint').textContent =
        dr.pendingStart ? 'Now pick an end date.' : 'Pick a start date.';
    }

    /* Per dataset: each one opens on its own full span, so switching tabs
       never carries a date range across (BLOCK_26_PLAN decision L4). */
    function resetPeriod() {
      dr.view = firstOfMonth(P_START);
      setPeriod(P_START, P_END);
    }

    /* Hoisted out of the old initPeriodPicker so the handlers below can bind
       once while the range itself is reset per dataset. */
    function drOpen(on) {
      var btn = document.getElementById('fPeriod'), pop = document.getElementById('fPeriodPop');
      /* dr.view is set by resetPeriod when a dataset lands. Clicked before
         that -- during the first load -- there is no month to draw, so the
         picker stays shut rather than rendering an Invalid Date calendar. */
      if (on && !dr.view) return;
      pop.hidden = !on;
      btn.setAttribute('aria-expanded', String(on));
      if (on) { dr.pendingStart = null; dr.hover = null; buildCalendar(); }
    }

    function bindPeriodPicker() {
      var btn = document.getElementById('fPeriod'), pop = document.getElementById('fPeriodPop');
      btn.addEventListener('click', function () { drOpen(pop.hidden); });

      pop.addEventListener('click', function (e) {
        var nav = e.target.closest('[data-nav]');
        if (nav) { dr.view = shiftMonths(dr.view, +nav.getAttribute('data-nav')); buildCalendar(); return; }
        var day = e.target.closest('[data-d]');
        if (!day || day.disabled) return;
        var iso = day.getAttribute('data-d');
        if (!dr.pendingStart) { dr.pendingStart = iso; dr.hover = iso; paintDays(); return; }
        /* Clicking backwards is a legitimate way to pick a range, not an
           error — order the two and commit rather than refusing. */
        var a = dr.pendingStart;
        setPeriod(a < iso ? a : iso, a < iso ? iso : a);
        drOpen(false);
        render();
      });
      pop.addEventListener('mouseover', function (e) {
        if (!dr.pendingStart) return;
        var day = e.target.closest('[data-d]');
        if (day && !day.disabled && day.getAttribute('data-d') !== dr.hover) {
          dr.hover = day.getAttribute('data-d'); paintDays();
        }
      });
      document.getElementById('fPeriodAll').addEventListener('click', function () {
        setPeriod(P_START, P_END); drOpen(false); render();
      });

      /* mousedown, not click: the decision has to be made against the DOM as
         it was when the pointer went down, before any handler re-renders it.
         Dismissing must not half-commit — a pending start is dropped. */
      document.addEventListener('mousedown', function (e) {
        if (!pop.hidden && !pop.contains(e.target) && e.target !== btn && !btn.contains(e.target)) drOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !pop.hidden) { drOpen(false); btn.focus(); }
      });
    }

    /* ---- breakdown: one renderer, three dimensions ---------------------
       Nominal categories get one hue for every bar: darkening by value would
       double-encode bar length and burn the only free channel. The folded
       tail gets neutral grey because it is an aggregate, not a series.

       Month is the odd one out — it has a natural order, so it is NOT ranked
       by size and never folds into "Other". */
    var DIMENSIONS = [
      { id: 'project', key: 'project', label: 'Project', drillBy: 'vendor' },
      { id: 'vendor', key: 'vendor', label: 'Vendor', drillBy: 'project' }
    ];

    function monthLabel(date) { var d = ymd(date + '-01'); return MON[d.getMonth()] + ' ' + d.getFullYear(); }
    function keyOf(r, dim) {
      if (dim.key === 'month') return monthLabel(r.date.slice(0, 7));
      return val(r, dim.key);
    }

    function groupBy(rows, dim) {
      var m = {}, order = [];
      rows.forEach(function (r) {
        var k = keyOf(r, dim);
        if (!m[k]) {
          var sk = dim.key === 'month' ? r.date.slice(0, 7) : k;
          m[k] = { name: k, total: 0, n: 0, sortKey: sk }; order.push(k);
        }
        m[k].total += r.amount; m[k].n++;
      });
      var out = order.map(function (k) { return m[k]; });
      /* Ranked by size, except the blank bucket which is pinned last however
         big it is — same rule the filter menus use. It is a gap in the source
         data, not a project or a vendor, so it should not outrank real ones. */
      return dim.ordered
        ? out.sort(function (a, b) { return a.sortKey < b.sortKey ? -1 : 1; })
        : out.sort(function (a, b) {
            if (a.name === BLANK) return 1;
            if (b.name === BLANK) return -1;
            return b.total - a.total || a.name.localeCompare(b.name);
          });
    }

    /* Round the axis ceiling to something a reader can divide by eye. The
       steps are fine-grained on purpose: a coarse 1/2/5/10 ladder rounds a
       $51k peak up to $100k and spends half the plot on empty space. Every
       step divides evenly by four, so the gridlines land on round numbers. */
    var NICE = [1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10];
    function niceMax(v) {
      if (v <= 0) return 1;
      var mag = Math.pow(10, Math.floor(Math.log10(v))), r = v / mag;
      for (var i = 0; i < NICE.length; i++) if (r <= NICE[i]) return NICE[i] * mag;
      return 10 * mag;
    }

    /* The bucket key for a row. groupBy sets `sortKey` from the same rule, so
       the chart's buckets, the drill-down filter and the stale-selection check
       cannot disagree. Kept as a function though it is now one line: it was
       three separate copies of this expression, and while the Week/Month
       toggle existed two of them silently went on bucketing by month. */
    function bucketKeyOf(r) {
      return r.date.slice(0, 7);
    }

    /* `colour` is optional; when given, every column takes it. Part-covered
       months used to draw in a lighter fill with a legend entry explaining
       it — removed 2026-08-24 at Jenny's request, so every month is drawn the
       same way. The period the card covers is stated by the range picker
       above it. */
    function columnsHtml(shown, max, total, colour) {
      var grid = '';
      for (var g = 4; g >= 0; g--) {
        grid += '<div class="fin-gridline" style="top:' + ((4 - g) * 25) + '%"><span>' +
          tickLabel(max * g / 4) + '</span></div>';
      }
      var cols = shown.map(function (d, i) {
        return '<div class="fin-col" data-i="' + i + '"' +
          (d.sortKey ? ' data-bar="' + esc(d.sortKey) + '"' : '') + '>' +
          '<div class="fin-col__bar" style="height:' + (max ? d.total / max * 100 : 0).toFixed(2) + '%' +
            (colour ? ';background:' + colour : '') + '">' +
          '<span class="fin-col__tag">' + esc(money0(d.total)) + '</span></div></div>';
      }).join('');
      var axis = shown.map(function (d) {
        return '<span>' + esc(d.name) + ' <span class="fin-cols__pct">' + esc(pct(d.total, total)) + '</span></span>';
      }).join('');
      return '<div class="fin-cols"><div class="fin-cols__plot">' + grid + cols +
             '</div><div class="fin-cols__axis">' + axis + '</div></div>';
    }
    function tickLabel(n) {
      if (n >= 1000) return '$' + (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + 'k';
      return '$' + Math.round(n);
    }

    /* The vendor split for one project, rendered closed. Bars are scaled
       within the project, not against the whole slice -- a project's biggest
       vendor should fill its row whatever the project's own size. */
    /* Works in either direction: the project card drills into vendors, the
       vendor card into projects. Only the two keys change -- the owner and
       transaction levels underneath are the same question whichever way in
       you came. */
    function drillHtml(rows, dim, parentName, colour) {
      var childKey = dim.drillBy;
      var mine = rows.filter(function (r) { return val(r, dim.key) === parentName; });
      var vendors = groupBy(mine, { key: childKey });
      var subtotal = sum(mine);

      /* Scaled against the PARENT's total, so a child bar is exactly the
         percentage printed beside it and the children of one row are read
         against each other. On the card's own scale a small project's
         vendors all collapsed into invisible slivers -- Rain's largest was
         1.6% of the track -- which made the panel useless for the projects
         most likely to need reading. The trade is that lengths are no longer
         comparable ACROSS parents; the figures still are. */
      var body = vendors.map(function (v) {
        /* Oldest first: at this level you are reading a history, and a
           history runs forwards. The cards above rank by size; this does not. */
        var txns = mine.filter(function (r) { return val(r, childKey) === v.name; })
                       .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        var key = dim.id + KEYSEP + parentName + KEYSEP + v.name;
        var childColour = childKey === 'project' ? (PROJECT_COLOR[v.name] || 'var(--fin-other)') : colour;
        return '<div class="fin-vend">' +
          '<div class="fin-drill__row fin-drill__row--open" role="button" tabindex="0" aria-expanded="false" data-child="' + esc(key) + '">' +
            '<div class="fin-drill__rowname' + (v.name === BLANK ? ' is-blank' : '') + '" title="' + esc(v.name) + '">' + esc(v.name) + '</div>' +
            '<div class="fin-drill__rowtrack"><div class="fin-drill__rowfill" style="width:' +
              (subtotal ? v.total / subtotal * 100 : 0).toFixed(2) + '%;background:' + childColour + '"></div></div>' +
            '<div class="fin-drill__rowval">' + esc(money0(v.total)) +
              ' <span class="fin-drill__rowpct">' + esc(pct(v.total, subtotal)) + '</span></div>' +
            '<i class="fin-drill__rowchev ti ti-chevron-right" aria-hidden="true"></i>' +
          '</div>' +
          '<div class="fin-txns"><div class="fin-txns__inner"><div class="fin-txns__pad">' +
            '<div class="fin-txn fin-txn__head"><span class="fin-txn__date">Account owner</span><span></span>' +
              '<span style="text-align:right">Amount</span><span></span></div>' +
            groupBy(txns, { key: 'accountOwner' }).map(function (o) {
              var his = txns.filter(function (t) { return val(t, 'accountOwner') === o.name; });
              var okey = key + KEYSEP + o.name;
              return '<div class="fin-own">' +
                '<div class="fin-ownrow" role="button" tabindex="0" aria-expanded="false" data-owner="' + esc(okey) + '">' +
                  '<span class="fin-ownrow__name' + (o.name === BLANK ? ' is-blank' : '') + '" title="' + esc(o.name) + '">' + esc(o.name) + '</span>' +
                  '<span class="fin-ownrow__track"><span class="fin-ownrow__fill" style="display:block;width:' +
                    (v.total ? o.total / v.total * 100 : 0).toFixed(2) + '%;background:' + childColour + '"></span></span>' +
                  '<span class="fin-ownrow__amt">' + esc(money(o.total)) +
                    ' <span class="fin-ownrow__n">\u00d7' + o.n + '</span></span>' +
                  '<i class="fin-ownrow__chev ti ti-chevron-right" aria-hidden="true"></i>' +
                '</div>' +
                '<div class="fin-opanel"><div class="fin-opanel__inner"><div class="fin-opanel__pad">' +
                  his.map(function (t) {
                    return '<div class="fin-txn">' +
                      '<span class="fin-txn__date">' + esc(dmy(t.date)) + '</span>' +
                      '<span></span>' +
                      '<span class="fin-txn__amt">' + esc(money(t.amount)) + '</span>' +
                      '<span></span>' +
                      '</div>';
                  }).join('') +
                '</div></div></div>' +
                '</div>';
            }).join('') +
          '</div></div></div>' +
          '</div>';
      }).join('');

      var noun = childKey === 'vendor' ? 'vendor' : 'project';
      var head = vendors.length
        ? vendors.length + ' ' + noun + (vendors.length === 1 ? '' : 's') + ' \u00b7 ' + money0(subtotal)
        : '';
      return '<div class="fin-drill__panel"><div class="fin-drill__inner">' +
             '<div class="fin-drill__pad" style="color:' + colour + '">' +
             (head ? '<p class="fin-drill__head">' + esc(head) + '</p>' : '') +
             (body || '<p class="fin-drill__more">No vendors in this slice.</p>') +
             '</div></div></div>';
    }

    /* Animate the card between the two view heights on switch. Measured
       from the live DOM rather than stored: a tree opened in one view changes
       the other's height too. */
    function animateViewSwitch(dim, paint) {
      var wrap = document.getElementById('bd-' + dim.id + '-views');
      if (!wrap) { paint(); return; }
      var from = wrap.offsetHeight;
      paint();
      var to = wrap.scrollHeight;
      if (from === to) return;
      wrap.classList.add('is-sizing');
      wrap.style.height = from + 'px';
      void wrap.offsetHeight;                    /* commit the start height */
      wrap.style.height = to + 'px';
      var done = function () {
        wrap.style.height = '';
        wrap.classList.remove('is-sizing');
        wrap.removeEventListener('transitionend', done);
      };
      wrap.addEventListener('transitionend', done);
      setTimeout(done, 400);                     /* in case the event is missed */
    }

    function renderBreakdown(rows, dim) {
      var host = document.getElementById('bd-' + dim.id + '-chart');
      var tblHost = document.getElementById('bd-' + dim.id + '-table');
      var noteEl = document.getElementById('bd-' + dim.id + '-note');
      var chartOn = state.view[dim.id] === 'chart';
      host.hidden = !chartOn; tblHost.hidden = chartOn;

      var all = groupBy(rows, dim), total = sum(rows);
      var over = all.length > LIMIT;
      var shown = (over && !state.expanded[dim.id]) ? all.slice(0, LIMIT) : all;

      /* Scaled to the largest value in the WHOLE group, not the largest one
         currently visible — otherwise every bar resizes when you expand, and
         the same vendor looks bigger in the short list than the long one. */
      var max = all.length ? Math.max.apply(null, all.map(function (d) { return d.total; })) : 1;

      /* Was a ternary on dim.key === 'month', which DIMENSIONS never sets —
         project and vendor only — so the month sentence was unreachable. */
      noteEl.textContent = '';

      if (!rows.length) { host.innerHTML = '<p class="fin-empty">No payments match these filters.</p>'; tblHost.innerHTML = ''; return; }

      if (dim.columns) {
        var cmax = niceMax(Math.max.apply(null, all.map(function (d) { return d.total; })));
        host.innerHTML = columnsHtml(shown, cmax, total);
        host.querySelectorAll('.fin-col').forEach(function (el) {
          var d = shown[+el.getAttribute('data-i')];
          bindTip(el, '<b>' + esc(d.name) + '</b>' +
            '<br><span class="fin-tip__v">' + esc(money(d.total)) + '</span>' +
            '<span class="fin-tip__m"> \u00b7 ' + esc(pct(d.total, total)) + ' of slice \u00b7 ' +
            d.n + ' payment' + (d.n === 1 ? '' : 's') + '</span>');
        });
        renderBreakdownTable(all, rows, total, dim, tblHost);
        return;
      }

      host.innerHTML = '<div class="fin-bars">' + shown.map(function (d, i) {
        /* Projects carry an identity colour from the spreadsheet. Vendors and
