  <!-- Block 19 rail boot. BYTE-IDENTICAL in all 11 authed pages, like the
       rail block in <body>; verification item 3b diffs them.

       This MUST be inline and synchronous, and it must stay in <head>.
       /_lib/side-nav.js is deferred, so it runs only after the document is
       parsed. Anything the rail needs at FIRST PAINT has to be decided here,
       or it visibly changes a moment later — which is what made moving
       between rail items look like a glitch rather than a page change.

       Settled before paint, as classes on <html>:
         sn-boot          layout is active (page gets its left offset)
         sn-section-open  Projects is open — derived from the PAGE, not from
                          storage, so the menu follows where you are: open on
                          a Projects page, shut everywhere else
         sn-at-<key>      which rail item is the current page
         sn-admin         reveal the admin group (a display hint, never a
                          permission — every link behind it is gated
                          server-side, and /api/me corrects it on load)

       sn-at-<key> duplicates activeKey() in /_lib/side-nav.js. That is a
       real drift risk and a deliberate trade: the alternative is the
       highlight appearing a frame late on every navigation. If you change
       one, change both — verification item 4 compares them.

       Keep it tiny and dependency-free: it blocks the parser by design. -->
  <script>(function(){var d=document.documentElement,p=location.pathname,k='';if(p==='/'||p.indexOf('/dashboard')===0)k='dashboard';else if(p.indexOf('/projects')===0||p.indexOf('/project/')===0||p.indexOf('/project.html')===0||p.indexOf('/project_settings')===0)k='projects';else if(p.indexOf('/cross-project')===0)k='cross-project';else if(p.indexOf('/workspace_settings')===0)k='workspace-settings';else if(p.indexOf('/admin')===0)k='members';else if(p.indexOf('/whats-new')===0)k='whats-new';d.classList.add('sn-boot');if(k)d.classList.add('sn-at-'+k);if(k==='projects')d.classList.add('sn-section-open');try{if(localStorage.getItem('elinno.sidenav.admin')==='1')d.classList.add('sn-admin');}catch(e){}})();</script>

  <style>
    /* Cross-project picker per v1.4 mockup screen-11. v1.4 components
       (.brandmark / .wordmark / .eyebrow / .btn-- variants / .card)
       live in auth.css; this <style> only positions them + defines
       picker-local rules.
       NOTE: do NOT write the substring "* /" (no space) inside a CSS
       comment — it prematurely terminates the comment and the next
       rule below (.xp-shell) silently drops. That was the bug fixed
       2026-05-26. */
    .xp-shell { max-width: 760px; margin: 0 auto; padding: 30px 30px 60px; }
    .xp-crumb {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-3);

      font-size: 28px;
      font-weight: 500;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .xp-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0 0 24px;
      max-width: 460px;

    .xp-section-head {

      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .xp-select-all {
      font-family: var(--font);
      font-size: 12px;
      color: var(--brand);
      font-weight: 500;

      border: none;
      padding: 0;

    .xp-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .xp-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 13px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: background var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .xp-row:hover:not(.xp-row--disabled):not(.xp-row--selected) {
      background: var(--brand-soft);
      border-color: var(--brand-soft-border);
    }
    .xp-row--selected {
      border: 0.5px solid var(--brand);
      background: var(--bg-card-tint);

    .xp-row--disabled {

      cursor: not-allowed;

    .xp-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex-shrink: 0;

      align-items: center;

      border: 1.5px solid var(--brand-hair);
      transition: background var(--t-fast), border-color var(--t-fast);

      border-color: var(--brand);
      color: #fff;
    }

    .xp-row--disabled .xp-check {
      border-color: var(--border-input);
      background: #f4f4f4;
    }
    .xp-ptile {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-weight: 600;
      font-size: 15px;
    }
    .xp-row--disabled .xp-ptile {
      background: #f0f0f0;
      color: var(--text-faint);
    }
    /* Block 15.2: img variant of the tile. object-fit:cover keeps
       non-square uploads from distorting in the rounded box. */
    img.xp-ptile { object-fit: cover; }
    .xp-body { flex: 1; min-width: 0; }
    .xp-name {
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }
    .xp-row--disabled .xp-name { color: var(--text-3); }
    .xp-helper {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 2px;
    }
    .xp-chips { display: flex; gap: 6px; flex-shrink: 0; }
    .srcchip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 6px;
      border-radius: var(--r-pill);
      font-family: var(--font);
      font-size: 10px;

      border: 0.5px solid var(--border-soft);

    .srcchip--jira { background: #eaf2ff; border-color: #d0e1ff; color: #1d5dcc; }
    .srcchip--slack { background: #fef7e7; border-color: #f7e3a8; color: #8a6a17; }
    .xp-unavailable {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-faint);

      flex-shrink: 0;
    }

    .xp-member-info {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-faint);

    .xp-foot {

    .xp-loading,
    .xp-empty {
      padding: 60px 0;
      text-align: center;
      color: var(--text-3);

    }

    @media (max-width: 700px) {
      .xp-shell { padding: 22px 18px 60px; }
      .xp-title { font-size: 23px; }
      .xp-foot { flex-direction: column; align-items: stretch; }
      .xp-foot-actions { flex-direction: column-reverse; gap: 9px; }
      .xp-foot-actions .btn { justify-content: center; }
      .xp-foot-summary { text-align: center; margin-bottom: 2px; }
    }
  </style>

  <!-- Block 19 rail tree restore. BYTE-IDENTICAL in all 11 authed pages.
       Runs during parse, right after the rail exists and before first paint.

       Three jobs, all so the menu arrives correct rather than being corrected:
         1. paint the avatar letter
         2. paint the Projects tree from the last page's render, so an open
            section is not empty while /api/projects is in flight
         3. NORMALISE that tree to the CURRENT page — the cache carries
            whichever project was open on the previous screen, so it is
            re-pointed at the project in this URL, or closed entirely when
            this page is not a project. Without this, opening Rain and then
            clicking Members left Rain expanded under a Members highlight.
       Order matters: the tree must exist before scrollTop means anything,
       so the scroll restore is last.
       The markup came from the previous page's own render (escaped there)
       and the live render replaces it moments later. -->
  <script>(function(){try{var d=document.documentElement,p=location.pathname,i=localStorage.getItem('elinno.sidenav.initial'),a=document.getElementById('navUserAvatar');if(a&&i)a.textContent=i;if(d.classList.contains('sn-section-open')){var s=document.querySelector('[data-sn-section="projects"]');if(s)s.setAttribute('aria-expanded','true');var b=document.querySelector('[data-sn-children="projects"]'),h=sessionStorage.getItem('elinno.sidenav.treeHtml');if(b&&h)b.innerHTML=h;}var m=p.match(/^\/(?:project|project_settings)\/([^\/]+)/),slug=m?decodeURIComponent(m[1]):null,rows=document.querySelectorAll('[data-sn-project]');for(var j=0;j<rows.length;j++){var on=slug!==null&&rows[j].getAttribute('data-sn-project')===slug;rows[j].classList.toggle('is-open',on);rows[j].setAttribute('aria-expanded',String(on));var g=rows[j].nextElementSibling;if(g&&g.classList.contains('sn-l3-group'))g.classList.toggle('is-open',on);}var c=document.querySelector('.side-nav__scroll'),y=sessionStorage.getItem('elinno.sidenav.scrollTop');if(c&&y)c.scrollTop=+y;}catch(e){}})();</script>

  <main style="background:var(--bg-subtle);min-height:100vh;">
    <div class="xp-shell">
      <div id="xpRoot">
        <div class="xp-loading">Loading projects…</div>
      </div>
    </div>
  </main>


  <script>
  (function () {
    'use strict';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) {
      return (String(s || '?').trim()[0] || '?').toUpperCase();
    }
    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent('/cross-project/new.html'));
    }

    // ---- state ----
    let me = null;
    let eligible = [];
    const selected = new Set();
    let submitting = false;
    let errorMsg = '';

    async function fetchMe() {
      const r = await fetch('/api/me');
      if (r.status === 401) { redirectToLogin(); return null; }
      if (!r.ok) return null;
      const data = await r.json().catch(() => null);
      return data && data.user ? data.user : null;
    }
    async function fetchEligible() {
      const r = await fetch('/api/cross-project/eligible-projects');
      if (r.status === 401) { redirectToLogin(); return null; }
      if (!r.ok) return [];
      const data = await r.json().catch(() => null);
      if (!data || !Array.isArray(data.projects)) return [];
      return data.projects;
    }

    function isAvailable(p) {
      return Array.isArray(p.connections) && p.connections.length > 0;
    }
    function availableCount() {
      return eligible.reduce((n, p) => n + (isAvailable(p) ? 1 : 0), 0);
    }

    function srcchipHtml(source) {
      if (source === 'jira') {
        return '<span class="srcchip srcchip--jira"><img src="/icons/jira.svg" width="11" height="11" alt=""> Jira</span>';
      }
      if (source === 'slack') {
        return '<span class="srcchip srcchip--slack"><img src="/icons/slack.svg" width="10" height="10" alt=""> Slack</span>';
      }
      return '<span class="srcchip">' + esc(source) + '</span>';
    }

    function rowHtml(p) {
      const available = isAvailable(p);
      const isSel = available && selected.has(p.id);
      const cls = 'xp-row'
        + (available ? '' : ' xp-row--disabled')
        + (isSel ? ' xp-row--selected' : '');
      const check = '<span class="xp-check">' + (isSel ? '<i class="ti ti-check"></i>' : '') + '</span>';
      // Block 15.2: uploaded logo or initial-letter fallback.
      const tile = p.logo_url
        ? '<img class="xp-ptile" src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
        : '<span class="xp-ptile">' + esc(initial(p.name)) + '</span>';
      let trailing;
      if (available) {
        const chips = p.connections.map(c => srcchipHtml(c.source)).join('');
        trailing = '<div class="xp-chips">' + chips + '</div>';
      } else {
        trailing = '<span class="xp-unavailable">Unavailable</span>';
      }
      const helper = available
        ? ''
        : '<div class="xp-helper">No sources connected — can’t be included</div>';
      return ''
        + '<div class="' + cls + '" data-project-id="' + esc(p.id) + (available ? '' : '" data-disabled="1"') + '">'
        +   check
        +   tile
        +   '<div class="xp-body"><div class="xp-name">' + esc(p.name) + '</div>' + helper + '</div>'
        +   trailing
        + '</div>';
    }

    function render() {
      if (eligible.length === 0) {
        document.getElementById('xpRoot').innerHTML = ''
          + '<div class="xp-crumb"><a href="/dashboard.html">Dashboard</a> / New cross-project chat</div>'
          + '<div class="eyebrow"><span class="eyebrow__label">Cross-project</span><span class="eyebrow__rule"></span></div>'
          + '<h1 class="xp-title">Which projects?</h1>'
          + '<p class="xp-sub">No projects in your workspace yet. Create one first, then start a cross-project chat.</p>'
          + '<a href="/projects/new.html" class="btn btn--primary">Create a project</a>';
        return;
      }

      const isAdmin = !!(me && me.is_admin);
      const sectionLabel = isAdmin ? 'Your projects' : 'Projects you can access';
      const availN = availableCount();
      const totalN = eligible.length;
      const selN = selected.size;
      const summary = selN === 0
        ? 'Pick at least one project to start'
        : selN + ' of ' + availN + (isAdmin ? ' connected projects selected' : ' selected');

      const memberInfo = isAdmin
        ? ''
        : '<div class="xp-member-info"><i class="ti ti-info-circle"></i> You can chat across the projects you have access to. Ask a workspace admin to be added to more.</div>';

      const selectAllBtn = (isAdmin && availN > 0)
        ? '<button type="button" class="xp-select-all" id="xpSelectAll"><i class="ti ti-checks"></i> Select all</button>'
        : '';

      const err = errorMsg ? '<div class="xp-error">' + esc(errorMsg) + '</div>' : '';

      document.getElementById('xpRoot').innerHTML = ''
        + '<div class="xp-crumb"><a href="/dashboard.html">Dashboard</a> / New cross-project chat</div>'
        + '<div class="eyebrow"><span class="eyebrow__label">Cross-project</span><span class="eyebrow__rule"></span></div>'
        + '<h1 class="xp-title">Which projects?</h1>'
        + '<p class="xp-sub">Pick the projects this chat reads across. The scope is fixed once you start — begin a new chat to ask across a different set.</p>'
        + err
        + '<div class="xp-section-head">'
        +   '<div class="eyebrow" style="margin:0;"><span class="eyebrow__label" style="letter-spacing:.18em;">' + esc(sectionLabel) + '</span><span class="eyebrow__rule" style="width:44px;"></span></div>'
        +   selectAllBtn
        + '</div>'
        + '<div class="xp-list" id="xpList">' + eligible.map(rowHtml).join('') + '</div>'
        + memberInfo
        + '<div class="xp-foot">'
        +   '<span class="xp-foot-summary">' + esc(summary) + '</span>'
        +   '<div class="xp-foot-actions">'
        +     '<a href="/cross-project/" class="btn btn--ghost">Cancel</a>'
        +     '<button type="button" id="xpStart" class="btn btn--primary"'
        +       ((selN === 0 || submitting) ? ' disabled' : '') + '>'
        +       (submitting ? 'Starting…' : 'Start chat')
        +       ' <i class="ti ti-arrow-right"></i>'
        +     '</button>'
        +   '</div>'
        + '</div>';

      wire();
    }

    function wire() {
      const list = document.getElementById('xpList');
      if (list) {
        list.addEventListener('click', (e) => {
          const row = e.target.closest('.xp-row');
          if (!row) return;
          if (row.getAttribute('data-disabled') === '1') return;
          const id = row.getAttribute('data-project-id');
          if (!id) return;
          if (selected.has(id)) selected.delete(id);
          else selected.add(id);
          errorMsg = '';
          render();
        });
      }
      const selAll = document.getElementById('xpSelectAll');
      if (selAll) {
        selAll.addEventListener('click', () => {
          const allSelected = eligible.every(p => !isAvailable(p) || selected.has(p.id));
          if (allSelected) {
            selected.clear();
          } else {
            for (const p of eligible) {
              if (isAvailable(p)) selected.add(p.id);
            }
          }
          errorMsg = '';
          render();
        });
      }
      const startBtn = document.getElementById('xpStart');
      if (startBtn) startBtn.addEventListener('click', onStart);
    }

    async function onStart() {
      if (submitting || selected.size === 0) return;
      submitting = true;
      errorMsg = '';
      render();

      // Build the slug-form redirect path. Reused by both the
      // "existing chat" and the "newly-created chat" branches below.
      const selectedIds = Array.from(selected);
      const selectedSlugs = selectedIds
        .map(id => (eligible.find(p => p.id === id) || {}).slug)
        .filter(Boolean)
        .sort();
      const haveAllSlugs = selectedSlugs.length === selectedIds.length;
      function redirectTo(convId) {
        const url = haveAllSlugs
          ? '/cross-project/' + selectedSlugs.join('+') + '/' + encodeURIComponent(convId)
          : '/cross-project/chat.html?id=' + encodeURIComponent(convId);
        location.replace(url);
      }

      // One chat per combo (Jenny 2026-05-27): before creating a new
      // conversation, check if one already exists for the exact same
      // project set and open it instead. Avoids duplicate chats stacking
      // up in the sidebar for the same combo.
      try {
        const listRes = await fetch('/api/cross-project/conversations');
        if (listRes.status === 401) { redirectToLogin(); return; }
        if (listRes.ok) {
          const listData = await listRes.json().catch(() => null);
          const conversations = (listData && Array.isArray(listData.conversations)) ? listData.conversations : [];
          const sortedSelected = selectedIds.slice().sort();
          const existing = conversations.find(c => {
            const ids = (Array.isArray(c.project_ids) ? c.project_ids : []).slice().sort();
            if (ids.length !== sortedSelected.length) return false;
            for (let i = 0; i < ids.length; i++) if (ids[i] !== sortedSelected[i]) return false;
            return true;
          });
          if (existing && existing.id) {
            redirectTo(existing.id);
            return;
          }
        }
      } catch {
        // Best-effort lookup; fall through to create-new if it fails.
      }

      let res;
      try {
        res = await fetch('/api/cross-project/conversations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            label: 'product',
            project_ids: selectedIds,
          }),
        });
      } catch {
        submitting = false;
        errorMsg = "Couldn't reach the server. Try again.";
        render();
        return;
      }
      if (res.status === 401) { redirectToLogin(); return; }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        submitting = false;
        errorMsg = (data && data.code === 'project_not_in_workspace')
          ? 'One of the selected projects is no longer in your workspace.'
          : (data && data.code === 'cross_project_empty_set')
            ? 'Pick at least one project.'
            : (data && data.error)
              ? data.error
              : 'Could not start the chat. Try again.';
        render();
        return;
      }
      const data = await res.json().catch(() => null);
      if (!data || !data.conversation || !data.conversation.id) {
        submitting = false;
        errorMsg = 'Chat created but no id returned. Refresh the landing page.';
        render();
        return;
      }
      redirectTo(data.conversation.id);
    }

    function wireNav(user) {
      const avatar = document.getElementById('navUserAvatar');
      if (avatar) {
        const label = (user && user.display_name) || (user && user.email) || '';
        avatar.textContent = initial(label);
        avatar.title = label;
      }
      if (user && user.is_admin) {
        const adminLink = document.getElementById('adminLink');
        if (adminLink) adminLink.style.display = '';
      }
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch {}
          location.replace('/');
        });
      }
    }

    (async function boot() {
      const [user, projects] = await Promise.all([fetchMe(), fetchEligible()]);
      if (user === null || projects === null) return;
      me = user;
      eligible = projects || [];
      wireNav(user);
      render();
    })();
  })();
  </script>
