<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <script src="/_lib/no-zoom.js" defer></script>
  <title>Cross-project chats — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-08-16-1" />
  <style>
    /* Cross-project landing per v1.4. v1.4 components
       (.brandmark/.wordmark/.eyebrow/.btn--*) live in auth.css. */
    .cp-shell { max-width: 760px; margin: 0 auto; padding: 30px 30px 60px; }
    .cp-crumb {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 14px;
    }
    .cp-crumb a { color: var(--brand); text-decoration: none; }
    .cp-head-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 24px;
    }
    .cp-title {
      font-family: var(--font);
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .cp-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0;
      max-width: 460px;
      line-height: 1.5;
    }

    /* Filter banner shown when arriving from the dashboard combo card
       (?ids=<sorted-uuids>). Click "clear" to drop the filter. */
    .cp-filter-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: var(--brand-tint);
      border: 0.5px solid var(--brand-soft-border);
      border-radius: var(--r-md);
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
    }
    .cp-filter-banner__label strong { color: var(--text); font-weight: 500; }
    .cp-filter-banner__clear {
      color: var(--brand);
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* Combo card grid (default view). Same component as the dashboard's
       cross-project section; click a card to drill down into the chats
       inside that combination via ?ids=. */
    .cpcombo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .cpcombo-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cpcombo-card:hover {
      background: var(--brand-tint);
      border-color: var(--brand-soft-border);
    }
    .cpcombo-card__avatars {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    .cpcombo-card__avatars > * {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      border: 2px solid var(--bg);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      object-fit: cover;
      box-sizing: border-box;
    }
    .cpcombo-card__avatars > * + * { margin-left: -10px; }
    .cpcombo-card:hover .cpcombo-card__avatars > * { border-color: var(--brand-tint); }
    .cpcombo-card__more {
      font-size: 11px !important;
      color: var(--text-3) !important;
      background: var(--bg-soft) !important;
    }
    .cpcombo-card__title {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cpcombo-card__meta {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .cpcombo-create {
      background: transparent;
      border: 1.5px dashed var(--brand-soft-border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      transition: background var(--t-fast), border-color var(--t-fast);
      min-height: 120px;
    }
    .cpcombo-create:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }
    .cpcombo-create__icon {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .cpcombo-create__label {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--brand);
    }

    .cp-list { display: flex; flex-direction: column; gap: 10px; }
    .cp-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      border-radius: var(--r-md);
      text-decoration: none;
      color: inherit;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cp-row:hover {
      background: var(--brand-soft);
      border-color: var(--brand-soft-border);
    }
    .cp-row__icon {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .cp-row__body { flex: 1; min-width: 0; }
    .cp-row__title {
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cp-row__scope {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cp-row__meta {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .cp-empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--text-3);
      font-family: var(--font);
      font-size: 13px;
      border: 1.5px dashed var(--border);
      border-radius: var(--r-md);
    }

    .cp-new-cta {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      color: var(--brand);
      border: 1.5px dashed var(--brand-soft-border);
      padding: 16px;
      border-radius: var(--r-md);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-top: 16px;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cp-new-cta:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }

    .cp-loading,
    .cp-error {
      padding: 60px 0;
      text-align: center;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-3);
    }
    .cp-error {
      color: #b80056;
      background: #fff1f7;
      border: 0.5px solid #f6c1d8;
      border-radius: var(--r-md);
      padding: 18px;
    }

    @media (max-width: 700px) {
      .cp-shell { padding: 22px 18px 60px; }
      .cp-title { font-size: 23px; }
      .cp-head-row { flex-direction: column; align-items: flex-start; }
      .cp-row__meta { display: none; }
    }
  </style>
</head>
<body>

  <!-- ===================================================================
       Block 19 side rail. This block is BYTE-IDENTICAL in all 11 authed
       pages and is diffed across them by verification item 3. Do not edit
       one copy — edit every copy, or the drift this rail exists to fix
       starts over. Behavior: /_lib/side-nav.js. Styles: auth.css .side-nav*.
       =================================================================== -->
  <div class="side-nav-head">
    <button class="side-nav-head__toggle" type="button" data-sn-mobile-toggle aria-label="Open navigation" aria-expanded="false"><i class="ti ti-menu-2" aria-hidden="true"></i></button>
    <a class="side-nav-head__brand" href="/dashboard.html"><span class="brandmark"></span><span class="wordmark" style="font-size:14px;">Elinno&nbsp;Agent</span></a>
  </div>
  <div class="side-nav-backdrop" data-sn-backdrop></div>
  <aside class="side-nav" aria-label="Main">
    <div class="side-nav__brand">
      <a class="side-nav__lockup" href="/dashboard.html"><span class="brandmark"></span><span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span></a>
      <button class="side-nav__collapse" type="button" data-sn-toggle aria-label="Expand navigation" aria-expanded="false"><i class="ti ti-chevrons-right" aria-hidden="true"></i></button>
    </div>
    <div class="side-nav__scroll">
      <a class="sn-item" href="/dashboard.html" data-sn-nav="dashboard" title="Dashboard"><i class="ti ti-layout-dashboard" aria-hidden="true"></i><span class="sn-item__label">Dashboard</span></a>
      <button class="sn-item" type="button" data-sn-section="projects" aria-expanded="false" title="Projects"><i class="ti ti-folders" aria-hidden="true"></i><span class="sn-item__label">Projects</span><i class="ti ti-chevron-right sn-chev" aria-hidden="true"></i></button>
      <div data-sn-children="projects"></div>
      <a class="sn-item" href="/cross-project/index.html" data-sn-nav="cross-project" title="Cross-project chats"><i class="ti ti-messages" aria-hidden="true"></i><span class="sn-item__label">Cross-project chats</span></a>
      <div id="adminLink" style="display:none;">
        <div class="sn-divider"></div>
        <a class="sn-item" href="/workspace_settings.html" data-sn-nav="workspace-settings" title="Workspace settings"><i class="ti ti-settings" aria-hidden="true"></i><span class="sn-item__label">Workspace settings</span></a>
        <a class="sn-item" href="/admin.html" data-sn-nav="members" title="Members"><i class="ti ti-shield" aria-hidden="true"></i><span class="sn-item__label">Members</span></a>
      </div>
    </div>
    <div class="side-nav__foot">
      <a class="sn-item wn-navlink" href="/whats-new.html" data-sn-nav="whats-new" title="What's new"><i class="ti ti-sparkles" aria-hidden="true"></i><span class="sn-item__label">What's new</span><span class="wn-navlink__dot" style="display:none;"></span></a>
      <div class="sn-item sn-item--static" data-sn-user><span id="navUserAvatar" class="sn-avatar" title=""></span><span class="sn-item__label" data-sn-username>Account</span></div>
      <button class="sn-item" type="button" id="logoutBtn" title="Log out"><i class="ti ti-logout" aria-hidden="true"></i><span class="sn-item__label">Log out</span></button>
    </div>
  </aside>

  <main style="background:var(--bg-subtle);min-height:100vh;">
    <div class="cp-shell">
      <div id="cpRoot">
        <div class="cp-loading">Loading cross-project chats…</div>
      </div>
    </div>
  </main>


  <script>
  (function () {
    'use strict';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) {
      return (String(s || '?').trim()[0] || '?').toUpperCase();
    }
    function fmtRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + ' hr' + (diffHr === 1 ? '' : 's') + ' ago';
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay === 1) return 'yesterday';
      if (diffDay < 7) return diffDay + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent('/cross-project/'));
    }

    async function loadMe() {
      const r = await fetch('/api/me');
      if (r.status === 401) { redirectToLogin(); return null; }
      const data = await r.json().catch(() => null);
      return data && data.user ? data.user : null;
    }
    async function loadProjects() {
      const r = await fetch('/api/projects');
      if (r.status === 401) { redirectToLogin(); return new Map(); }
      const data = await r.json().catch(() => null);
      const map = new Map();
      if (data && Array.isArray(data.projects)) {
        data.projects.forEach(p => map.set(p.id, p));
      }
      return map;
    }
    async function loadConversations() {
      const r = await fetch('/api/cross-project/conversations');
      if (r.status === 401) { redirectToLogin(); return []; }
      const data = await r.json().catch(() => null);
      if (!data || !Array.isArray(data.conversations)) return [];
      return data.conversations;
    }

    function wireNav(user) {
      const avatar = document.getElementById('navUserAvatar');
      if (avatar) {
        const label = (user && user.display_name) || (user && user.email) || '';
        avatar.textContent = initial(label);
        avatar.title = label;
      }
      if (user && user.is_admin) {
        const adminLink = document.getElementById('adminLink');
        if (adminLink) adminLink.style.display = '';
      }
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch {}
          location.replace('/');
        });
      }
    }

    function rowHtml(chat, projectsById) {
      const projectIds = Array.isArray(chat.project_ids) ? chat.project_ids : [];
      const names = projectIds
        .map(id => (projectsById.get(id) || {}).name || 'Project')
        .join(', ');
      const lastAt = chat.last_message_at || chat.updated_at || chat.created_at;
      const title = chat.title || 'Cross-project chat';
      const scope = projectIds.length === 0
        ? 'No projects'
        : 'Across ' + projectIds.length + ' · ' + names;
      return ''
        + '<a class="cp-row" href="/cross-project/chat.html?id=' + esc(chat.id) + '">'
        +   '<div class="cp-row__icon"><i class="ti ti-messages"></i></div>'
        +   '<div class="cp-row__body">'
        +     '<div class="cp-row__title">' + esc(title) + '</div>'
        +     '<div class="cp-row__scope">' + esc(scope) + '</div>'
        +   '</div>'
        +   '<div class="cp-row__meta">' + esc(fmtRelative(lastAt) || '') + '</div>'
        + '</a>';
    }

    // ?ids=<sorted-uuids> filter: when the user clicks a combo card on
    // the dashboard, this page is opened with the combo's project_ids
    // pre-applied as a filter. Empty / missing param = no filter.
    function getFilterIds() {
      try {
        const ids = new URLSearchParams(location.search).get('ids');
        if (!ids) return null;
        const list = ids.split(',').map(s => s.trim()).filter(Boolean).sort();
        return list.length ? list : null;
      } catch { return null; }
    }

    function filterByIds(conversations, filterIds) {
      if (!filterIds) return conversations;
      return conversations.filter(c => {
        const ids = (Array.isArray(c.project_ids) ? c.project_ids : []).slice().sort();
        if (ids.length !== filterIds.length) return false;
        for (let i = 0; i < ids.length; i++) if (ids[i] !== filterIds[i]) return false;
        return true;
      });
    }

    function filterBannerHtml(filterIds, projectsById) {
      if (!filterIds) return '';
      const names = filterIds
        .map(id => (projectsById.get(id) || {}).name || 'Project')
        .join(' × ');
      return ''
        + '<div class="cp-filter-banner">'
        +   '<div class="cp-filter-banner__label">Filtered by combination: <strong>' + esc(names) + '</strong></div>'
        +   '<a class="cp-filter-banner__clear" href="/cross-project/index.html">Clear filter →</a>'
        + '</div>';
    }

    // Group conversations by the SET of projects they span (same shape
     // as the dashboard's combo-card grouping).
    function groupConversationsByCombo(conversations) {
      const groups = new Map();
      for (const chat of conversations) {
        const ids = (Array.isArray(chat.project_ids) ? chat.project_ids : []).slice().sort();
        if (ids.length === 0) continue;
        const key = ids.join(',');
        if (!groups.has(key)) groups.set(key, { ids, chats: [], lastAt: null });
        const g = groups.get(key);
        g.chats.push(chat);
        const lastAt = chat.last_message_at || chat.updated_at || chat.created_at;
        if (lastAt && (!g.lastAt || lastAt > g.lastAt)) g.lastAt = lastAt;
      }
      return Array.from(groups.values()).sort((a, b) => {
        if (a.lastAt && b.lastAt) return a.lastAt < b.lastAt ? 1 : -1;
        if (a.lastAt) return -1;
        if (b.lastAt) return 1;
        return 0;
      });
    }

    function comboCardHtml(group, projectsById) {
      const projects = group.ids.map(id => projectsById.get(id) || { id, name: 'Project', logo_url: null });
      const title = projects.map(p => p.name).join(' × ');
      const chatCount = group.chats.length;
      const chatLabel = chatCount === 1 ? '1 chat' : (chatCount + ' chats');
      const meta = chatLabel + (group.lastAt ? ' · ' + fmtRelative(group.lastAt) : '');
      const MAX_AVATARS = 10;
      const avatarHtml = projects.slice(0, MAX_AVATARS).map(p =>
        p.logo_url
          ? '<img src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
          : '<div>' + esc(initial(p.name)) + '</div>'
      ).join('')
      + (projects.length > MAX_AVATARS
          ? '<div class="cpcombo-card__more">+' + (projects.length - MAX_AVATARS) + '</div>'
          : '');
      // Slug-form URL. See dashboard.html crossProjectComboCardHtml
       // for the same construction.
      const slugs = projects.map(p => p.slug).filter(Boolean).sort();
      const href = slugs.length === projects.length
        ? '/cross-project/' + slugs.join('+')
        : '/cross-project/chat.html?ids=' + esc(group.ids.join(','));
      return ''
        + '<a class="cpcombo-card" href="' + href + '">'
        +   '<div class="cpcombo-card__avatars">' + avatarHtml + '</div>'
        +   '<div class="cpcombo-card__title">' + esc(title) + '</div>'
        +   '<div class="cpcombo-card__meta">' + esc(meta) + '</div>'
        + '</a>';
    }

    function comboGridHtml(conversations, projectsById) {
      const groups = groupConversationsByCombo(conversations);
      const cards = groups.map(g => comboCardHtml(g, projectsById)).join('');
      const createTile = ''
        + '<a class="cpcombo-create" href="/cross-project/new.html">'
        +   '<div class="cpcombo-create__icon"><i class="ti ti-plus"></i></div>'
        +   '<span class="cpcombo-create__label">New cross-project chat</span>'
        + '</a>';
      return '<div class="cpcombo-grid">' + cards + createTile + '</div>';
    }

    function render(conversations, projectsById) {
      const filterIds = getFilterIds();
      const visible = filterByIds(conversations, filterIds);

      // Two view modes:
      //   - Filtered (?ids=): row list of every chat in the combo + clear-filter banner.
      //   - Default: combo cards grouped by project set (drill-down lands you in filtered mode).
      let body;
      if (filterIds) {
        const emptyMsg = 'No chats match this project combination.';
        const list = visible.length === 0
          ? '<div class="cp-empty">' + emptyMsg + '</div>'
          : '<div class="cp-list">' + visible.map(c => rowHtml(c, projectsById)).join('') + '</div>';
        body = filterBannerHtml(filterIds, projectsById)
          + list
          + '<a href="/cross-project/new.html" class="cp-new-cta"><i class="ti ti-plus"></i> New cross-project chat</a>';
      } else {
        // The "+ New cross-project chat" tile lives inside the grid (it is
        // the empty state too — when zero combos exist, the grid still
        // shows just the create tile).
        body = comboGridHtml(conversations, projectsById);
      }

      document.getElementById('cpRoot').innerHTML = ''
        + '<div class="cp-crumb"><a href="/dashboard.html">Dashboard</a> / Cross-project chats</div>'
        + '<div class="cp-head-row">'
        +   '<div>'
        +     '<div class="eyebrow"><span class="eyebrow__label">Cross-project</span><span class="eyebrow__rule"></span></div>'
        +     '<h1 class="cp-title">Your cross-project chats</h1>'
        +     '<p class="cp-sub">Each chat reads across a fixed set of projects you pick at the start. Begin a new chat to ask across a different set.</p>'
        +   '</div>'
        + '</div>'
        + body;
    }

    function renderError() {
      document.getElementById('cpRoot').innerHTML =
        '<div class="cp-error">Couldn’t load cross-project chats. Refresh to try again.</div>';
    }

    (async function boot() {
      try {
        const me = await loadMe();
        if (!me) { redirectToLogin(); return; }
        wireNav(me);
        const [projectsById, conversations] = await Promise.all([
          loadProjects(),
          loadConversations(),
        ]);
        render(conversations, projectsById);
      } catch {
        renderError();
      }
    })();
  })();
  </script>
  <script src="/_lib/side-nav.js" defer></script>
</body>
</html>
