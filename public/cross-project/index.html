<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cross-project chats — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css" />
  <style>
    /* Cross-project landing per v1.4. v1.4 components
       (.brandmark/.wordmark/.eyebrow/.btn--*) live in auth.css. */
    .cp-shell { max-width: 760px; margin: 0 auto; padding: 30px 30px 60px; }
    .cp-crumb {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 14px;
    }
    .cp-crumb a { color: var(--brand); text-decoration: none; }
    .cp-head-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 24px;
    }
    .cp-title {
      font-family: var(--font);
      font-size: 28px;
      font-weight: 500;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .cp-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0;
      max-width: 460px;
      line-height: 1.5;
    }

    .cp-list { display: flex; flex-direction: column; gap: 10px; }
    .cp-row {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      border-radius: var(--r-md);
      text-decoration: none;
      color: inherit;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cp-row:hover {
      background: var(--brand-soft);
      border-color: var(--brand-soft-border);
    }
    .cp-row__icon {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }
    .cp-row__body { flex: 1; min-width: 0; }
    .cp-row__title {
      font-family: var(--font);
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cp-row__scope {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cp-row__meta {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      flex-shrink: 0;
    }

    .cp-empty {
      padding: 36px 18px;
      text-align: center;
      color: var(--text-3);
      font-family: var(--font);
      font-size: 13px;
      border: 1.5px dashed var(--border);
      border-radius: var(--r-md);
    }

    .cp-new-cta {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      color: var(--brand);
      border: 1.5px dashed var(--brand-soft-border);
      padding: 16px;
      border-radius: var(--r-md);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      margin-top: 16px;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cp-new-cta:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }

    .cp-loading,
    .cp-error {
      padding: 60px 0;
      text-align: center;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-3);
    }
    .cp-error {
      color: #b80056;
      background: #fff1f7;
      border: 0.5px solid #f6c1d8;
      border-radius: var(--r-md);
      padding: 18px;
    }

    @media (max-width: 700px) {
      .cp-shell { padding: 22px 18px 60px; }
      .cp-title { font-size: 23px; }
      .cp-head-row { flex-direction: column; align-items: flex-start; }
      .cp-row__meta { display: none; }
    }
  </style>
</head>
<body>

  <nav class="app-nav" data-sticky-topbar>
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/projects.html">Projects</a>
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" class="pcard__avatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main style="background:var(--bg-subtle);min-height:calc(100vh - 70px);">
    <div class="cp-shell">
      <div id="cpRoot">
        <div class="cp-loading">Loading cross-project chats…</div>
      </div>
    </div>
  </main>

  <script src="/_lib/sticky-topbar.js" defer></script>

  <script>
  (function () {
    'use strict';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) {
      return (String(s || '?').trim()[0] || '?').toUpperCase();
    }
    function fmtRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + ' hr' + (diffHr === 1 ? '' : 's') + ' ago';
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay === 1) return 'yesterday';
      if (diffDay < 7) return diffDay + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent('/cross-project/'));
    }

    async function loadMe() {
      const r = await fetch('/api/me');
      if (r.status === 401) { redirectToLogin(); return null; }
      const data = await r.json().catch(() => null);
      return data && data.user ? data.user : null;
    }
    async function loadProjects() {
      const r = await fetch('/api/projects');
      if (r.status === 401) { redirectToLogin(); return new Map(); }
      const data = await r.json().catch(() => null);
      const map = new Map();
      if (data && Array.isArray(data.projects)) {
        data.projects.forEach(p => map.set(p.id, p));
      }
      return map;
    }
    async function loadConversations() {
      const r = await fetch('/api/cross-project/conversations');
      if (r.status === 401) { redirectToLogin(); return []; }
      const data = await r.json().catch(() => null);
      if (!data || !Array.isArray(data.conversations)) return [];
      return data.conversations;
    }

    function wireNav(user) {
      const avatar = document.getElementById('navUserAvatar');
      if (avatar) {
        const label = (user && user.display_name) || (user && user.email) || '';
        avatar.textContent = initial(label);
        avatar.title = label;
      }
      if (user && user.is_admin) {
        const adminLink = document.getElementById('adminLink');
        if (adminLink) adminLink.style.display = '';
      }
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch {}
          location.replace('/');
        });
      }
    }

    function rowHtml(chat, projectsById) {
      const projectIds = Array.isArray(chat.project_ids) ? chat.project_ids : [];
      const names = projectIds
        .map(id => (projectsById.get(id) || {}).name || 'Project')
        .join(', ');
      const lastAt = chat.last_message_at || chat.updated_at || chat.created_at;
      const title = chat.title || 'Cross-project chat';
      const scope = projectIds.length === 0
        ? 'No projects'
        : 'Across ' + projectIds.length + ' · ' + names;
      return ''
        + '<a class="cp-row" href="/cross-project/chat.html?id=' + esc(chat.id) + '">'
        +   '<div class="cp-row__icon"><i class="ti ti-messages"></i></div>'
        +   '<div class="cp-row__body">'
        +     '<div class="cp-row__title">' + esc(title) + '</div>'
        +     '<div class="cp-row__scope">' + esc(scope) + '</div>'
        +   '</div>'
        +   '<div class="cp-row__meta">' + esc(fmtRelative(lastAt) || '') + '</div>'
        + '</a>';
    }

    function render(conversations, projectsById) {
      const list = conversations.length === 0
        ? '<div class="cp-empty">No cross-project chats yet — start one below.</div>'
        : '<div class="cp-list">' + conversations.map(c => rowHtml(c, projectsById)).join('') + '</div>';
      document.getElementById('cpRoot').innerHTML = ''
        + '<div class="cp-crumb"><a href="/dashboard.html">Dashboard</a> / Cross-project chats</div>'
        + '<div class="cp-head-row">'
        +   '<div>'
        +     '<div class="eyebrow"><span class="eyebrow__label">Cross-project</span><span class="eyebrow__rule"></span></div>'
        +     '<h1 class="cp-title">Your cross-project chats</h1>'
        +     '<p class="cp-sub">Each chat reads across a fixed set of projects you pick at the start. Begin a new chat to ask across a different set.</p>'
        +   '</div>'
        + '</div>'
        + list
        + '<a href="/cross-project/new.html" class="cp-new-cta"><i class="ti ti-plus"></i> New cross-project chat</a>';
    }

    function renderError() {
      document.getElementById('cpRoot').innerHTML =
        '<div class="cp-error">Couldn’t load cross-project chats. Refresh to try again.</div>';
    }

    (async function boot() {
      try {
        const me = await loadMe();
        if (!me) { redirectToLogin(); return; }
        wireNav(me);
        const [projectsById, conversations] = await Promise.all([
          loadProjects(),
          loadConversations(),
        ]);
        render(conversations, projectsById);
      } catch {
        renderError();
      }
    })();
  })();
  </script>
</body>
</html>
