<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cross-project chat — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-05-26-1" />
  <style>
    /* Cross-project chat per v1.4 mockup screen-12. v1.4 components
       (.brandmark / .wordmark / .app-nav / .btn-- variants /
       .conv-item / .menu) live in auth.css; this <style> only
       positions them + defines the chat-local rules: sidebar grid,
       scope row, scopechips, mobile Across (N) ▾ popover, conv-row
       kebab menu (per-row, Block 13.5 pattern from project.html),
       conv toast.

       Block 13.6 (v1.4 Phase 6) consolidates 13.6d-1 (nav + tokens +
       sticky-topbar), 13.6d-2 (read-only Across row, drop edit-scope
       overlay), 13.6d-3 (.conv-row sidebar port), 13.6d-5 (mobile
       Across popover).

       NOTE: do NOT write the substring "* /" (no space) inside a CSS
       comment — it prematurely terminates the comment and the next
       rule below silently drops. Same root cause as the
       .xp-shell bug fixed 2026-05-26 on /cross-project/new.html. */

    .xc-shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 20px 30px;
    }
    .xc-grid {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 18px;
      /* Lock the grid to (viewport − nav − shell padding) so long
         chat histories scroll inside .xc-body instead of the whole
         page. 130px = 70 nav + 18 shell padding-top + 30 shell
         padding-bottom + 12 buffer. min-height keeps the layout
         usable on short viewports (page-level scroll falls back). */
      height: calc(100vh - 130px);
      min-height: 480px;
      align-items: stretch;
    }

    /* Sidebar */
    .xc-sidebar {
      background: var(--bg-subtle);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .xc-sidebar__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      margin-bottom: 12px;
    }
    .xc-sidebar__label {
      font-family: var(--font);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-3);
      font-weight: 600;
    }
    .xc-sidebar__new {
      width: 24px;
      height: 24px;
      border: 0.5px solid var(--border-input);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--brand);
      background: var(--bg);
      text-decoration: none;
      cursor: pointer;
    }
    .xc-sidebar__new:hover { background: var(--brand-soft); border-color: var(--brand); }
    .xc-conv-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    /* .conv-row + ⋯ menu — ported from project.html Block 13.5.
       The .conv-item / .conv-title / .conv-meta + .menu / .kebab-btn
       base styles are in auth.css; this block only adds the wrapper
       positioning + visibility behavior. */
    .conv-item {
      padding: 9px 11px;
      border-radius: 9px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
      display: block;
      transition: background var(--t-fast, 0.1s ease-out), color var(--t-fast, 0.1s ease-out);
    }
    .conv-item:hover { background: var(--brand-soft); color: var(--text); }
    .conv-row.active .conv-item {
      background: var(--brand-tint);
      color: var(--brand-strong);
      font-weight: 500;
    }
    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .conv-row { position: relative; }
    .conv-row .conv-item { padding-right: 32px; }
    .conv-row .conv-title-wrap { display: block; min-width: 0; max-width: 100%; }
    .conv-row .conv-rename-input {
      padding: 2px 6px;
      border: 1px solid var(--brand);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
      outline: none;
      box-shadow: 0 0 0 3px var(--brand-hair);
      width: 100%;
      box-sizing: border-box;
    }
    .conv-menu-trigger {
      position: absolute;
      top: 6px;
      right: 4px;
      opacity: 0;
      transition: opacity var(--t-fast, 0.1s ease-out), background var(--t-fast, 0.1s ease-out);
      z-index: 2;
      width: 24px;
      height: 24px;
      font-size: 14px;
    }
    .conv-row:hover .conv-menu-trigger,
    .conv-menu-trigger[aria-expanded="true"] {
      opacity: 1;
    }
    .conv-menu {
      top: 30px;
      right: 4px;
      min-width: 170px;
    }

    /* Conv toast — floating notice for delete + undo. */
    .conv-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: #fff;
      padding: 12px 16px;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
      z-index: 2000;
      display: none;
    }
    .conv-toast .btn--ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 0.5px solid rgba(255, 255, 255, 0.3);
    }
    .conv-toast .btn--ghost:hover { background: rgba(255, 255, 255, 0.2); }
    .conv-toast-warn { background: #b80056; }

    /* Main column */
    .xc-main {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .xc-crumb {
      padding: 14px 22px 0;
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-3);
    }
    .xc-crumb a { color: var(--brand); text-decoration: none; }

    /* Read-only "Across" scope row */
    .xc-across {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      padding: 12px 22px 14px;
      border-bottom: 0.5px solid var(--border-soft);
    }
    .xc-across__label {
      font-family: var(--font);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-3);
      font-weight: 600;
    }
    .scopechip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px 4px 4px;
      border-radius: var(--r-pill);
      background: var(--brand-soft);
      border: 0.5px solid var(--brand-soft-border);
      font-family: var(--font);
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
    }
    .scopechip__icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    /* Block 15.2: img variant of the scope-chip icon. object-fit:cover
       keeps non-square uploads from distorting in the rounded box. */
    img.scopechip__icon { object-fit: cover; }

    /* Mobile Across (N) ▾ button + popover */
    .xc-across-mobile { display: none; }
    .xc-across-pop {
      position: absolute;
      right: 0;
      top: 42px;
      z-index: 6;
      padding: 6px;
      width: 200px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.22);
      display: none;
    }
    .xc-across-pop.open { display: block; }
    .xc-across-pop__label {
      font-family: var(--font);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      padding: 7px 10px 5px;
    }
    .xc-across-pop__row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      padding: 8px 10px;
    }
    .xc-across-pop__row .scopechip__icon {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      font-size: 11px;
    }
    .xc-across-pop__foot {
      font-family: var(--font);
      font-size: 10px;
      color: var(--text-faint);
      padding: 6px 10px 4px;
      border-top: 0.5px solid #f2f2f2;
      margin-top: 4px;
    }

    /* Chat body + composer */
    .xc-body {
      flex: 1;
      min-height: 0;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .xc-empty {
      margin: 40px auto;
      max-width: 460px;
      text-align: center;
    }
    .xc-empty__icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 22px;
    }
    .xc-empty__title {
      font-family: var(--font);
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 8px;
    }
    .xc-empty__title strong { font-weight: 600; }
    .xc-empty__sub {
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .xc-suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }
    .xc-suggestion {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 13px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      text-align: left;
    }
    .xc-suggestion:hover { background: var(--brand-soft); border-color: var(--brand-soft-border); }
    .xc-suggestion__icon { color: var(--brand); flex-shrink: 0; font-size: 14px; }

    .xc-composer {
      border-top: 0.5px solid var(--border-soft);
      padding: 14px 22px;
      background: var(--bg);
    }
    .xc-composer__error {
      background: #fff1f7;
      border: 0.5px solid #f6c1d8;
      color: #b80056;
      border-radius: var(--r-sm);
      padding: 8px 12px;
      font-family: var(--font);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .xc-composer__row {
      background: var(--bg-subtle);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .xc-composer__input {
      flex: 1;
      background: transparent;
      border: none;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      resize: none;
      min-height: 22px;
      max-height: 180px;
      line-height: 1.45;
      padding: 6px 0;
    }
    .xc-composer__input:focus { outline: none; }
    .xc-composer__send {
      background: var(--brand);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .xc-composer__send:disabled {
      background: var(--text-3);
      opacity: 0.6;
      cursor: not-allowed;
    }
    .xc-composer__footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-family: var(--font);
      font-size: 10px;
      color: var(--text-3);
      padding: 0 2px;
    }

    .xc-loading,
    .xc-error {
      padding: 60px 0;
      text-align: center;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-3);
    }
    .xc-error {
      color: #b80056;
      background: #fff1f7;
      border: 0.5px solid #f6c1d8;
      border-radius: var(--r-md);
      padding: 18px;
      margin: 18px;
    }

    /* Paused banner */
    .xc-paused {
      margin: 18px 22px 0;
      padding: 14px 16px;
      background: #fff8e6;
      border: 0.5px solid #f0d68a;
      border-radius: var(--r-md);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .xc-paused__icon {
      color: #8a6a17;
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .xc-paused__body { flex: 1; }
    .xc-paused__title {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin: 0 0 4px;
    }
    .xc-paused__text {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.5;
      margin: 0 0 8px;
    }
    .xc-paused__actions {
      display: flex;
      gap: 8px;
    }

    /* Mobile (≤700px): collapse sidebar; scope row becomes Across (N) ▾. */
    @media (max-width: 700px) {
      .xc-shell { padding: 12px 12px 30px; }
      .xc-grid { grid-template-columns: 1fr; gap: 0; }
      .xc-sidebar { display: none; }
      .xc-across { display: none; }
      .xc-across-mobile {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 18px 13px;
        border-bottom: 0.5px solid var(--border-soft);
        position: relative;
      }
      .xc-across-mobile__title {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-family: var(--font);
        font-size: 12px;
        color: var(--text-2);
        border: 0.5px solid var(--border);
        border-radius: 9px;
        padding: 7px 12px;
        min-width: 0;
        flex: 1;
      }
      .xc-across-mobile__title i { color: var(--brand); flex-shrink: 0; font-size: 15px; }
      .xc-across-mobile__title span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .xc-across-mobile__btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        color: var(--brand-strong);
        background: var(--brand-tint);
        border: 0.5px solid var(--brand);
        border-radius: 9px;
        padding: 7px 12px;
        cursor: pointer;
      }
      .xc-body { padding: 18px 18px; }
      .xc-composer { padding: 12px 18px; }
    }
  </style>
</head>
<body>

  <nav class="app-nav" data-sticky-topbar>
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" class="pcard__avatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main style="background:var(--bg-subtle);min-height:calc(100vh - 70px);">
    <div class="xc-shell">
      <div id="xcRoot">
        <div class="xc-loading">Loading chat…</div>
      </div>
    </div>
  </main>

  <script src="/_lib/sticky-topbar.js" defer></script>

  <script>
  (function () {
    'use strict';

    // ---------- utils ----------
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    // Minimal, XSS-safe inline markdown for assistant answers. Escape FIRST,
    // then apply a tiny allowlist (asterisk-bold + backtick-code) on the
    // already-escaped string so untrusted tool-result text can't inject
    // markup. The cross-project prompt mandates **bold** project-name
    // headers (rule #3), so this is what makes those render. Underscores are
    // left alone so identifiers aren't italicised; newlines render via
    // .chat-msg-content's white-space: pre-wrap.
    function renderMessageContent(s) {
      let html = esc(s == null ? '' : String(s));
      html = html.replace(/`([^`\n]+?)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
      return html;
    }
    function fmtUsd(n) {
      const num = Number(n) || 0;
      return '$' + num.toFixed(2);
    }
    function fmtRelativeShort(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMin = Math.floor((Date.now() - d.getTime()) / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + 'm ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + 'h ago';
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay < 7) return diffDay + 'd ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function initialOf(name) {
      return (String(name || '?').trim()[0] || '?').toUpperCase();
    }
    function naturalNameList(names) {
      if (names.length === 0) return '';
      if (names.length === 1) return names[0];
      if (names.length === 2) return names[0] + ' and ' + names[1];
      return names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1];
    }
    // Active chat id: prefer the <meta> tag (injected by the slug route
    // functions/cross-project/[combo].js or [combo]/[chat].js), fall
    // back to ?id= (legacy URL form).
    function getConvId() {
      const meta = document.querySelector('meta[name="x-active-chat-id"]')?.getAttribute('content');
      if (meta) return meta;
      const sp = new URLSearchParams(location.search);
      return sp.get('id') || '';
    }
    // Combo filter: prefer <meta name="x-combo-ids"> (slug route), fall
    // back to ?ids= (legacy). Returns a sorted array of project uuids
    // or null when no combo filter is active.
    function getFilterIds() {
      try {
        const fromMeta = document.querySelector('meta[name="x-combo-ids"]')?.getAttribute('content');
        const raw = fromMeta || new URLSearchParams(location.search).get('ids');
        if (!raw) return null;
        const list = raw.split(',').map(s => s.trim()).filter(Boolean).sort();
        return list.length ? list : null;
      } catch { return null; }
    }
    // Build a slug-form combo URL: /cross-project/<sorted-slugs>+joined.
    // 2026-05-27 (shared-workspace-visibility follow-up): convId is no
    // longer included in the URL path — sidebar is the canonical "which
    // chat is open" control, mirroring the single-project pattern in
    // project.html applyState(). The convId parameter is accepted for
    // call-site stability but ignored. Falls back to the legacy
    // /cross-project/chat.html?ids= shape when slugs aren't available
    // yet (projectsById still loading at first paint).
    function chatUrl(_convId, optsIds) {
      const ids = optsIds === undefined ? getFilterIds() : optsIds;
      if (ids && ids.length && projectsById && projectsById.size) {
        const slugs = ids
          .map(id => (projectsById.get(id) || {}).slug)
          .filter(Boolean)
          .sort();
        if (slugs.length === ids.length) {
          return '/cross-project/' + slugs.join('+');
        }
      }
      // Legacy / pre-projectsById fallback.
      const u = new URL('/cross-project/chat.html', location.origin);
      if (ids && ids.length) u.searchParams.set('ids', ids.join(','));
      return u.pathname + u.search;
    }
    function matchesCombo(chat, filterIds) {
      if (!filterIds) return true;
      const ids = (Array.isArray(chat.project_ids) ? chat.project_ids : []).slice().sort();
      if (ids.length !== filterIds.length) return false;
      for (let i = 0; i < ids.length; i++) if (ids[i] !== filterIds[i]) return false;
      return true;
    }
    function redirectToLogin() {
      location.replace('/login.html?next=' + encodeURIComponent(chatUrl(getConvId())));
    }

    // ---------- state ----------
    let me = null;
    let conv = null;            // active conversation
    let conversations = [];     // sidebar list
    let projectsById = new Map();
    let messages = [];
    let workspaceSpend = { used: 0, cap: 20, resets_at: null };
    let inFlight = false;

    function isPaused() {
      return workspaceSpend.cap > 0 && workspaceSpend.used >= workspaceSpend.cap;
    }
    function fmtResetDate(iso) {
      if (!iso) return 'next month';
      const d = new Date(iso);
      if (!isFinite(d)) return 'next month';
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // ---------- data loaders ----------
    async function loadMe() {
      const r = await fetch('/api/me');
      if (r.status === 401) { redirectToLogin(); return null; }
      const data = await r.json().catch(() => null);
      return data && data.user ? data.user : null;
    }
    async function loadProjects() {
      const r = await fetch('/api/projects');
      if (!r.ok) return new Map();
      const data = await r.json().catch(() => null);
      const map = new Map();
      if (data && Array.isArray(data.projects)) {
        data.projects.forEach(p => map.set(p.id, p));
      }
      return map;
    }
    async function loadConv(id) {
      const r = await fetch('/api/cross-project/conversations/' + encodeURIComponent(id));
      if (r.status === 401) { redirectToLogin(); return null; }
      if (r.status === 404) return null;
      const data = await r.json().catch(() => null);
      return data && data.conversation ? data.conversation : null;
    }
    async function loadConvList() {
      const r = await fetch('/api/cross-project/conversations');
      if (r.status === 401) { redirectToLogin(); return []; }
      if (!r.ok) return [];
      const data = await r.json().catch(() => null);
      return data && Array.isArray(data.conversations) ? data.conversations : [];
    }
    async function loadMessages(id) {
      const r = await fetch('/api/cross-project/conversations/' + encodeURIComponent(id) + '/messages');
      if (r.status === 401) { redirectToLogin(); return []; }
      if (!r.ok) return [];
      const data = await r.json().catch(() => null);
      return data && Array.isArray(data.messages) ? data.messages : [];
    }
    async function loadWorkspaceSpend() {
      const r = await fetch('/api/workspace');
      if (r.ok) {
        const data = await r.json().catch(() => null);
        if (data && data.cross_project_ai) {
          return {
            used: Number(data.cross_project_ai.spend_usd) || 0,
            cap: Number(data.cross_project_ai.cap_usd) || 20,
            resets_at: data.cross_project_ai.resets_at || null,
          };
        }
      }
      const r2 = await fetch('/api/dashboard');
      if (!r2.ok) return { used: 0, cap: 20, resets_at: null };
      const data2 = await r2.json().catch(() => null);
      if (!data2 || !data2.workspace) return { used: 0, cap: 20, resets_at: null };
      return {
        used: Number(data2.workspace.cross_project_spend_usd) || 0,
        cap: Number(data2.workspace.cross_project_cap_usd) || 20,
        resets_at: null,
      };
    }

    // ---------- scope helpers ----------
    function scopeProjects() {
      const ids = Array.isArray(conv.project_ids) ? conv.project_ids : [];
      return ids.map(id => {
        const p = projectsById.get(id) || {};
        return {
          id,
          name: p.name || 'Project',
          // Block 15.2: forward logo_url so scope chips can render the
          // uploaded logo instead of the initial-letter placeholder.
          logo_url: p.logo_url || null,
        };
      });
    }
    function scopeNames() {
      return scopeProjects().map(p => p.name);
    }

    // ---------- nav ----------
    function wireNav(user) {
      const avatar = document.getElementById('navUserAvatar');
      if (avatar) {
        const label = (user && user.display_name) || (user && user.email) || '';
        avatar.textContent = initialOf(label);
        avatar.title = label;
      }
      if (user && user.is_admin) {

        if (adminLink) adminLink.style.display = '';
      }
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          try { await fetch('/api/logout', { method: 'POST' }); } catch {}
          location.replace('/');
        });
      }
    }

    // ---------- sidebar (ported from project.html Block 13.5) ----------
    function sidebarHtml() {
      const items = conversations.map(c => {
        const id = esc(c.id);
        const title = esc(c.title || 'Untitled');
        const meta = esc(fmtRelativeShort(c.updated_at) || '');
        const isActive = conv && c.id === conv.id;
        const active = isActive ? ' active' : '';

        return ''
          + '<div class="conv-row' + active + '" data-conv-id="' + id + '">'
          +   '<div class="conv-item" role="button" tabindex="0" data-conv-id="' + id + '">'
          +     '<div class="conv-title-wrap">'
          +       '<span class="conv-title">' + title + '</span>'
          +       '<input class="conv-rename-input" value="' + title + '" maxlength="120" hidden aria-label="Rename conversation">'
          +     '</div>'
          +     (meta ? '<div class="conv-meta" style="font-size:11px;color:var(--text-3);margin-top:3px;">' + meta + '</div>' : '')
          +   '</div>'
          +   '<button class="kebab-btn conv-menu-trigger" type="button" data-menu-toggle="' + menuId + '" aria-haspopup="menu" aria-expanded="false" aria-label="Conversation actions">'
          +     '<i class="ti ti-dots"></i>'
          +   '</button>'
          +   '<div class="menu conv-menu" role="menu" id="' + menuId + '" data-open="false">'
          +     '<button class="menu__item" role="menuitem" type="button" data-action="rename" data-conv-id="' + id + '"><i class="ti ti-pencil"></i>Rename</button>'
          +     '<button class="menu__item menu__item--danger" role="menuitem" type="button" data-action="delete" data-conv-id="' + id + '"><i class="ti ti-trash"></i>Delete</button>'
          +   '</div>'
          + '</div>';
      }).join('');
      return ''
        + '<aside class="xc-sidebar">'
        +   '<div class="xc-sidebar__head">'
        +     '<span class="xc-sidebar__label">Cross-project chats</span>'
        +     '<a class="xc-sidebar__new" id="xcSidebarNewBtn" href="/cross-project/new.html" title="New chat in this combo" aria-label="New chat in this combo">+</a>'
        +   '</div>'
        +   '<div class="xc-conv-list" id="xcConvList">' + items + '</div>'
        + '</aside>';

    // 2026-05-27 (shared-workspace-visibility follow-up):
    // SPA-style chat switch — loads the requested conv + messages and
    // re-renders without a page reload. Mirrors single-project chat
    // (project.html applyState). Used by sidebar clicks/keydown and
    // by the delete fallback. The URL stays /cross-project/<combo> —
    // see chatUrl() comment for the design.
    async function switchToConv(id) {
      if (!id || (conv && id === conv.id)) return;
      const [c, msgs] = await Promise.all([loadConv(id), loadMessages(id)]);
      if (!c) return;
      conv = c;
      messages = msgs || [];
      inFlight = false;
      render();
    }

    function wireSidebar() {
      const list = document.getElementById('xcConvList');
      if (!list) return;
      list.querySelectorAll('.conv-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.conv-rename-input')) return;
          if (e.target.closest('.conv-menu-trigger')) return;
          const id = el.dataset.convId;
          if (id && (!conv || id !== conv.id)) {
            switchToConv(id);
          }
        });
        el.addEventListener('keydown', (e) => {
          if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.conv-rename-input')) {
            e.preventDefault();
            const id = el.dataset.convId;
            if (id && (!conv || id !== conv.id)) {
              switchToConv(id);
            }
          }
        });
      });

      // 2026-05-27 (shared-workspace-visibility follow-up):
      // Sidebar "+" creates a new conversation in the SAME combo as the
      // current chat. Smooth SPA-style swap — no page reload — matching
      // the single-project chat "new conversation" pattern in
      // project.html onNewConv(). The anchor's href stays
      // /cross-project/new.html for graceful no-JS fallback and for
      // Cmd/Ctrl/middle-click power-user escape (open picker in new tab).
      // Available to all authenticated users (POST /api/cross-project/
      // conversations requires auth, not admin).
      const newBtn = document.getElementById('xcSidebarNewBtn');
      if (newBtn) {
        newBtn.addEventListener('click', async (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
          if (!conv || !Array.isArray(conv.project_ids) || conv.project_ids.length < 2) return;
          e.preventDefault();
          if (newBtn.dataset.busy === '1') return;
          newBtn.dataset.busy = '1';
          newBtn.style.opacity = '0.5';
          newBtn.style.pointerEvents = 'none';
          const comboIds = conv.project_ids.slice();
          try {
            const res = await fetch('/api/cross-project/conversations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'same-origin',
              body: JSON.stringify({ label: 'product', project_ids: comboIds }),
            });
            if (res.status === 401) { redirectToLogin(); return; }
            if (!res.ok) {
              newBtn.dataset.busy = '';
              newBtn.style.opacity = '';
              newBtn.style.pointerEvents = '';
              return;
            }
            const data = await res.json().catch(() => null);
            const newConv = data && data.conversation;
            if (!newConv || !newConv.id) {
              newBtn.dataset.busy = '';
              newBtn.style.opacity = '';
              newBtn.style.pointerEvents = '';
              return;
            }
            // SPA-style swap: insert at top of in-memory list, swap
            // active conv, clear messages + inFlight, push URL,
            // re-render. Matches project.html onNewConv() → applyState
            // shape.
            conversations.unshift(newConv);
            conv = newConv;
            messages = [];
            inFlight = false;
            // replaceState (not pushState) so the browser back button
            // returns to where the user was BEFORE opening the previous
            // chat, instead of getting stuck in a popstate loop between
            // chats (the existing chat-switch sidebar uses location.assign
            // which does full nav; popstate isn't wired anywhere here).
            const newUrl = chatUrl(newConv.id, comboIds);
            try { history.replaceState({ convId: newConv.id }, '', newUrl); } catch {}
            render();
            // Focus the composer so the user can start typing right away.
            const input = document.getElementById('xcInput');
            if (input) input.focus();
          } catch {
            newBtn.dataset.busy = '';
            newBtn.style.opacity = '';
            newBtn.style.pointerEvents = '';
          }
        });
      }
    }

    // Conv menu open/close (one at a time).
    let openConvMenu = null;
    function closeConvMenu() {
      if (!openConvMenu) return;
      openConvMenu.setAttribute('data-open', 'false');
      const trigger = document.querySelector('[data-menu-toggle="' + openConvMenu.id + '"]');
      if (trigger) trigger.setAttribute('aria-expanded', 'false');
      openConvMenu = null;
    }
    document.addEventListener('click', (e) => {
      const trigger = e.target.closest('[data-menu-toggle]');
      if (trigger && trigger.classList.contains('conv-menu-trigger')) {
        e.stopPropagation();
        const id = trigger.getAttribute('data-menu-toggle');
        const menu = document.getElementById(id);
        if (!menu) return;
        if (openConvMenu === menu) { closeConvMenu(); return; }
        closeConvMenu();
        menu.setAttribute('data-open', 'true');
        trigger.setAttribute('aria-expanded', 'true');
        openConvMenu = menu;
        return;
      }
      if (openConvMenu && !openConvMenu.contains(e.target)) closeConvMenu();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openConvMenu) closeConvMenu();
    });
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action][data-conv-id]');
      if (!btn) return;
      if (!btn.closest('.conv-menu')) return;
      e.stopPropagation();
      closeConvMenu();
      const id = btn.dataset.convId;
      const action = btn.dataset.action;
      if (action === 'rename') startConvRename(id);
      else if (action === 'delete') deleteConv(id);
    });

    function startConvRename(id) {
      const row = document.querySelector('.conv-row[data-conv-id="' + id + '"]');
      if (!row) return;
      const titleSpan = row.querySelector('.conv-title');
      const input = row.querySelector('.conv-rename-input');
      if (!titleSpan || !input) return;
      input.value = titleSpan.textContent;
      titleSpan.hidden = true;
      input.hidden = false;
      input.focus();
      input.select();
    }
    document.addEventListener('keydown', (e) => {
      if (!e.target.classList || !e.target.classList.contains('conv-rename-input')) return;
      const row = e.target.closest('.conv-row');
      if (!row) return;
      if (e.key === 'Enter') { e.preventDefault(); commitConvRename(row); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelConvRename(row); }
    });
    document.addEventListener('blur', (e) => {
      if (!e.target.classList || !e.target.classList.contains('conv-rename-input')) return;
      const row = e.target.closest('.conv-row');
      if (row) setTimeout(() => cancelConvRename(row), 100);
    }, true);
    async function commitConvRename(row) {
      const input = row.querySelector('.conv-rename-input');
      const titleSpan = row.querySelector('.conv-title');
      const id = row.dataset.convId;
      const next = (input.value || '').trim();
      if (!next) { cancelConvRename(row); return; }
      const prev = titleSpan.textContent;
      titleSpan.textContent = next;
      input.hidden = true;
      titleSpan.hidden = false;
      try {
        const res = await fetch('/api/cross-project/conversations/' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: next }),
        });
        if (!res.ok) {
          titleSpan.textContent = prev;
          showConvToast('Rename failed', 'warn');
          return;
        }
        const c = conversations.find(c => c.id === id);
        if (c) c.title = next;
        if (conv && conv.id === id) conv.title = next;
      } catch {
        titleSpan.textContent = prev;
        showConvToast('Network error', 'warn');
      }
    }
    function cancelConvRename(row) {
      const input = row.querySelector('.conv-rename-input');
      const titleSpan = row.querySelector('.conv-title');
      if (!input || !titleSpan) return;
      input.hidden = true;
      titleSpan.hidden = false;
    }

    async function deleteConv(id) {
      const c = conversations.find(x => x.id === id);
      if (!c) return;
      const wasActive = conv && id === conv.id;
      conversations = conversations.filter(x => x.id !== id);
      const fallback = wasActive ? (conversations[0] || null) : null;
      renderSidebarOnly();

      let serverOk = false;
      try {
        const res = await fetch('/api/cross-project/conversations/' + encodeURIComponent(id), { method: 'DELETE' });
        serverOk = res.ok;
      } catch { serverOk = false; }

      if (!serverOk) {
        conversations.push(c);
        conversations.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        renderSidebarOnly();
        showConvToast('Delete failed', 'warn');
        return;
      }

      if (wasActive) {
        if (fallback) {
          // SPA swap — keep the URL on /cross-project/<combo>.
          await switchToConv(fallback.id);
          return;
        } else {
          // No remaining chats in this combo — bounce out.
          location.assign('/cross-project/');
          return;
        }
      }
      showConvUndoToast(c, false);
    }

    function showConvToast(text, kind, ms) {
      const existing = document.getElementById('convToast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'convToast';
      toast.className = 'conv-toast conv-toast-' + (kind || 'info');
      toast.textContent = text;
      document.body.appendChild(toast);
      toast.style.display = 'block';
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, ms || 3000);
    }
    function showConvUndoToast(c, wasActive) {
      const existing = document.getElementById('convToast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'convToast';
      toast.className = 'conv-toast conv-toast-info';
      toast.style.display = 'flex';
      toast.style.alignItems = 'center';
      toast.style.gap = '12px';
      toast.innerHTML = '<span>"' + esc(c.title || 'Conversation') + '" deleted.</span>';
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.className = 'btn btn--ghost';
      undo.style.padding = '4px 10px';
      undo.style.fontSize = '12px';
      undo.textContent = 'Undo';
      undo.addEventListener('click', async () => {
        toast.remove();
        try {
          const res = await fetch('/api/cross-project/conversations/' + encodeURIComponent(c.id), {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ restore: true }),
          });
          if (!res.ok) { showConvToast('Undo failed', 'warn'); return; }
          conversations.push(c);
          conversations.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
          renderSidebarOnly();
        } catch { showConvToast('Network error', 'warn'); }
      });
      toast.appendChild(undo);
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
    }

    function renderSidebarOnly() {
      const aside = document.querySelector('.xc-sidebar');
      if (!aside) return;
      aside.outerHTML = sidebarHtml();
      wireSidebar();
    }

    // ---------- scope row ----------
    function acrossRowHtml() {
      const scope = scopeProjects();
      // Block 15.2: uploaded logo or initial-letter for each scope chip
      // + the popover row that lists the same projects on mobile.
      const scopeIconHtml = (p) => p.logo_url
        ? '<img class="scopechip__icon" src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
        : '<span class="scopechip__icon">' + esc(initialOf(p.name)) + '</span>';
      const chips = scope.map(p => (
        '<span class="scopechip">' + scopeIconHtml(p) + esc(p.name) + '</span>'
      )).join('');
      const popoverRows = scope.map(p => (
        '<div class="xc-across-pop__row">' + scopeIconHtml(p) + esc(p.name) + '</div>'
      )).join('');
      const convTitle = conv && conv.title ? conv.title : 'Cross-project chat';
      return ''
        + '<div class="xc-crumb"><a href="/cross-project/">Cross-project</a> / ' + esc(convTitle) + '</div>'
        + '<div class="xc-across">'
        +   '<span class="xc-across__label">Across</span>'
        +   chips
        + '</div>'
        + '<div class="xc-across-mobile">'
        +   '<span class="xc-across-mobile__title"><i class="ti ti-messages"></i><span>' + esc(convTitle) + '</span></span>'
        +   '<button type="button" class="xc-across-mobile__btn" id="xcAcrossBtn" aria-expanded="false" aria-controls="xcAcrossPop">Across (' + scope.length + ') <i class="ti ti-chevron-down" style="font-size:13px;"></i></button>'
        +   '<div class="xc-across-pop" id="xcAcrossPop" role="dialog" aria-label="Scope of this chat">'
        +     '<div class="xc-across-pop__label">This chat reads across</div>'
        +     popoverRows
        +     '<div class="xc-across-pop__foot">Set when the chat was created.</div>'
        +   '</div>'
        + '</div>';
    }
    function wireAcrossMobile() {
      const btn = document.getElementById('xcAcrossBtn');
      const pop = document.getElementById('xcAcrossPop');
      if (!btn || !pop) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = pop.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', (e) => {
        if (!pop.classList.contains('open')) return;
        if (e.target.closest('#xcAcrossPop') || e.target.closest('#xcAcrossBtn')) return;
        pop.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    }

    // ---------- messages ----------
    function visibleMessages() {
      return messages.filter(m => {
        if (m.role === 'tool') return false;
        if (m.role === 'assistant' && !(m.content && m.content.length > 0)) return false;
        return true;
      });
    }
    function renderCitationRail(citations) {
      // Dedupe visually-identical chips: one source can be cited by several
      // tool calls in a turn (and duplicate source records can share a
      // name), rendering the same chip 2–3×. Key on project + title so
      // same-named sprints in different projects stay separate; one chip per
      // distinct source. PRD principle 2 still holds.
      const seenChipKeys = new Set();
      const chips = citations.map(c => {
        const titleBase = c.title || c.author || (c.source ? c.source[0].toUpperCase() + c.source.slice(1) : 'Source');
        const chipKey = (c.project_name || '') + '|' + titleBase;
        if (seenChipKeys.has(chipKey)) return '';
        seenChipKeys.add(chipKey);
        const safeBase = esc(titleBase);
        const projectName = c.project_name || '';
        const prefixHtml = projectName
          ? '<span class="citation-chip-prefix">' + esc(projectName) + '</span>'
          : '';
        const inner = prefixHtml + safeBase;
        // Decision 6 (v1.4): citations are non-clickable labels, even
        // when source_url is present. Apply to cross-project too.
        return '<span class="chat-citation chat-citation-noref">' + inner + '</span>';
      }).join('');
      return '<div class="chat-citation-rail">' + chips + '</div>';
    }
    function renderToolTrace(toolCalls) {
      if (!toolCalls || toolCalls.length === 0) return '';
      const items = toolCalls.map(tc => (
        '<li><span class="tool-trace-name">' + esc(tc.name || 'unknown') + '</span> <span class="tool-trace-result ok">✓</span></li>'
      )).join('');
      const summary = '🔧 ' + toolCalls.length + ' tool call' + (toolCalls.length === 1 ? '' : 's');
      return '<details class="tool-trace"><summary>' + esc(summary) + '</summary><ul>' + items + '</ul></details>';
    }
    function renderMessage(m, allMsgs) {
      const isUser = m.role === 'user';
      const userInitial = me && me.email ? initialOf(String(me.email).split('@')[0]) : '?';
      const avatar = isUser ? userInitial : 'EA';
      const rel = fmtRelativeShort(m.created_at) || 'just now';
      const meta = (isUser ? 'You · ' : 'Elinno Agent · ') + rel;
      const citations = !isUser && Array.isArray(m.citations) ? m.citations : [];
      let toolCalls = [];
      if (!isUser) {
        const own = Array.isArray(m.tool_calls) ? m.tool_calls : [];
        if (m.content && m.content.length > 0) {
          const idx = allMsgs.findIndex(am => am.id === m.id);
          const aggregated = [];
          for (let i = idx - 1; i >= 0; i--) {
            const prev = allMsgs[i];
            if (prev.role === 'user') break;
            if (prev.role === 'assistant' && Array.isArray(prev.tool_calls) && prev.tool_calls.length > 0) {
              aggregated.unshift(...prev.tool_calls);
            }
          }
          toolCalls = [...aggregated, ...own];
        } else {
          toolCalls = own;
        }
      }
      let stateClass = '';
      if (!isUser) {
        if (m.model === null || m.model === undefined) stateClass = ' error';
        else if (citations.length === 0) stateClass = ' muted';
      }
      return ''
        + '<div class="chat-msg ' + (isUser ? 'user' : 'assistant') + stateClass + '">'
        +   '<div class="chat-msg-avatar">' + esc(avatar) + '</div>'
        +   '<div class="chat-msg-body">'
        +     '<div class="chat-msg-meta">' + esc(meta) + '</div>'
        +     '<div class="chat-msg-content">' + renderMessageContent(m.content || '') + '</div>'
        +     renderToolTrace(toolCalls)
        +     (citations.length > 0 ? renderCitationRail(citations) : '')
        +   '</div>'
        + '</div>';
    }
    function renderEmpty() {
      const names = scopeNames();
      const prose = naturalNameList(names) || 'your projects';
      return ''
        + '<div class="xc-empty">'
        +   '<div class="xc-empty__icon"><i class="ti ti-affiliate"></i></div>'
        +   '<h2 class="xc-empty__title">Ask across <strong>' + esc(prose) + '</strong></h2>'
        +   '<p class="xc-empty__sub">The agent reads each project and labels every citation with the project name so you can tell which data point came from where.</p>'
        +   '<div class="xc-suggestions">'
        +     suggestionRow('ti-flag', 'Which projects are at risk of missing their sprint?')
        +     suggestionRow('ti-alert-triangle', 'Where are the blockers across all projects?')
        +     suggestionRow('ti-users', 'Across ' + (names.join(' and ') || 'projects') + ', who is the busiest assignee right now?')
        +   '</div>'
        + '</div>';
    }
    function suggestionRow(icon, text) {
      return ''
        + '<button class="xc-suggestion" type="button" data-suggestion="' + esc(text) + '">'
        +   '<i class="ti ' + icon + ' xc-suggestion__icon"></i>'
        +   '<span>' + esc(text) + '</span>'
        + '</button>';
    }
    function renderBody() {
      const visible = visibleMessages();
      if (visible.length === 0) return renderEmpty();
      const all = messages;
      return visible.map(m => renderMessage(m, all)).join('');
    }
    function renderPausedBanner() {
      if (!isPaused()) return '';
      const resetText = fmtResetDate(workspaceSpend.resets_at);
      const names = scopeNames();
      const namesText = names.length > 0 ? names.join(', ') : 'individual projects';
      return ''
        + '<div class="xc-paused">'
        +   '<i class="ti ti-alert-triangle xc-paused__icon"></i>'
        +   '<div class="xc-paused__body">'
        +     '<div class="xc-paused__title">Cross-project chats paused</div>'
        +     '<p class="xc-paused__text">You’ve reached the workspace cap of <strong>' + fmtUsd(workspaceSpend.cap) + '</strong> for cross-project AI this month. Per-project chats (' + esc(namesText) + ') are unaffected. Resumes automatically on <strong>' + esc(resetText) + '</strong>.</p>'
        +     '<div class="xc-paused__actions">'
        +       '<a class="btn btn--primary" href="/workspace_settings.html" style="padding:6px 12px;font-size:12px;">Raise cap</a>'
        +       '<a class="btn btn--ghost" href="/workspace_settings.html" style="padding:6px 12px;font-size:12px;">Workspace settings</a>'
        +     '</div>'
        +   '</div>'
        + '</div>';
    }
    function renderComposer() {
      const pausedNow = isPaused();
      const names = scopeNames();
      const placeholder = pausedNow
        ? 'Cross-project is paused this month'
        : (names.length === 0
          ? 'Ask…'
          : names.length <= 3
            ? 'Ask across ' + names.join(' and ') + '…'
            : 'Ask across ' + names.slice(0, 2).join(', ') + ' and ' + (names.length - 2) + ' more…');
      const footerCap = pausedNow
        ? 'Cross-project AI · <strong style="color:#8a6a17;">' + fmtUsd(workspaceSpend.cap) + ' / ' + fmtUsd(workspaceSpend.cap) + ' — cap reached</strong>'
        : 'Cross-project AI · workspace cap ' + fmtUsd(workspaceSpend.used) + ' / ' + fmtUsd(workspaceSpend.cap) + ' this month';
      const footerHint = pausedNow ? 'Paused' : '↵ to send';
      const rowOpacity = pausedNow ? 'opacity:0.55;cursor:not-allowed;' : '';
      return ''
        + '<div class="xc-composer">'
        +   '<div class="xc-composer__error" id="xcComposerError" style="display:none;"></div>'
        +   '<div class="xc-composer__row" style="' + rowOpacity + '">'
        +     '<textarea class="xc-composer__input" id="xcInput" rows="1" placeholder="' + esc(placeholder) + '" aria-label="Message"' + (pausedNow ? ' disabled' : '') + '></textarea>'
        +     '<button class="xc-composer__send" id="xcSend" type="button" disabled aria-label="Send"><i class="ti ti-send"></i></button>'
        +   '</div>'
        +   '<div class="xc-composer__footer">'
        +     '<div>' + footerCap + '</div>'
        +     '<div>' + footerHint + '</div>'
        +   '</div>'
        + '</div>';
    }

    function render() {
      const root = document.getElementById('xcRoot');
      root.innerHTML = ''
        + '<div class="xc-grid">'
        +   sidebarHtml()
        +   '<section class="xc-main">'
        +     acrossRowHtml()
        +     renderPausedBanner()
        +     '<div class="xc-body" id="xcBody">' + renderBody() + '</div>'
        +     renderComposer()
        +   '</section>'
        + '</div>';
      wireSidebar();
      wireAcrossMobile();
      wireMain();
      const body = document.getElementById('xcBody');
      if (body) body.scrollTop = body.scrollHeight;
    }
    function wireMain() {
      document.querySelectorAll('[data-suggestion]').forEach(btn => {
        btn.addEventListener('click', () => {
          const input = document.getElementById('xcInput');
          if (input) {
            input.value = btn.getAttribute('data-suggestion') || '';
            input.dispatchEvent(new Event('input'));
            input.focus();
          }
        });
      });
      const input = document.getElementById('xcInput');
      const send = document.getElementById('xcSend');
      if (input && send) {
        input.addEventListener('input', () => {
          input.style.height = 'auto';
          input.style.height = input.scrollHeight + 'px';
          send.disabled = inFlight || input.value.trim().length === 0;
        });
        input.addEventListener('keydown', (e) => {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
        send.addEventListener('click', sendMessage);
      }
    }

    function showComposerError(msg) {
      const e = document.getElementById('xcComposerError');
      if (!e) return;
      e.textContent = msg;
      e.style.display = '';
    }
    function clearComposerError() {
      const e = document.getElementById('xcComposerError');
      if (!e) return;
      e.textContent = '';
      e.style.display = 'none';
    }
    function restoreComposer() {
      inFlight = false;
      const input = document.getElementById('xcInput');
      const send = document.getElementById('xcSend');
      if (send) {
        send.innerHTML = '<i class="ti ti-send"></i>';
        send.disabled = !input || input.value.trim().length === 0;
      }
      if (input) {
        input.disabled = false;
        input.focus();
      }
    }

    async function sendMessage() {
      if (inFlight) return;
      const input = document.getElementById('xcInput');
      const send = document.getElementById('xcSend');
      if (!input || !send) return;
      const content = input.value.trim();
      if (content.length === 0) return;

      inFlight = true;
      send.innerHTML = '…';
      send.disabled = true;
      input.disabled = true;
      clearComposerError();

      let res;
      try {
        res = await fetch('/api/cross-project/conversations/' + encodeURIComponent(conv.id) + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }),
        });
      } catch {
        restoreComposer();
        showComposerError("Couldn't reach the server. Try again.");
        return;
      }
      if (res.status === 401) { redirectToLogin(); return; }
      if (res.status === 403) { location.replace('/cross-project/'); return; }
      if (res.status === 402) {
        const data = await res.json().catch(() => ({}));
        if (data && typeof data.cap_usd === 'number') {
          workspaceSpend = {
            used: Number(data.spend_usd) || workspaceSpend.used,
            cap: Number(data.cap_usd) || workspaceSpend.cap,
            resets_at: data.resets_at || workspaceSpend.resets_at,
          };
          if (workspaceSpend.used < workspaceSpend.cap) {
            workspaceSpend.used = workspaceSpend.cap;
          }
        }
        inFlight = false;
        render();
        return;
      }
      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        restoreComposer();
        let msg = data && data.error ? data.error : 'Limit reached.';
        if (data && data.resets_at) {
          const resetDate = new Date(data.resets_at);
          if (!isNaN(resetDate.getTime())) {
            msg = msg + ' Resumes ' + resetDate.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) + '.';
          }
          if (typeof data.used_usd === 'number' && typeof data.cap_usd === 'number') {
            msg = msg + ' ($' + Number(data.used_usd).toFixed(2) + ' / $' + Number(data.cap_usd).toFixed(2) + ')';
          }
        }
        showComposerError(msg);
        return;
      }
      if (!res.ok) {
        restoreComposer();
        showComposerError('Something went wrong. Please try again.');
        return;
      }
      const data = await res.json().catch(() => null);
      if (!data) { restoreComposer(); return; }

      if (data.user_message) messages.push(data.user_message);
      if (data.assistant_message) messages.push(data.assistant_message);
      workspaceSpend = await loadWorkspaceSpend();

      input.value = '';
      input.style.height = '';
      render();
      restoreComposer();
    }

    // ---------- boot ----------
    (async function boot() {
      const filterIds = getFilterIds();
      let id = getConvId();

      // Combo-only mode WITHOUT meta tags (legacy ?ids= URL — no slug
      // route ran server-side). Load projects + conv list in parallel,
      // pick the most-recent chat in the combo, replace the URL with the
      // slug-form path so subsequent loads go through the function.
      // Slug-form URLs reach this page with x-active-chat-id meta
      // already set, so they skip this branch entirely.
      if (!id && filterIds) {
        try {
          me = await loadMe();
          if (!me) { redirectToLogin(); return; }
          const [pmap, convList] = await Promise.all([
            loadProjects(),
            loadConvList(),
          ]);
          projectsById = pmap;
          const match = (convList || []).find(c => matchesCombo(c, filterIds));
          if (match) {
            location.replace(chatUrl(match.id, filterIds));
            return;
          }
          // No chats in this combo — drop to /cross-project/ so the user
          // sees the combo grid (and "+ New cross-project chat" tile).
          location.replace('/cross-project/');
          return;
        } catch {
          document.getElementById('xcRoot').innerHTML = '<div class="xc-error">Couldn’t resolve this combination. <a href="/cross-project/">Back to cross-project chats</a></div>';
          return;
        }
      }

      if (!id) {
        document.getElementById('xcRoot').innerHTML = '<div class="xc-error">No conversation id in URL. <a href="/cross-project/">Back to cross-project chats</a></div>';
        return;
      }
      try {
        if (!me) me = await loadMe();
        if (!me) { redirectToLogin(); return; }
        wireNav(me);
        const [pmap, c, msgs, ws, convList] = await Promise.all([
          loadProjects(),
          loadConv(id),
          loadMessages(id),
          loadWorkspaceSpend(),
          loadConvList(),
        ]);
        projectsById = pmap;
        workspaceSpend = ws;
        // Filter sidebar by the active conv's combo so the user always
        // sees only chats matching the project set they're currently in.
        // When the URL supplied a ?ids=/x-combo-ids filter, prefer that
        // (slug-route consistency); otherwise derive from c.project_ids
        // so legacy /cross-project/chat.html?id=<id> entry points (e.g.
        // new.html's post-create redirect) still filter the sidebar.
        const sidebarFilter = filterIds
          || (c && Array.isArray(c.project_ids) && c.project_ids.length
                ? c.project_ids.slice().sort()
                : null);
        conversations = (convList || []).filter(x => matchesCombo(x, sidebarFilter));
        if (!c) {
          document.getElementById('xcRoot').innerHTML = '<div class="xc-error">Chat not found or you don’t have access. <a href="/cross-project/">Back to cross-project chats</a></div>';
          return;
        }
        conv = c;
        messages = msgs;
        render();
        // 2026-05-27 (shared-workspace-visibility follow-up):
        // Canonicalize the URL — strip the conv-uuid from the path so
        // /cross-project/<combo>/<uuid> becomes /cross-project/<combo>.
        // Matches the single-project chat pattern (project.html
        // applyState() strips ?c=<uuid>). Legacy URLs keep working
        // because the [combo]/[chat].js server function still resolves
        // them; we just rewrite after the page boots.
        try {
          const canonical = chatUrl(null);
          if (canonical && canonical !== location.pathname + location.search) {
            // Only rewrite when chatUrl produced a real slug path (not
            // the chat.html?ids= fallback), to avoid downgrading a good
            // URL on early-boot races.
            if (canonical.startsWith('/cross-project/') && !canonical.includes('chat.html')) {
              history.replaceState(null, '', canonical);
            }
          }
        } catch {}
      } catch {
        document.getElementById('xcRoot').innerHTML = '<div class="xc-error">Couldn’t load this chat. Refresh to try again.</div>';
      }
    })();
  })();
  </script>
</body>
