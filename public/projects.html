  <!-- Block 19 rail boot. BYTE-IDENTICAL in all 11 authed pages, like the
       rail block in <body>; verification item 3b diffs them.

       This MUST be inline and synchronous, and it must stay in <head>.
       /_lib/side-nav.js is deferred, so it runs only after the document is
       parsed. Anything the rail needs at FIRST PAINT has to be decided here,
       or it visibly changes a moment later — which is what made moving
       between rail items look like a glitch rather than a page change.

       Three things are settled before paint, all as classes on <html>:
         sn-boot          layout is active (page gets its left offset)
         sn-expanded      rail width, restored from the last page
         sn-section-open  the Projects section's open/closed state
         sn-at-<key>      which rail item is the current page
         sn-admin         reveal the admin group (a display hint, never a
                          permission — every link behind it is gated
                          server-side, and /api/me corrects it on load)

       sn-at-<key> duplicates activeKey() in /_lib/side-nav.js. That is a
       real drift risk and a deliberate trade: the alternative is the
       highlight appearing a frame late on every navigation. If you change
       one, change both — verification item 4 compares them.

       Keep it tiny and dependency-free: it blocks the parser by design. -->
  <script>(function(){var d=document.documentElement,p=location.pathname,k='';if(p==='/'||p.indexOf('/dashboard')===0)k='dashboard';else if(p.indexOf('/projects')===0||p.indexOf('/project/')===0||p.indexOf('/project.html')===0||p.indexOf('/project_settings')===0)k='projects';else if(p.indexOf('/cross-project')===0)k='cross-project';else if(p.indexOf('/workspace_settings')===0)k='workspace-settings';else if(p.indexOf('/admin')===0)k='members';else if(p.indexOf('/whats-new')===0)k='whats-new';d.classList.add('sn-boot');if(k)d.classList.add('sn-at-'+k);try{if(localStorage.getItem('elinno.sidenav.expanded')==='1')d.classList.add('sn-expanded');if(localStorage.getItem('elinno.sidenav.projectsOpen')==='true')d.classList.add('sn-section-open');if(localStorage.getItem('elinno.sidenav.admin')==='1')d.classList.add('sn-admin');}catch(e){}})();</script>

  <script>
  (function () {
    'use strict';

    let me = null;
    // Last-loaded project list (ordered). Kept so reorder mode can snapshot
    // and restore on Cancel without a refetch.
    let projectsData = [];
    let reordering = false;

    function $(s) { return document.querySelector(s); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) { return (String(s || '?').trim()[0] || '?').toUpperCase(); }
    function fmtRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMs = Date.now() - d.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hr ago' : ' hrs ago');
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay === 1) return 'yesterday';
      if (diffDay < 7) return diffDay + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Workspace "Sync now" (admin-only). Reuses POST /api/sync-all to run an
    // incremental sync of every project + connection; GET returns the
    // workspace-wide MAX(last_sync_at) for the freshness stamp.
    function fmtAbsoluteLocal(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (!isFinite(d)) return null;
      return d.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit',
      });
    }
    function setSyncStamp(html) {
      const el = $('#syncAllStamp'); if (el) el.innerHTML = html;
    }
    async function refreshSyncStamp() {
      try {
        const res = await fetch('/api/sync-all');
        if (!res.ok) return;
        const d = await res.json();
        const abs = fmtAbsoluteLocal(d && d.last_sync_at);
        setSyncStamp(abs ? ('Last sync on <b>' + esc(abs) + '</b>') : 'Not synced yet');
      } catch { /* leave blank */ }
    }
    async function doSyncAll() {
      const btn = $('#syncAllBtn');
      if (!btn) return;
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader"></i> Syncing…';
      try {
        const res = await fetch('/api/sync-all', { method: 'POST' });
        const d = await res.json().catch(() => ({}));
        if (res.status === 429 && d.cooldown) {
          const mins = d.retry_after_seconds ? Math.max(1, Math.ceil(d.retry_after_seconds / 60)) : 1;
          setSyncStamp('Just synced — try again in ' + mins + 'm');
        } else if (res.ok && d.ok) {
          const abs = fmtAbsoluteLocal(d.last_sync_at);
          const n = d.succeeded || 0;
          let msg = abs ? ('Last sync on <b>' + esc(abs) + '</b>') : 'Synced';
          msg += ' · ' + n + ' connection' + (n === 1 ? '' : 's');
          if (d.completedAll === false) msg += ' (partial)';
          if (d.failed) msg += ', ' + d.failed + ' failed';
          setSyncStamp(msg);
        } else {
          setSyncStamp('Sync failed — try again');
        }
      } catch {
        setSyncStamp('Sync failed — check your connection');
      } finally {
        btn.disabled = false; btn.innerHTML = original;
      }
    }
    function initSyncAll() {
      const b = $('#syncAllBtn');
      if (b) b.addEventListener('click', doSyncAll);
      refreshSyncStamp();
    }

    // D6: preserve the page user tried to reach so login can return them here.
    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    // Auth gate
    fetch('/api/me').then(r => r.json()).then(d => {
      if (!d.user) { gotoLogin(); return; }
      me = d.user;
      const av = $('#navUserAvatar');
      av.textContent = initial(me.display_name || me.email);
      av.title = (me.display_name || '') + (me.email ? ' · ' + me.email : '');
      if (me.is_admin) {
        $('#adminLink').style.display = '';
        $('#newProjectAction').style.display = '';
        $('#syncAllAction').style.display = '';
        initSyncAll();
      }
      loadProjects();
    }).catch(() => gotoLogin());

    $('#logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        if (res.status === 401) { gotoLogin(); return; }
        if (!res.ok) { renderError(); return; }
        const data = await res.json();
        const projects = Array.isArray(data.projects) ? data.projects : [];
        projectsData = projects;
        if (projects.length === 0) { renderEmpty(); return; }
        renderPopulated(projects);
      } catch { renderError(); }
    }

    function renderCard(p) {
      const desc = p.description ? '<p class="pcard__desc">' + esc(p.description) + '</p>' : '';
      // Show data freshness: prefer the project's latest connection sync,
      // fall back to the project row's updated_at when nothing has synced.
      const stampTs = p.last_sync_at || p.updated_at;
      const updated = stampTs ? esc(fmtRelative(stampTs)) : '';
      // Block 15.2: render uploaded logo when present, else initial-letter.
      const avatarHtml = p.logo_url
        ? '<img class="pcard__avatar" src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
        : '<div class="pcard__avatar">' + esc(initial(p.name)) + '</div>';
      // Prefer slug routing (Block 13.8); fall back to ?id= if a project
      // is somehow missing a slug. Matches the pattern in dashboard.html.
      const cardHref = p.slug ? '/project/' + esc(p.slug) : '/project.html?id=' + esc(p.id);
      return ''
        + '<a class="pcard" href="' + cardHref + '" data-id="' + esc(p.id) + '">'
        +   '<div class="pcard__head">'
        +     avatarHtml
        +     '<div style="flex:1;min-width:0;">'
        +       '<div class="pcard__name">' + esc(p.name) + '</div>'
        +     '</div>'
        +     '<span class="pcard__grip" aria-hidden="true"><i class="ti ti-grip-vertical"></i></span>'
        +   '</div>'
        +   desc
        +   (updated ? '<div class="pcard__footer">Updated ' + updated + '</div>' : '')
        + '</a>';
    }

    function renderPopulated(projects) {
      const gridCls = (me.is_admin ? 'pj-grid-admin' : 'pj-grid-member')
        + (reordering ? ' reordering' : '');
      const cards = projects.map(renderCard).join('');
      const create = me.is_admin
        ? '<a href="/projects/new.html" class="pcard-create"><div class="pcard-create__icon"><i class="ti ti-plus"></i></div><span class="pcard-create__label">New project</span></a>'
        : '';
      $('#projectsList').innerHTML = '<div class="' + gridCls + '" id="pjGrid">' + cards + create + '</div>';
      // Admin reorder affordance: only meaningful with 2+ projects.
      const canReorder = me.is_admin && projects.length >= 2;
      $('#reorderBtn').style.display = (canReorder && !reordering) ? '' : 'none';
      if (reordering) wireGridDnd();
    }

    function renderEmpty() {
      const list = $('#projectsList');
      if (me.is_admin) {
        list.innerHTML = ''
          + '<div class="pj-state">'
          +   '<div class="pj-state__icon"><i class="ti ti-folder"></i></div>'
          +   '<h2 class="pj-state__title">No projects yet</h2>'
          +   '<p class="pj-state__body">Create your first one to get started. You can connect Slack or Jira after creating it.</p>'
          +   '<a class="btn btn--primary" href="/projects/new.html" style="margin-top:8px;"><i class="ti ti-plus"></i> New project</a>'
          + '</div>';
      } else {
        list.innerHTML = ''
          + '<div class="pj-state">'
          +   '<div class="pj-state__icon"><i class="ti ti-folder"></i></div>'
          +   '<h2 class="pj-state__title">No projects yet</h2>'
          +   '<p class="pj-state__body">Your workspace doesn\'t have any projects. Ask a workspace admin to create one.</p>'
          + '</div>';
      }
    }

    function renderError() {
      $('#projectsList').innerHTML = ''
        + '<div class="pj-state" role="alert">'
        +   '<div class="pj-state__icon" style="background:rgba(179,20,75,0.1);color:var(--danger);"><i class="ti ti-alert-triangle"></i></div>'
        +   '<h2 class="pj-state__title">Couldn\'t load your projects</h2>'
        +   '<p class="pj-state__body">Check your connection or refresh the page if this persists.</p>'
        +   '<button class="btn btn--ghost" id="retryBtn">Retry</button>'
        + '</div>';
    }

    $('#projectsList').addEventListener('click', (e) => {
      if (e.target && e.target.id === 'retryBtn') loadProjects();
    });

    // ---------- Admin drag-to-reorder ----------
    // Global order: admin drags cards, Save persists via PUT /api/projects/order,
    // every user then sees the same order. Cards reorder live in the DOM during
    // drag; Save reads the DOM id order, Cancel re-renders the original list.
    function setReorderButtons() {
      const canReorder = me.is_admin && projectsData.length >= 2;
      $('#reorderBtn').style.display = (canReorder && !reordering) ? '' : 'none';
      $('#reorderSaveBtn').style.display = reordering ? '' : 'none';
      $('#reorderCancelBtn').style.display = reordering ? '' : 'none';
      const np = $('#newProjectAction');
      if (np) np.style.display = (me.is_admin && !reordering) ? '' : 'none';
    }

    function enterReorder() {
      if (reordering) return;
      reordering = true;
      renderPopulated(projectsData); // re-render with .reordering + DnD wiring
      setReorderButtons();
    }

    function exitReorder() {
      reordering = false;
      renderPopulated(projectsData); // canonical (possibly updated) order
      setReorderButtons();
    }

    function wireGridDnd() {
      const grid = document.getElementById('pjGrid');
      if (!grid) return;
      let dragging = null;
      grid.querySelectorAll('.pcard[data-id]').forEach((c) => { c.draggable = true; });

      grid.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.pcard[data-id]');
        if (!card) return;
        dragging = card;
        e.dataTransfer.effectAllowed = 'move';
        // setData is required for Firefox to initiate the drag.
        try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch {}
        card.classList.add('pcard--dragging');
      });

      grid.addEventListener('dragover', (e) => {
        if (!dragging) return;
        const target = e.target.closest('.pcard[data-id]');
        if (!target || target === dragging) { e.preventDefault(); return; }
        e.preventDefault();
        const cards = [...grid.querySelectorAll('.pcard[data-id]')];
        // Insert relative to the card under the cursor based on current order.
        if (cards.indexOf(dragging) < cards.indexOf(target)) {
          grid.insertBefore(dragging, target.nextSibling);
        } else {
          grid.insertBefore(dragging, target);
        }
      });

      grid.addEventListener('drop', (e) => { e.preventDefault(); });

      grid.addEventListener('dragend', () => {
        if (dragging) dragging.classList.remove('pcard--dragging');
        dragging = null;
      });

      // Suppress card navigation while reordering (cards are <a> links).
      grid.addEventListener('click', (e) => {
        if (!reordering) return;
        const card = e.target.closest('.pcard[data-id]');
        if (card) { e.preventDefault(); e.stopPropagation(); }
      }, true);
    }

    async function saveOrder() {
      const grid = document.getElementById('pjGrid');
      if (!grid) return;
      const ids = [...grid.querySelectorAll('.pcard[data-id]')].map((c) => c.dataset.id);
      const saveBtn = $('#reorderSaveBtn');
      saveBtn.disabled = true;
      try {
        const res = await fetch('/api/projects/order', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order: ids }),
        });
        if (res.status === 401) { gotoLogin(); return; }
        if (res.status === 409) {
          // The project set changed since load — refetch the canonical list.
          alert('The project list changed in another tab or session. Reloading the latest order.');
          reordering = false;
          await loadProjects();
          setReorderButtons();
          return;
        }
        if (!res.ok) { alert('Couldn’t save the new order. Please try again.'); return; }
        // Persisted: reorder the in-memory list to match and re-render.
        const byId = new Map(projectsData.map((p) => [p.id, p]));
        projectsData = ids.map((id) => byId.get(id)).filter(Boolean);
        exitReorder();
      } catch {
        alert('Couldn’t save the new order. Please check your connection.');
      } finally {
        saveBtn.disabled = false;
      }
    }

    $('#reorderBtn').addEventListener('click', enterReorder);
    $('#reorderCancelBtn').addEventListener('click', exitReorder);
    $('#reorderSaveBtn').addEventListener('click', saveOrder);
  })();
  </script>
</body>
</html>
