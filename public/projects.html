<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Projects — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-06-01-1" />
  <style>
    /* Projects page layout per v1.4 mockup screen-05. */
    .pj-shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }
    .pj-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 24px;
      gap: 16px;
    }
    .pj-head__left { min-width: 0; }
    .pj-heading {
      font-family: var(--font);
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    .pj-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0;
      line-height: 1.5;
    }
    .pj-grid-admin {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .pj-grid-member {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 700px) {
      .pj-shell { padding: 16px 14px 64px; }
      .pj-heading { font-size: 22px; }
      .pj-head { flex-direction: column; align-items: stretch; }
      .pj-grid-admin,
      .pj-grid-member { grid-template-columns: 1fr; }
      .pj-mobile-new {
        display: block;
        width: 100%;
        text-align: center;
      }
    }
    .pj-mobile-new { display: none; }
    @media (max-width: 700px) { .pj-head .pj-desktop-new { display: none; } }

    .pcard {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .pcard:hover {
      background: var(--brand-tint);
      border-color: var(--brand-soft-border);
    }
    .pcard__head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .pcard__avatar {
      width: 32px; height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    /* Block 15.2: img variant. object-fit:cover keeps non-square
       uploads from distorting in the rounded box. */
    img.pcard__avatar { object-fit: cover; }
    .pcard__name {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      line-height: 1.2;
    }
    .pcard__updated {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .pcard__desc {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.45;
      margin: 4px 0 0;
    }
    .pcard__footer {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid var(--border-soft);
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .pcard-create {
      background: transparent;
      border: 1.5px dashed var(--brand-soft-border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background var(--t-fast), border-color var(--t-fast);
      min-height: 130px;
    }
    .pcard-create:hover { background: var(--brand-soft); border-color: var(--brand); }
    .pcard-create__icon {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 8px;
      font-size: 18px;
    }
    .pcard-create__label {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--brand);
    }

    .pj-state {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 56px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .pj-state__icon {
      width: 44px; height: 44px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .pj-state__title {
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin: 4px 0 0;
    }
    .pj-state__body {
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
      margin: 0;
      max-width: 360px;
      line-height: 1.5;
    }
    .pj-loading { padding: 60px 0; text-align: center; color: var(--text-3); font-family: var(--font); font-size: 13px; }
  </style>
</head>
<body>

  <nav class="app-nav" data-sticky-topbar>
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" class="pcard__avatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main style="background:var(--bg-subtle);min-height:calc(100vh - 70px);">
    <div class="pj-shell">
      <div class="eyebrow">
        <span class="eyebrow__label">Workspace</span>
        <span class="eyebrow__rule"></span>
      </div>
      <div class="pj-head">
        <div class="pj-head__left">
          <h1 class="pj-heading">Your projects</h1>
          <p class="pj-sub">Each project has its own connected sources and chat history. Open one to start asking questions.</p>
        </div>
        <div id="newProjectAction" class="pj-desktop-new" style="display:none;">
          <a href="/projects/new.html" class="btn btn--primary"><i class="ti ti-plus"></i> New project</a>
        </div>
      </div>
      <a id="newProjectMobile" href="/projects/new.html" class="btn btn--primary pj-mobile-new" style="display:none;margin-bottom:16px;"><i class="ti ti-plus"></i> New project</a>
      <div id="projectsList">
        <div class="pj-loading">Loading projects…</div>
      </div>
    </div>
  </main>

  <script src="/_lib/sticky-topbar.js" defer></script>

  <script>
  (function () {
    'use strict';

    let me = null;

    function $(s) { return document.querySelector(s); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) { return (String(s || '?').trim()[0] || '?').toUpperCase(); }
    function fmtRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMs = Date.now() - d.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hr ago' : ' hrs ago');
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay === 1) return 'yesterday';
      if (diffDay < 7) return diffDay + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // D6: preserve the page user tried to reach so login can return them here.
    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    // Auth gate
    fetch('/api/me').then(r => r.json()).then(d => {
      if (!d.user) { gotoLogin(); return; }
      me = d.user;
      const av = $('#navUserAvatar');
      av.textContent = initial(me.display_name || me.email);
      av.title = (me.display_name || '') + (me.email ? ' · ' + me.email : '');
      if (me.is_admin) {
        $('#adminLink').style.display = '';
        $('#newProjectAction').style.display = '';
        $('#newProjectMobile').style.display = '';
      }
      loadProjects();
    }).catch(() => gotoLogin());

    $('#logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    async function loadProjects() {
      try {
        const res = await fetch('/api/projects');
        if (res.status === 401) { gotoLogin(); return; }
        if (!res.ok) { renderError(); return; }
        const data = await res.json();
        const projects = Array.isArray(data.projects) ? data.projects : [];
        if (projects.length === 0) { renderEmpty(); return; }
        renderPopulated(projects);
      } catch { renderError(); }
    }

    function renderCard(p) {
      const desc = p.description ? '<p class="pcard__desc">' + esc(p.description) + '</p>' : '';
      const updated = p.updated_at ? esc(fmtRelative(p.updated_at)) : '';
      // Block 15.2: render uploaded logo when present, else initial-letter.
      const avatarHtml = p.logo_url
        ? '<img class="pcard__avatar" src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
        : '<div class="pcard__avatar">' + esc(initial(p.name)) + '</div>';
      // Prefer slug routing (Block 13.8); fall back to ?id= if a project
      // is somehow missing a slug. Matches the pattern in dashboard.html.
      const cardHref = p.slug ? '/project/' + esc(p.slug) : '/project.html?id=' + esc(p.id);
      return ''
        + '<a class="pcard" href="' + cardHref + '">'
        +   '<div class="pcard__head">'
        +     avatarHtml
        +     '<div style="flex:1;min-width:0;">'
        +       '<div class="pcard__name">' + esc(p.name) + '</div>'
        +     '</div>'
        +   '</div>'
        +   desc
        +   (updated ? '<div class="pcard__footer">Updated ' + updated + '</div>' : '')
        + '</a>';
    }

    function renderPopulated(projects) {
      const gridCls = me.is_admin ? 'pj-grid-admin' : 'pj-grid-member';
      const cards = projects.map(renderCard).join('');
      const create = me.is_admin
        ? '<a href="/projects/new.html" class="pcard-create"><div class="pcard-create__icon"><i class="ti ti-plus"></i></div><span class="pcard-create__label">New project</span></a>'
        : '';
      $('#projectsList').innerHTML = '<div class="' + gridCls + '">' + cards + create + '</div>';
    }

    function renderEmpty() {
      const list = $('#projectsList');
      if (me.is_admin) {
        list.innerHTML = ''
          + '<div class="pj-state">'
          +   '<div class="pj-state__icon"><i class="ti ti-folder"></i></div>'
          +   '<h2 class="pj-state__title">No projects yet</h2>'
          +   '<p class="pj-state__body">Create your first one to get started. You can connect Slack or Jira after creating it.</p>'
          +   '<a class="btn btn--primary" href="/projects/new.html" style="margin-top:8px;"><i class="ti ti-plus"></i> New project</a>'
          + '</div>';
      } else {
        list.innerHTML = ''
          + '<div class="pj-state">'
          +   '<div class="pj-state__icon"><i class="ti ti-folder"></i></div>'
          +   '<h2 class="pj-state__title">No projects yet</h2>'
          +   '<p class="pj-state__body">Your workspace doesn\'t have any projects. Ask a workspace admin to create one.</p>'
          + '</div>';
      }
    }

    function renderError() {
      $('#projectsList').innerHTML = ''
        + '<div class="pj-state" role="alert">'
        +   '<div class="pj-state__icon" style="background:rgba(179,20,75,0.1);color:var(--danger);"><i class="ti ti-alert-triangle"></i></div>'
        +   '<h2 class="pj-state__title">Couldn\'t load your projects</h2>'
        +   '<p class="pj-state__body">Check your connection or refresh the page if this persists.</p>'
        +   '<button class="btn btn--ghost" id="retryBtn">Retry</button>'
        + '</div>';
    }

    $('#projectsList').addEventListener('click', (e) => {
      if (e.target && e.target.id === 'retryBtn') loadProjects();
    });
  })();
  </script>
</body>
</html>
