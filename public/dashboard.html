<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css" />
  <style>
    /* Dashboard layout per v1.4 mockup screen-02. v1.4 components
       (.brandmark/.wordmark/.eyebrow/.surface/.pill/.btn--*) live in
       auth.css; this <style> only positions them. */
    .dash-shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

    .dash-greeting {
      font-family: var(--font);
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .dash-greeting strong { font-weight: 600; }
    .dash-greeting-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0 0 28px;
      line-height: 1.5;
    }

    /* Cross-project dark hero — the single dark surface in the light app. */
    .xp-hero {
      position: relative;
      background: var(--hero-bg);
      color: #fff;
      border-radius: var(--r-lg);
      padding: 28px 30px;
      margin: 0 0 28px;
      overflow: hidden;
    }
    .xp-hero::before {
      content: "";
      position: absolute;
      right: -80px; top: -60px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: var(--brand);
      opacity: 0.4;
      filter: blur(60px);
      pointer-events: none;
    }
    .xp-hero__inner {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }
    .xp-hero__title {
      font-family: var(--font);
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
      margin: 0 0 8px;
      color: #fff;
      max-width: 520px;
    }
    .xp-hero__sub {
      font-family: var(--font);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.5;
      margin: 0;
      max-width: 520px;
    }
    .xp-hero__cta {
      background: #fff;
      color: var(--text);
      border: none;
      padding: 12px 18px;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: transform var(--t-fast), background var(--t-fast);
    }
    .xp-hero__cta:hover { background: #f0f0f0; }

    /* Admin spend meter (visible only when data.user.is_admin === true). */
    .spend-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px 22px;
      margin: 0 0 28px;
    }
    .spend-card__head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .spend-card__title {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .spend-card__pct {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .spend-card__amount {
      font-family: var(--font);
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    /* Projects grid. Admin: 3-up + "+ New project" card. Member: 2-up, no create. */
    .projects-section { margin-top: 8px; }
    .projects-section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .projects-section-head a {
      font-family: var(--font);
      font-size: 12px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
    }
    .projects-grid-admin {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .projects-grid-member {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 700px) {
      .projects-grid-admin,
      .projects-grid-member { grid-template-columns: 1fr; }
      .xp-hero__inner { grid-template-columns: 1fr; }
      .xp-hero__cta { justify-content: center; width: 100%; }
      .dash-shell { padding: 16px 14px 64px; }
      .dash-greeting { font-size: 22px; }
    }

    .pcard {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .pcard:hover {
      background: var(--brand-tint);
      border-color: var(--brand-soft-border);
    }
    .pcard__head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pcard__avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    .pcard__name {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      line-height: 1.2;
    }
    .pcard__updated {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .pcard__sources {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid var(--border-soft);
    }
    .pcard__sources .srcchip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 6px;
      border-radius: var(--r-pill);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
    }
    .pcard__sources .srcchip--jira {
      background: var(--jira-chip);
      border: 0.5px solid var(--jira-chip-border);
      color: var(--jira-text);
    }
    .pcard__sources .srcchip--none {
      color: var(--text-3);
      font-style: italic;
    }
    .pcard-create {
      background: transparent;
      border: 1.5px dashed var(--brand-soft-border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background var(--t-fast), border-color var(--t-fast);
      min-height: 130px;
    }
    .pcard-create:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }
    .pcard-create__icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: 18px;
    }
    .pcard-create__label {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--brand);
    }

    .dash-loading,
    .dash-error {
      padding: 60px 0;
      text-align: center;
      color: var(--text-3);
      font-family: var(--font);
      font-size: 13px;
    }
    .dash-error { color: var(--danger); }
  </style>
</head>
<body>

  <nav class="app-nav" data-sticky-topbar>
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a href="/dashboard.html" class="is-active">Dashboard</a>
        <a href="/projects.html">Projects</a>
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" class="pcard__avatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main style="background:var(--bg-subtle);min-height:calc(100vh - 70px);">
    <div class="dash-shell">
      <div id="dashRoot">
        <div class="dash-loading">Loading workspace…</div>
      </div>
    </div>
  </main>

  <script src="/_lib/sticky-topbar.js" defer></script>

  <script>/* removed for diagnostic */</script>
</body>
</html>
