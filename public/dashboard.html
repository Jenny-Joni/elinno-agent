<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Elinno Agent</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
  <link rel="stylesheet" href="/auth.css?v=2026-05-26-1" />
  <style>
    /* Dashboard layout per v1.4 mockup screen-02. v1.4 components
       (.brandmark/.wordmark/.eyebrow/.surface/.pill/.btn--*) live in
       auth.css; this <style> only positions them. */
    .dash-shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

    .dash-greeting {
      font-family: var(--font);
      font-size: 28px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .dash-greeting strong { font-weight: 600; }
    .dash-greeting-sub {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-2);
      margin: 0 0 28px;
      line-height: 1.5;
    }

    /* Cross-project dark hero — the single dark surface in the light app. */
    .xp-hero {
      position: relative;
      background: var(--hero-bg);
      color: #fff;
      border-radius: var(--r-lg);
      padding: 28px 30px;
      margin: 0 0 28px;
      overflow: hidden;
    }
    .xp-hero::before {
      content: "";
      position: absolute;
      right: -80px; top: -60px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: var(--brand);
      opacity: 0.4;
      filter: blur(60px);
      pointer-events: none;
    }
    .xp-hero__inner {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: center;
    }
    .xp-hero__title {
      font-family: var(--font);
      font-size: 24px;
      font-weight: 500;
      line-height: 1.2;
      margin: 0 0 8px;
      color: #fff;
      max-width: 520px;
    }
    .xp-hero__sub {
      font-family: var(--font);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.5;
      margin: 0;
      max-width: 520px;
    }
    .xp-hero__cta {
      background: #fff;
      color: var(--text);
      border: none;
      padding: 12px 18px;
      border-radius: var(--r-sm);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      transition: transform var(--t-fast), background var(--t-fast);
    }
    .xp-hero__cta:hover { background: #f0f0f0; }

    /* Cross-project chats section. Chats are grouped by the SET of
       projects they span (sorted project_ids signature) and each
       unique combination renders as one card. Card → filtered
       /cross-project/index.html?ids=<sorted-uuids>. */
    .cpchats-section { margin-top: 8px; margin-bottom: 28px; }
    .cpchats-section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .cpchats-section-head a {
      font-family: var(--font);
      font-size: 12px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
    }
    .cpcombo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .cpcombo-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .cpcombo-card:hover {
      background: var(--brand-tint);
      border-color: var(--brand-soft-border);
    }
    .cpcombo-card__avatars {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }
    /* Each avatar slot (img OR initial-letter div OR +N overflow chip)
       is the same 32px square with a tight 2px ring matching the card
       background so overlapping reads as a stack. */
    .cpcombo-card__avatars > * {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      border: 2px solid var(--bg);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
      object-fit: cover;
      box-sizing: border-box;
    }
    .cpcombo-card__avatars > * + * { margin-left: -10px; }
    .cpcombo-card:hover .cpcombo-card__avatars > * { border-color: var(--brand-tint); }
    .cpcombo-card__more {
      font-size: 11px !important;
      color: var(--text-3) !important;
      background: var(--bg-soft) !important;
    }
    .cpcombo-card__title {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cpcombo-card__meta {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    /* Dashed "+ New cross-project chat" tile that sits at the end of
       the combo grid. Mirrors .pcard-create from the projects grid. */
    .cpcombo-create {
      background: transparent;
      border: 1.5px dashed var(--brand-soft-border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
      transition: background var(--t-fast), border-color var(--t-fast);
      min-height: 120px;
    }
    .cpcombo-create:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }
    .cpcombo-create__icon {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .cpcombo-create__label {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--brand);
    }

    /* Projects grid. Admin: 3-up + "+ New project" card. Member: 2-up, no create. */
    .projects-section { margin-top: 8px; }
    .projects-section-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }
    .projects-section-head a {
      font-family: var(--font);
      font-size: 12px;
      color: var(--brand);
      text-decoration: none;
      font-weight: 500;
    }
    .projects-grid-admin {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .projects-grid-member {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (max-width: 700px) {
      .projects-grid-admin,
      .projects-grid-member { grid-template-columns: 1fr; }
      .xp-hero__inner { grid-template-columns: 1fr; }
      .xp-hero__cta { justify-content: center; width: 100%; }
      .dash-shell { padding: 16px 14px 64px; }
      .dash-greeting { font-size: 22px; }
    }

    .pcard {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: background var(--t-fast), border-color var(--t-fast);
    }
    .pcard:hover {
      background: var(--brand-tint);
      border-color: var(--brand-soft-border);
    }
    .pcard__head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .pcard__avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    /* Block 15.2: img variant. object-fit:cover keeps non-square
       uploads from distorting in the rounded box. */
    img.pcard__avatar { object-fit: cover; }
    .pcard__name {
      font-family: var(--font);
      font-weight: 500;
      font-size: 14px;
      color: var(--text);
      line-height: 1.2;
    }
    .pcard__updated {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
    }
    .pcard__sources {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 0.5px solid var(--border-soft);
    }
    .pcard__sources .srcchip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 6px;
      border-radius: var(--r-pill);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 500;
    }
    .pcard__sources .srcchip--jira {
      background: var(--jira-chip);
      border: 0.5px solid var(--jira-chip-border);
      color: var(--jira-text);
    }
    .pcard__sources .srcchip--none {
      color: var(--text-3);
      font-style: italic;
    }
    .pcard-create {
      background: transparent;
      border: 1.5px dashed var(--brand-soft-border);
      border-radius: var(--r-md);
      padding: 18px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background var(--t-fast), border-color var(--t-fast);
      min-height: 130px;
    }
    .pcard-create:hover {
      background: var(--brand-soft);
      border-color: var(--brand);
    }
    .pcard-create__icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      font-size: 18px;
    }
    .pcard-create__label {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--brand);
    }

    .dash-loading,
    .dash-error {
      padding: 60px 0;
      text-align: center;
      color: var(--text-3);
      font-family: var(--font);
      font-size: 13px;
    }
    .dash-error { color: var(--danger); }
  </style>
</head>
<body>

  <nav class="app-nav" data-sticky-topbar>
    <div class="app-nav-inner">
      <a href="/dashboard.html" class="app-brand" style="display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:inherit;">
        <span class="brandmark"></span>
        <span class="wordmark" style="font-size:15px;">Elinno&nbsp;Agent</span>
      </a>
      <div class="app-nav-actions">
        <a id="adminLink" href="/admin.html" style="display:none;">Admin</a>
        <span id="navUserAvatar" class="pcard__avatar" style="width:28px;height:28px;background:var(--brand);color:#fff;font-size:11px;border-radius:50%;" title=""></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button" style="padding:6px 12px;font-size:12px;">Log out</button>
      </div>
    </div>
  </nav>

  <main style="background:var(--bg-subtle);min-height:calc(100vh - 70px);">
    <div class="dash-shell">
      <div id="dashRoot">
        <div class="dash-loading">Loading workspace…</div>
      </div>
    </div>
  </main>

  <script src="/_lib/sticky-topbar.js" defer></script>

  <script>
  (function () {
    'use strict';

    function $(s, root) { return (root || document).querySelector(s); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function fmtUsd(n) {
      const num = Number(n) || 0;
      return '$' + num.toFixed(2);
    }
    function timeOfDay() {
      const h = new Date().getHours();
      if (h < 12) return 'morning';
      if (h < 18) return 'afternoon';
      return 'evening';
    }
    function nameFromUser(user) {
      // Use display_name if present; fall back to email local-part with title-case.
      if (user && user.display_name && user.display_name.trim()) return user.display_name.trim();
      if (!user || !user.email) return 'there';
      const local = String(user.email).split('@')[0];
      const first = local.split(/[._-]/)[0] || local;
      return first.charAt(0).toUpperCase() + first.slice(1);
    }
    function initial(s) {
      return (String(s || '?').trim()[0] || '?').toUpperCase();
    }
    function fmtRelative(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (!isFinite(d)) return '';
      const diffMs = Date.now() - d.getTime();
      const diffMin = Math.floor(diffMs / 60000);
      if (diffMin < 1) return 'just now';
      if (diffMin < 60) return diffMin + ' min ago';
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hr ago' : ' hrs ago');
      const diffDay = Math.floor(diffHr / 24);
      if (diffDay === 1) return 'yesterday';
      if (diffDay < 7) return diffDay + ' days ago';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function renderGreeting(user, projects) {
      const greeting = nameFromUser(user);
      const count = projects.length;
      const noun = count === 1 ? 'project' : 'projects';
      return ''
        + '<div class="eyebrow"><span class="eyebrow__label">Workspace</span><span class="eyebrow__rule"></span></div>'
        + '<h1 class="dash-greeting">Good ' + timeOfDay() + ', <strong>' + esc(greeting) + '</strong></h1>'
        + '<p class="dash-greeting-sub">' + count + ' ' + noun + ' in your workspace. Ask on any one, or start a chat that spans every project.</p>';
    }

    function renderHero() {
      return ''
        + '<div class="xp-hero">'
        +   '<div class="xp-hero__inner">'
        +     '<div>'
        +       '<h2 class="xp-hero__title">Ask across all your projects at once</h2>'
        +       '<p class="xp-hero__sub">Track delivery across projects — who\'s shipping, who\'s blocked, what\'s at risk.</p>'
        +     '</div>'
        +     '<a class="xp-hero__cta" href="/cross-project/new.html">Start chat <i class="ti ti-arrow-right"></i></a>'
        +   '</div>'
        + '</div>';
    }

    // Cross-project chats grouped by the SET of projects they span.
    // Multiple chats covering the same combination (e.g., "Joni × Rain")
    // collapse into a single card; click opens the filtered list page.
    // Caps shown combinations at MAX_CP_COMBOS; overflow → "View all →".
    const MAX_CP_COMBOS = 4;

    function groupConversationsByCombo(conversations) {
      const groups = new Map(); // key: sorted ids joined by comma
      for (const chat of conversations) {
        const ids = (Array.isArray(chat.project_ids) ? chat.project_ids : []).slice().sort();
        if (ids.length === 0) continue; // skip orphan / no-project chats
        const key = ids.join(',');
        if (!groups.has(key)) groups.set(key, { ids, chats: [], lastAt: null });
        const g = groups.get(key);
        g.chats.push(chat);
        const lastAt = chat.last_message_at || chat.updated_at || chat.created_at;
        if (lastAt && (!g.lastAt || lastAt > g.lastAt)) g.lastAt = lastAt;
      }
      // Newest-activity-first ordering.
      return Array.from(groups.values()).sort((a, b) => {
        if (a.lastAt && b.lastAt) return a.lastAt < b.lastAt ? 1 : -1;
        if (a.lastAt) return -1;
        if (b.lastAt) return 1;
        return 0;
      });
    }

    function renderCrossProjectChatsSection(conversations, projectsById) {
      const groups = (conversations && conversations.length)
        ? groupConversationsByCombo(conversations)
        : [];
      const shown = groups.slice(0, MAX_CP_COMBOS);
      const cards = shown.map(g => crossProjectComboCardHtml(g, projectsById)).join('');
      // "+ New cross-project chat" tile always closes the grid, even
      // when zero combos exist (acts as the empty-state CTA in that case).
      const createCard = ''
        + '<a class="cpcombo-create" href="/cross-project/new.html">'
        +   '<div class="cpcombo-create__icon"><i class="ti ti-plus"></i></div>'
        +   '<span class="cpcombo-create__label">New cross-project chat</span>'
        + '</a>';
      return ''
        + '<div class="cpchats-section">'
        +   '<div class="eyebrow"><span class="eyebrow__label">Cross-project chats</span><span class="eyebrow__rule"></span></div>'
        +   '<div class="cpchats-section-head"><span></span>'
        +     '<a href="/cross-project/index.html">View all →</a>'
        +   '</div>'
        +   '<div class="cpcombo-grid">' + cards + createCard + '</div>'
        + '</div>';
    }

    function crossProjectComboCardHtml(group, projectsById) {
      const projects = group.ids.map(id => projectsById.get(id) || { id, name: 'Project', logo_url: null });
      const title = projects.map(p => p.name).join(' × ');
      const chatCount = group.chats.length;
      const chatLabel = chatCount === 1 ? '1 chat' : (chatCount + ' chats');
      const meta = chatLabel + (group.lastAt ? ' · ' + fmtRelative(group.lastAt) : '');
      const MAX_AVATARS = 10;
      const avatarHtml = projects.slice(0, MAX_AVATARS).map(p =>
        p.logo_url
          ? '<img src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
          : '<div>' + esc(initial(p.name)) + '</div>'
      ).join('')
      + (projects.length > MAX_AVATARS
          ? '<div class="cpcombo-card__more">+' + (projects.length - MAX_AVATARS) + '</div>'
          : '');
      // Slug-form URL: /cross-project/<slug1>+<slug2>+... The server
      // route picks the most recent chat in the combo and serves the
      // chat page directly — no flicker, no UTM-looking query params.
      // Falls back to the legacy ?ids= form when any slug is missing
      // (shouldn't normally happen since projects API returns slug).
      const slugs = projects.map(p => p.slug).filter(Boolean).sort();
      const href = slugs.length === projects.length
        ? '/cross-project/' + slugs.join('+')
        : '/cross-project/chat.html?ids=' + esc(group.ids.join(','));
      return ''
        + '<a class="cpcombo-card" href="' + href + '">'
        +   '<div class="cpcombo-card__avatars">' + avatarHtml + '</div>'
        +   '<div class="cpcombo-card__title">' + esc(title) + '</div>'
        +   '<div class="cpcombo-card__meta">' + esc(meta) + '</div>'
        + '</a>';
    }

    function jiraChip() {
      return '<span class="srcchip srcchip--jira">'
        + '<img src="/icons/jira.svg" width="10" height="10" alt="Jira">'
        + 'Jira'
        + '</span>';
    }

    function renderProjectCard(p) {
      const hasJira = !!p.has_jira;
      const sources = hasJira
        ? jiraChip()
        : '<span class="srcchip srcchip--none">No sources yet</span>';
      const updated = p.updated_at ? esc(fmtRelative(p.updated_at)) : '';
      // Prefer slug routing; fall back to legacy ?id= for safety if slug is somehow missing.
      const cardHref = p.slug ? '/project/' + esc(p.slug) : '/project.html?id=' + esc(p.id);
      // Block 15.2: render uploaded logo when present, else initial-letter.
      const avatarHtml = p.logo_url
        ? '<img class="pcard__avatar" src="' + esc(p.logo_url) + '" alt="' + esc(p.name) + '">'
        : '<div class="pcard__avatar">' + esc(initial(p.name)) + '</div>';
      return ''
        + '<a class="pcard" href="' + cardHref + '">'
        +   '<div class="pcard__head">'
        +     avatarHtml
        +     '<div style="flex:1;min-width:0;">'
        +       '<div class="pcard__name">' + esc(p.name) + '</div>'
        +       (updated ? '<div class="pcard__updated">Updated ' + updated + '</div>' : '')
        +     '</div>'
        +   '</div>'
        +   '<div class="pcard__sources">' + sources + '</div>'
        + '</a>';
    }

    function renderProjectsSection(projects, isAdmin) {
      const gridCls = isAdmin ? 'projects-grid-admin' : 'projects-grid-member';
      const cards = projects.map(renderProjectCard).join('');
      const createCard = isAdmin
        ? '<a href="/projects/new.html" class="pcard-create"><div class="pcard-create__icon"><i class="ti ti-plus"></i></div><span class="pcard-create__label">New project</span></a>'
        : '';
      return ''
        + '<div class="projects-section">'
        +   '<div class="eyebrow"><span class="eyebrow__label">Projects</span><span class="eyebrow__rule"></span></div>'
        +   '<div class="projects-section-head"><span></span><a href="/projects.html">View all →</a></div>'
        +   '<div class="' + gridCls + '">' + cards + createCard + '</div>'
        + '</div>';
    }

    function render(data) {
      const root = $('#dashRoot');
      const isAdmin = !!(data.user && data.user.is_admin);
      const parts = [];
      parts.push(renderGreeting(data.user, data.projects));
      // Hero card ("Ask across all your projects at once") removed
      // per Jenny 2026-05-27. renderHero() is still defined in case
      // it returns, but is no longer rendered.
      // Cross-project chats list (above projects). Section omitted entirely
      // when the user has no cross-project chats yet.
      const projectsById = new Map((data.projects || []).map(p => [p.id, p]));
      parts.push(renderCrossProjectChatsSection(data.conversations || [], projectsById));
      parts.push(renderProjectsSection(data.projects, isAdmin));
      root.innerHTML = parts.join('');
    }

    // D6: preserve the page user tried to reach so login can return them here.
    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    async function boot() {
      try {
        // Fetch dashboard + cross-project conversations in parallel.
        // Conversations failure is non-fatal — dashboard still renders
        // (the cp-chats section just stays empty / hidden).
        const [dashRes, convRes] = await Promise.all([
          fetch('/api/dashboard', { credentials: 'same-origin' }),
          fetch('/api/cross-project/conversations', { credentials: 'same-origin' }).catch(() => null),
        ]);
        if (dashRes.status === 401) { gotoLogin(); return; }
        if (!dashRes.ok) throw new Error('HTTP ' + dashRes.status);
        const data = await dashRes.json();
        if (!data.ok) throw new Error(data.error || 'Failed to load');
        // Merge conversations into the data payload for render().
        let conversations = [];
        if (convRes && convRes.ok) {
          const convData = await convRes.json().catch(() => null);
          if (convData && Array.isArray(convData.conversations)) {
            conversations = convData.conversations;
          }
        }
        data.conversations = conversations;
        const av = $('#navUserAvatar');
        av.textContent = initial(data.user.display_name || data.user.email);
        av.title = (data.user.display_name || '') + (data.user.email ? ' · ' + data.user.email : '');
        if (data.user.is_admin) $('#adminLink').style.display = '';
        render(data);
      } catch (err) {
        $('#dashRoot').innerHTML = '<div class="dash-error">Couldn\'t load workspace. <small>' + esc(String(err && err.message || err)) + '</small></div>';
      }
    }

    $('#logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    boot();
  })();
  </script>
</body>
</html>
