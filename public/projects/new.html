  <!-- Block 19 rail boot. BYTE-IDENTICAL in all 11 authed pages, like the
       rail block in <body>; verification item 3b diffs them.

       This MUST be inline and synchronous, and it must stay in <head>.
       /_lib/side-nav.js is deferred, so it runs only after the document is
       parsed. Anything the rail needs at FIRST PAINT has to be decided here,
       or it visibly changes a moment later — which is what made moving
       between rail items look like a glitch rather than a page change.

       Three things are settled before paint, all as classes on <html>:
         sn-boot          layout is active (page gets its left offset)
         sn-section-open  the Projects section's open/closed state
         sn-at-<key>      which rail item is the current page
         sn-admin         reveal the admin group (a display hint, never a
                          permission — every link behind it is gated
                          server-side, and /api/me corrects it on load)

       sn-at-<key> duplicates activeKey() in /_lib/side-nav.js. That is a
       real drift risk and a deliberate trade: the alternative is the
       highlight appearing a frame late on every navigation. If you change
       one, change both — verification item 4 compares them.

       Keep it tiny and dependency-free: it blocks the parser by design. -->
  <script>(function(){var d=document.documentElement,p=location.pathname,k='';if(p==='/'||p.indexOf('/dashboard')===0)k='dashboard';else if(p.indexOf('/projects')===0||p.indexOf('/project/')===0||p.indexOf('/project.html')===0||p.indexOf('/project_settings')===0)k='projects';else if(p.indexOf('/cross-project')===0)k='cross-project';else if(p.indexOf('/workspace_settings')===0)k='workspace-settings';else if(p.indexOf('/admin')===0)k='members';else if(p.indexOf('/whats-new')===0)k='whats-new';d.classList.add('sn-boot');if(k)d.classList.add('sn-at-'+k);try{if(localStorage.getItem('elinno.sidenav.projectsOpen')==='true')d.classList.add('sn-section-open');if(localStorage.getItem('elinno.sidenav.admin')==='1')d.classList.add('sn-admin');}catch(e){}})();</script>
  <link rel="stylesheet" href="/auth.css?v=2026-08-16-1" />
  <style>
    /* New-project page per v1.4 mockup screen-06. */
    .np-shell { max-width: 520px; margin: 0 auto; padding: 32px 20px 80px; }
    .np-heading {
      font-family: var(--font);
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .np-sub {
      font-family: var(--font);
      font-size: 13px;
      color: var(--text-2);
      margin: 0 0 22px;
      line-height: 1.5;
    }
    .np-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 24px;
    }
    .np-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .np-field label {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
    }
    .np-field input,
    .np-field textarea {
      width: 100%;
      padding: 10px 13px;
      border: 0.5px solid var(--border-input);
      border-radius: var(--r-sm);
      background: var(--bg-subtle);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
    }
    .np-field input::placeholder,
    .np-field textarea::placeholder {
      color: var(--text-3);
      opacity: 1; /* Firefox lowers opacity by default; normalize */
    }
    .np-field textarea { min-height: 90px; resize: vertical; }
    .np-field input:focus,
    .np-field textarea:focus {
      outline: none;
      border-color: var(--brand);
      background: var(--bg);
    }
    .np-hint {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .np-slug-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .np-slug-row input { flex: 1; }
    .np-slug-status {
      font-family: var(--font);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--r-pill);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .np-slug-status.ok    { background: #e6f5ec; color: #1d7a3e; }
    .np-slug-status.error { background: rgba(179,20,75,0.08); color: var(--danger); }
    .np-slug-status.muted { background: var(--bg-subtle); color: var(--text-3); }
    .np-slug-preview {
      font-family: var(--font);
      font-size: 11px;
      color: var(--text-3);
    }
    .np-slug-preview code {
      background: var(--bg-subtle);
      padding: 1px 4px;
      border-radius: 3px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }
    .np-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 22px;
    }
    .np-msg {
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 13px;
      border-radius: var(--r-sm);
      display: none;
      margin-bottom: 12px;
    }
    .np-msg.show { display: block; }
    .np-msg.error { background: rgba(179,20,75,0.06); color: var(--danger); }

    .np-unauthorized {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r-md);
      padding: 48px 24px;
      text-align: center;
    }
    .np-unauthorized__icon {
      width: 44px; height: 44px;
      border-radius: var(--r-sm);
      background: var(--brand-tint);
      color: var(--brand);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 22px;
      margin-bottom: 10px;
    }
    .np-unauthorized__title { font-family: var(--font); font-size: 16px; font-weight: 500; color: var(--text); margin: 0 0 6px; }
    .np-unauthorized__body { font-family: var(--font); font-size: 13px; color: var(--text-2); margin: 0 auto 16px; max-width: 320px; line-height: 1.5; }

    @media (max-width: 700px) {
      .np-shell { padding: 18px 14px 64px; }
      .np-actions { flex-direction: column-reverse; gap: 8px; }
      .np-actions .btn { width: 100%; }
      /* 16px controls kill iOS focus-zoom; overrides the page's 14px which
         out-specifies the shared auth.css mobile rule. */
      .np-field input,
      .np-field textarea { font-size: 16px; }
    }
  </style>

<body>

  <!-- ===================================================================
       Block 19 side rail. This block is BYTE-IDENTICAL in all 11 authed
       pages and is diffed across them by verification item 3. Do not edit
       one copy — edit every copy, or the drift this rail exists to fix

       =================================================================== -->
  <div class="side-nav-head">
    <button class="side-nav-head__toggle" type="button" data-sn-mobile-toggle aria-label="Open navigation" aria-expanded="false"><i class="ti ti-menu-2" aria-hidden="true"></i></button>

    </div>
    <div class="side-nav__scroll">

      <button class="sn-item" type="button" data-sn-section="projects" aria-expanded="false" title="Projects"><i class="ti ti-folders" aria-hidden="true"></i><span class="sn-item__label">Projects</span><i class="ti ti-chevron-right sn-chev" aria-hidden="true"></i></button>

      <div id="adminLink" style="display:none;">

        <a class="sn-item" href="/workspace_settings.html" data-sn-nav="workspace-settings" title="Workspace settings"><i class="ti ti-settings" aria-hidden="true"></i><span class="sn-item__label">Workspace settings</span></a>
        <a class="sn-item" href="/admin.html" data-sn-nav="members" title="Members"><i class="ti ti-shield" aria-hidden="true"></i><span class="sn-item__label">Members</span></a>

      <div class="sn-item sn-item--static" data-sn-user><span id="navUserAvatar" class="sn-avatar" title=""></span><span class="sn-item__label" data-sn-username>Account</span></div>
      <button class="sn-item" type="button" id="logoutBtn" title="Log out"><i class="ti ti-logout" aria-hidden="true"></i><span class="sn-item__label">Log out</span></button>
    </div>

  <!-- Block 19 rail tree restore. BYTE-IDENTICAL in all 11 authed pages.
       Runs during parse, right after the rail exists and before first paint,
       so an open Projects section paints WITH its tree instead of painting
       empty and filling in once /_lib/side-nav.js has fetched /api/projects.
       That fill-in was the remaining flicker when moving between two children
       of the same project. It also paints the avatar letter, and restores the
       rail's own scroll offset — each page is a new document, so without that
       the menu jumped back to the top whenever you clicked something near the
       bottom of a long tree.
       Order matters: the tree has to be in place before scrollTop means
       anything, so the scroll restore comes last.
       The markup came from the previous page's own render (escaped there) and
       the live render replaces it moments later. -->
  <script>(function(){try{var d=document.documentElement,i=localStorage.getItem('elinno.sidenav.initial'),a=document.getElementById('navUserAvatar');if(a&&i)a.textContent=i;if(d.classList.contains('sn-section-open')){var s=document.querySelector('[data-sn-section="projects"]');if(s)s.setAttribute('aria-expanded','true');var b=document.querySelector('[data-sn-children="projects"]'),h=sessionStorage.getItem('elinno.sidenav.treeHtml');if(b&&h)b.innerHTML=h;}var c=document.querySelector('.side-nav__scroll'),y=sessionStorage.getItem('elinno.sidenav.scrollTop');if(c&&y)c.scrollTop=+y;}catch(e){}})();</script>

  <main style="background:var(--bg-subtle);min-height:100vh;">
    <div class="np-shell">
      <a href="/projects.html" style="font-family:var(--font);font-size:12px;color:var(--text-3);text-decoration:none;display:inline-block;margin-bottom:14px;">← Projects</a>
      <h1 class="np-heading">New project</h1>
      <p class="np-sub">A project has its own connected tools and chat history. After creating, you'll connect a source like Jira or Slack.</p>
      <div id="formContainer">
        <div class="np-card" aria-busy="true">
          <p class="np-hint">Loading…</p>
        </div>
      </div>
    </div>
  </main>


  <script>
  (function () {
    'use strict';
    let me = null;
    function $(s) { return document.querySelector(s); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function initial(s) { return (String(s || '?').trim()[0] || '?').toUpperCase(); }

    // D6: preserve the page user tried to reach so login can return them here.
    function gotoLogin() {
      location.replace('/?next=' + encodeURIComponent(location.pathname + location.search));
    }

    fetch('/api/me').then(r => r.json()).then(d => {
      if (!d.user) { gotoLogin(); return; }
      me = d.user;
      const av = $('#navUserAvatar');
      av.textContent = initial(me.display_name || me.email);
      av.title = (me.display_name || '') + (me.email ? ' · ' + me.email : '');
      if (me.is_admin) {
        $('#adminLink').style.display = '';
        renderForm();
      } else {
        renderUnauthorized();
      }
    }).catch(() => gotoLogin());

    $('#logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }).catch(() => {});
      location.replace('/');
    });

    function renderUnauthorized() {
      $('#formContainer').innerHTML = ''
        + '<div class="np-unauthorized">'
        +   '<div class="np-unauthorized__icon"><i class="ti ti-lock"></i></div>'
        +   '<h2 class="np-unauthorized__title">Workspace admin only</h2>'
        +   '<p class="np-unauthorized__body">Only workspace admins can create projects. Ask your admin to create one for you.</p>'
        +   '<a class="btn btn--ghost" href="/projects.html">← Back to projects</a>'
        + '</div>';
    }

    function renderForm() {
      $('#formContainer').innerHTML = ''
        + '<div class="np-card">'
        +   '<div id="formMsg" class="np-msg" role="alert"></div>'
        +   '<form id="createForm" novalidate>'
        +     '<div class="np-field">'
        +       '<label for="projectName">Project name</label>'
        +       '<input id="projectName" name="name" type="text" required maxlength="100" placeholder="e.g. Rain" autocomplete="off" />'
        +     '</div>'
        +     '<div class="np-field">'
        +       '<label for="projectSlug">URL slug</label>'
        +       '<div class="np-slug-row">'
        +         '<input id="projectSlug" name="slug" type="text" maxlength="64" placeholder="rain" autocomplete="off" pattern="[a-z][a-z0-9-]*" />'
        +         '<span id="slugStatus" class="np-slug-status muted">Type a name</span>'
        +       '</div>'
        +       '<p class="np-slug-preview"><code id="slugPreview">elinnoagent.com/project/&lt;slug&gt;</code></p>'
        +       '<p class="np-hint">Lowercase letters, digits, and hyphens. Must start with a letter. We’ll auto-fill from the project name as you type — you can override.</p>'
        +     '</div>'
        +     '<div class="np-field">'
        +       '<label for="projectDesc">Description <span style="color:var(--text-3);font-weight:400;">(optional)</span></label>'
        +       '<textarea id="projectDesc" name="description" maxlength="1000" placeholder="What is this project about?"></textarea>'
        +       '<p class="np-hint">Visible on the projects list for everyone in the workspace.</p>'
        +     '</div>'
        +     '<div class="np-actions">'
        +       '<a href="/projects.html" class="btn btn--ghost">Cancel</a>'
        +       '<button type="submit" class="btn btn--primary" id="submitBtn" disabled>Create &amp; connect a source <i class="ti ti-arrow-right"></i></button>'
        +     '</div>'
        +   '</form>'
        + '</div>';
      wireForm();
    }

    // Block 13.8e: mirrors functions/_lib/slug.js + the SQL backfill so
    // client + server + migration all produce the same slug for the
    // same input. Keep this regex shape in sync with the server.
    function deriveSlugFromName(name) {
      if (name == null) return '';
      let s = String(name).toLowerCase();
      s = s.replace(/[^a-z0-9]+/g, '-');
      s = s.replace(/-+/g, '-');
      s = s.replace(/^-+|-+$/g, '');
      if (s.length === 0) return '';
      if (!/^[a-z]/.test(s)) s = 'p-' + s;
      if (s.length > 64) s = s.slice(0, 64).replace(/-+$/g, '');
      return s;
    }
    function isValidSlugFormat(slug) {
      if (typeof slug !== 'string' || slug.length === 0 || slug.length > 64) return false;
      return /^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(slug);
    }

    function wireForm() {
      const form = $('#createForm');
      const name = $('#projectName');
      const slug = $('#projectSlug');
      const slugStatus = $('#slugStatus');
      const slugPreview = $('#slugPreview');
      const desc = $('#projectDesc');
      const btn = $('#submitBtn');
      const msg = $('#formMsg');

      // Block 13.8e state for slug field.
      let slugEdited = false;          // true once the user types into the slug input
      let slugCheckSeq = 0;            // monotonic; latest fetch wins on race
      let slugCheckTimer = null;
      let slugCheckResult = null;      // { available, reason } | null (idle / pending)

      function setSlugStatus(kind, text) {
        slugStatus.className = 'np-slug-status ' + kind;
        slugStatus.textContent = text;
      }
      function updatePreview() {
        const s = slug.value.trim();
        slugPreview.textContent = s
          ? 'elinnoagent.com/project/' + s
          : 'elinnoagent.com/project/<slug>';
      }
      function syncSubmit() {
        const hasName = name.value.trim().length > 0;
        const hasSlug = slug.value.trim().length > 0;
        const slugOk = slugCheckResult && slugCheckResult.available === true;
        btn.disabled = !(hasName && hasSlug && slugOk);
      }

      async function checkSlugAvailability(candidate) {
        const seq = ++slugCheckSeq;
        setSlugStatus('muted', 'Checking…');
        try {
          const res = await fetch('/api/projects/slug-available?slug=' + encodeURIComponent(candidate));
          if (seq !== slugCheckSeq) return;  // a newer check superseded this one
          const data = await res.json().catch(() => ({}));
          if (!res.ok && data.reason !== 'invalid_format') {
            setSlugStatus('error', 'Check failed');
            slugCheckResult = { available: false, reason: 'error' };
            syncSubmit();
            return;
          }
          slugCheckResult = data;
          if (data.available) {
            setSlugStatus('ok', '✓ Available');
          } else if (data.reason === 'reserved') {
            setSlugStatus('error', 'Reserved word');
          } else if (data.reason === 'taken') {
            setSlugStatus('error', 'Already taken');
          } else if (data.reason === 'invalid_format') {
            setSlugStatus('error', 'Invalid format');
          } else {
            setSlugStatus('error', 'Unavailable');
          }
          syncSubmit();
        } catch {
          if (seq !== slugCheckSeq) return;
          setSlugStatus('error', 'Check failed');
          slugCheckResult = { available: false, reason: 'error' };
          syncSubmit();
        }
      }

      function scheduleSlugCheck() {
        clearTimeout(slugCheckTimer);
        slugCheckResult = null;
        updatePreview();
        const candidate = slug.value.trim();
        if (candidate.length === 0) {
          setSlugStatus('muted', 'Type a slug');
          syncSubmit();
          return;
        }
        if (!isValidSlugFormat(candidate)) {
          setSlugStatus('error', 'Invalid format');
          slugCheckResult = { available: false, reason: 'invalid_format' };
          syncSubmit();
          return;
        }
        slugCheckTimer = setTimeout(() => checkSlugAvailability(candidate), 300);
      }

      // Live-derive slug from name UNTIL the user edits the slug field manually.
      name.addEventListener('input', () => {
        if (!slugEdited) {
          slug.value = deriveSlugFromName(name.value);
          scheduleSlugCheck();
        }
        syncSubmit();
      });
      slug.addEventListener('input', () => {
        slugEdited = true;
        scheduleSlugCheck();
      });

      function showErr(text) { msg.textContent = text; msg.className = 'np-msg show error'; }
      function hideErr() { msg.className = 'np-msg'; msg.textContent = ''; }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideErr();
        const n = name.value.trim();
        const d = desc.value.trim();
        const s = slug.value.trim();
        if (!n || !s) return;
        if (!(slugCheckResult && slugCheckResult.available === true)) return;
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = 'Creating…';
        try {
          const payload = { name: n, slug: s };
          if (d) payload.description = d;
          const res = await fetch('/api/projects', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          if (res.status === 401) { gotoLogin(); return; }
          if (res.status === 403) { renderUnauthorized(); return; }
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            let errText = data.error || 'Something went wrong. Please try again.';
            if (data.code === 'slug_taken') errText = 'That slug just got taken. Pick another.';
            else if (data.code === 'slug_reserved') errText = 'That slug is reserved. Pick another.';
            else if (data.code === 'slug_invalid_format') errText = 'Slug format is invalid.';
            if (res.status >= 500) errText = 'Something went wrong. Please try again.';
            showErr(errText);
            btn.disabled = false;
            btn.innerHTML = originalHtml;
            // Re-check slug availability so the status pill reflects the race result.
            if (data.code === 'slug_taken') {
              slugCheckResult = { available: false, reason: 'taken' };
              setSlugStatus('error', 'Already taken');
            }
            return;
          }
          // Per SPEC §6: redirect to NEW project's Settings → Connections tab.
          // Graceful fallback to projects list if the new ID is unresolvable.
          const newId = data && data.project && data.project.id;
          const newSlug = data && data.project && data.project.slug;
          if (newSlug) {
            location.replace('/project_settings/' + encodeURIComponent(newSlug) + '/connections?just_created=1');
          } else if (newId) {
            location.replace('/project_settings.html?id=' + encodeURIComponent(newId) + '&tab=connections&just_created=1');
          } else {
            location.replace('/projects.html');
          }
        } catch {
          showErr('Network error. Please try again.');
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    }
  })();
  </script>
